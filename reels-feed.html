let io=null; const viewed=new Set();
function observe(){
  if(io) io.disconnect();
  io=new IntersectionObserver(es=>{ es.forEach(e=>{ const v=e.target.querySelector('video'); if(!v) return;
    if(e.isIntersecting && e.intersectionRatio>=0.6){ activate(e.target); } else { v.pause(); } }); }, {root:feed, threshold:[0,0.6,1]});
  feed.querySelectorAll('.ritem').forEach(x=>io.observe(x));
}
function activate(item){
  cur=item; const v=item.querySelector('video'); v.muted=muted;
  const p=v.play(); if(p&&p.catch) p.catch(()=>{ v.muted=true; muted=true; v.play().catch(()=>{}); syncMute(); });
  history.replaceState(null,'','#'+item.id);
  // a view counts after 3 seconds on screen (once per reel per visit)
  const id=item.id; clearTimeout(item._vt);
  item._vt=setTimeout(()=>{ if(cur===item && !viewed.has(id)){ viewed.add(id); bump(id,'views'); } }, 3000);
  // preload the next one
  const nx=item.nextElementSibling && item.nextElementSibling.querySelector('video'); if(nx) nx.preload='auto';
}

async function toggleLike(id, anim){
  const me=L(id), on=!me.liked; me.liked=on; saveLocal();
  st(id).likes=Math.max(0, st(id).likes + (on?1:-1)); paint(id);
  const btn=document.querySelector(`#${CSS.escape(id)} .like`); if(btn&&on&&anim!==false){ btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop'); }
  if(!db){ warnOffline(); return; }
  const rref=db.collection('reels').doc(id), lref=rref.collection('likes').doc(DEV), b=db.batch();
  if(on){ b.set(lref,{at:FV.serverTimestamp()}); b.set(rref,{likes:FV.increment(1), lastLiker:DEV},{merge:true}); }
  else  { b.delete(lref); b.set(rref,{likes:FV.increment(-1), lastLiker:DEV},{merge:true}); }
  try{ await b.commit(); }
  catch(e){ // out of step with the server (e.g. phone storage was cleared): trust the server
    try{ const d=await lref.get(); me.liked=d.exists; saveLocal(); }catch(_){ warnOffline(); }
    paint(id);
  }
}

let cUnsub=null, cReel=null, lastPost=0;
const COLORS=['#0f7b6c','#b8860b','#7c3aed','#db2777','#2563eb','#ea580c','#0891b2','#65a30d'];
const colorOf=s=>{ let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))|0; return COLORS[Math.abs(h)%COLORS.length]; };
function ago(d){ if(!d) return t().now; const s=(Date.now()-d.getTime())/1000; if(s<60) return t().now; if(s<3600) return Math.floor(s/60)+'m'; if(s<86400) return Math.floor(s/3600)+'h'; if(s<604800) return Math.floor(s/86400)+'d'; return d.toLocaleDateString(); }
function profileName(){
  const own=store.get('baio_reel_name'); if(own) return own;
  try{ const p=JSON.parse(store.get('baio_student')||'null'); if(p&&p.name) return p.name; }catch(e){}
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(/_student_profile$/.test(k)){ const p=JSON.parse(localStorage.getItem(k)||'null'); if(p&&p.name) return p.name; } } }catch(e){}
  return '';
}
function localComments(id){ try{ return JSON.parse(store.get('baio_reel_c_'+id)||'[]'); }catch(e){ return []; } }
function drawComments(items){
  if(!items.length){ cList.innerHTML=`<div class="empty">${t().noC}</div>`; return; }
  cList.innerHTML=items.map(c=>`<div class="cm${c.pending?' pending':''}"><div class="av" style="background:${colorOf(c.name)}">${esc((c.name||'?').trim().charAt(0).toUpperCase())}</div>
    <div><div class="nm">${c.device===DEV?`<span class="you">${esc(c.name)} · ${t().you}</span>`:esc(c.name)}<span class="tm">${ago(c.at)}</span></div><div class="tx">${esc(c.text)}</div></div></div>`).join('');
}
function openSheet(el){ veil.classList.add('on'); el.classList.add('on'); }
function closeSheets(){ veil.classList.remove('on'); cSheet.classList.remove('on'); sSheet.classList.remove('on'); if(cUnsub){ cUnsub(); cUnsub=null; } cReel=null; }
veil.addEventListener('click', closeSheets);
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeSheets));
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheets(); });
function openComments(id){
  cReel=id; $('#cName').value=profileName(); $('#cName').style.display=$('#cName').value?'none':'';
  $('#cTitle').textContent=`${t().comments} · ${fmt(st(id).comments)}`;
  drawComments(localComments(id).map(c=>Object.assign(c,{at:c.at?new Date(c.at):null})));
  openSheet(cSheet);
  if(db){
    cUnsub=db.collection('reels').doc(id).collection('comments').orderBy('at','desc').limit(200).onSnapshot(snap=>{
      const items=[]; snap.forEach(d=>{ const x=d.data(); items.push({name:x.name, text:x.text, device:x.device, at:x.at&&x.at.toDate?x.at.toDate():null, pending:d.metadata.hasPendingWrites}); });
      drawComments(items); $('#cTitle').textContent=`${t().comments} · ${fmt(Math.max(items.length, st(id).comments))}`;
    }, ()=>{});
  }
}
const BAD=/\b(f+u+c+k+|sh[i1]t|b[i1]tch|bastard|asshole|dick|slut|whore|chutiya|madarchod|bhenchod|behenchod|bc|mc|gandu|randi|harami|kamina|saala|sala)\b/i;
$('#cText').addEventListener('input', e=>{ e.target.style.height='44px'; e.target.style.height=Math.min(110,e.target.scrollHeight)+'px'; });
$('#cText').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('#cForm').requestSubmit(); } });
$('#cForm').addEventListener('submit', async e=>{
  e.preventDefault(); const id=cReel; if(!id) return;
  const name=$('#cName').value.trim().slice(0,40), text=$('#cText').value.trim().slice(0,300);
  if(!text) return;
  if(!name){ toast(t().needName); $('#cName').style.display=''; $('#cName').focus(); return; }
  if(BAD.test(text)||BAD.test(name)){ toast(t().blocked); return; }
  if(Date.now()-lastPost<15000){ toast(t().tooFast); return; }
  lastPost=Date.now(); store.set('baio_reel_name', name); $('#cName').style.display='none';
  $('#cText').value=''; $('#cText').style.height='44px';
  st(id).comments++; paint(id);
  if(!db){ const arr=localComments(id); arr.unshift({name,text,device:DEV,at:Date.now()}); store.set('baio_reel_c_'+id, JSON.stringify(arr.slice(0,50))); drawComments(arr.map(c=>Object.assign({},c,{at:new Date(c.at)}))); warnOffline(); return; }
  const rref=db.collection('reels').doc(id), cref=rref.collection('comments').doc(), b=db.batch();
  b.set(cref,{name,text,device:DEV,at:FV.serverTimestamp()});
  b.set(rref,{comments:FV.increment(1), lastComment:cref.id},{merge:true});
  try{ await b.commit(); }catch(err){ const arr=localComments(id); arr.unshift({name,text,device:DEV,at:Date.now()}); store.set('baio_reel_c_'+id, JSON.stringify(arr.slice(0,50))); drawComments(arr.map(c=>Object.assign({},c,{at:new Date(c.at)}))); warnOffline(); }
});

/* ---------- share ---------- */
let shareURL='';
async function share(id){
  const r=REELS.find(x=>x.id===id); if(!r) return;
  const title=(r.pu===1?'I PUC':'II PUC')+' Biology · '+(r.title[lang]||r.title.en), text=MSG[lang](title), url=BASE+'#'+r.id; shareURL=url;
  const done=()=>{ bump(id,'shares'); };
  if(navigator.share){ try{ await navigator.share({title:'BAIO · '+r.title.en, text, url}); done(); }catch(e){} return; }
  $('#sWa').href='https://wa.me/?text='+encodeURIComponent(text+'\n'+url);
  $('#sTg').href='https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(text);
  $('#sWa').onclick=$('#sTg').onclick=()=>{ done(); setTimeout(closeSheets,300); };
  openSheet(sSheet);
}
$('#sCp').addEventListener('click', ()=>{
  const ok=()=>{ toast(t().copied); const id=(shareURL.split('#')[1]||''); if(id) bump(id,'shares'); closeSheets(); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(shareURL).then(ok, ok); else ok();
});

/* ---------- toast ---------- */
let toastT=null;
function toast(m){ const el=$('#toast'); el.textContent=m; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'), 2600); }

/* ---------- top bar ---------- */
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click', ()=>{ filter=b.dataset.f; setChrome(); render(); feed.scrollTo({top:0}); }));
$('#langBtn').addEventListener('click', ()=>{ lang=LANGS[(LANGS.indexOf(lang)+1)%LANGS.length]; store.set('baio_lang',lang); store.set('baio_mt_lang',lang); const at=cur&&cur.id; setChrome(); render(); if(at){ const el=document.getElementById(at); if(el) feed.scrollTo({top:el.offsetTop}); } });
/* keyboard (laptop / projector) */
document.addEventListener('keydown', e=>{
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName)) return;
  if(cSheet.classList.contains('on')||sSheet.classList.contains('on')) return;
  const items=[...feed.children]; const i=cur?items.indexOf(cur):0;
  if(e.key==='ArrowDown'||e.key==='PageDown'||e.key==='j'){ e.preventDefault(); const n=items[Math.min(items.length-1,i+1)]; if(n) feed.scrollTo({top:n.offsetTop,behavior:'smooth'}); }
  else if(e.key==='ArrowUp'||e.key==='PageUp'||e.key==='k'){ e.preventDefault(); const n=items[Math.max(0,i-1)]; if(n) feed.scrollTo({top:n.offsetTop,behavior:'smooth'}); }
  else if(e.key===' '&&cur){ e.preventDefault(); const v=cur.querySelector('video'); if(v) v.paused?v.play().catch(()=>{}):v.pause(); }
  else if((e.key==='l'||e.key==='L')&&cur){ toggleLike(cur.id,true); }
  else if((e.key==='m'||e.key==='M')&&cur){ muted=!muted; const v=cur.querySelector('video'); if(v){ v.muted=muted; if(!muted) v.play().catch(()=>{}); } syncMute(); }
});

/* ---------- start ---------- */
setChrome(); render();
(function(){ const id=location.hash.slice(1); const r=REELS.find(x=>x.id===id); if(r && r.cat==='mehfil'){ filter='mehfil'; setChrome(); render(); } const el=id&&document.getElementById(id); if(el) feed.scrollTo({top:el.offsetTop}); })();
if(store.get('baio_reels_hint')) $('#swipeHint').remove(); else store.set('baio_reels_hint','1');
fbInit();
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
