<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1B14">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Use BAIO offline | BAIO Learning System</title>
<meta name="description" content="Save BAIO chapters on your phone so they open without internet.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="subject-apps/app.css?v=1">
<style>
[hidden]{display:none!important}
body{font-family:Inter,'Noto Sans Kannada','Noto Sans Devanagari',system-ui,sans-serif}
.net{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font:700 12.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel)}
.net i{width:8px;height:8px;border-radius:50%;background:#2F9E6B;display:inline-block}
.net.off i{background:#C9792B}
.note{margin-top:14px;padding:13px 15px;border-radius:14px;font-size:14px;line-height:1.5}
.note.miss{background:color-mix(in srgb,#C9792B 14%,var(--panel));border:1.5px solid color-mix(in srgb,#C9792B 55%,transparent)}
.note.ok{background:color-mix(in srgb,#2F9E6B 13%,var(--panel));border:1.5px solid color-mix(in srgb,#2F9E6B 50%,transparent)}
.note.bad{background:color-mix(in srgb,var(--red) 12%,var(--panel));border:1.5px solid color-mix(in srgb,var(--red) 45%,transparent)}
h2.sec{font:700 18px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari';margin:26px 0 10px}
.packs{display:grid;gap:10px}
.pack{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 14px;border-radius:16px;background:var(--panel);border:1.5px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.pack.on{border-color:var(--gold2);box-shadow:0 0 0 1px var(--gold2) inset}
.pack.fixed{cursor:default}
.pack .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:24px;background:var(--panel2);border:1px solid var(--line)}
.pack b{display:block;font:700 15.5px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari';line-height:1.3}
.pack small{display:block;color:var(--dim);font-size:12.5px;line-height:1.4;margin-top:2px}
.pack .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font:700 11px Inter,'Noto Sans Kannada','Noto Sans Devanagari';padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.tag.saved{color:#1F7A52;border-color:#2F9E6B;background:color-mix(in srgb,#2F9E6B 12%,transparent)}
[data-theme="dark"] .tag.saved{color:#6FD3A3}
.tag.part{color:#A0601F;border-color:#C9792B}
[data-theme="dark"] .tag.part{color:#F0B774}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font:800 15px Inter;color:#1a1406}
.pack.on .box{background:linear-gradient(135deg,var(--gold2),#E9C45A);border-color:var(--gold2)}
.pack.fixed .box{background:var(--panel2);color:var(--dim);border-color:var(--line)}
.rm{background:none;border:0;color:var(--dim);font:600 12px Inter,'Noto Sans Kannada','Noto Sans Devanagari';text-decoration:underline;cursor:pointer;padding:0}
.go{display:block;width:100%;margin-top:14px;border:0;border-radius:14px;padding:15px 16px;font:700 16px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari';background:linear-gradient(135deg,var(--gold2),#E9C45A);color:#1a1406;cursor:pointer;-webkit-tap-highlight-color:transparent}
.go:disabled{opacity:.55;cursor:not-allowed}
.bar{height:10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold2));transition:width .25s}
.prog{font-size:13px;color:var(--dim);margin-top:7px}
.small{font-size:12.5px;color:var(--dim);margin-top:8px}
.saved-list{display:grid;gap:8px}
details.grp{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.grp summary{cursor:pointer;padding:12px 14px;font:700 14.5px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari';list-style:none;display:flex;justify-content:space-between;gap:10px}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary span{color:var(--dim);font:600 12.5px Inter}
details.grp ul{list-style:none;margin:0;padding:0 8px 8px}
details.grp li a{display:block;padding:9px 8px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14px}
details.grp li a:active,details.grp li a:hover{background:var(--panel2)}
.empty{color:var(--dim);font-size:14px;padding:4px 2px}
ul.need{margin:0;padding-left:20px;color:var(--dim);font-size:14px;line-height:1.7}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="index.html"><div class="b">B</div><span>BAIO Learning System</span></a>
  <div class="tools"><div id="langs"></div>
    <a class="ib" href="index.html" aria-label="BAIO home">🏠</a>
    <button class="ib" id="themeBtn" aria-label="Toggle theme">🌙</button></div>
</div></header>
<main class="wrap">
  <section class="hero">
    <div class="eyebrow" id="eyebrow" style="color:var(--teal)"></div>
    <h1><span class="ic">📥</span><span id="h1"></span></h1>
    <p id="intro"></p>
    <div class="net" id="net"><i></i><span></span></div>
  </section>
  <div class="note miss" id="miss" hidden></div>
  <div class="note bad" id="unsup" hidden></div>

  <h2 class="sec" id="hPick"></h2>
  <div class="packs" id="packs"></div>
  <button class="go" id="go" type="button"></button>
  <div id="progWrap" hidden><div class="bar"><i id="barFill"></i></div><div class="prog" id="prog"></div></div>
  <div class="note ok" id="done" hidden></div>
  <p class="small" id="wifi"></p>

  <h2 class="sec" id="hSaved"></h2>
  <div class="saved-list" id="saved"></div>
  <p class="small" id="storage"></p>

  <h2 class="sec" id="hNeed"></h2>
  <ul class="need" id="need"></ul>
  <p class="hint" id="keep"></p>
  <footer>BAIO Learning System · Narendra Sir</footer>
</main>

         go:function(mb){ return '📥 चुने हुए डाउनलोड करें · लगभग '+mb; }, update:'🔄 अपडेट देखें', needNet:'डाउनलोड के लिए इंटरनेट से जुड़ें',
         saving:function(a,b,c,d){ return b+' में से '+a+' फ़ाइलें सेव हो रही हैं · '+d+' में से '+c; }, wait:'फ़ाइल सूची ली जा रही है…',
         done:function(f){ return '✅ सेव हो गया! BAIO के ये हिस्से अब बिना इंटरनेट के खुलेंगे।'+(f?' ('+f+' फ़ाइलें सेव नहीं हुईं; बाद में फिर डाउनलोड दबाएँ।)':''); },
         upToDate:'✅ सब कुछ पहले से सेव और अपडेट है।',
         failed:'अभी डाउनलोड नहीं हो सका। इंटरनेट जाँचें और फिर कोशिश करें।',
         wifi:'सुझाव: Wi-Fi पर डाउनलोड करें। इंटरनेट रहते BAIO खोलने पर सेव किए अध्याय अपने-आप अपडेट हो जाते हैं।',
         nothing:'अभी कुछ सेव नहीं है। ऊपर चुनें और डाउनलोड दबाएँ।',
         pages:function(n){ return n+' पेज'; },
         storage:function(u){ return 'BAIO लगभग '+u+' फ़ोन स्टोरेज इस्तेमाल कर रहा है।'; },
         needList:['वीडियो और पॉडकास्ट','PDF और PPT डाउनलोड','WhatsApp, फ़ीडबैक फ़ॉर्म और भुगतान','BAIO AI असिस्टेंट के जवाब','जो अध्याय आपने सेव नहीं किए'],
         keep:'💡 आपकी प्रगति, अंक और प्रीमियम अनलॉक फ़ोन में ही रहते हैं, इसलिए ऑफ़लाइन भी काम करते हैं।',
         removeAsk:'इसे फ़ोन से हटाएँ?' }
  };
  var ORDER = ['core','pu1','pu2','pcm','extras'];
  function $(id){ return document.getElementById(id); }
  var lang = 'en'; try{ lang = localStorage.getItem('baio_lang') || 'en'; }catch(e){} if(!UI[lang]) lang = 'en';
  var tb = $('themeBtn');
  function theme(t){ document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); tb.textContent = t === 'dark' ? '☀️' : '🌙'; }
  var th = 'light'; try{ th = localStorage.getItem('baio_theme') || 'light'; }catch(e){} theme(th);
  tb.onclick = function(){ var n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; theme(n); try{ localStorage.setItem('baio_theme', n); }catch(e){} };
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
  function mb(b){ return b >= 1e6 ? (Math.round(b / 1e5) / 10) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB'; }

  var BO = window.BaioOffline, ok = !!(BO && BO.supported());
  var M = null, ST = null, PAGES = {}, busy = false, msg = null;
  var missing = new URLSearchParams(location.search).get('missing');

  /* Which packs start ticked: what is already saved, else the student's own year + small packs. */
  var sel = {};
  (function(){
    var s = ok ? BO.state() : { packs: [] };
    if(s.packs.length){ s.packs.forEach(function(p){ sel[p] = true; }); return; }
    var roll = ''; try{ roll = (JSON.parse(localStorage.getItem('baio_student') || 'null') || {}).roll || ''; }catch(e){}
    if(/^26MPU/i.test(roll)) sel.pu1 = true; else if(/^25MPU/i.test(roll)) sel.pu2 = true; else { sel.pu1 = true; sel.pu2 = true; }
    sel.pcm = true; sel.extras = true;
  })();

  function chosenBytes(){
    if(!M) return 0;
    var seen = {}, b = 0;
    ['core'].concat(ORDER.filter(function(p){ return sel[p] && p !== 'core'; })).forEach(function(id){
      var p = M.packs[id]; if(!p) return;
      p.files.forEach(function(f){ if(!seen[f[0]]){ seen[f[0]] = 1; b += f[1]; } });
    });
    return b;
  }

  function render(){
    var u = UI[lang];
    document.documentElement.lang = lang;
    $('langs').innerHTML = [['en','English'],['kn','ಕನ್ನಡ'],['hi','हिंदी']].map(function(l){ return '<button class="lang'+(l[0]===lang?' on':'')+'" data-l="'+l[0]+'">'+l[1]+'</button>'; }).join('');
    $('eyebrow').textContent = u.eyebrow; $('h1').textContent = u.h1; $('intro').textContent = u.intro;
    var on = navigator.onLine;
    $('net').className = 'net' + (on ? '' : ' off'); $('net').querySelector('span').textContent = on ? u.online : u.offline;
    $('miss').hidden = !missing; $('miss').textContent = u.miss(missing);
    $('unsup').hidden = ok; $('unsup').textContent = u.unsup;
    $('hPick').textContent = u.pick; $('hSaved').textContent = u.saved; $('hNeed').textContent = u.need;
    $('wifi').textContent = u.wifi; $('keep').textContent = u.keep;
    $('need').innerHTML = u.needList.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('');

    $('packs').innerHTML = ORDER.map(function(id){
      var P = u.packs[id], fixed = id === 'core', isOn = fixed || !!sel[id];
      var s = ST && ST[id], tag = '';
      if(s){ tag = s.have >= s.total ? '<span class="tag saved">'+u.isSaved+'</span>' : s.have ? '<span class="tag part">'+u.part(s.have, s.total)+'</span>' : '<span class="tag">'+u.notSaved+'</span>'; }
      var size = M && M.packs[id] ? '<span class="tag">≈ '+mb(M.packs[id].bytes)+'</span>' : '';
      var savedPack = ok && BO.state().packs.indexOf(id) >= 0 && !fixed;
      return '<div class="pack'+(isOn?' on':'')+(fixed?' fixed':'')+'" data-p="'+id+'" role="checkbox" aria-checked="'+isOn+'" tabindex="0">'
        + '<div class="ic">'+P[0]+'</div><div><b>'+esc(P[1])+'</b><small>'+esc(P[2])+'</small><div class="meta">'
        + (fixed ? '<span class="tag">'+u.always+'</span>' : '') + size + tag
        + (savedPack && !busy ? '<button class="rm" data-rm="'+id+'" type="button">'+u.remove+'</button>' : '')
        + '</div></div><div class="box">'+(isOn?'✓':'')+'</div></div>';
    }).join('');

    var go = $('go');
    var allSaved = ST && ORDER.every(function(id){ return !(id === 'core' || sel[id]) || (ST[id] && ST[id].have >= ST[id].total); });
    if(!ok){ go.disabled = true; go.textContent = u.go('—'); }
    else if(!on){ go.disabled = true; go.textContent = u.needNet; }
    else if(!M){ go.disabled = true; go.textContent = u.wait; }
    else { go.disabled = busy; go.textContent = allSaved ? u.update : u.go(mb(chosenBytes())); }

    if(msg){ $('done').hidden = false; $('done').className = 'note ' + (msg.bad ? 'bad' : 'ok'); $('done').textContent = msg.bad ? u.failed : msg.same ? u.upToDate : u.done(msg.failed); }
    else $('done').hidden = true;

    var groups = ORDER.map(function(id){
      var list = PAGES[id] || []; if(!list.length) return '';
      return '<details class="grp"'+(id===ORDER.find(function(x){ return (PAGES[x]||[]).length && x !== 'core'; })?' open':'')+'><summary>'+u.packs[id][0]+' '+esc(u.packs[id][1])+'<span>'+u.pages(list.length)+'</span></summary><ul>'
        + list.map(function(p){ return '<li><a href="'+esc(p[0])+'">'+esc(p[1])+'</a></li>'; }).join('') + '</ul></details>';
    }).join('');
    $('saved').innerHTML = groups || '<div class="empty">'+u.nothing+'</div>';
  }

  /* Which pages are actually on the phone right now (checks the cache, so it is always true). */
  function refreshSaved(){
    if(!ok || !M) { render(); return Promise.resolve(); }
    return Promise.all([BO.status(M), caches.open('baio-shell-v3')]).then(function(r){
      ST = r[0]; var c = r[1];
      return Promise.all(ORDER.map(function(id){
        var pages = (M.packs[id] && M.packs[id].pages) || [];
        return Promise.all(pages.map(function(p){ return c.match(new URL(p[0], location.href).href).then(function(h){ return h ? p : null; }); }))
          .then(function(l){ PAGES[id] = l.filter(Boolean); });
      }));
    }).then(function(){
      render();
      if(navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(function(e){ if(e && e.usage) $('storage').textContent = UI[lang].storage(mb(e.usage)); }).catch(function(){});
    }).catch(render);
  }

  /* The file list: from the network when online; offline, the copy saved with the core pack. */
  function getManifest(){
    return BO.manifest().catch(function(){
      return caches.match(new URL('offline-manifest.json', location.href).href).then(function(r){ if(!r) throw 0; return r.json(); });
    });
  }

  $('packs').addEventListener('click', function(e){
    var rm = e.target.closest('[data-rm]');
    if(rm){
      e.stopPropagation();
      if(!M || busy || !confirm(UI[lang].removeAsk)) return;
      var id = rm.getAttribute('data-rm'); sel[id] = false; msg = null;
      BO.remove(M, id).then(refreshSaved); return;
    }
    var card = e.target.closest('.pack'); if(!card || busy) return;
    var id2 = card.getAttribute('data-p'); if(id2 === 'core') return;
    sel[id2] = !sel[id2]; msg = null; render();
  });
  $('packs').addEventListener('keydown', function(e){ if((e.key === ' ' || e.key === 'Enter') && e.target.classList.contains('pack')){ e.preventDefault(); e.target.click(); } });

  $('go').addEventListener('click', function(){
    if(!M || busy) return;
    busy = true; msg = null; render();
    $('progWrap').hidden = false; $('barFill').style.width = '0';
    var ids = ORDER.filter(function(p){ return p === 'core' || sel[p]; });
    getManifest().then(function(m){ M = m;
      return BO.download(M, ids, { onProgress: function(d, t, bd, bt){
        $('barFill').style.width = (t ? Math.round(d / t * 100) : 100) + '%';
        $('prog').textContent = UI[lang].saving(d, t, mb(bd), mb(bt));
      }});
    }).then(function(r){
      msg = { failed: r.failed, same: r.fetched === 0 && r.failed === 0 };
      if(missing){ missing = null; try{ history.replaceState(null, '', 'offline.html'); }catch(x){} }
    }).catch(function(){ msg = { bad: true }; })
      .then(function(){ busy = false; $('progWrap').hidden = true; return refreshSaved(); });
  });

  $('langs').addEventListener('click', function(e){ var b = e.target.closest('button'); if(!b) return; lang = b.dataset.l; try{ localStorage.setItem('baio_lang', lang); }catch(x){} render(); });
  window.addEventListener('online', render); window.addEventListener('offline', render);

  render();
  if(ok){
    if(!navigator.serviceWorker.controller) navigator.serviceWorker.register('sw.js').catch(function(){});
    getManifest().then(function(m){ M = m; return refreshSaved(); }).catch(render);
  }
})();
</script>
</body>
</html>
