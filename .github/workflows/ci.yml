name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check inline script syntax
        run: node scripts/check-html-scripts.js
