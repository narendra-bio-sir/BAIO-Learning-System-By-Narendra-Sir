name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check inline script syntax
        run: node scripts/check-html-scripts.js
      - name: Check offline file list is up to date
        run: |
          python3 scripts/build-offline-manifest.py
          git diff --exit-code offline-manifest.json || { echo "::error::offline-manifest.json is out of date. Run: python3 scripts/build-offline-manifest.py and commit it."; exit 1; }
