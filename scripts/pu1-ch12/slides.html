<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#f8f5ec}
:root{--ui:Inter,'Noto Sans Kannada','Noto Sans Devanagari','Noto Color Emoji',sans-serif;--teal:#0d7f70;--gold:#a87d14;--ink:#15203a}
#s{position:absolute;inset:0;font-family:var(--ui);color:var(--ink);background:#f8f5ec}
.bar{position:absolute;left:0;top:0;right:0;height:10px;background:linear-gradient(90deg,#0d7f70 0 66%,#d4af37 66% 100%)}
.kick{position:absolute;left:4.2%;top:4.6%;font-weight:800;letter-spacing:.2em;color:var(--gold);font-size:calc(var(--u)*1.25)}
.ttl{position:absolute;left:4.2%;right:4.2%;top:8.2%;font-weight:800;letter-spacing:-.01em;font-size:calc(var(--u)*3.2);line-height:1.12}

.body{position:absolute;left:4.2%;right:4.2%;top:21%;bottom:9.5%;display:flex;gap:2.2%}
.cards{flex:1;display:grid;gap:calc(var(--u)*1);align-content:start}
.cards.two{grid-template-columns:1fr 1fr}
.card{background:#fff;border:2px solid #e6dcc4;border-left:calc(var(--u)*.55) solid var(--teal);border-radius:calc(var(--u)*1.1);padding:calc(var(--u)*.9) calc(var(--u)*1.25);font-size:var(--f);line-height:1.38;font-weight:500;display:flex;gap:calc(var(--u)*.8);align-items:flex-start}
.card:nth-child(4n+2){border-left-color:#c99a1c}.card:nth-child(4n+3){border-left-color:#6c48d6}.card:nth-child(4n+4){border-left-color:#c24f28}

.num{flex:0 0 auto;width:calc(var(--f)*1.45);height:calc(var(--f)*1.45);border-radius:50%;background:#f2e3b3;color:#6b4e00;font-weight:800;font-size:calc(var(--f)*.8);display:flex;align-items:center;justify-content:center;margin-top:.1em}
.vis{flex:0 0 38%;background:#fffdf7;border:2px solid #eadfc6;border-radius:calc(var(--u)*1.3);display:flex;align-items:center;justify-content:center;padding:1%}

table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--f);background:#fff;border-radius:calc(var(--u)*1.1);overflow:hidden;border:2px solid #e6dcc4}
th{background:var(--teal);color:#fff;text-align:left;padding:calc(var(--u)*.75) calc(var(--u)*1.1);font-weight:700}
td{padding:calc(var(--u)*.7) calc(var(--u)*1.1);border-top:1.5px solid #efe7d4;line-height:1.3}
tr:nth-child(even) td{background:#fbf7ec}
td:first-child{font-weight:700}
.tip{margin-top:calc(var(--u)*1);background:#fdf4d8;border:2px solid #e8c766;border-radius:calc(var(--u)*1);padding:calc(var(--u)*.8) calc(var(--u)*1.2);font-size:var(--f);font-weight:600}
.tip span{color:var(--gold);font-weight:800;letter-spacing:.12em;margin-right:.6em;font-size:.8em}
/* part / cover */
.part{position:absolute;left:4.2%;top:9%;display:flex;align-items:center;gap:calc(var(--u)*1.2)}
.badge{background:var(--teal);color:#fff;font-weight:800;border-radius:calc(var(--u)*.8);padding:calc(var(--u)*.4) calc(var(--u)*1);font-size:calc(var(--u)*1.6)}
.cover{position:absolute;inset:0;background:radial-gradient(circle at 78% 40%,#e3f3ec,#f8f5ec 60%)}
.cover .big{position:absolute;left:5%;top:20%;width:52%;font-weight:850;font-size:calc(var(--u)*5.2);line-height:1.05;letter-spacing:-.02em}
.cover .big em{font-style:normal;color:var(--teal)}
.cover .sub{position:absolute;left:5%;top:58%;font-size:calc(var(--u)*1.6);color:#4b5563;font-weight:600}
.cover .who{position:absolute;left:5%;top:70%;font-size:calc(var(--u)*1.9);font-weight:800;color:var(--gold)}
.cover .who span{display:block;font-size:.62em;color:#4b5563;font-weight:600;margin-top:.3em}
.cover .art{position:absolute;right:3%;top:14%;width:42%;height:72%}
.lang-kn .kick,.lang-hi .kick{letter-spacing:.03em}
.road{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1);width:100%}
.road .card{align-items:center}
/* ---------- photo cover (both decks) ---------- */
.photo{position:absolute;inset:0;background:#0b2a1a url(../../pu1-ch12-assets/cover-thumb.jpg) center/cover no-repeat}
/* ---------- standard deck: infographic style (same look as the Biomolecules deck) ---------- */
.std #s{background:radial-gradient(1200px 700px at 0% 0%,#e7f3ec 0,rgba(231,243,236,0) 60%),radial-gradient(1100px 700px at 100% 100%,#f6ead2 0,rgba(246,234,210,0) 60%),#f8f4ea}
.std .kick{top:4.4%;left:4.2%;font-size:calc(var(--u)*.95);letter-spacing:.22em;color:#b0841a}
.std.lang-kn .kick,.std.lang-hi .kick{letter-spacing:.04em}
.std .ttl{top:7.6%;font-size:calc(var(--u)*2.55);color:#16213a;letter-spacing:-.01em}
.std .ttl em{color:#0f8a6c}
.std .uline{position:absolute;left:4.2%;top:15.3%;width:4.2%;height:4px;border-radius:2px;background:#d4a52a}
.std .body{top:19.5%;bottom:8.5%;gap:1.6%}
.std .col{flex:1;display:flex;flex-direction:column;gap:calc(var(--u)*.85);min-width:0}
.std .lead{background:linear-gradient(135deg,#dff1e8,#eaf6ef);border:1.5px solid #bfe0cf;border-radius:calc(var(--u)*1.1);padding:calc(var(--u)*1) calc(var(--u)*1.3);font-size:calc(var(--f)*1.08);line-height:1.38;font-weight:600;color:#14324a}
.std .lead b{color:#0f7a62}
.std .grid{display:grid;gap:calc(var(--u)*.85);align-content:start}
.std .grid.two{grid-template-columns:1fr 1fr}
.std .ic{border-radius:calc(var(--u)*1);padding:calc(var(--u)*.8) calc(var(--u)*1.05);font-size:var(--f);line-height:1.38;font-weight:500;display:flex;gap:calc(var(--u)*.75);align-items:flex-start;border:1.5px solid}
.std .ic .e{flex:0 0 auto;width:calc(var(--f)*1.9);height:calc(var(--f)*1.9);border-radius:calc(var(--f)*.55);display:flex;align-items:center;justify-content:center;font-size:calc(var(--f)*1.05);background:rgba(255,255,255,.75)}
.std .ic b{font-weight:750}
.std .t0{background:#fff;border-color:#e9dfc8}.std .t0 b{color:#0f7a62}
.std .t1{background:#f7eed6;border-color:#ead7a6}.std .t1 b{color:#8a5f00}
.std .t2{background:#e4f2ea;border-color:#c3e1d0}.std .t2 b{color:#0f7a62}
.std .t3{background:#fbe8de;border-color:#f1cab6}.std .t3 b{color:#b2431c}
.std .t4{background:#ece7fb;border-color:#d4c9f3}.std .t4 b{color:#5b3fc4}
.std .note{display:flex;align-items:center;gap:calc(var(--u)*.9);background:#fbf1d4;border:1.5px solid #ecd28c;border-radius:calc(var(--u)*1);padding:calc(var(--u)*.75) calc(var(--u)*1.1);font-size:var(--f);line-height:1.38;font-weight:600;color:#3d2c05}
.std .note .tg{flex:0 0 auto;background:#e3b13b;color:#3b2700;font-weight:800;font-size:calc(var(--f)*.62);letter-spacing:.12em;padding:.32em .7em;border-radius:.4em}
.std .note b{color:#a0520f}
.std .panel{flex:0 0 40%;background:#fff;border:1.5px solid #e6dcc4;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*1.2) calc(var(--u)*1) calc(var(--u)*.8);display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(80,60,20,.06)}
.std .panel .cap{font-size:calc(var(--u)*.72);letter-spacing:.16em;font-weight:800;color:#7a8a7f;margin-bottom:calc(var(--u)*.4)}
.std .panel .art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.std .panel svg{width:100%;height:100%}
/* "A vs B" comparison */
.std .vs{display:flex;gap:1.6%;width:100%;align-items:flex-start}
.std .side{flex:1;border-radius:calc(var(--u)*1.2);border:1.5px solid;padding:calc(var(--u)*1.1);display:flex;flex-direction:column;gap:calc(var(--u)*.6)}
.std .side.a{background:#e4f2ea;border-color:#bfe0cf}.std .side.b{background:#f7eed6;border-color:#ead7a6}
.std .side h4{font-size:calc(var(--f)*1.2);font-weight:800;margin-bottom:calc(var(--u)*.2)}
.std .side.a h4{color:#0f7a62}.std .side.b h4{color:#8a5f00}
.std .row2{background:rgba(255,255,255,.72);border-radius:calc(var(--u)*.7);padding:calc(var(--u)*.55) calc(var(--u)*.85);font-size:var(--f);line-height:1.32}
.std .row2 small{display:block;font-size:.66em;letter-spacing:.12em;font-weight:800;color:#7b8a80;text-transform:uppercase;margin-bottom:.15em}
.std.lang-kn .row2 small,.std.lang-hi .row2 small{letter-spacing:.02em}
.std .vsb{flex:0 0 auto;align-self:center;width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);border-radius:50%;background:#fff;border:1.5px solid #e2d6b8;display:flex;align-items:center;justify-content:center;font-weight:800;color:#8a5f00;font-size:calc(var(--u)*1.2)}
/* tables */
.std table{border:1.5px solid #e2d6b8;border-radius:calc(var(--u)*1.1);box-shadow:0 6px 18px rgba(80,60,20,.05)}
.std th{background:#f3e7c6;color:#6b4e00;font-size:calc(var(--f)*.72);letter-spacing:.12em;text-transform:uppercase;font-weight:800}
.std.lang-kn th,.std.lang-hi th{letter-spacing:.02em;text-transform:none;font-size:calc(var(--f)*.85)}
.std td:first-child{color:#0f7a62}
.std tr:nth-child(even) td{background:#f4faf6}
/* roadmap */
.std .road{grid-template-columns:1fr 1fr;gap:calc(var(--u)*.85)}
.std .road .ic{align-items:center;font-weight:650}
.std .road .n{flex:0 0 auto;width:calc(var(--f)*1.8);height:calc(var(--f)*1.8);border-radius:50%;background:#0f8a6c;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:calc(var(--f)*.85)}
.std .foot{bottom:3.4%;font-size:calc(var(--u)*.78);color:#7b7f88}
.std .foot b{color:#a87d14}
</style></head><body><div id="s"></div>
<script>
function over(b){ return b.scrollHeight > b.clientHeight + 2 || [...b.querySelectorAll('.cards,.road,.col,.vs,.side')].some(c => c.scrollHeight > b.clientHeight + 2); }
/* standard deck: grow short text so the slide is filled (up to 1.4x), then size the diagram panel to the text column */
function grow(){
  const b = document.querySelector('.body'); if (!b || !document.body.classList.contains('std')) return;
  const col = b.querySelector('.col, .vs, .road, .cards'); if (!col) return;
  const cap = col.matches('.road') ? 1.3 : col.matches('.cards') ? 1.5 : 1.4, fill = col.matches('.road, .cards') ? 0.8 : 0.9;
  const root = document.documentElement, f0 = parseFloat(getComputedStyle(root).getPropertyValue('--f'));
  const panel = b.querySelector('.panel');
  if (panel){ b.style.alignItems = 'flex-start'; panel.style.height = (b.clientHeight * 0.7) + 'px'; }
  const ch = () => { const t = col.getBoundingClientRect().top; return Math.max(...[...col.children].map(c => c.getBoundingClientRect().bottom)) - t; };
  let f = f0;
  for (let i = 0; i < 14; i++){
    const nf = f * 1.04; if (nf > f0 * cap) break;
    root.style.setProperty('--f', nf + 'px');
    if (over(b) || ch() > b.clientHeight * fill){ root.style.setProperty('--f', f + 'px'); break; }
    f = nf;
  }
  /* road and table slides: spread the rows down the slide instead of leaving the lower half empty */
  const fNow = parseFloat(getComputedStyle(root).getPropertyValue('--f')), tb = col.querySelector(':scope > table');
  const spread = (el, n) => { const h = Math.min(b.clientHeight * 0.82, n * fNow * 4.2); if (h > el.offsetHeight) el.style.height = h + 'px'; if (over(b)) el.style.height = ''; };
  if (col.matches('.road')){ col.style.gridAutoRows = '1fr'; spread(col, Math.ceil(col.children.length / 2)); }
  else if (tb && !panel){
    const h = Math.min(b.clientHeight * 0.82, tb.rows.length * fNow * 4.2), rh = h / tb.rows.length;
    if (h > tb.offsetHeight){ [...tb.rows].forEach(r => { r.style.height = rh + 'px'; }); if (over(b)) [...tb.rows].forEach(r => { r.style.height = ''; }); }
  }
  if (panel){ panel.style.height = Math.min(b.clientHeight, Math.max(ch(), b.clientHeight * 0.7)) + 'px'; }
}
function fit(){ /* shrink text until the body fits */
  const b = document.querySelector('.body'); if (!b) return; let f = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--f'));
  for (let i = 0; i < 30 && (b.scrollHeight > b.clientHeight + 2 || [...b.querySelectorAll('.cards,.road,.col,.vs,.side')].some(c => c.scrollHeight > b.clientHeight + 2)); i++){ f *= .95; document.documentElement.style.setProperty('--f', f + 'px'); }
}

/* ---------- standard deck renderer (infographic style) ---------- */
const ICONS = { breathe:['🌿','⚡','🔥','🍃','🫧','🧪'], glycolysis:['🍬','⚗️','🔋','🧪','➡️','🎯'], fermentation:['🍺','🥛','🦠','⚠️','🔁'],
  krebs:['🔄','⚛️','🧬','🌀','🔋','🧮'], ets:['⚡','🔋','💧','🧲','🌊','⚙️'], balance:['⚖️','🔢','📐','🧮','📊'], amphibolic:['🔀','🥑','🥩','🔁','🚪'], rq:['📊','🌾','🥜','🫘','🧮'] };
const STOP = /^(and|of|the|in|to|a|an|for|with|vs|or|is|are)$/i;
function twoTone(t){
  const raw = t.replace(/&mdash;/g, '—');
  let m;
  if ((m = raw.match(/^(.*?:)\s*(.+)$/))) return [m[1] + ' ', m[2]];
  if ((m = raw.match(/^(.*?)(\([^)]*\))\s*$/))) return [m[1], m[2]];
  if ((m = raw.match(/^(.*?\bvs\.?\s)(.+)$/i))) return [m[1], m[2]];
  const w = raw.split(' ');
  if (w.length < 2) return ['', raw];
  let k = w.length >= 4 ? 2 : 1;
  if (k === 2 && STOP.test(w[w.length - 2])) k = 1;
  return [w.slice(0, w.length - k).join(' ') + ' ', w.slice(w.length - k).join(' ')];
}
function stdHead(U, title, hl){
  let a = title, b = hl || '';
  if (!b){ const p = twoTone(title); a = p[0]; b = p[1]; }
  return `<div class="kick">${U.kick}</div><div class="ttl" data-cue="0">${a}${b ? (hl ? ' — ' : '') + '<em>' + b + '</em>' : ''}</div><div class="uline"></div>`;
}
function stdFoot(U){ return `<div class="foot"><span>${U.ref}</span><span><b>BAIO Learning System</b> · ${U.by}</span></div>`; }
const plainLen = h => h.replace(/<[^>]+>/g, '').length;
function stdSlide(s, U){
  const icons = ICONS[s.topic] || ['📌','✨','🔬','💡','🧪','📎'];
  if (s.type === 'road'){
    const ri = ['🌿','🍬','🍺','🔄','⚡','⚖️','🔀','📊'];
    return stdHead(U, s.title) + `<div class="body"><div class="grid road">${s.items.map((x, i) => `<div class="ic t${[2,1,3,4][i % 4]}" data-cue="${i + 1}"><span class="n">${i + 1}</span><span class="e">${ri[i] || '📘'}</span><span>${x}</span></div>`).join('')}</div></div>` + stdFoot(U);
  }
  if (s.type === 'sec'){
    const c = s.cards, lead = c[0], rest = c.slice(1);
    let note = null;
    if (rest.length >= 2 && plainLen(rest[rest.length - 1]) < 170) note = rest.pop();
    const two = !s.vis && rest.length >= 2;
    const cards = rest.map((x, i) => `<div class="ic t${[0,1,2,3,4][i % 5]}" data-cue="${i + 2}"><span class="e">${icons[(i + 1) % icons.length]}</span><span>${x}</span></div>`).join('');
    const col = `<div class="col"><div class="lead" data-cue="1">${lead}</div>${cards ? `<div class="grid ${two ? 'two' : ''}">${cards}</div>` : ''}${note ? `<div class="note" data-cue="${c.length}"><span class="tg">${U.note}</span><span>${note}</span></div>` : ''}</div>`;
    const panel = s.vis ? `<div class="panel"><div class="cap">${U.dia}</div><div class="art">${V[s.vis](s.lang)}</div></div>` : '';
    return stdHead(U, s.title, s.hl) + `<div class="body">${panel}${col}</div>` + stdFoot(U);
  }
  if (s.type === 'table'){
    const t = s.table;
    if (s.vs){
      const side = (k, cls) => `<div class="side ${cls}"><h4>${t.headers[k]}</h4>${t.rows.map((r, i) => `<div class="row2" data-cue="${i + 1}"><small>${r[0]}</small>${r[k]}</div>`).join('')}</div>`;
      return stdHead(U, t.title) + `<div class="body"><div class="vs">${side(1, 'a')}<div class="vsb">VS</div>${side(2, 'b')}</div></div>` + stdFoot(U);
    }
    return stdHead(U, t.title) + `<div class="body"><div class="cards"><table><tr>${t.headers.map(x => `<th>${x}</th>`).join('')}</tr>${t.rows.map((r, i) => `<tr data-cue="${i + 1}">${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>${s.vis ? `<div class="panel"><div class="cap">${U.dia}</div><div class="art">${V[s.vis](s.lang)}</div></div>` : ''}</div>` + stdFoot(U);
  }
  return '';
}
window.renderSlide = function(s){
  const W = innerWidth, u = W / 100 * 1.04; const large = s.kind === 'large';
  document.documentElement.style.setProperty('--u', u + 'px');
  document.documentElement.style.setProperty('--f', (large ? u * 1.72 : u * 1.36) + 'px');
  document.body.className = (large ? "large" : "std") + " lang-" + s.lang;
  const U = s.ui, el = document.getElementById('s');
  const foot = `<div class="foot"><span><b>${U.foot}</b> · ${U.by}</span><span>${s.n}</span></div>`;
  const head = (t, hl) => `<div class="bar"></div><div class="kick">${U.kick}</div><div class="ttl" data-cue="0">${t}${hl ? ' — <em>' + hl + '</em>' : ''}</div>`;
  let h = '';
  if (s.type === 'cover' || s.type === 'close'){
    h = `<div class="cover" data-cue="0"><div class="bar"></div><div class="kick">${U.kick}</div>
      <div class="big">${s.type === 'cover' ? U.ch + '<br><em>' + U.chap + '</em>' : '<em>' + U.thanks + '</em>'}</div>
      <div class="sub">${s.type === 'cover' ? U.sub : U.chap}</div><div class="who">${U.by}<span>${U.role}</span></div>
      <div class="art">${s.type === 'cover' ? V.energyFlow(s.lang) : V.cellSites(s.lang)}</div></div>`;
  } else if (s.type === 'road'){
    h = head(s.title) + `<div class="body"><div class="road">${s.items.map((x, i) => `<div class="card" data-cue="${i + 1}"><span class="num">${i + 1}</span><span>${x}</span></div>`).join('')}</div></div>` + foot;
  } else if (s.type === 'part'){
    h = `<div class="bar"></div><div class="kick">${U.kick}</div><div class="ttl" data-cue="0" style="top:8.2%"><span class="badge">${U.part} ${s.pn}</span>&nbsp; ${s.title}</div>
      <div class="body"><div class="cards">${s.items.map((x, i) => `<div class="card" data-cue="${i + 1}"><span class="num">✓</span><span>${x}</span></div>`).join('')}</div></div>` + foot;
  } else if (s.type === 'sec'){
    const two = !s.vis && s.cards.length > 2;
    h = head(s.title, s.hl) + `<div class="body"><div class="cards ${two ? 'two' : ''}">${s.cards.map((x, i) => `<div class="card" data-cue="${i + 1}"><span class="num">${i + 1}</span><span>${x}</span></div>`).join('')}</div>${s.vis ? `<div class="vis">${V[s.vis](s.lang)}</div>` : ''}</div>` + foot;
  } else if (s.type === 'table'){
    const t = s.table;
    h = head(t.title) + `<div class="body"><div class="cards"><table><tr>${t.headers.map(x => `<th>${x}</th>`).join('')}</tr>${t.rows.map((r, i) => `<tr data-cue="${i + 1}">${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>${s.vis ? `<div class="vis">${V[s.vis](s.lang)}</div>` : ''}</div>` + foot;
  } else if (s.type === 'rem'){
    h = head(s.title) + `<div class="body"><div class="cards">${s.items.map((x, i) => `<div class="card" data-cue="${i + 1}"><span class="num">★</span><span>${x}</span></div>`).join('')}</div></div>` + foot;
  }
  /* photo thumbnail as the cover of both decks and the close of the standard deck (same as the Biomolecules deck) */
  if (s.type === 'cover' || (s.type === 'close' && !large)){
    el.innerHTML = '<div class="photo" data-cue="0"></div>';
    const r = el.firstChild.getBoundingClientRect(); return { 0: [r.left, r.top, r.width, r.height] };
  }
  if (!large) h = stdSlide(s, U);
  el.innerHTML = h; fit(); grow();
