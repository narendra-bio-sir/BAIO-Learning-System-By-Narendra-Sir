<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<script src="../../notes/src/draw.js"></script><script src="../pu1-ch11/ps-draw.js"></script><script src="diagrams.js"></script><script src="vis.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1240px;height:1754px;overflow:hidden;font-family:'Kalam','Patrick Hand',cursive;color:#1d2b6b;
 background:#fffef6 repeating-linear-gradient(transparent 0 52px,#c9dbf2 52px 54px);background-position:0 120px;position:relative}
body:before{content:'';position:absolute;left:110px;top:0;bottom:0;width:3px;background:#f2a1a1}
.pg{position:absolute;left:140px;right:60px;top:40px;bottom:60px}
h1{font:700 80px/1.1 'Kalam';color:#c62828;text-decoration:underline wavy #f2b705 4px;text-underline-offset:10px;margin-bottom:12px}
h2{font:700 48px/1.3 'Kalam';color:#0d6e5c;margin:16px 0 4px}
h2 u{text-decoration-color:#0d6e5c}
p,li{font:400 35px/54px 'Patrick Hand','Kalam';color:#1d2b6b}
li{margin-left:34px}
b{color:#b71c1c;font-weight:400;background:linear-gradient(transparent 55%,#fff27a 55%)}
.star{color:#e65100;font-weight:700}
.box{border:3px solid #1d2b6b;border-radius:14px;padding:6px 16px;margin:10px 0;background:rgba(255,255,255,.75);transform:rotate(-.4deg)}
.pic{display:flex;justify-content:center;margin:8px 0}
.pic svg{width:78%;height:auto;max-height:var(--ph,560px)}.pic img{max-width:92%;max-height:var(--ph,560px)}
table{border-collapse:collapse;margin:8px 0;background:rgba(255,255,255,.8)}
td,th{border:2px solid #1d2b6b;padding:4px 16px;font:400 32px/44px 'Patrick Hand'}
th{color:#c62828}
.foot{position:absolute;left:140px;right:60px;bottom:16px;display:flex;justify-content:space-between;font:400 20px 'Patrick Hand';color:#6b6b9a}
.cover{text-align:center;padding-top:200px}
.cover h1{font-size:96px;text-decoration:none}
.cover p{font-size:36px;line-height:60px}
</style></head><body><div class="pg" id="pg"></div><div class="foot"><span>Narendra Sir · Lecturer in Biology · BAIO Learning System</span><span id="pn"></span></div>
<script>
const st = '<span class="star">★</span>';
const PG = [
 `<div class="cover"><h1>Respiration<br>in Plants</h1><p>PU-I Biology · Chapter 12<br>Handwritten notes by <b>Narendra Sir</b><br>Lecturer in Biology · Founder/CEO, BAIO Learning System</p><div class="pic">${V.energyFlow()}</div></div>`,
 `<h1>1. Respiration</h1><ul><li>${st} Respiration = breaking of <b>C–C bonds</b> by <b>oxidation</b> inside cells → energy.</li><li>Substrates: usually <b>carbohydrates</b>; also proteins, fats, organic acids.</li><li>${st} Energy released <b>step by step</b> (enzymes) and stored as <b>ATP</b> = energy currency.</li><li>All food respired comes from <b>photosynthesis</b>.</li></ul>
  <div class="box"><p>${st} <b>C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + Energy</b></p></div><div class="pic">${V.burnVsStep()}</div>`,
 `<h1>1b. Do Plants Breathe?</h1><ul><li>${st} Yes — O₂ in, CO₂ out, through <b>stomata</b> &amp; <b>lenticels</b>.</li><li>${st} No lungs because: each part serves itself · <b>low demand</b> · every living cell <b>near the surface</b>.</li><li>Woody stem: living cells in thin layers under the bark; inside = <b>dead</b>. Loose parenchyma = air spaces.</li></ul><div class="pic">${V.woodyStem()}</div>`,
 `<h1>2. Glycolysis (EMP)</h1><div class="pic"><img src="../../pu1-ch12-assets/diag-glycolysis.jpg"></div><ul><li>${st} Embden, Meyerhof, Parnas · <b>cytoplasm</b> · no O₂ · 10 steps.</li><li>ATP used: glucose → G-6-P (<b>hexokinase</b>), F-6-P → F-1,6-BP.</li><li>${st} NADH at <b>PGAL → BPGA</b>; ATP at BPGA → PGA and PEP → pyruvate.</li><li>${st} Net: <b>2 ATP + 2 NADH + 2 pyruvic acid</b>.</li></ul>`,
 `<h1>3. Fermentation</h1><div class="pic"><img src="../../pu1-ch12-assets/diag-fermentation.jpg"></div><table><tr><th></th><th>Alcoholic</th><th>Lactic acid</th></tr><tr><td>Who</td><td>yeast</td><td>muscle, bacteria</td></tr><tr><td>Makes</td><td>ethanol + CO₂</td><td>lactic acid</td></tr><tr><td>Enzyme</td><td>PDC + ADH</td><td>LDH</td></tr></table>
  <p>${st} &lt; <b>7%</b> energy · net <b>2 ATP</b> · yeast dies at <b>13%</b> alcohol · NADH → NAD⁺.</p>`,
 `<h1>4. Link Reaction &amp; Krebs</h1><div class="box"><p>${st} Pyruvic acid + CoA + NAD⁺ → <b>Acetyl CoA</b> + CO₂ + NADH (PDH, Mg²⁺)</p></div><div class="pic"><img src="../../pu1-ch12-assets/diag-krebs.jpg"></div>
  <ul><li>${st} Acetyl CoA + <b>OAA</b> → <b>citric acid</b> (citrate synthase) — Hans Krebs.</li><li>${st} Per turn: <b>3 NADH + 1 FADH₂ + 1 GTP + 2 CO₂</b>.</li></ul>`,
 `<h1>5. ETS</h1><div class="pic"><img src="../../pu1-ch12-assets/diag-ets.jpg"></div><ul><li>${st} I → <b>UQ</b> (+ II) → III → <b>cyt c</b> → IV → <b>O₂ → H₂O</b>.</li><li>${st} <b>NADH = 3 ATP</b>, <b>FADH₂ = 2 ATP</b>.</li><li>O₂ = final H acceptor; drives the whole process.</li><li>ATP synthase: <b>F₀</b> channel + <b>F₁</b> head; <b>4H⁺ per ATP</b>.</li></ul>`,
 `<h1>6. Balance Sheet</h1><table><tr><th>Stage</th><th>ATP</th></tr><tr><td>Glycolysis (2 + 2 NADH)</td><td>8</td></tr><tr><td>Link (2 NADH)</td><td>6</td></tr><tr><td>Krebs (2 + 6 NADH + 2 FADH₂)</td><td>24</td></tr><tr><td><b>Total</b></td><td><b>38</b></td></tr></table>
  <ul><li>${st} Assumptions: orderly pathway · NADH enters mito · no withdrawal · only glucose.</li><li>${st} Fermentation: partial, <b>2 ATP</b>, slow NADH oxidation.</li></ul><div class="pic">${V.balanceBars()}</div>`,
 `<h1>7. Amphibolic Pathway</h1><div class="pic"><img src="../../pu1-ch12-assets/diag-amphibolic.jpg"></div><ul><li>${st} Fatty acids → <b>acetyl CoA</b> · glycerol → <b>PGAL</b> · amino acids (deaminated) → pyruvate / acetyl CoA / Krebs.</li><li>${st} Same intermediates withdrawn for synthesis ⇒ <b>catabolism + anabolism = amphibolic</b>.</li></ul>`,
 `<h1>8. Respiratory Quotient</h1><div class="box"><p>${st} <b>RQ = CO₂ evolved / O₂ consumed</b></p></div><ul><li>Carbohydrate: 6CO₂/6O₂ = <b>1</b></li><li>${st} Fat (tripalmitin): 102CO₂/145O₂ = <b>0.7</b></li><li>Protein: about <b>0.9</b></li><li>Substrates are usually mixed.</li></ul><div class="pic">${V.rqBars()}</div>`
];
const n = +new URLSearchParams(location.search).get('p') || 1;
document.getElementById('pg').innerHTML = PG[n - 1]; document.getElementById('pn').textContent = n + ' / ' + PG.length; window.NP = PG.length;
window.FIT = () => { let ph = 560; const pg = document.getElementById('pg'); for (let k = 0; k < 30 && pg.scrollHeight > pg.clientHeight; k++){ ph *= .92; document.documentElement.style.setProperty('--ph', ph + 'px'); } return pg.scrollHeight > pg.clientHeight; };
</script></body></html>
