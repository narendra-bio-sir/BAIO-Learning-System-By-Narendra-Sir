<!doctype html>
<html><head><meta charset="utf-8">
<title>Career guidance social banner</title>
<!-- Short, big-text social banner for BAIO Career Guidance. ?f=post (1080x1350) or ?f=story (1080x1920). Rendered by social.js -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#14053b}
body{font-family:Inter,'Noto Sans Kannada','Noto Sans Devanagari',sans-serif;color:#fff}
#c{position:relative;width:1080px;height:1350px;overflow:hidden;
  background:
   radial-gradient(700px 560px at 100% 0%, rgba(255,92,190,.45), transparent 62%),
   radial-gradient(700px 600px at 0% 100%, rgba(56,214,255,.20), transparent 60%),
   linear-gradient(160deg,#3a0f8f 0%,#24086b 50%,#14053b 100%)}
.story #c{height:1920px}
.wrap{position:relative;height:100%;padding:56px 64px 0;display:flex;flex-direction:column}
.wrap>*{flex-shrink:0}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:68px;height:68px;border-radius:18px;background:linear-gradient(145deg,#ffe07a,#f2b632);color:#2a0b6e;font:900 40px 'Inter Display',Inter;display:flex;align-items:center;justify-content:center}
.brand h1{font:800 32px 'Inter Display',Inter}
.free{padding:14px 26px;border-radius:999px;background:#ffd84d;color:#22085c;font:900 28px Inter;letter-spacing:1px}
.t1{margin-top:50px;font:900 112px/1 'Inter Display',Inter;letter-spacing:-4px}
.t1 span{display:block;background:linear-gradient(95deg,#ffd84d 0%,#ff9ad5 60%,#9fe8ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:18px;font:600 34px/1.3 Inter;color:#eae2ff}
.list{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:54px}
.it{display:flex;align-items:center;gap:18px;padding:36px 24px;border-radius:24px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.18)}
.it .e{font-size:64px;line-height:1;flex:none}
.it b{font:800 36px/1.12 'Inter Display',Inter}
.cap{position:absolute;right:70px;top:150px;font-size:230px;transform:rotate(12deg);filter:drop-shadow(0 24px 40px rgba(0,0,0,.45))}
.story .cap{top:210px;font-size:260px}
.cta{margin-top:auto;margin-bottom:56px;padding:30px 34px;border-radius:30px;background:linear-gradient(100deg,#ffd84d,#ffb547 55%,#ff8fc8);color:#22085c;text-align:center}
.cta b{display:block;font:900 46px/1.1 'Inter Display',Inter;letter-spacing:-1px}
.cta small{display:block;font:700 26px Inter;margin-top:8px;color:#4a2a10}
/* story: one column, bigger */
.story .t1{margin-top:110px;font-size:132px}
.story .sub{font-size:40px}
.story .list{grid-template-columns:1fr;gap:24px;margin-top:80px}
.story .it{padding:34px 32px}.story .it .e{font-size:66px}.story .it b{font-size:44px}
.story .cta{margin-bottom:110px}.story .cta b{font-size:54px}
</style></head>
<body>
<div id="c"><div class="cap">🎓</div><div class="wrap">
  <div class="top"><div class="brand"><div class="logo">B</div><h1>BAIO App</h1></div><div class="free">FREE</div></div>
  <div class="t1">Career<span>Guidance</span></div>
  <div class="sub">Plan your future with Narendra Sir</div>
  <div class="list">
    <div class="it"><span class="e">📊</span><b>My career report</b></div>
    <div class="it"><span class="e">🧭</span><b>Medical or Engineering?</b></div>
    <div class="it"><span class="e">💰</span><b>Scholarships</b></div>
    <div class="it"><span class="e">🏦</span><b>Education loans</b></div>
    <div class="it"><span class="e">🏛️</span><b>Top colleges &amp; seats</b></div>
    <div class="it"><span class="e">🎓</span><b>66 careers</b></div>
  </div>
  <div class="cta"><b>Open BAIO → Career Guidance</b><small>English · ಕನ್ನಡ · हिंदी</small></div>
</div></div>
<script>if(/f=story/.test(location.search)) document.documentElement.classList.add('story');</script>
</body></html>
