/* ---------- ₹299 per chapter + class bundles ----------

};

const CODE_SALT = 'BAIO-STUDENT-LOCK-2026', CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const norm = s => (s || '').toString().trim().toUpperCase().replace(/\s+/g, ' ');
function fnv(str){ let h = 0x811c9dc5; for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return h >>> 0; }
function code(name, roll, section, ck){
  const key = CODE_SALT + '|' + norm(name) + '|' + norm(roll) + '|' + norm(section) + (ck ? '|' + norm(ck) : '');
  let n = (BigInt(fnv(key)) << 32n) | BigInt(fnv(key.split('').reverse().join('') + CODE_SALT));
  const base = BigInt(CODE_CHARS.length); let c = '';
  for(let i = 0; i < 8; i++){ c += CODE_CHARS[Number(n % base)]; n = n / base; }
  return c.slice(0, 4) + '-' + c.slice(4, 8);
}
function store(){ try{ return JSON.parse(localStorage.getItem(STORE) || '{}') || {}; }catch(e){ return {}; } }
function save(id, o){ try{ const s = store(); s[id] = Object.assign({ts: Date.now()}, o); localStorage.setItem(STORE, JSON.stringify(s)); }catch(e){} }
function readJSON(k){ try{ return JSON.parse(localStorage.getItem(k) || 'null'); }catch(e){ return null; } }

  if(store()['*']) return true;

  $('#body').innerHTML = head + (ok ? `<div class="okbar">✅ Unlocked on this phone · every language</div>` : `<div class="pv">🎧 <b>Free preview</b> — the first 2 minutes in any language. Unlock the full podcast for ₹${PRICE}.</div>`)
    + player
    + (ok ? `<div class="acts"><a class="btn teal" href="${A.href}">📘 Open chapter</a></div>` : locked(id));
  wirePlayer(id, ok);
  if(!ok) wireBuy(id);
  window.scrollTo(0, 0);
}
function wirePlayer(id, ok){
  const A = POD[id], au = $('#au'), tr = $('#tr');
  audio = au;
  const fmt = t => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  const setLang = l => { au.src = AUDIO_ROOT + A.base + 'podcast-' + l + '.mp3' + (AUDIO_VER[id + '/' + l] ? '?v=' + AUDIO_VER[id + '/' + l] : ''); au.load(); $('#langs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.l === l)); tr.className = 'tr'; tr.textContent = ok ? '' : 'Free preview: first 2:00'; };
  $('#langs').onclick = e => { const b = e.target.closest('button'); if(b) setLang(b.dataset.l); };
  au.addEventListener('loadedmetadata', () => { if(ok) tr.textContent = 'Length ' + fmt(au.duration); else tr.textContent = 'Free preview: first 2:00 of ' + fmt(au.duration); });
  if(!ok){
    const cap = () => { if(au.currentTime >= TRIAL_SEC){ au.pause(); au.currentTime = TRIAL_SEC - 0.3; tr.className = 'tr end'; tr.textContent = '⏸ Free preview ended — unlock the full podcast below for ₹' + PRICE; } };
    au.addEventListener('timeupdate', cap); au.addEventListener('seeking', cap); au.addEventListener('play', cap);
  }
  if('mediaSession' in navigator) try{ navigator.mediaSession.metadata = new MediaMetadata({title: A.t, artist: 'Narendra Sir · BAIO', album: A.ch, artwork: [{src:'icon-512.png', sizes:'512x512', type:'image/png'}]}); }catch(e){}
  setLang(A.langs[0]);
}
function locked(id){
  const A = POD[id], b = bundleOf(id), B = BUNDLES[b], n = bIds(b).length;
  return `<div class="inside"><h4>🔒 Unlock the full podcast</h4><ul><li>🎧 The complete chapter, start to end</li><li>🌐 All ${A.langs.length} languages: ${A.langs.map(l => LANG[l] || l).join(' · ')}</li><li>⏩ Change speed, pause and replay any time</li><li>♾️ Yours to keep on this phone</li></ul></div>`
    + buyBox(id, PRICE, '', 'one-time · this chapter · all languages', `Already bought this chapter's Premium${id.startsWith('pu2') ? ' or the PU-II bundle' : ''}? Enter that code here — it includes the Audio Podcast.`)
    + (bundleOwned(b) ? '' : `<a class="bndlink" href="#${b}">🎁 Or get all ${n} ${B.short} podcasts for ₹${B.price} (instead of ₹${n * PRICE}) →</a>`);
}
function openBundle(b){
  stopAudio();
  const B = BUNDLES[b], list = bIds(b), n = list.length;
  $('#hero').hidden = true; $('#library').hidden = true; $('#chapter').hidden = false;
  $('#cch').textContent = B.cls + ' · all chapters';
  const head = `<div class="hd"><span class="ic" style="background:linear-gradient(150deg,#C79A2A,#0b1b14)">🎁</span><div><div class="k">🎧 Audio Podcasts · bundle</div><h2>All ${n} ${B.short} podcasts</h2><p>One payment, one code: every ${B.cls} chapter's full podcast in all its languages.</p></div></div>`;
  if(bundleOwned(b)){
    $('#body').innerHTML = head + `<div class="okbar">✅ All ${n} ${B.short} podcasts are unlocked on this phone</div><div class="acts"><button class="btn primary" id="bndBack">🎧 Open the podcasts</button></div>`;
    $('#bndBack').onclick = () => { location.hash = ''; };
    window.scrollTo(0, 0); return;
  }
  $('#body').innerHTML = head
    + `<div class="inside"><h4>📦 What's inside</h4><ul>${list.map(id => `<li>${POD[id].ic} ${esc(POD[id].t)}${unlocked(id) ? ' <small style="color:var(--teal)">(already yours)</small>' : ''}</li>`).join('')}</ul></div>`
    + buyBox(b, B.price, `<s style="color:var(--ink-dim);font-size:15px;margin-right:6px">₹${n * PRICE}</s>`, 'one-time · all ' + n + ' ' + B.short + ' podcasts', B.also.length ? 'Already have the PU-II Premium bundle code? Enter it here — it opens every PU-II podcast too.' : 'One code opens every I PUC podcast.');
  wireBuy(b);
  window.scrollTo(0, 0);
}
function buyBox(id, price, was, sub, note){
  const p = profile();
  return `<div class="buy"><div class="price">${was}<b>₹${price}</b><span>${sub}</span></div>`
    + `<div class="steps"><div><i>1</i>Pay ₹${price}</div><div><i>2</i>Send the screenshot</div><div><i>3</i>Enter your code</div></div>`
    + `<div class="col"><a class="btn primary" id="payUpi" href="${upiLink(id)}">📲 Pay ₹${price} with UPI app</a>${RZP_LINK ? `<a class="btn" href="${RZP_LINK}" target="_blank" rel="noopener">💳 Pay online</a>` : ''}<a class="btn teal" id="payWa" href="#" target="_blank" rel="noopener">📤 Send screenshot on WhatsApp</a></div>`
    + `<div class="upi">UPI ID: <b>${UPI_ID}</b> <button type="button" id="copyUpi">Copy</button></div>`
    + `<form id="pdForm" autocomplete="off"><div class="msg" id="pdMsg"></div><input id="pdName" placeholder="Full name (e.g. Vishwapal)" value="${esc(p.name)}"><input id="pdSection" placeholder="Section (e.g. Spark)" value="${esc(p.section)}"><input id="pdRoll" placeholder="Roll number (e.g. 25MPU0087)" value="${esc(p.roll)}"><input id="pdCode" placeholder="Podcast unlock code" autocapitalize="characters"><button class="btn primary" type="submit">🔓 Unlock</button></form>`
    + `<div class="note">${note} Not opened by the demo code or the 1-day trial.</div></div>`;
}
function upiLink(id){ const B = BUNDLES[id]; return 'upi://pay?pa=' + UPI_ID + '&pn=' + encodeURIComponent('Narendra Sir') + '&am=' + (B ? B.price : PRICE) + '&cu=INR&tn=' + encodeURIComponent(B ? 'Podcasts ' + B.short + ' all chapters' : 'Podcast ' + id.toUpperCase()); }
function waLink(id){
  const B = BUNDLES[id], A = POD[id], v = k => (($('#' + k) || {}).value || '').trim();
  const what = B ? 'all ' + bIds(id).length + ' ' + B.short + ' chapter podcasts, bundle' : A.ch + ': ' + A.t;
  const msg = 'Hi Narendra Sir, I paid ₹' + (B ? B.price : PRICE) + ' for the Audio Podcast (' + what + ').\n\nName: ' + v('pdName') + '\nSection: ' + v('pdSection') + '\nRoll number: ' + v('pdRoll') + '\n\n(Attaching my payment screenshot.) Please send my podcast unlock code.';
  return 'https://wa.me/919008968389?text=' + encodeURIComponent(msg);
}
function wireBuy(id){
  const wa = $('#payWa'); wa.href = waLink(id); wa.addEventListener('click', () => { wa.href = waLink(id); });
  $('#copyUpi').onclick = () => { const b = $('#copyUpi'), done = () => { b.textContent = 'Copied ✓'; setTimeout(() => b.textContent = 'Copy', 1800); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(UPI_ID).then(done, () => {}); else done(); };
  $('#pdForm').onsubmit = e => { e.preventDefault();
    const v = k => ($('#' + k).value || '').trim(), name = v('pdName'), section = v('pdSection'), roll = v('pdRoll'), c = v('pdCode').toUpperCase(), m = $('#pdMsg');
    if(!c){ m.textContent = 'Please enter your unlock code.'; return; }
    if(MASTER_CODES.some(x => x.toUpperCase() === c)){ try{ localStorage.removeItem(OWNER_LOCK); }catch(e){} save('*', {method:'master'}); route(); return; }
    if(!name || !section || !roll){ m.textContent = 'Please fill in your name, section and roll number exactly as you sent them to Narendra Sir.'; return; }
    const b = BUNDLES[id] ? id : bundleOf(id), B = BUNDLES[b];
    if([B.key].concat(B.also).some(k => code(name, roll, section, k) === c)){ save(b, {method:'code', name, roll, section}); route(); return; }
    const ok = !BUNDLES[id] && ([podKey(id), PREMIUM[id] && PREMIUM[id][1]].filter(Boolean).some(k => code(name, roll, section, k) === c)
      || (id === 'pu2-ch4' && code(name, roll, section) === c));
    if(ok){ save(id, {method:'code', name, roll, section}); route(); return; }
    m.textContent = 'That name / section / roll number / code combination was not recognised. Check the spelling, or ask Narendra Sir.'; };
}

function showLibrary(){ stopAudio(); $('#hero').hidden = false; $('#library').hidden = false; $('#chapter').hidden = true; drawLibrary(); }
function route(){ const h = decodeURIComponent(location.hash.slice(1)); if(BUNDLES[h]) openBundle(h); else if(POD[h]) openCh(h); else showLibrary(); }
$('#back').onclick = () => { location.hash = ''; };
window.addEventListener('hashchange', route);
route();
})();
</script>
</body>
