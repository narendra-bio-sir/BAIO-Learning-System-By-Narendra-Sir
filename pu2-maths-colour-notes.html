<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>II PUC Maths Colour Notes · All 13 Chapters | BAIO Learning System</title>
<meta name="description" content="Karnataka board II PUC Mathematics colour notes by BAIO Learning System: all 13 chapters, formulas, solved ideas and board practice questions. Free to read, ₹100 to download the PDF.">
<meta name="theme-color" content="#1e1b4b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="II PUC Maths Colour Notes · BAIO Learning System">
<meta property="og:description" content="All 13 chapters on 28 colour-coded pages. Free to read, ₹100 to download.">
<meta property="og:image" content="https://narendra-bio-sir.github.io/BAIO-Learning-System-By-Narendra-Sir/pu2-mat-colour-notes/page-01.jpg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#0b1020;--card:#141a33;--ink:#eef0ff;--ink-dim:#a9b0d6;--gold:#fbbf24;--line:rgba(160,170,230,.22);--acc:#8b5cf6}
[data-theme="light"]{--bg:#f6f4ff;--card:#fff;--ink:#1e1b4b;--ink-dim:#5b5f86;--gold:#b45309;--line:rgba(60,50,140,.18);--acc:#6d28d9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(120deg,#1e1b4b,#3730a3 60%,#6d28d9);color:#fff}
.top a{color:#fff;text-decoration:none}
.top .b{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#ffe07a,#f2b632);color:#1e1b4b;font-weight:900;display:flex;align-items:center;justify-content:center}
.top .ttl{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;padding:6px 10px;font:inherit;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:16px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.hero .ey{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--acc);text-transform:uppercase}
.hero h1{margin:4px 0 6px;font-size:24px;line-height:1.2}
.hero h1 span{color:var(--gold)}
.hero p{margin:0;color:var(--ink-dim);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line)}
.dl-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none}
.dl-btn.dl{background:var(--gold);border-color:var(--gold);color:#1e1b4b}
.dl-btn.view{border-color:var(--acc);color:var(--ink)}
.cn-share{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.cn-buy{border:1.5px dashed var(--gold);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--card)}
.cn-buy.ok{border-style:solid;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cn-buy-h{font-weight:700;color:var(--gold);margin-bottom:4px}
.cn-small{font-size:12.5px;color:var(--ink-dim);line-height:1.45}
.cn-buy-btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.cn-form{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cn-form input{padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit;font-size:13px;min-width:0}
.cn-form #cnName,.cn-form #cnCode,.cn-form .cn-msg,.cn-form button{grid-column:1/-1}
.cn-msg{font-size:12px;color:#e05252;min-height:1em}
.toc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.toc b{font-size:13px}
.toc .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.toc button{border:1px solid var(--line);background:transparent;color:inherit;border-radius:8px;padding:6px 9px;font:inherit;font-size:12px;cursor:pointer}
.toc button:hover{border-color:var(--gold);color:var(--gold)}
.cn-pages{display:flex;flex-direction:column;gap:14px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cn-page{margin:0;scroll-margin-top:70px}
.cn-imgwrap{position:relative;max-width:820px;margin:0 auto;border-radius:10px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.25);background:#1e1b4b}
.cn-imgwrap img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.cn-wm{position:absolute;inset:-20%;display:flex;flex-direction:column;justify-content:space-around;align-items:center;transform:rotate(-28deg);pointer-events:none}
.cn-wm span{white-space:nowrap;font:700 clamp(11px,2.6vw,20px)/1 sans-serif;color:rgba(140,140,140,.3);letter-spacing:.5px}
.cn-page figcaption{text-align:center;font-size:11px;color:var(--ink-dim);margin-top:5px}
.cn-shield{display:none;flex-direction:column;position:fixed;inset:0;z-index:99999;background:#0b1530;color:#fff;font:700 20px/1.6 sans-serif;text-align:center;align-items:center;justify-content:center;cursor:pointer}
.cn-shield span{font-weight:400;font-size:14px;opacity:.8}
body.cn-hidden .cn-pages{visibility:hidden}
body.cn-hidden .cn-shield{display:flex}
footer{text-align:center;color:var(--ink-dim);font-size:12px;padding:20px 0 30px}
@media print{ .cn-pages{display:none !important} }
@media (max-width:520px){ .hero h1{font-size:21px} }
</style>
</head>
<body>
<div class="top">
  <a href="index.html" aria-label="BAIO home" class="b">B</a>
  <div class="ttl">II PUC Maths · Colour Notes</div>
  <a class="dl-btn" style="color:#fff;border-color:rgba(255,255,255,.35);padding:6px 10px" href="pcm.html">📐 PCM</a>
  <button type="button" id="themeBtn" aria-label="Switch theme">☀️</button>
</div>
<main id="app"></main>
<div class="cn-shield" id="cnShield">🔒 Notes hidden<br><span>Tap here to continue reading</span></div>
<footer>BAIO Learning System · Narendra Sir · Founder &amp; CEO</footer>

<script>
/* ---------------- II PUC MATHS COLOUR NOTES (all 13 chapters, 28 pages) ----------------
   Same model as the Biology chapter colour notes: reading is free; the PDF download
   costs ₹100 and unlocks with a name/section/roll code (content key MAT-PU2-COLOURNOTES
   in ns-gen.html) or the master code. Page images: pu2-mat-colour-notes/page-NN.jpg,
   built from scripts/pu2-mat-cn (node render-pages.js). */
const PAGES = 28;
const CN_UNLOCK_KEY = 'pu2mat_colour_notes_unlock';
const CN_CONTENT_KEY = 'MAT-PU2-COLOURNOTES';
const CN_PRICE_RUPEES = 100;
const CN_RAZORPAY_LINK = 'YOUR_PU2_MATHS_CN_LINK_HERE'; /* II PUC Maths Colour Notes ₹100 payment link */
const HW_MASTER_CODE = 'NS-MASTER-2027';
const STUDENT_KEY = 'pu2mat_student_profile';
const CN_BRAND_LINE = 'BAIO Learning System · Narendra Sir';
const CN_CRED_LINE = 'Founder & CEO · II PUC Maths Colour Notes';
const TOC = [[1,'Contents & blueprint',2],[2,'Relations & Functions',3],[3,'Inverse Trig',5],[4,'Matrices',7],[5,'Determinants',9],[6,'Continuity & Diff.',11],[7,'Application of Derivatives',14],[8,'Integrals',16],[9,'Application of Integrals',19],[10,'Differential Equations',20],[11,'Vectors',22],[12,'3D Geometry',24],[13,'Linear Programming',26],[14,'Probability',27]];

/* code check — identical to the chapter apps so ns-gen.html codes work here */
const CODE_SALT = 'BAIO-STUDENT-LOCK-2026';
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function normalizeField(s){ return (s || '').toString().trim().toUpperCase().replace(/\s+/g, ' '); }
function fnv1aHash(str){ let h = 0x811c9dc5; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return h >>> 0; }
function computeStudentCode(name, roll, section, contentKey){
  const ck = contentKey ? ('|' + normalizeField(contentKey)) : '';
  const key = CODE_SALT + '|' + normalizeField(name) + '|' + normalizeField(roll) + '|' + normalizeField(section) + ck;
  const h1 = fnv1aHash(key), h2 = fnv1aHash(key.split('').reverse().join('') + CODE_SALT);
  let n = (BigInt(h1) << 32n) | BigInt(h2); const base = BigInt(CODE_CHARS.length); let code = '';
  for(let i=0;i<8;i++){ code += CODE_CHARS[Number(n % base)]; n = n / base; }
  return code.slice(0,4) + '-' + code.slice(4,8);
}

function cnPageSrc(i){ return `pu2-mat-colour-notes/page-${String(i).padStart(2,'0')}.jpg?v=1`; }
function cnStudent(){ try{ return JSON.parse(localStorage.getItem(STUDENT_KEY)||'null')||{}; }catch(e){ return {}; } }
function cnGetUnlock(){ try{ return JSON.parse(localStorage.getItem(CN_UNLOCK_KEY)||'null'); }catch(e){ return null; } }
function cnQualifies(){ const u=cnGetUnlock(); return !!(u && u.unlocked); }
function cnWatermarkText(){ return CN_BRAND_LINE + ' · ' + CN_CRED_LINE; }
function cnEscape(t){ return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cnPayWaLink(){
  const st=cnStudent();
  const msg='Hi Narendra Sir, I paid ₹'+CN_PRICE_RUPEES+' for the II PUC Maths Colour Notes download (all 13 chapters).\n\nName: '+(st.name||'')+'\nSection: '+(st.section||'')+'\nRoll No: '+(st.roll||'')+'\n\n(Attaching my payment screenshot below)';
  return 'https://wa.me/919008968389?text='+encodeURIComponent(msg);
}
function cnDownloadBox(){
  if(cnQualifies()) return `<div class="cn-buy ok"><div><b>🔓 Download unlocked</b><div class="cn-small">Thank you! The PDF is yours to study offline.</div></div><button type="button" class="dl-btn dl" id="cnDlBtn" onclick="cnDownload()">⬇ Download PDF</button></div>`;
  const st=cnStudent(), payReady = CN_RAZORPAY_LINK.indexOf('YOUR_')!==0;
  return `<div class="cn-buy"><div class="cn-buy-h">🔒 Download PDF – ₹${CN_PRICE_RUPEES}</div>
    <div class="cn-small">Reading here is free. To keep all ${PAGES} pages offline, pay ₹${CN_PRICE_RUPEES}, then send Narendra Sir the payment screenshot on WhatsApp. He'll send your personal unlock code.</div>
    <div class="cn-buy-btns">${payReady?`<a class="dl-btn dl" href="${CN_RAZORPAY_LINK}" target="_blank" rel="noopener">Pay ₹${CN_PRICE_RUPEES}</a>`:''}<a class="dl-btn view" href="${cnPayWaLink()}" target="_blank" rel="noopener">💬 Send payment on WhatsApp</a></div>
    <div class="cn-form"><input id="cnName" placeholder="Full name" value="${cnEscape(st.name||'')}"><input id="cnSection" placeholder="Section" value="${cnEscape(st.section||'')}"><input id="cnRoll" placeholder="Roll number" value="${cnEscape(st.roll||'')}"><input id="cnCode" placeholder="Unlock code (e.g. ABCD-EFGH)" autocomplete="off"><button type="button" class="dl-btn dl" onclick="cnSubmit()">Unlock</button><div class="cn-msg" id="cnMsg"></div></div></div>`;
}
function cnSave(o){ try{ localStorage.setItem(CN_UNLOCK_KEY, JSON.stringify(Object.assign({unlocked:true,ts:Date.now()},o))); }catch(e){} }
function cnSubmit(){
  const v=id=>((document.getElementById(id)||{}).value||'').trim();
  const name=v('cnName'), section=v('cnSection'), roll=v('cnRoll'), code=v('cnCode').toUpperCase();
  const m=document.getElementById('cnMsg');
  if(!code){ m.textContent='Please enter your unlock code.'; return; }
  if(code===HW_MASTER_CODE){ cnSave({method:'master',name:name||'Narendra Sir',roll}); render(); return; }
  if(!name||!section||!roll){ m.textContent='Fill in name, section and roll number exactly as you gave them to Narendra Sir.'; return; }
  try{ localStorage.setItem(STUDENT_KEY, JSON.stringify({name,section,roll})); }catch(e){}
  if(computeStudentCode(name,roll,section,CN_CONTENT_KEY)===code){ cnSave({method:'code',name,roll,section}); render(); return; }
  m.textContent='That code does not match this name, section and roll number. Check the spelling, or ask Narendra Sir.';
}
function cnLoadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
async function cnDownload(){
  if(!cnQualifies()) return;
  if(typeof window.jspdf==='undefined'){ alert('The PDF tool did not load. Check your internet and try again.'); return; }
  const btn=document.getElementById('cnDlBtn'); const orig=btn?btn.textContent:'';
  const wm=cnWatermarkText();
  try{
    const { jsPDF } = window.jspdf; const pdf=new jsPDF({unit:'pt',format:'a4',compress:true});
    const W=pdf.internal.pageSize.getWidth(), H=pdf.internal.pageSize.getHeight();
    for(let i=1;i<=PAGES;i++){
      if(btn) btn.textContent='Preparing '+i+'/'+PAGES+'…';
      const im=await cnLoadImg(cnPageSrc(i));
      const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight;
      const x=c.getContext('2d'); x.drawImage(im,0,0);
      x.save(); x.globalAlpha=0.08; x.fillStyle='#000'; x.font='bold '+Math.round(c.width/26)+'px sans-serif'; x.textAlign='center';
      x.translate(c.width/2,c.height/2); x.rotate(-Math.PI/6);
      for(let k=-4;k<=4;k++){ x.fillText(CN_BRAND_LINE, 0, k*c.height/6); }
      x.restore();
      x.fillStyle='rgba(0,0,0,.6)'; x.fillRect(0,c.height-30,c.width,30); x.fillStyle='#fff'; x.font='14px sans-serif'; x.textAlign='center';
      x.fillText('© '+wm+' · Not for sharing', c.width/2, c.height-10);
      if(i>1) pdf.addPage();
      const r=Math.min(W/c.width,H/c.height), w=c.width*r, h=c.height*r;
      pdf.addImage(c.toDataURL('image/jpeg',0.85),'JPEG',(W-w)/2,(H-h)/2,w,h);
    }
    pdf.save('II_PUC_Maths_Colour_Notes_BAIO.pdf');
    if(btn){ btn.textContent='Downloaded ✓'; setTimeout(()=>btn.textContent=orig,2000); }
  }catch(e){ if(btn) btn.textContent=orig; alert('Download failed. Please check your internet and try again.'); }
}
function cnShareUrl(){ return location.origin + location.pathname; }
async function cnShare(){
  const url=cnShareUrl(), text='📐 II PUC Maths Colour Notes — all 13 chapters, 28 pages (BAIO Learning System, Narendra Sir). Read free, or pay ₹'+CN_PRICE_RUPEES+' to download the PDF:';
  if(navigator.share){ try{ await navigator.share({title:document.title, text, url}); return; }catch(e){ if(e && e.name==='AbortError') return; } }
  window.open('https://wa.me/?text='+encodeURIComponent(text+'\n'+url), '_blank', 'noopener');
}
function cnCopyLink(btn){
  const url=cnShareUrl(), done=()=>{ if(btn){ const o=btn.textContent; btn.textContent='✓ Link copied'; setTimeout(()=>btn.textContent=o,1800); } };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(url).then(done, ()=>{ prompt('Copy this link:', url); }); }
  else { prompt('Copy this link:', url); }
}
function go(p){ const el=document.getElementById('cnp'+p); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
function render(){
  const wm=cnEscape(cnWatermarkText());
  const wmRows=Array.from({length:9},()=>`<span>${wm} &nbsp;&nbsp; ${wm}</span>`).join('');
  let pages='';
  for(let i=1;i<=PAGES;i++){
    pages += `<figure class="cn-page" id="cnp${i}"><div class="cn-imgwrap"><img src="${cnPageSrc(i)}" alt="II PUC Maths colour notes, page ${i} of ${PAGES}" loading="${i<=2?'eager':'lazy'}" decoding="async" draggable="false" width="1112" height="1572"><div class="cn-wm" aria-hidden="true">${wmRows}</div></div><figcaption>Page ${i} / ${PAGES}</figcaption></figure>`;
  }
  const toc=TOC.map(([n,t,p])=>`<button type="button" onclick="go(${p})">${n===1?'📋':'Ch '+(n-1)+' ·'} ${t}</button>`).join('');
  document.getElementById('app').innerHTML = `
    <div class="hero"><div class="ey">Karnataka Board · II PUC</div><h1>Mathematics <span>Colour Notes</span></h1>
      <p>All 13 chapters on ${PAGES} colour-coded pages: definitions, every formula, solved board-style ideas and practice questions with answers. Free to read here — just scroll down.</p>
      <div class="chips"><span>📘 NCERT based</span><span>🎯 Board + KCET + JEE</span><span>🧮 115 practice questions with answers</span></div></div>
    <div class="cn-share"><button type="button" class="dl-btn view" onclick="cnShare()">📤 Share these notes</button><button type="button" class="dl-btn" onclick="cnCopyLink(this)">🔗 Copy link</button></div>
    ${cnDownloadBox()}
    <div class="toc"><b>Jump to a chapter</b><div class="row">${toc}</div></div>
    <div class="cn-pages" oncontextmenu="return false">${pages}</div>
    <div style="text-align:center;margin-top:14px;"><button type="button" class="dl-btn view" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ Back to top</button></div>`;
}
/* theme */
(function(){ let t='dark'; try{ t=localStorage.getItem('baio_theme')||'dark'; }catch(e){}
  const set=v=>{ document.documentElement.setAttribute('data-theme',v); document.getElementById('themeBtn').textContent=v==='dark'?'☀️':'🌙'; };
  set(t); document.getElementById('themeBtn').onclick=()=>{ const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'; set(n); try{ localStorage.setItem('baio_theme',n); }catch(e){} };
})();
/* screen protection (same as chapter colour notes) */
(function(){
  const hide=()=>document.body.classList.add('cn-hidden'), show=()=>document.body.classList.remove('cn-hidden');
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) hide(); });
  window.addEventListener('blur',hide); window.addEventListener('pagehide',hide);
  document.getElementById('cnShield').addEventListener('click',show);
  document.addEventListener('keydown',e=>{ const k=(e.key||'').toLowerCase();
    if(k==='printscreen' || ((e.ctrlKey||e.metaKey) && (k==='p'||k==='s')) || (e.metaKey && e.shiftKey && ['3','4','5','s'].includes(k))){ hide(); e.preventDefault(); } });
  document.addEventListener('keyup',e=>{ if((e.key||'').toLowerCase()==='printscreen'){ hide(); try{ navigator.clipboard && navigator.clipboard.writeText(''); }catch(_){} } });
  document.addEventListener('dragstart',e=>{ if(e.target.closest && e.target.closest('.cn-pages')) e.preventDefault(); });
})();
render();
</script>
</body>
</html>
