<style>
[hidden]{display:none!important}
body{font-family:Inter,'Noto Sans Kannada','Noto Sans Devanagari',system-ui,sans-serif}
.pat{margin-top:16px;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:13px 15px}
.pat h3{margin:0 0 6px;font:700 16px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.pat table{width:100%;border-collapse:collapse;font-size:13.5px}
.pat td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.pat td:first-child{font-weight:800;white-space:nowrap;color:var(--teal);width:56px}
.pat td:last-child{text-align:right;white-space:nowrap;color:var(--dim)}
.pat p{margin:8px 0 0;font-size:13px;color:var(--dim);line-height:1.5}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);margin-top:18px}
.seg button{border:0;background:transparent;color:var(--ink);border-radius:12px;padding:10px 8px;cursor:pointer;font:700 15px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.seg button small{display:block;font:500 11.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';color:var(--dim);margin-top:2px}
.seg button.on{background:linear-gradient(135deg,var(--gold2),#E9C45A);color:#1a1406}.seg button.on small{color:#3b300f}
.chs{display:grid;gap:9px;margin-top:14px}
.chc{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;scroll-margin-top:64px}
.chc.open{border-color:color-mix(in srgb,var(--teal) 60%,var(--line))}
.chh{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;background:none;border:0;color:var(--ink);text-align:left;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chh .e{font-size:26px;flex:none;width:38px;text-align:center}
.chh b{display:block;font:700 16px/1.25 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.chh small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.chh .ar{margin-left:auto;flex:none;color:var(--dim);transition:transform .2s}
.chc.open .chh .ar{transform:rotate(90deg)}
.chb{display:none;padding:0 12px 12px}
.chc.open .chb{display:block}
.bp{font-size:12.5px;color:var(--dim);margin:0 2px 8px;line-height:1.45}
.bp b{color:var(--ink)}
.wsr{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--panel2);margin-top:7px}
.wsr.full{background:color-mix(in srgb,var(--gold2) 16%,var(--panel2));border:1.5px solid color-mix(in srgb,var(--gold2) 50%,transparent)}
.wsr .t{flex:1;min-width:0}
.wsr .t b{display:block;font:700 14.5px/1.3 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.wsr .t small{color:var(--dim);font-size:12px}
.wsr .a{display:flex;gap:6px;flex:none}
.wsr .a button,.wsr .a a{border:1.5px solid var(--teal);background:transparent;color:var(--teal);border-radius:10px;padding:7px 10px;font:700 12.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer;text-decoration:none;white-space:nowrap}
.wsr .a .v{background:var(--teal);color:#fff}
/* viewer */
.vbar{position:sticky;top:56px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 0;background:var(--bg)}
.vbar .btn{padding:9px 13px;font-size:13.5px}
.vbar .sp{flex:1}
.paper{background:#fff;color:#111;border-radius:6px;box-shadow:0 4px 24px rgba(0,0,0,.18);padding:22px 20px;max-width:794px;margin:4px auto 30px}
/* the worksheet itself (screen + print) */
.ws{font-family:Arial,'Liberation Sans',Helvetica,sans-serif;color:#111;font-size:14px;line-height:1.45}
.ws .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:2.5px solid #0E6B4F;padding-bottom:8px}
.ws .brand{font-weight:800;font-size:15px;color:#0E6B4F}.ws .brand span{color:#B8860B}
.ws .brand small{display:block;font-weight:600;font-size:11px;color:#444;margin-top:2px}
.ws .tag{font-weight:800;font-size:11px;letter-spacing:.12em;color:#fff;background:#0E6B4F;border-radius:6px;padding:5px 9px;white-space:nowrap}
.ws h1{margin:10px 0 0;text-align:center;font-size:18px;line-height:1.25;color:#111}
.ws .sub{text-align:center;font-size:13.5px;color:#333;margin-top:3px;font-weight:600}
.ws .fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px 14px;margin-top:12px;font-size:12.5px}
.ws .fields div{white-space:nowrap;display:flex;gap:5px}.ws .fields i{flex:1;border-bottom:1px solid #555;min-width:30px}
.ws .meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;margin-top:10px;padding:7px 10px;border:1px solid #bbb;border-radius:6px;background:#F6FAF8;font-size:12.5px}
.ws .ins{font-size:12.5px;color:#333;margin:8px 0 2px}
.ws .part{margin:16px 0 4px;text-align:center;font-weight:800;font-size:14.5px;letter-spacing:.04em;break-after:avoid}
.ws .sec{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:13.5px;margin:8px 0 6px;break-after:avoid}
.ws .sec span{white-space:nowrap}
.ws .q{display:flex;gap:6px;margin:0 0 9px;break-inside:avoid}
.ws .q .n{flex:none;width:26px;font-weight:700;text-align:right}
.ws .q .b{flex:1;min-width:0}
.ws .op{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;margin-top:3px}
.ws .bank{border:1.5px solid #333;border-radius:4px;padding:6px 9px;margin:2px 0 9px 32px;font-size:13px;line-height:1.6}
.ws .lines{margin-top:4px}
.ws .lines i{display:block;height:30px;border-bottom:1px solid #9aa5a0}
.ws .box{margin-top:6px;height:300px;border:1.5px solid #555;border-radius:6px;position:relative}
.ws .box.big{height:430px}
.ws .box em{position:absolute;right:8px;bottom:5px;font-size:10.5px;color:#999;font-style:normal}
.ws .dq{break-inside:avoid;margin:0 0 14px}
.ws .ft{margin-top:18px;border-top:1px solid #ccc;padding-top:6px;text-align:center;font-size:11px;color:#666}
@media (max-width:640px){
  .paper{padding:14px 11px;border-radius:4px}
  .ws{font-size:13.5px}.ws .op{grid-template-columns:1fr}.ws .fields{grid-template-columns:1fr 1fr}
  .ws .box{height:250px}.ws .box.big{height:340px}
  .wsr{flex-wrap:wrap}.wsr .a{width:100%}.wsr .a>*{flex:1;text-align:center}
}
@page{size:A4;margin:12mm 12mm 14mm}
@media print{
  html,body{background:#fff!important}
  body *{visibility:hidden}
  #viewer,#viewer *{visibility:visible}
  #viewer{position:absolute;left:0;top:0;width:100%}
  .vbar,.top,footer{display:none!important}
  .paper{box-shadow:none;padding:0;margin:0;max-width:none;border-radius:0}
  .ws{font-size:12.5px}.ws .op{grid-template-columns:1fr 1fr}.ws .fields{grid-template-columns:2fr 1fr 1fr}
  .ws .lines i{height:8mm}.ws .box{height:80mm}.ws .box.big{height:112mm}
  .ws .ft{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
body.print-only .top,body.print-only main>*:not(#viewer),body.print-only footer,body.print-only .vbar{display:none!important}
body.print-only .paper{box-shadow:none;padding:0;margin:0;max-width:none}
body.print-only main.wrap{padding:0;max-width:none}
</style>

  function theme(t){ document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); tb.textContent = t === 'dark' ? '☀️' : '🌙'; }
  var th = 'light'; try{ th = localStorage.getItem('baio_theme') || 'light'; }catch(e){} theme(th);
  tb.onclick = function(){ var n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; theme(n); try{ localStorage.setItem('baio_theme', n); }catch(e){} };

  var puc = 1, openCh = {}, cache = {}, cur = null;
  try{ if(localStorage.getItem('baio_ws_puc') === '2') puc = 2; }catch(e){}
  var Q = new URLSearchParams(location.search), PRINT = Q.get('print');
  var h = decodeURIComponent(location.hash.slice(1)), hm = /^([12])-(\d+)(?:\/(\w+))?$/.exec(h);
  if(hm){ puc = +hm[1]; openCh[hm[1] + '-' + hm[2]] = true; }

  function pdfUrl(cid, sid){ return 'worksheets/pdf/' + cid + '-' + sid + '.pdf'; }
  function load(cid, cb){
    if(cache[cid]) return cb(cache[cid]);
    fetch('worksheets/data/' + cid + '.json?v=1').then(function(r){ return r.json(); }).then(function(d){ cache[cid] = d; cb(d); }).catch(function(){ cb(null); });
  }

  function render(){
    var u = UI[lang];
    document.documentElement.lang = lang;
    $('langs').innerHTML = [['en','English'],['kn','ಕನ್ನಡ'],['hi','हिंदी']].map(function(l){ return '<button class="lang'+(l[0]===lang?' on':'')+'" data-l="'+l[0]+'">'+l[1]+'</button>'; }).join('');
    $('eyebrow').textContent = u.eyebrow; $('h1').textContent = u.h1; $('intro').textContent = u.intro; $('note').textContent = u.note;
    $('pat').innerHTML = '<h3>📋 '+u.patH+'</h3><table>' + u.pat.map(function(r){ return '<tr><td>'+r[0]+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>'; }).join('') + '</table><p>'+esc(u.patNote)+'</p>';
    $('seg').innerHTML = [[1,u.p1,u.p1s],[2,u.p2,u.p2s]].map(function(x){ return '<button type="button" role="tab" aria-selected="'+(x[0]===puc)+'" class="'+(x[0]===puc?'on':'')+'" data-p="'+x[0]+'">'+x[1]+'<small>'+x[2]+'</small></button>'; }).join('');
    $('chs').innerHTML = IDX.filter(function(c){ return c.puc === puc; }).map(function(c){
      var rows = c.sheets.map(function(s, i){
        var full = s[0] === 'full';
        return '<div class="wsr'+(full?' full':'')+'"><div class="t"><b>'+(full ? '📘 '+u.full : '📄 '+esc(s[1]))+'</b><small>'+(full ? esc(c.title) : u.topic+' '+i)+' · '+s[2]+' '+u.marks+'</small></div>'
          + '<div class="a"><button type="button" class="v" data-view="'+c.id+'/'+s[0]+'">'+u.view+'</button><a href="'+pdfUrl(c.id, s[0])+'" download>'+u.pdf+'</a></div></div>';
      }).join('');
      return '<article class="chc'+(openCh[c.id]?' open':'')+'" id="c'+c.id+'"><button class="chh" type="button" data-ch="'+c.id+'" aria-expanded="'+!!openCh[c.id]+'"><span class="e">'+c.ic+'</span><span><b>'+u.ch+' '+c.ch+' · '+esc(c.title)+'</b><small>'+u.sheets(c.sheets.length)+' · '+c.bp+'/105</small></span><span class="ar">›</span></button>'
        + '<div class="chb"><p class="bp" data-bp="'+c.id+'"></p>' + rows + '</div></article>';
    }).join('');
    IDX.forEach(function(c){ if(openCh[c.id] && c.puc === puc) fillBp(c.id); });
    $('vBack').textContent = u.back; $('vPrint').textContent = u.print; $('vPdf').textContent = u.dl;
  }
  function fillBp(cid){
    load(cid, function(d){ var el = document.querySelector('[data-bp="'+cid+'"]'); if(!d || !el) return; var u = UI[lang];
      el.innerHTML = d.puc === 1 ? u.bp1(d.bp.marks, d.bp.q) : u.bp2(d.bp.marks); });
  }

  /* ---------- worksheet HTML (always English, like the question bank) ---------- */
  var ROMAN = { 'A-I':'I', 'A-II':'II', B:'III', C:'IV', D:'V' };
  var PART = { 'A-I':'PART – A', B:'PART – B', C:'PART – C', D:'PART – D' };
  var HEAD = { mcq:'Select the correct answer from the choices given.', fill:'Fill in the blanks by choosing the appropriate word from those given in the box.', fill0:'Fill in the blanks with the appropriate word.', short2:'Answer the following questions.', short3:'Answer the following questions.', long5:'Answer the following questions.' };
  var LINES = { short2:4, short3:6, long5:11 };
  function lines(n){ return '<div class="lines">' + new Array(n + 1).join('<i></i>') + '</div>'; }
  function sheetHtml(d, s){
    var idx = d.sheets.indexOf(s), full = s.id === 'full', n = 0, html = '';
    var time = Math.max(20, Math.round(s.marks * 1.3 / 5) * 5);
    html += '<div class="hd"><div class="brand">Biology All In One <span>(BAIO)</span> Learning System<small>Free worksheet by Narendra Sir · Lecturer in Biology</small></div><div class="tag">WORKSHEET</div></div>';
    html += '<h1>' + (d.puc === 1 ? 'I' : 'II') + ' PUC Biology · Chapter ' + d.ch + ': ' + esc(d.title) + '</h1>';
    html += '<div class="sub">' + (full ? 'Whole Chapter · Board-exam pattern' : 'Topic ' + idx + ' · ' + esc(s.title)) + '</div>';
    html += '<div class="fields"><div>Name:<i></i></div><div>Class/Sec:<i></i></div><div>Date:<i></i></div><div>College:<i></i></div><div>Roll No:<i></i></div><div>Score:<i></i>/ ' + s.marks + '</div></div>';
    var bp = d.puc === 1 ? 'Board weightage: ' + d.bp.marks + ' of 105 marks (2026-27 blueprint)' : 'Board weightage: ' + d.bp.marks + ' of 105 marks (model blueprint)';
    html += '<div class="meta"><span><b>Max. marks:</b> ' + s.marks + '</span><span><b>Suggested time:</b> ' + time + ' min</span><span>' + bp + '</span></div>';
    html += '<p class="ins"><b>Instructions:</b> Answer all questions in the space given. Draw neat, labelled diagrams with a pencil wherever asked.</p>';
    s.parts.forEach(function(p){
      if(PART[p.p]) html += '<div class="part">' + PART[p.p] + '</div>';
      var head = p.kind === 'fill' && !d.bank.length ? HEAD.fill0 : HEAD[p.kind];
      html += '<div class="sec">' + ROMAN[p.p] + '. ' + head + ' <span>' + p.q.length + ' × ' + p.m + ' = ' + (p.q.length * p.m) + '</span></div>';
      if(p.kind === 'fill' && d.bank.length) html += '<div class="bank">( ' + d.bank.map(esc).join(', ') + ' )</div>';
      p.q.forEach(function(q){
        n++;
        var body = esc(q.t).replace(/_{2,}|…+/g, '________');
        if(p.kind === 'mcq') body += '<div class="op">' + q.o.map(function(o, i){ return '<div>(' + 'abcd'[i] + ') ' + esc(o) + '</div>'; }).join('') + '</div>';
        else if(p.kind !== 'fill') body += q.d ? '<div class="box' + (p.m >= 5 ? ' big' : '') + '"><em>Draw here</em></div>' + lines(p.m >= 5 ? 3 : 1) : lines(LINES[p.kind]);
        html += '<div class="q"><span class="n">' + n + '.</span><div class="b">' + body + '</div></div>';
      });
    });
    html += '<div class="part">DIAGRAM PRACTICE</div><div class="sec">' + (s.parts.length ? 'VI' : 'I') + '. Draw neat, labelled diagrams in the boxes. <span>Practice</span></div>';
    s.dia.forEach(function(t){ n++; html += '<div class="dq"><div class="q"><span class="n">' + n + '.</span><div class="b">' + esc(t) + '</div></div><div class="box big"><em>Draw here · use a pencil</em></div></div>'; });
    html += '<div class="ft">BAIO Learning System · narendra-bio-sir.github.io/BAIO-Learning-System-By-Narendra-Sir/worksheets.html</div>';
    return html;
  }
  function openSheet(id, push){
    var m = /^([12]-\d+)\/(\w+)$/.exec(id); if(!m) return;
    load(m[1], function(d){
      if(!d) return; var s = d.sheets.filter(function(x){ return x.id === m[2]; })[0]; if(!s) return;
      cur = id;
      $('ws').innerHTML = sheetHtml(d, s);
      $('vPdf').href = pdfUrl(m[1], m[2]); $('vPdf').setAttribute('download', 'BAIO-worksheet-' + m[1] + '-' + m[2] + '.pdf');
      document.title = (s.id === 'full' ? 'Ch ' + d.ch + ' Whole Chapter' : s.title) + ' · Worksheet | BAIO';
      ['hero','pat','seg','chs','note'].forEach(function(x){ $(x).hidden = true; });
      $('viewer').hidden = false; window.scrollTo(0, 0);
      if(push !== false){ try{ history.pushState({ ws:id }, '', '#' + id); }catch(e){} }
      window.__ready = true;
    });
  }
  function closeSheet(){
    cur = null; $('viewer').hidden = true; document.title = 'Free Worksheets | BAIO Learning System';
    ['hero','pat','seg','chs','note'].forEach(function(x){ $(x).hidden = false; });
  }

  $('langs').addEventListener('click', function(e){ var b = e.target.closest('button'); if(!b) return; lang = b.dataset.l; try{ localStorage.setItem('baio_lang', lang); }catch(x){} render(); });
  $('seg').addEventListener('click', function(e){ var b = e.target.closest('[data-p]'); if(!b) return; puc = +b.dataset.p; try{ localStorage.setItem('baio_ws_puc', puc); }catch(x){} render(); });
  $('chs').addEventListener('click', function(e){
    var v = e.target.closest('[data-view]'); if(v){ openSheet(v.dataset.view); return; }
    var b = e.target.closest('[data-ch]'); if(!b) return;
    var id = b.dataset.ch; openCh[id] = !openCh[id];
    b.closest('.chc').classList.toggle('open', !!openCh[id]); b.setAttribute('aria-expanded', !!openCh[id]);
    if(openCh[id]){ fillBp(id); try{ history.replaceState(null, '', '#' + id); }catch(x){} }
  });
  $('vBack').onclick = function(){ if(history.state && history.state.ws) history.back(); else { closeSheet(); try{ history.replaceState(null, '', location.pathname); }catch(x){} } };
  $('vPrint').onclick = function(){ window.print(); };
  window.addEventListener('popstate', function(){ var hh = location.hash.slice(1); if(/\//.test(hh)) openSheet(hh, false); else closeSheet(); });

  if(PRINT){ document.body.classList.add('print-only'); openSheet(PRINT, false); return; }
  render();
  if(hm && hm[3]) openSheet(hm[1] + '-' + hm[2] + '/' + hm[3], false);
  else if(hm) setTimeout(function(){ var el = $('c' + hm[1] + '-' + hm[2]); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); }, 150);
})();
</script>
</body>
</html>
