    c.qs.forEach(function(q, i){
      var id = 'c'+c.ch+'q'+i, on = !!st[id];
      html += '<div class="q'+(on?' learnt':'')+'"><div class="q-top"><span class="mk m'+q.mk+'">'+u.mk(q.mk)+'</span><div class="q-q">'+esc(q.q)+'</div></div>'
        + '<ol>'+q.a.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('')+'</ol>'
        + '<div class="q-foot"><button class="mini'+(on?' on':'')+'" data-learn="'+id+'">'+(on?u.learntOn:u.learnt)+'</button>'
        + (lang === 'en' ? '<button class="mini" data-gist="kn" data-i="'+i+'">'+u.kn+'</button><button class="mini" data-gist="hi" data-i="'+i+'">'+u.hi+'</button><div class="gist" id="g'+i+'" hidden></div>'
                         : '<div class="gist">'+esc(q[lang])+'</div>')
        + '</div></div>';
    });
    html += '</div>';
    var DG = (window.ES_DIAGRAMS || {})[c.ch] || [], NC = (window.ES_NCERT || {})[c.ch];
    html += '<div class="sec"><h3>🖊️ '+u.dia+'</h3><p style="font-size:12.5px;color:var(--ink-dim);margin:4px 0 0">'+u.dnote+'</p><div class="dia">'+c.dia.map(function(d, di){
      return '<div class="dcard"><b>'+esc(d.n)+'</b>'+(DG[di] ? '<div class="dgwrap" data-zoom="'+di+'">'+DG[di]+'</div>' : '')
        + '<div class="labels" style="margin-top:8px">'+d.l.map(function(l){ return '<span>'+esc(l)+'</span>'; }).join('')+'</div>'
        + '<div class="dact">'+(DG[di] ? '<button data-zoom="'+di+'">'+u.dzoom+'</button>' : '')+(NC ? '<a href="https://ncert.nic.in/textbook/pdf/'+NC+'.pdf" target="_blank" rel="noopener">'+u.dncert+'</a>' : '')+'</div></div>'; }).join('')+'</div></div>';
    html += '<div class="sec"><h3>⚡ '+u.facts+'</h3><ul class="facts">'+c.facts.map(function(f){ return '<li>'+esc(f)+'</li>'; }).join('')+'</ul></div>';
    html += '<div class="sec"><h3>🧠 '+u.trick+'</h3>'+c.trick.map(function(t){ return '<div class="trick">'+esc(t)+'</div>'; }).join('')+'</div>';
    html += '<div class="nav2">'+(cur>1?'<button class="act" data-go="'+(cur-1)+'">'+u.prev+'</button>':'<span></span>')+(cur<13?'<button class="act primary" data-go="'+(cur+1)+'">'+u.next+'</button>':'')+'</div>';
    document.getElementById('chapter').innerHTML = html;
  }
  function all(){ renderStatic(); renderGrid(); renderChapter(); }
  function go(n, scroll){
    cur = n; st.last = n; save();
    try{ history.replaceState(null, '', '#ch'+n); }catch(e){}
    renderGrid(); renderChapter();
    if(scroll) document.getElementById('chapter').scrollIntoView({behavior:'smooth', block:'start'});
  }
  document.getElementById('langs').addEventListener('click', function(e){ var b = e.target.closest('button'); if(!b) return; lang = b.dataset.l; try{ localStorage.setItem('baio_lang', lang); }catch(x){} all(); });
  document.getElementById('paper').addEventListener('click', function(e){ var b = e.target.closest('.order button'); if(b) go(+b.dataset.ch, true); });
  document.getElementById('chgrid').addEventListener('click', function(e){ var b = e.target.closest('.chbtn'); if(b) go(+b.dataset.ch, true); });
  function zoom(i){
    var c = chap(cur), DG = (window.ES_DIAGRAMS || {})[c.ch] || []; if(!DG[i]) return;
    var z = document.createElement('div'); z.className = 'zoom';
    z.innerHTML = '<div class="zin"><button class="zx" aria-label="Close">✕</button><b>'+esc(c.dia[i].n)+'</b>'+DG[i]+'</div>';
    z.addEventListener('click', function(e){ if(e.target === z || e.target.closest('.zx')) z.remove(); });
    document.body.appendChild(z);
  }
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ var z = document.querySelector('.zoom'); if(z) z.remove(); } });
  document.getElementById('chapter').addEventListener('click', function(e){
    var w = e.target.closest('.dgwrap'); if(w){ zoom(+w.dataset.zoom); return; }
    var b = e.target.closest('button'); if(!b) return;
    if(b.dataset.go){ go(+b.dataset.go, true); return; }
    if(b.dataset.zoom){ zoom(+b.dataset.zoom); return; }
    if(b.dataset.learn){ st[b.dataset.learn] = !st[b.dataset.learn]; save(); var y = window.scrollY; renderGrid(); renderChapter(); window.scrollTo(0, y); return; }
    if(b.dataset.gist){
      var c = chap(cur), q = c.qs[+b.dataset.i], g = document.getElementById('g'+b.dataset.i), same = !g.hidden && g.dataset.l === b.dataset.gist;
      b.parentNode.querySelectorAll('[data-gist]').forEach(function(x){ x.classList.remove('on'); });
      if(same){ g.hidden = true; return; }
      g.textContent = q[b.dataset.gist]; g.dataset.l = b.dataset.gist; g.hidden = false; b.classList.add('on');
    }
  });
  window.addEventListener('hashchange', function(){ var m = /^#ch(\d{1,2})$/.exec(location.hash); if(m && +m[1] >= 1 && +m[1] <= 13 && +m[1] !== cur) go(+m[1], true); });
  all();
})();
</script>
</body>
</html>
