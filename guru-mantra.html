<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1B14">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>BAIO Guru Mantra | BAIO Learning System</title>
<meta name="description" content="BAIO Guru Mantra: Narendra Sir's mantras for study, memory tricks, board exams, NEET & KCET, daily routine, a calm mind and motivation. A new mantra every day, in English, Kannada and Hindi.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="subject-apps/app.css?v=2">
<script>(function(){var t='light';try{t=localStorage.getItem('baio_theme')||'light';}catch(e){}document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');})();</script>
<style>
[hidden]{display:none!important}
body{font-family:Inter,'Noto Sans Kannada','Noto Sans Devanagari',system-ui,sans-serif}
.hero .eyebrow{color:#C2410C}
:root[data-theme="dark"] .hero .eyebrow{color:#FDBA74}
/* today's mantra */
.today{position:relative;overflow:hidden;margin-top:14px;padding:18px 18px 16px;border-radius:22px;color:#fff;
  background:radial-gradient(260px 200px at 100% 0%,rgba(255,196,77,.55),transparent 70%),linear-gradient(150deg,#7C2D12 0%,#9A3412 30%,#4C1D95 100%);
  box-shadow:0 14px 34px rgba(124,45,18,.28)}
.today .lamp{position:absolute;right:12px;top:8px;font-size:58px;opacity:.9;filter:drop-shadow(0 6px 14px rgba(0,0,0,.3))}
.today .lb{font:800 11.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';letter-spacing:.14em;text-transform:uppercase;color:#FFD580}
.today .dt{font:600 12.5px Inter;color:#FDE7C8;margin-top:2px}
.today .sc{display:inline-block;margin-top:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.16);font:700 12px Inter,'Noto Sans Kannada','Noto Sans Devanagari'}
.today blockquote{margin:10px 64px 0 0;font:700 22px/1.32 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari';text-wrap:balance}
.today .hw{margin-top:10px;font-size:14px;line-height:1.5;color:#FFEBD2}
.today .hw b{color:#FFD580}
.today .by{margin-top:8px;font:600 12.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';color:#FDE7C8}
.today .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.today .acts button{border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:8px 12px;font:700 13px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer;min-height:40px}
.today .acts .fl{background:#FFD580;color:#4A1D05;border-color:#FFD580}
.today .acts .fl.on{background:#22C55E;border-color:#22C55E;color:#fff}
.today .stk{margin-top:10px;font:700 13px Inter,'Noto Sans Kannada','Noto Sans Devanagari';color:#FFD580;min-height:1em}
/* filters */
.fl-row{position:sticky;top:53px;z-index:10;display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin-top:12px;background:var(--bg);scrollbar-width:none}
.fl-row::-webkit-scrollbar{display:none}
.fl-row button{flex:none;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 12px;font:700 13px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer;white-space:nowrap;min-height:38px}
.fl-row button.on{background:linear-gradient(135deg,#EA580C,#B45309);border-color:#C2410C;color:#fff}
/* sections */
.sec{margin-top:14px;scroll-margin-top:110px}
.sec h2{font-size:18px;display:flex;align-items:center;gap:8px}
.sec h2 small{font:600 12px Inter,'Noto Sans Kannada','Noto Sans Devanagari';color:var(--dim);margin-left:auto}
.mt{display:flex;gap:11px;align-items:flex-start;margin-top:8px;padding:12px 12px 12px 13px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.mt .n{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font:800 13px Inter;background:color-mix(in srgb,#EA580C 14%,var(--panel2));color:#C2410C}
:root[data-theme="dark"] .mt .n{color:#FDBA74}
.mt .tx{flex:1;min-width:0}
.mt .tx b{display:block;font:700 15px/1.35 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.mt .tx span{display:block;color:var(--dim);font-size:13.5px;line-height:1.5;margin-top:3px}
.mt .sv{flex:none;border:0;background:none;font-size:20px;line-height:1;padding:4px;cursor:pointer;filter:grayscale(1) opacity(.45)}
.mt .sv.on{filter:none}
.mt.mem .tx b{font-family:'Space Grotesk',Inter;color:#7C3AED}
:root[data-theme="dark"] .mt.mem .tx b{color:#C4B5FD}
.empty{margin-top:14px;padding:18px;border-radius:16px;border:1.5px dashed var(--line);text-align:center;color:var(--dim);font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:999px;font:600 13px Inter;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:.92}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="index.html"><div class="b">B</div><span>BAIO Learning System</span></a>
  <div class="tools"><div id="langs"></div>
    <a class="ib" href="index.html" aria-label="BAIO home">🏠</a>
    <button class="ib" id="themeBtn" aria-label="Toggle theme">🌙</button></div>
</div></header>
<main class="wrap">
  <section class="hero">
    <div class="eyebrow" id="eyebrow"></div>
    <h1><span class="ic">🪔</span><span id="h1"></span></h1>
    <p id="intro"></p>
  </section>
  <section class="today" id="today" aria-live="polite"></section>
  <nav class="fl-row" id="fl" aria-label="Mantra topics"></nav>
  <div id="list"></div>
  <p class="note" id="note"></p>
  <footer>BAIO Learning System · Narendra Sir · Guru Mantra</footer>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="guru-mantra/data.js?v=3"></script>
<script src="guru-mantra/share.js?v=1" defer></script>
<script>
(function(){
  var G = window.GURU_MANTRA, UI = G.ui;
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  var lang = 'en'; try{ lang = localStorage.getItem('baio_lang') || 'en'; }catch(e){} if(!UI[lang]) lang = 'en';
  function L(o){ return o[lang] || o.en; }
  var tb = $('themeBtn');
  function theme(t){ document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); tb.textContent = t === 'dark' ? '☀️' : '🌙'; }
  var th = 'light'; try{ th = localStorage.getItem('baio_theme') || 'light'; }catch(e){} theme(th);
  tb.onclick = function(){ var n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; theme(n); try{ localStorage.setItem('baio_theme', n); }catch(e){} };

  /* every mantra in one list, so "today" walks through all of them */
  var ALL = [];
  G.secs.forEach(function(s){ s.list.forEach(function(x, i){ ALL.push({ id:s.id + '-' + (i + 1), s:s, x:x }); }); });
  function ymd(d){ return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  var now = new Date(), TODAY = ymd(now);
  var dayNo = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 864e5);
  /* spread neighbouring days across topics: step through the list by a stride coprime with its length */
  function stride(n){ var s = 7; while(gcd(s, n) !== 1) s++; return s; }
  function gcd(a, b){ return b ? gcd(b, a % b) : a; }
  function todayItem(){ var n = ALL.length; return ALL[(dayNo * stride(n)) % n]; }

  function get(k, d){ try{ var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }catch(e){ return d; } }
  function put(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  var saved = get('baio_gm_saved', []), stk = get('baio_gm_streak', null);
  if(!Array.isArray(saved)) saved = [];
  var filt = 'all';
  var h0 = location.hash.slice(1);
  if(h0 === 'saved' || G.secs.some(function(s){ return s.id === h0; })) filt = h0;

  function toast(t){ var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function(){ el.classList.remove('on'); }, 1600); }
  function streakNow(){
    if(!stk || !stk.d) return 0;
    var y = new Date(now); y.setDate(y.getDate() - 1);
    return (stk.d === TODAY || stk.d === ymd(y)) ? stk.n : 0;
  }

  var SITE = 'https://narendra-bio-sir.github.io/BAIO-Learning-System-By-Narendra-Sir/';
  function dateStr(){ return now.toLocaleDateString(lang === 'kn' ? 'kn-IN' : lang === 'hi' ? 'hi-IN' : 'en-IN', { weekday:'long', day:'numeric', month:'long' }); }
  function renderToday(){
    var u = UI[lang], it = todayItem(), done = stk && stk.d === TODAY, n = streakNow();
    var dt = dateStr();
    $('today').innerHTML = '<span class="lamp" aria-hidden="true">🪔</span><div class="lb">'+esc(u.today)+'</div><div class="dt">'+esc(dt)+'</div>'
      + '<span class="sc">'+it.s.ic+' '+esc(L(it.s.t))+'</span>'
      + '<blockquote>'+esc(L(it.x.m))+'</blockquote>'
      + '<div class="hw"><b>'+esc(u.how)+':</b> '+esc(L(it.x.d))+'</div><div class="by">'+esc(u.by)+'</div>'
      + '<div class="acts"><button type="button" class="fl'+(done?' on':'')+'" id="tFollow">'+(done ? esc(u.followed) : '✅ '+esc(u.follow))+'</button>'
      + '<button type="button" id="tShare">📤 '+esc(u.share)+'</button></div>'
      + '<div class="stk">'+(n ? esc(u.streak(n)) : '')+'</div>';
  }

  function renderList(){
    var u = UI[lang];
    $('fl').innerHTML = [['all', '✨ ' + u.all]].concat(G.secs.map(function(s){ return [s.id, s.ic + ' ' + L(s.t)]; }), [['saved', '💛 ' + u.saved + (saved.length ? ' (' + saved.length + ')' : '')]])
      .map(function(f){ return '<button type="button" data-f="'+f[0]+'" class="'+(f[0]===filt?'on':'')+'" aria-pressed="'+(f[0]===filt)+'">'+esc(f[1])+'</button>'; }).join('');
    var html = '';
    function row(a, num){
      var on = saved.indexOf(a.id) >= 0;
      return '<div class="mt'+(a.s.id === 'memory' ? ' mem' : '')+'" id="m-'+a.id+'"><span class="n">'+num+'</span><div class="tx"><b>'+esc(L(a.x.m))+'</b><span>'+esc(L(a.x.d))+'</span></div>'
        + '<button type="button" class="sv'+(on?' on':'')+'" data-sv="'+a.id+'" aria-pressed="'+on+'" aria-label="'+esc(on ? u.unsave : u.save)+'">💛</button></div>';
    }
    if(filt === 'saved'){
      var l = ALL.filter(function(a){ return saved.indexOf(a.id) >= 0; });
      html = l.length ? '<section class="sec"><h2>💛 '+esc(u.saved)+'<small>'+esc(u.count(l.length))+'</small></h2>' + l.map(function(a, i){ return row(a, i + 1); }).join('') + '</section>'
                      : '<div class="empty">'+esc(u.none)+'</div>';
    } else {
      G.secs.filter(function(s){ return filt === 'all' || s.id === filt; }).forEach(function(s){
        html += '<section class="sec" id="'+s.id+'"><h2>'+s.ic+' '+esc(L(s.t))+'<small>'+esc(u.count(s.list.length))+'</small></h2>'
          + s.list.map(function(x, i){ return row({ id:s.id + '-' + (i + 1), s:s, x:x }, i + 1); }).join('') + '</section>';
      });
    }
    $('list').innerHTML = html;
    var on = $('fl').querySelector('.on'); if(on){ var f = $('fl'); f.scrollLeft = Math.max(0, on.offsetLeft - (f.clientWidth - on.offsetWidth) / 2); }
  }

  function render(){
    var u = UI[lang];
    document.documentElement.lang = lang;
    $('langs').innerHTML = [['en','English'],['kn','ಕನ್ನಡ'],['hi','हिंदी']].map(function(l){ return '<button class="lang'+(l[0]===lang?' on':'')+'" data-l="'+l[0]+'">'+l[1]+'</button>'; }).join('');
    $('eyebrow').textContent = u.eyebrow; $('h1').textContent = u.h1; $('intro').textContent = u.intro; $('note').textContent = '💡 ' + u.note;
    renderToday(); renderList();
  }

  $('langs').addEventListener('click', function(e){ var b = e.target.closest('button'); if(!b) return; lang = b.dataset.l; try{ localStorage.setItem('baio_lang', lang); }catch(x){} render(); });
  $('today').addEventListener('click', function(e){
    var u = UI[lang], b = e.target.closest('button'); if(!b) return;
    if(b.id === 'tFollow'){
      if(stk && stk.d === TODAY) return;
      stk = { d:TODAY, n:streakNow() + 1 }; put('baio_gm_streak', stk); renderToday(); return;
    }
    if(b.id === 'tShare'){
      var it = todayItem(), url = SITE + 'guru-mantra.html';
      var o = { date:dateStr(), ymd:TODAY, url:url, by:u.by, how:u.how, today:u.today, h1:u.h1 };
      if(window.gmShare){ gmShare(it, lang, o); return; }
      var text = '🪔 ' + u.h1 + '\n\n“' + L(it.x.m) + '”\n' + u.how + ': ' + L(it.x.d) + '\n' + u.by;
      if(navigator.share){ navigator.share({ title:u.h1, text:text, url:url }).catch(function(){}); }
      else { window.open('https://wa.me/?text=' + encodeURIComponent(text + '\n' + url), '_blank', 'noopener'); }
    }
  });
  $('fl').addEventListener('click', function(e){
    var b = e.target.closest('[data-f]'); if(!b) return;
    filt = b.dataset.f; renderList();
    try{ history.replaceState(null, '', filt === 'all' ? location.pathname + location.search : '#' + filt); }catch(x){}
    var top = $('fl').getBoundingClientRect().top + scrollY - 53;
    if(scrollY > top) scrollTo({ top:top, behavior:'smooth' });
  });
  $('list').addEventListener('click', function(e){
    var b = e.target.closest('[data-sv]'); if(!b) return;
    var id = b.dataset.sv, i = saved.indexOf(id), u = UI[lang];
    if(i >= 0) saved.splice(i, 1); else { saved.push(id); toast('💛 ' + u.unsave); }
    put('baio_gm_saved', saved);
    var keep = scrollY; renderList(); scrollTo(0, keep);
  });

  render();
  if(h0 === 'today') $('today').scrollIntoView({ block:'start' });
})();
</script>
</body>
</html>
