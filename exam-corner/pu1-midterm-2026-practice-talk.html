<style>
:root{--navy:#0c1830;--ink:#1f2a40;--muted:#556074;--teal:#0b8f80;--tealSoft:#e8f3f1;--gold:#c99a1e;--goldSoft:#fbf1d5;--line:#d9e2e1;--page:#eef2f4;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:Inter,'Noto Sans Kannada','Noto Sans Devanagari',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:1280px;margin:0 auto;padding:14px 16px 24px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .b{width:38px;height:38px;border-radius:10px;background:var(--navy);color:#e8c25a;font:700 20px 'Space Grotesk',sans-serif;display:grid;place-items:center}
.brand b{font:700 15px 'Space Grotesk',sans-serif;color:var(--navy);display:block}
.brand span{font:600 11px Inter;letter-spacing:.12em;color:var(--teal);text-transform:uppercase}
.langs{display:flex;gap:6px}
.btn{font:600 14px Inter,'Noto Sans Kannada','Noto Sans Devanagari',sans-serif;border:1.5px solid var(--line);background:#fff;color:var(--navy);padding:9px 14px;border-radius:999px;cursor:pointer;min-height:40px}
.btn[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn:focus-visible{outline:3px solid #e8c25a;outline-offset:2px}

/* stage */
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 6px 30px rgba(12,24,48,.12)}
.slide{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
.s{position:absolute;inset:0;padding:42px 58px 0;background:#fff;opacity:0;visibility:hidden;transition:opacity .45s}
.s.on{opacity:1;visibility:visible}
.ptr{position:absolute;z-index:3;left:0;top:0;pointer-events:none;opacity:0;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .3s}
.ptr.on{opacity:1}
.ptr.sm .hand{left:50%;top:auto;bottom:-52px;transform:translateX(-50%);animation:tapup 1.1s ease-in-out infinite}
@keyframes tapup{0%,100%{margin-bottom:0}50%{margin-bottom:8px}}
.ptr .hand{position:absolute;left:-58px;top:50%;font-size:46px;line-height:1;transform:translateY(-50%);filter:drop-shadow(0 3px 4px rgba(0,0,0,.45));animation:tap 1.1s ease-in-out infinite}
@keyframes tap{0%,100%{margin-left:0}50%{margin-left:10px}}
.ptr .box{position:absolute;inset:-6px -10px;border:3px solid #f5c542;border-radius:12px;background:rgba(245,197,66,.13);box-shadow:0 0 0 4px rgba(245,197,66,.18);transition:width .55s,height .55s}
@media (prefers-reduced-motion:reduce){.ptr{transition:none}.ptr .hand{animation:none}}
.s.img{padding:0;background:#0b1730}
.s.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.s.img img.d{display:none}
html.dk .s.img img.d{display:block}
html.dk .s.img img.l{display:none}
.s.dark{background:var(--navy);color:#fff}
.s h2{font:700 36px/1.1 'Space Grotesk',sans-serif;color:var(--navy);letter-spacing:-.01em}
.foot{position:absolute;left:58px;right:58px;bottom:18px;display:flex;justify-content:space-between;font:500 12px Inter;color:var(--muted)}
.dark .foot{display:none}
/* entrance animation, staggered */
.s.on .a{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.a{opacity:0}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.s.on .a{animation:none;opacity:1}}
/* explain highlight */
.hl{box-shadow:0 0 0 4px rgba(201,154,30,.85),0 10px 28px rgba(12,24,48,.18)!important;transform:translateY(-3px)!important;transition:box-shadow .3s,transform .3s}

/* shared bits */
.card{border-radius:16px;background:var(--tealSoft);transition:box-shadow .3s,transform .3s}
.card.gold{background:var(--goldSoft)}
.label{font:700 13px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.gold .label,.label.g{color:#a57c10}
.big{font:700 76px/1 'Space Grotesk',sans-serif;color:var(--navy)}
.ic{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:32px}

/* title slide */
.t-kick{position:absolute;left:72px;top:150px;font:700 16px Inter;letter-spacing:.2em;color:#e8c25a}
.t-h{position:absolute;left:72px;top:190px;width:760px;font:700 60px/1.06 'Space Grotesk',sans-serif;color:#fff}
.t-h em{font-style:normal;color:#5fd3c4}
.t-sub{position:absolute;left:72px;top:360px;width:700px;font:500 20px/1.45 Inter;color:#c9d3e3}
.t-by{position:absolute;left:72px;top:520px;font:500 15px/1.6 Inter;color:#c9d3e3}
.t-by b{color:#fff;font-size:17px}
.emblem{position:absolute;right:110px;top:150px;width:300px;height:300px;border-radius:50%;background:#16264a;border:3px solid #c99a1e;display:grid;place-items:center;font-size:130px}
.t-lang{position:absolute;right:70px;top:480px;width:380px;text-align:center;font:600 15px Inter;color:#e8c25a}

/* pattern */
.parts{position:absolute;left:58px;right:58px;top:120px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.part{padding:24px;height:330px}
.part .big{margin-top:12px}
.part .u{font:500 15px Inter;color:var(--muted);margin-top:6px}
.part .d{margin-top:26px;font:700 17px/1.3 Inter;color:var(--navy)}
.part .d2{margin-top:6px;font:500 15px/1.35 Inter;color:var(--muted)}
.band{position:absolute;left:58px;right:58px;top:480px;height:100px;border-radius:16px;background:var(--navy);display:flex;align-items:center;padding:0 30px;gap:18px;color:#dce4f0;font:500 18px Inter}
.band b{font:700 30px 'Space Grotesk',sans-serif;color:#fff;white-space:nowrap}

/* chart */
.chart{position:absolute;left:58px;top:118px;width:720px}
.chart .ccap{font:600 14px Inter;color:var(--muted);margin-bottom:12px}
.row{display:grid;grid-template-columns:200px 1fr;align-items:center;gap:14px;margin:9px 0}
.row{border-radius:10px;padding:2px 6px;transition:box-shadow .3s,transform .3s}
.row span{font:600 15px Inter;color:var(--navy);text-align:right}
.bar{height:34px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:flex-end;padding-right:10px;color:#fff;font:700 15px Inter;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.row.top .bar{background:#c99a1e}
.focus{position:absolute;right:58px;top:120px;width:380px;padding:28px}
.focus .big{font-size:96px}
.focus p{font:500 18px/1.4 Inter;color:var(--navy);margin-top:10px}
.tipc{position:absolute;right:58px;top:430px;width:380px;padding:24px;display:flex;gap:14px;font:500 17px/1.4 Inter;color:var(--navy)}

/* chapter slides */
.chp{position:absolute;left:58px;top:112px;width:300px;height:478px;padding:26px}
.chp .tag{margin-top:22px;font:700 16px Inter;color:var(--teal)}
.chp.gold .tag{color:#a57c10}
.chp .big{font-size:104px;margin-top:10px}
.chp .ml{font:500 16px Inter;color:var(--muted);margin-top:6px}
.chp .mn{font:italic 500 13px Inter;color:var(--muted);margin-top:4px}
.topics{position:absolute;left:390px;right:58px;top:116px}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.chip{font:700 21px Inter;color:var(--navy);background:#f4f8f8;border:1.5px solid var(--line);padding:15px 24px;border-radius:999px;transition:box-shadow .3s,transform .3s,background .3s}
.gold .chip,.chips.gold .chip{background:#fff8e6;border-color:#e6cf8a}
.tip{position:absolute;left:390px;right:58px;top:450px;height:140px;border-radius:16px;background:var(--navy);padding:26px 30px 0 92px;color:#fff;font:500 18px/1.45 Inter;transition:box-shadow .3s,transform .3s}
.tip:before{content:"💡";position:absolute;left:30px;top:24px;font-size:34px}
.tip b{display:block;color:#f2d27a;margin-bottom:6px}

/* diagrams */
.diags{position:absolute;left:58px;right:58px;top:118px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.diag{height:220px;padding:26px 14px;text-align:center}
.diag .ic{margin:0 auto}
.diag b{display:block;margin-top:18px;font:700 18px Inter;color:var(--navy)}
.diag small{display:block;margin-top:6px;font:600 14px Inter;color:var(--teal)}
.rules{position:absolute;left:58px;right:58px;top:380px;display:grid;grid-template-columns:1fr 1fr;gap:26px 40px}
.rule{display:flex;gap:16px;align-items:flex-start;border-radius:14px;padding:6px}
.num{flex:none;width:46px;height:46px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font:700 20px Inter}
.rule b{font:700 18px Inter;color:var(--navy);display:block}
.rule span{font:500 16px/1.4 Inter;color:var(--muted)}

/* tips */
.tp{position:absolute;left:58px;top:112px;width:290px;height:478px;padding:28px}
.tp .big{font-size:96px;margin-top:14px}
.tp p{font:500 16px/1.45 Inter;color:var(--muted);margin-top:14px}
.tlist{position:absolute;left:390px;right:58px;top:118px;display:grid;gap:16px}
.ti{display:flex;gap:18px;align-items:flex-start;padding:14px 16px;border-radius:14px;transition:box-shadow .3s,transform .3s,background .3s}
.ti .ic{width:58px;height:58px;font-size:26px;background:var(--teal);color:#fff;flex:none}
.goldset .ti .ic{background:#c99a1e}
.ti b{display:block;font:700 21px Inter;color:var(--navy)}
.ti span{font:500 17px/1.4 Inter;color:var(--muted)}

/* steps */
.steps{position:absolute;left:58px;right:58px;top:140px;display:grid;grid-template-columns:repeat(5,1fr);gap:26px}
.step{height:360px;padding:30px 18px;text-align:center;position:relative}
.step .num{margin:0 auto;width:62px;height:62px;font-size:26px}
.step.gold .num{background:#c99a1e}
.step b{display:block;margin-top:24px;font:700 20px/1.25 Inter;color:var(--navy)}
.step span{display:block;margin-top:12px;font:500 16px/1.4 Inter;color:var(--muted)}
.step:not(:last-child):after{content:"➜";position:absolute;right:-22px;top:150px;color:#9fbab6;font-size:18px}
.hallnote{position:absolute;left:58px;top:530px;font:500 17px Inter;color:var(--muted)}

/* days */
.days{position:absolute;left:58px;right:58px;top:118px;display:grid;grid-template-columns:repeat(7,1fr);gap:14px}
.day{height:470px;padding:24px 12px;text-align:center}
.day.dk{background:var(--navy)}
.day .label{font-size:12px}
.day .big{font-size:60px;margin-top:8px}
.day b{display:block;margin-top:22px;font:700 17px/1.3 Inter;color:var(--navy)}
.day span{display:block;margin-top:16px;font:500 15px/1.4 Inter;color:var(--muted)}
.day.dk .label{color:#f2d27a}.day.dk .big,.day.dk b{color:#fff}.day.dk span{color:#dce4f0}

/* close */
.c-h{position:absolute;left:72px;top:190px;font:700 58px 'Space Grotesk',sans-serif;color:#fff}
.c-l{position:absolute;left:72px;top:300px;display:grid;gap:22px}
.c-l div{display:flex;align-items:center;gap:16px;font:500 24px Inter;color:#fff;border-radius:12px;padding:4px 8px;transition:box-shadow .3s}
.c-l i{font-style:normal;width:38px;height:38px;border-radius:50%;background:#c99a1e;display:grid;place-items:center;font-size:20px;color:var(--navy)}
.c-by{position:absolute;left:72px;top:520px;font:700 18px Inter;color:#e8c25a}

/* caption + controls */
.cap{position:absolute;z-index:4;left:90px;right:90px;bottom:40px;background:rgba(12,24,48,.92);color:#fff;border-radius:16px;padding:14px 24px;font:500 24px/1.45 Inter,'Noto Sans Kannada','Noto Sans Devanagari',sans-serif;text-align:center;pointer-events:none}
.cap[hidden]{display:none}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.controls .sp{flex:1}
@media (max-width:289px){ .controls{gap:6px} #fs{padding:9px 8px;font-size:13px} .controls .opt{font-size:13px;gap:4px} #rate{padding-left:6px;padding-right:2px} }
.controls .opt{max-width:100%;min-width:0} #voice{max-width:calc(100% - 56px);min-width:0;text-overflow:ellipsis}
.prog{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.prog button{width:28px;height:8px;border-radius:4px;border:0;background:#cdd6dc;cursor:pointer}
.prog button.on{background:var(--teal)}
.count{font:600 14px Inter;color:var(--muted);min-width:64px;text-align:center}
.opt{display:flex;align-items:center;gap:6px;font:600 13px Inter;color:var(--muted)}
select{font:500 14px Inter;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--navy);max-width:240px;min-height:40px}
.hint{margin-top:10px;font:500 13px Inter;color:var(--muted)}

/* fullscreen */
.stage:fullscreen{border-radius:0;background:#000;width:100vw;height:100vh;aspect-ratio:auto}
/* iPhone Safari can't make a page element full screen, so fill the screen ourselves */
.stage.fs{position:fixed;inset:0;z-index:50;width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;border-radius:0;background:#000}
body.fsmode{overflow:hidden}
:root{--sat:env(safe-area-inset-top,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px)}
.stage:-webkit-full-screen{border-radius:0;background:#000;width:100vw;height:100vh}
.fsbar{display:none;position:absolute;z-index:5;gap:var(--fsg,12px);flex-direction:column;left:var(--fsoff,12px);top:50%;transform:translateY(-50%)}
.stage.fs .fsbar{display:flex}
.fsbar .btn{width:var(--fsb,52px);height:var(--fsb,52px);min-height:0;padding:0;border-radius:50%;display:grid;place-items:center;font-size:calc(var(--fsb,52px) * .4);font-weight:700;background:rgba(255,255,255,.94);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.fsbar .btn.primary{background:var(--teal);color:#fff}
.stage.rot .fsbar{flex-direction:row-reverse;left:50%;top:var(--fsoff,12px);transform:translateX(-50%)}
.stage.rot .fsbar .btn{transform:rotate(90deg)}

.share-sheet{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.share-sheet[hidden]{display:none}
.share-box{position:relative;width:100%;max-width:380px;background:#fff;color:#0c1830;border-radius:18px;padding:18px;display:grid;gap:10px;font-family:Inter,'Noto Sans Kannada','Noto Sans Devanagari',sans-serif;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.share-box b{font:700 17px 'Space Grotesk',Inter,sans-serif}
.share-opt{display:block;text-align:left;padding:13px 14px;border-radius:12px;border:1.5px solid #e6e0d2;background:#fbf8f1;color:#0c1830;text-decoration:none;font:600 15px Inter,'Noto Sans Kannada','Noto Sans Devanagari',sans-serif;cursor:pointer}
.share-opt:hover{border-color:#0b8f80}
.share-url{width:100%;padding:9px 10px;border-radius:10px;border:1px solid #e6e0d2;font:500 12px Inter;color:#5f6b80;background:#fff}
.share-x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:none;background:#f1ede2;cursor:pointer;font-size:14px}
/* ---------- dark theme (follows the shared BAIO theme: localStorage baio_theme) ---------- */

<script>
const NARR = [{"en": "Hello students! I am Narendra Sir's BAIO AI assistant. Today I will take you through your first year P U C Biology mid-term paper, chapter by chapter. For every topic, I will explain what it means, how many marks it carries, and how you should write it in the exam. So keep your notebook and pen ready, and let's begin.", "kn": "ನಮಸ್ಕಾರ ವಿದ್ಯಾರ್ಥಿಗಳೇ! ನಾನು ನರೇಂದ್ರ ಸರ್ ಅವರ ಬಿಎಐಒ ಎಐ ಸಹಾಯಕ. ಇಂದು ಪ್ರಥಮ ಪಿಯುಸಿ ಜೀವಶಾಸ್ತ್ರ ಮಧ್ಯಾವಧಿ ಪ್ರಶ್ನೆಪತ್ರಿಕೆಯನ್ನು ಅಧ್ಯಾಯವಾರು ನಿಮ್ಮೊಂದಿಗೆ ನೋಡುತ್ತೇನೆ. ಪ್ರತಿ ವಿಷಯದ ಅರ್ಥ, ಅದಕ್ಕೆ ಎಷ್ಟು ಅಂಕ, ಮತ್ತು ಪರೀಕ್ಷೆಯಲ್ಲಿ ಹೇಗೆ ಬರೆಯಬೇಕು ಎಂದು ವಿವರಿಸುತ್ತೇನೆ. ನೋಟ್‌ಬುಕ್ ಮತ್ತು ಪೆನ್ ಸಿದ್ಧವಾಗಿಟ್ಟುಕೊಳ್ಳಿ, ಆರಂಭಿಸೋಣ.", "hi": "नमस्ते विद्यार्थियों! मैं नरेंद्र सर का बी ए आई ओ ए आई सहायक हूँ। आज मैं आपको प्रथम पीयूसी जीव विज्ञान का मध्यावधि प्रश्नपत्र अध्याय दर अध्याय समझाऊँगा। हर विषय का मतलब, उसके कितने अंक हैं, और परीक्षा में उसे कैसे लिखना है, यह सब समझाऊँगा। अपनी नोटबुक और पेन तैयार रखिए, चलिए शुरू करते हैं।"}, {"en": "Before we start, here is how to get the most out of this session. When a topic comes up, pause, and try writing the answer in your notebook on your own. Then compare it with the slide and correct your mistakes in a different colour. That is how memory becomes strong. Draw every diagram exactly the way Narendra Sir taught you in class. And on the morning of the exam, just revise the key facts once more.", "kn": "ಮೊದಲು, ಈ ಅವಧಿಯಿಂದ ಹೆಚ್ಚು ಲಾಭ ಪಡೆಯುವುದು ಹೇಗೆ ಎಂದು ನೋಡೋಣ. ಪ್ರತಿ ವಿಷಯ ಬಂದಾಗ ನಿಲ್ಲಿಸಿ, ನೀವೇ ನೋಟ್‌ಬುಕ್‌ನಲ್ಲಿ ಉತ್ತರ ಬರೆಯಲು ಪ್ರಯತ್ನಿಸಿ. ನಂತರ ಸ್ಲೈಡ್‌ನೊಂದಿಗೆ ಹೋಲಿಸಿ, ತಪ್ಪುಗಳನ್ನು ಬೇರೆ ಬಣ್ಣದಲ್ಲಿ ತಿದ್ದಿ. ಹೀಗೆ ಮಾಡಿದರೆ ನೆನಪು ಗಟ್ಟಿಯಾಗುತ್ತದೆ. ಪ್ರತಿ ಚಿತ್ರವನ್ನು ನರೇಂದ್ರ ಸರ್ ತರಗತಿಯಲ್ಲಿ ಕಲಿಸಿದಂತೆಯೇ ಬರೆಯಿರಿ. ಪರೀಕ್ಷೆಯ ದಿನ ಬೆಳಿಗ್ಗೆ ಮುಖ್ಯ ಅಂಶಗಳನ್ನು ಮತ್ತೊಮ್ಮೆ ಪುನರಾವರ್ತಿಸಿ.", "hi": "शुरू करने से पहले, इस सत्र का पूरा फ़ायदा कैसे उठाएँ, यह जान लीजिए। जब कोई विषय आए, तो रुकिए, और ख़ुद नोटबुक में उत्तर लिखने की कोशिश कीजिए। फिर स्लाइड से मिलाइए और गलतियाँ दूसरे रंग से सुधारिए। इसी से याददाश्त मज़बूत होती है। हर चित्र वैसे ही बनाइए जैसे नरेंद्र सर ने कक्षा में सिखाया है। और परीक्षा की सुबह, मुख्य तथ्य एक बार फिर दोहरा लीजिए।"}, {"en": "Let's start with chapter one, The Living World. It is a small chapter, worth only four marks in the paper. But these are easy marks, so please don't skip it.", "kn": "ಅಧ್ಯಾಯ ಒಂದು, ಜೀವ ಜಗತ್ತು, ಇದರಿಂದ ಆರಂಭಿಸೋಣ. ಇದು ಚಿಕ್ಕ ಅಧ್ಯಾಯ, ಪತ್ರಿಕೆಯಲ್ಲಿ ಕೇವಲ ನಾಲ್ಕು ಅಂಕ. ಆದರೆ ಇವು ಸುಲಭದ ಅಂಕಗಳು, ಆದ್ದರಿಂದ ಬಿಟ್ಟುಬಿಡಬೇಡಿ.", "hi": "चलिए अध्याय एक, सजीव जगत, से शुरू करते हैं। यह छोटा अध्याय है, प्रश्नपत्र में सिर्फ़ चार अंक का। पर ये आसान अंक हैं, इसलिए इसे मत छोड़िए।"}, {"en": "These facts come as one-mark MCQs. First, the basic unit of classification is the species, not the genus. Students often mix these up, so be careful. Second, the rules for writing a scientific name. The genus begins with a capital letter, the species name begins with a small letter, and in print it is in italics. When you write by hand, underline both words separately, like Mangifera indica for mango. If an option has a capital letter in the species name, it is wrong.", "kn": "ಈ ಅಂಶಗಳು ಒಂದು ಅಂಕದ ಬಹು ಆಯ್ಕೆ ಪ್ರಶ್ನೆಗಳಾಗಿ ಬರುತ್ತವೆ. ಮೊದಲನೆಯದು, ವರ್ಗೀಕರಣದ ಮೂಲ ಘಟಕ ಪ್ರಭೇದ, ಅಂದರೆ ಸ್ಪೀಶೀಸ್, ಕುಲ ಅಲ್ಲ. ಇದನ್ನು ವಿದ್ಯಾರ್ಥಿಗಳು ಹೆಚ್ಚಾಗಿ ಗೊಂದಲ ಮಾಡಿಕೊಳ್ಳುತ್ತಾರೆ. ಎರಡನೆಯದು, ವೈಜ್ಞಾನಿಕ ಹೆಸರು ಬರೆಯುವ ನಿಯಮ. ಕುಲದ ಹೆಸರು ದೊಡ್ಡ ಅಕ್ಷರದಿಂದ, ಪ್ರಭೇದದ ಹೆಸರು ಸಣ್ಣ ಅಕ್ಷರದಿಂದ ಆರಂಭವಾಗುತ್ತದೆ, ಮುದ್ರಣದಲ್ಲಿ ಓರೆ ಅಕ್ಷರದಲ್ಲಿರುತ್ತದೆ. ಕೈಯಲ್ಲಿ ಬರೆಯುವಾಗ ಎರಡೂ ಪದಗಳಿಗೆ ಬೇರೆ ಬೇರೆಯಾಗಿ ಅಡಿಗೆರೆ ಹಾಕಿ, ಮಾವಿಗೆ ಮ್ಯಾಂಜಿಫೆರಾ ಇಂಡಿಕಾ ಎಂಬಂತೆ.", "hi": "ये तथ्य एक अंक के बहुविकल्पीय प्रश्नों में आते हैं। पहला, वर्गीकरण की मूल इकाई जाति यानी स्पीशीज़ है, वंश नहीं। विद्यार्थी अक्सर इनमें उलझ जाते हैं, इसलिए ध्यान रखिए। दूसरा, वैज्ञानिक नाम लिखने के नियम। वंश का नाम बड़े अक्षर से, और जाति का नाम छोटे अक्षर से शुरू होता है, और छपाई में तिरछे अक्षरों में होता है। हाथ से लिखते समय दोनों शब्दों के नीचे अलग अलग रेखा खींचिए, जैसे आम के लिए मैंजीफ़ेरा इंडिका।"}, {"en": "Binomial nomenclature is a two-mark question. Bi means two, so every organism gets two names: the first is the generic name, and the second is the specific epithet. For example, in Homo sapiens, Homo is the genus and sapiens is the species. This system was given by Carolus Linnaeus. In the exam, write the definition in one line, give one example, and name Linnaeus. That's your full two marks.", "kn": "ದ್ವಿನಾಮ ನಾಮಕರಣ ಎರಡು ಅಂಕದ ಪ್ರಶ್ನೆ. ದ್ವಿ ಎಂದರೆ ಎರಡು, ಆದ್ದರಿಂದ ಪ್ರತಿ ಜೀವಿಗೆ ಎರಡು ಹೆಸರು: ಮೊದಲನೆಯದು ಕುಲದ ಹೆಸರು, ಎರಡನೆಯದು ಪ್ರಭೇದ ಸೂಚಕ ಪದ. ಉದಾಹರಣೆಗೆ ಹೋಮೋ ಸೇಪಿಯನ್ಸ್‌ನಲ್ಲಿ ಹೋಮೋ ಕುಲ, ಸೇಪಿಯನ್ಸ್ ಪ್ರಭೇದ. ಈ ಪದ್ಧತಿಯನ್ನು ಕ್ಯಾರೋಲಸ್ ಲಿನ್ನಿಯಸ್ ನೀಡಿದರು. ಪರೀಕ್ಷೆಯಲ್ಲಿ ಒಂದು ಸಾಲಿನ ವ್ಯಾಖ್ಯಾನ, ಒಂದು ಉದಾಹರಣೆ, ಮತ್ತು ಲಿನ್ನಿಯಸ್ ಹೆಸರು ಬರೆಯಿರಿ. ಎರಡೂ ಅಂಕ ನಿಮ್ಮದು.", "hi": "द्विनाम पद्धति दो अंक का प्रश्न है। द्वि मतलब दो, इसलिए हर जीव के दो नाम होते हैं: पहला वंश का नाम, और दूसरा जाति का नाम। जैसे होमो सेपियंस में होमो वंश है और सेपियंस जाति। यह पद्धति कैरोलस लिनियस ने दी थी। परीक्षा में एक लाइन में परिभाषा, एक उदाहरण, और लिनियस का नाम लिखिए। पूरे दो अंक आपके।"}, {"en": "Chapter two, Biological Classification, carries ten marks. Questions come from Kingdom Monera, the five kingdom classification and fungi. Let's see each one.", "kn": "ಅಧ್ಯಾಯ ಎರಡು, ಜೈವಿಕ ವರ್ಗೀಕರಣ, ಹತ್ತು ಅಂಕಗಳದ್ದು. ಮೊನೆರಾ ಸಾಮ್ರಾಜ್ಯ, ಐದು ಸಾಮ್ರಾಜ್ಯ ವರ್ಗೀಕರಣ ಮತ್ತು ಶಿಲೀಂಧ್ರಗಳಿಂದ ಪ್ರಶ್ನೆಗಳು ಬರುತ್ತವೆ. ಒಂದೊಂದಾಗಿ ನೋಡೋಣ.", "hi": "अध्याय दो, जैविक वर्गीकरण, दस अंक का है। प्रश्न मोनेरा जगत, पाँच जगत वर्गीकरण और कवकों से आते हैं। एक एक करके देखते हैं।"}, {"en": "Two quick MCQ facts. The cell wall of fungi is made of chitin, the same tough material found in the shells of insects. Plant cell walls are made of cellulose, so don't confuse the two. Next, red rot of sugarcane is caused by a fungus called Colletotrichum falcatum. Remember: red rot, fungus.", "kn": "ಎರಡು ಬಹು ಆಯ್ಕೆ ಅಂಶಗಳು. ಶಿಲೀಂಧ್ರಗಳ ಜೀವಕೋಶ ಭಿತ್ತಿ ಕೈಟಿನ್‌ನಿಂದ ಮಾಡಲ್ಪಟ್ಟಿದೆ, ಕೀಟಗಳ ಹೊರಕವಚದಲ್ಲಿರುವ ಅದೇ ಗಟ್ಟಿ ವಸ್ತು. ಸಸ್ಯ ಜೀವಕೋಶ ಭಿತ್ತಿ ಸೆಲ್ಯುಲೋಸ್‌ನದು, ಎರಡನ್ನೂ ಗೊಂದಲ ಮಾಡಿಕೊಳ್ಳಬೇಡಿ. ಮುಂದೆ, ಕಬ್ಬಿನ ಕೆಂಪು ಕೊಳೆ ರೋಗ ಕೊಲೆಟೋಟ್ರೈಕಮ್ ಫಾಲ್ಕೇಟಮ್ ಎಂಬ ಶಿಲೀಂಧ್ರದಿಂದ ಬರುತ್ತದೆ. ನೆನಪಿಡಿ: ಕೆಂಪು ಕೊಳೆ, ಶಿಲೀಂಧ್ರ.", "hi": "दो छोटे बहुविकल्पीय तथ्य। कवक की कोशिका भित्ति काइटिन की बनी होती है, वही कड़ा पदार्थ जो कीड़ों के खोल में होता है। पौधों की कोशिका भित्ति सेल्यूलोज़ की होती है, दोनों में भ्रमित मत होइए। अगला, गन्ने का लाल सड़न रोग कोलेटोट्राइकम फ़ाल्केटम नामक कवक से होता है। याद रखिए: लाल सड़न, कवक।"}, {"en": "Kingdom Monera is a three-mark question. Monerans are bacteria. They are prokaryotic and unicellular, which means there is no true nucleus and no membrane-bound organelles. Their cell wall is made of peptidoglycan. They are the most abundant organisms and can live almost anywhere, even in hot springs, deserts, snow and deep oceans. Some make their own food by photosynthesis or chemosynthesis, others depend on other organisms. They mostly reproduce by fission. For three marks, write three clear features with examples like E coli, Nostoc and Anabaena.", "kn": "ಮೊನೆರಾ ಸಾಮ್ರಾಜ್ಯ ಮೂರು ಅಂಕದ ಪ್ರಶ್ನೆ. ಮೊನೆರಾ ಎಂದರೆ ಬ್ಯಾಕ್ಟೀರಿಯಾ. ಇವು ಆದಿಕೋಶೀಯ ಮತ್ತು ಏಕಕೋಶೀಯ, ಅಂದರೆ ನಿಜವಾದ ಕೋಶಕೇಂದ್ರ ಮತ್ತು ಪೊರೆಯಿರುವ ಕಣದಂಗಗಳಿಲ್ಲ. ಕೋಶಭಿತ್ತಿ ಪೆಪ್ಟಿಡೋಗ್ಲೈಕಾನ್‌ನಿಂದ ಮಾಡಲ್ಪಟ್ಟಿದೆ. ಇವು ಅತ್ಯಂತ ಹೆಚ್ಚು ಸಂಖ್ಯೆಯಲ್ಲಿದ್ದು, ಬಿಸಿನೀರಿನ ಬುಗ್ಗೆ, ಮರುಭೂಮಿ, ಹಿಮ, ಆಳ ಸಮುದ್ರ ಎಲ್ಲೆಡೆ ಬದುಕುತ್ತವೆ. ಕೆಲವು ದ್ಯುತಿಸಂಶ್ಲೇಷಣೆ ಅಥವಾ ರಸಾಯನ ಸಂಶ್ಲೇಷಣೆಯಿಂದ ಆಹಾರ ತಯಾರಿಸುತ್ತವೆ, ಕೆಲವು ಪರಾವಲಂಬಿಗಳು. ಮುಖ್ಯವಾಗಿ ವಿದಳನದಿಂದ ಸಂತಾನೋತ್ಪತ್ತಿ ಮಾಡುತ್ತವೆ. ಮೂರು ಅಂಕಕ್ಕೆ ಮೂರು ಸ್ಪಷ್ಟ ಲಕ್ಷಣಗಳನ್ನು ಇ ಕೋಲೈ, ನಾಸ್ಟಾಕ್, ಅನಬೀನಾ ಉದಾಹರಣೆಗಳೊಂದಿಗೆ ಬರೆಯಿರಿ.", "hi": "मोनेरा जगत तीन अंक का प्रश्न है। मोनेरा मतलब जीवाणु। ये प्रोकैरियोटिक और एककोशिकीय होते हैं, यानी इनमें असली केंद्रक और झिल्ली वाले कोशिकांग नहीं होते। इनकी कोशिका भित्ति पेप्टिडोग्लाइकन की होती है। ये सबसे ज़्यादा संख्या में होते हैं और लगभग हर जगह रहते हैं, गर्म झरनों, रेगिस्तान, बर्फ़ और गहरे समुद्र में भी। कुछ प्रकाश संश्लेषण या रसायन संश्लेषण से भोजन बनाते हैं, कुछ दूसरों पर निर्भर रहते हैं। ये मुख्यतः विखंडन से प्रजनन करते हैं। तीन अंक के लिए तीन स्पष्ट लक्षण, ई कोलाई, नॉस्टॉक और एनाबीना जैसे उदाहरणों के साथ लिखिए।"}, {"en": "Now a five-mark favourite: Whittaker's five kingdom classification, proposed in nineteen sixty nine. He used five criteria: cell structure, body organisation, mode of nutrition, reproduction and phylogenetic relationships. The five kingdoms are Monera, Protista, Fungi, Plantae and Animalia. For each kingdom, remember one key feature and one example. Monera: prokaryotes, like bacteria. Protista: unicellular eukaryotes, like Paramecium. Fungi: chitin wall and heterotrophic, like Mucor. Plantae: autotrophs with a cellulose wall. Animalia: no cell wall, holozoic nutrition. A neat table like this scores very well.", "kn": "ಈಗ ಐದು ಅಂಕದ ನೆಚ್ಚಿನ ಪ್ರಶ್ನೆ: ವಿಟೇಕರ್ ಅವರ ಐದು ಸಾಮ್ರಾಜ್ಯ ವರ್ಗೀಕರಣ, ಸಾವಿರದ ಒಂಬೈನೂರ ಅರವತ್ತೊಂಬತ್ತರಲ್ಲಿ ನೀಡಲಾಯಿತು. ಅವರು ಐದು ಆಧಾರಗಳನ್ನು ಬಳಸಿದರು: ಕೋಶ ರಚನೆ, ದೇಹ ವ್ಯವಸ್ಥೆ, ಪೋಷಣೆಯ ವಿಧ, ಸಂತಾನೋತ್ಪತ್ತಿ ಮತ್ತು ವಿಕಾಸ ಸಂಬಂಧ. ಐದು ಸಾಮ್ರಾಜ್ಯಗಳು ಮೊನೆರಾ, ಪ್ರೊಟಿಸ್ಟಾ, ಶಿಲೀಂಧ್ರ, ಸಸ್ಯ ಮತ್ತು ಪ್ರಾಣಿ. ಪ್ರತಿ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ ಒಂದು ಮುಖ್ಯ ಲಕ್ಷಣ ಮತ್ತು ಒಂದು ಉದಾಹರಣೆ ನೆನಪಿಡಿ. ಮೊನೆರಾ ಆದಿಕೋಶಿಗಳು, ಬ್ಯಾಕ್ಟೀರಿಯಾದಂತೆ. ಪ್ರೊಟಿಸ್ಟಾ ಏಕಕೋಶೀಯ ನಿಜಕೋಶಿಗಳು, ಪ್ಯಾರಾಮೀಸಿಯಮ್‌ನಂತೆ. ಶಿಲೀಂಧ್ರ ಕೈಟಿನ್ ಭಿತ್ತಿ, ಪರಪೋಷಿ, ಮ್ಯೂಕರ್‌ನಂತೆ. ಸಸ್ಯಗಳು ಸೆಲ್ಯುಲೋಸ್ ಭಿತ್ತಿಯ ಸ್ವಪೋಷಿಗಳು. ಪ್ರಾಣಿಗಳಿಗೆ ಕೋಶಭಿತ್ತಿ ಇಲ್ಲ, ಸಮಗ್ರಭಕ್ಷಕ ಪೋಷಣೆ. ಇಂತಹ ಅಚ್ಚುಕಟ್ಟಾದ ಕೋಷ್ಟಕ ಹೆಚ್ಚು ಅಂಕ ತರುತ್ತದೆ.", "hi": "अब पाँच अंक का पसंदीदा प्रश्न: व्हिटेकर का पाँच जगत वर्गीकरण, जो उन्नीस सौ उनहत्तर में दिया गया। उन्होंने पाँच आधार इस्तेमाल किए: कोशिका संरचना, शरीर संगठन, पोषण का तरीका, प्रजनन और जातिवृत्तीय संबंध। पाँच जगत हैं मोनेरा, प्रोटिस्टा, कवक, पादप और जंतु। हर जगत का एक मुख्य लक्षण और एक उदाहरण याद रखिए। मोनेरा प्रोकैरियोट हैं, जैसे जीवाणु। प्रोटिस्टा एककोशिकीय यूकैरियोट हैं, जैसे पैरामीशियम। कवक में काइटिन भित्ति, परपोषी, जैसे म्यूकर। पादप सेल्यूलोज़ भित्ति वाले स्वपोषी। जंतुओं में कोशिका भित्ति नहीं, प्राणिसम पोषण। ऐसी साफ़ तालिका बहुत अच्छे अंक दिलाती है।"}, {"en": "The same five-mark question usually asks for merits and demerits too. The merits: prokaryotes were finally separated from eukaryotes, fungi got their own kingdom apart from plants, and the system reflects evolution better than the old two kingdom system. The demerits: Protista became a mixed group, archaebacteria and eubacteria were kept together, and viruses, viroids and lichens found no place at all. Write two or three points on each side, in two columns.", "kn": "ಇದೇ ಐದು ಅಂಕದ ಪ್ರಶ್ನೆಯಲ್ಲಿ ಗುಣಗಳು ಮತ್ತು ದೋಷಗಳನ್ನೂ ಕೇಳುತ್ತಾರೆ. ಗುಣಗಳು: ಆದಿಕೋಶಿಗಳನ್ನು ನಿಜಕೋಶಿಗಳಿಂದ ಬೇರ್ಪಡಿಸಲಾಯಿತು, ಶಿಲೀಂಧ್ರಗಳಿಗೆ ಸಸ್ಯಗಳಿಂದ ಬೇರೆ ಸಾಮ್ರಾಜ್ಯ ಸಿಕ್ಕಿತು, ಮತ್ತು ಹಳೆಯ ಎರಡು ಸಾಮ್ರಾಜ್ಯ ಪದ್ಧತಿಗಿಂತ ವಿಕಾಸವನ್ನು ಚೆನ್ನಾಗಿ ತೋರಿಸುತ್ತದೆ. ದೋಷಗಳು: ಪ್ರೊಟಿಸ್ಟಾ ಮಿಶ್ರ ಗುಂಪಾಯಿತು, ಆರ್ಕಿಬ್ಯಾಕ್ಟೀರಿಯಾ ಮತ್ತು ಯೂಬ್ಯಾಕ್ಟೀರಿಯಾ ಒಟ್ಟಿಗೆ ಇಡಲ್ಪಟ್ಟವು, ಮತ್ತು ವೈರಸ್, ವೈರಾಯ್ಡ್ ಹಾಗೂ ಕಲ್ಲುಹೂಗಳಿಗೆ ಸ್ಥಾನವೇ ಇಲ್ಲ. ಪ್ರತಿ ಬದಿಗೆ ಎರಡು ಮೂರು ಅಂಶಗಳನ್ನು ಎರಡು ಕಾಲಂಗಳಲ್ಲಿ ಬರೆಯಿರಿ.", "hi": "इसी पाँच अंक के प्रश्न में गुण और दोष भी पूछे जाते हैं। गुण: प्रोकैरियोट को यूकैरियोट से अलग किया गया, कवक को पौधों से अलग अपना जगत मिला, और यह पुरानी दो जगत पद्धति से विकास को बेहतर दिखाता है। दोष: प्रोटिस्टा एक मिश्रित समूह बन गया, आर्कीबैक्टीरिया और यूबैक्टीरिया साथ रख दिए गए, और विषाणु, वाइरॉइड और लाइकेन को कोई जगह नहीं मिली। दोनों तरफ़ दो तीन बिंदु, दो कॉलम में लिखिए।"}, {"en": "Chapter three, Plant Kingdom, is worth ten marks. The star topic here is the algae table. Learn it well and you can score five marks in one go.", "kn": "ಅಧ್ಯಾಯ ಮೂರು, ಸಸ್ಯ ಸಾಮ್ರಾಜ್ಯ, ಹತ್ತು ಅಂಕಗಳದ್ದು. ಇಲ್ಲಿನ ಮುಖ್ಯ ವಿಷಯ ಶೈವಲಗಳ ಕೋಷ್ಟಕ. ಇದನ್ನು ಚೆನ್ನಾಗಿ ಕಲಿತರೆ ಒಮ್ಮೆಗೇ ಐದು ಅಂಕ ಗಳಿಸಬಹುದು.", "hi": "अध्याय तीन, पादप जगत, दस अंक का है। यहाँ का सबसे ख़ास विषय शैवालों की तालिका है। इसे अच्छे से सीख लिया तो एक ही बार में पाँच अंक मिल सकते हैं।"}, {"en": "Three MCQ facts. Bryophytes are called the amphibians of the plant kingdom, because they live on land but need water for fertilisation, just like frogs. Cycas or Ginkgo is called a living fossil among gymnosperms, because these plants have survived almost unchanged from ancient times. So if either name appears in the options, think living fossil. And Chlorella is a protein-rich alga, so rich that space travellers use it as food.", "kn": "ಮೂರು ಬಹು ಆಯ್ಕೆ ಅಂಶಗಳು. ಬ್ರಯೋಫೈಟ್‌ಗಳನ್ನು ಸಸ್ಯ ಸಾಮ್ರಾಜ್ಯದ ಉಭಯವಾಸಿಗಳು ಎನ್ನುತ್ತಾರೆ, ಏಕೆಂದರೆ ಅವು ನೆಲದ ಮೇಲೆ ಬದುಕಿದರೂ ಫಲೀಕರಣಕ್ಕೆ ನೀರು ಬೇಕು, ಕಪ್ಪೆಗಳಂತೆಯೇ. ಸೈಕಸ್ ಅಥವಾ ಜಿಂಕೋವನ್ನು ಅನಾವೃತಬೀಜಿಗಳಲ್ಲಿ ಜೀವಂತ ಪಳೆಯುಳಿಕೆ ಎನ್ನುತ್ತಾರೆ, ಏಕೆಂದರೆ ಈ ಸಸ್ಯಗಳು ಪ್ರಾಚೀನ ಕಾಲದಿಂದ ಬಹುತೇಕ ಬದಲಾಗದೆ ಉಳಿದಿವೆ. ಆಯ್ಕೆಗಳಲ್ಲಿ ಇವುಗಳಲ್ಲಿ ಯಾವುದೇ ಹೆಸರು ಬಂದರೂ, ಜೀವಂತ ಪಳೆಯುಳಿಕೆ ಎಂದು ನೆನಪಿಡಿ. ಕ್ಲೋರೆಲ್ಲಾ ಪ್ರೋಟೀನ್ ಸಮೃದ್ಧ ಶೈವಲ, ಅಂತರಿಕ್ಷ ಯಾತ್ರಿಗಳೂ ಇದನ್ನು ಆಹಾರವಾಗಿ ಬಳಸುತ್ತಾರೆ.", "hi": "तीन बहुविकल्पीय तथ्य। ब्रायोफ़ाइट्स को पादप जगत के उभयचर कहते हैं, क्योंकि ये ज़मीन पर रहते हैं पर निषेचन के लिए पानी चाहिए, बिल्कुल मेंढक की तरह। साइकस या जिंकगो को अनावृतबीजियों में जीवित जीवाश्म कहते हैं, क्योंकि ये पौधे प्राचीन काल से लगभग बिना बदले बचे हैं। तो विकल्पों में इनमें से कोई भी नाम आए, तो जीवित जीवाश्म सोचिए। और क्लोरेला प्रोटीन से भरपूर शैवाल है, इतना कि अंतरिक्ष यात्री भी इसे भोजन के रूप में लेते हैं।"}, {"en": "Economic importance of algae is a two-mark question. Write any two clear points. Some algae are eaten as food, like Porphyra, Laminaria and Sargassum. Brown algae give algin and red algae give carrageen, used commercially. Agar from Gelidium and Gracilaria is used in laboratories to grow microbes, and in ice-creams and jellies. And here is a great point: algae fix about half of all the carbon dioxide on earth.", "kn": "ಶೈವಲಗಳ ಆರ್ಥಿಕ ಮಹತ್ವ ಎರಡು ಅಂಕದ ಪ್ರಶ್ನೆ. ಯಾವುದೇ ಎರಡು ಸ್ಪಷ್ಟ ಅಂಶ ಬರೆಯಿರಿ. ಪೋರ್ಫೈರಾ, ಲ್ಯಾಮಿನೇರಿಯಾ, ಸರ್ಗಾಸಮ್‌ನಂತಹ ಕೆಲವು ಶೈವಲಗಳನ್ನು ಆಹಾರವಾಗಿ ತಿನ್ನುತ್ತಾರೆ. ಕಂದು ಶೈವಲಗಳಿಂದ ಆಲ್ಜಿನ್, ಕೆಂಪು ಶೈವಲಗಳಿಂದ ಕ್ಯಾರಜೀನ್ ಸಿಗುತ್ತದೆ. ಜೆಲಿಡಿಯಮ್ ಮತ್ತು ಗ್ರಾಸಿಲೇರಿಯಾದಿಂದ ಸಿಗುವ ಅಗರ್ ಅನ್ನು ಪ್ರಯೋಗಾಲಯದಲ್ಲಿ ಸೂಕ್ಷ್ಮಜೀವಿ ಬೆಳೆಸಲು, ಐಸ್‌ಕ್ರೀಮ್ ಮತ್ತು ಜೆಲ್ಲಿಗಳಲ್ಲಿ ಬಳಸುತ್ತಾರೆ. ಒಂದು ಉತ್ತಮ ಅಂಶ: ಭೂಮಿಯ ಒಟ್ಟು ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್‌ನ ಅರ್ಧದಷ್ಟನ್ನು ಶೈವಲಗಳೇ ಸ್ಥಿರೀಕರಿಸುತ್ತವೆ.", "hi": "शैवालों का आर्थिक महत्व दो अंक का प्रश्न है। कोई भी दो स्पष्ट बिंदु लिखिए। कुछ शैवाल भोजन के रूप में खाए जाते हैं, जैसे पॉरफ़ाइरा, लैमिनेरिया और सरगासम। भूरे शैवाल से एल्जिन और लाल शैवाल से कैरागीन मिलता है, जिनका व्यावसायिक उपयोग होता है। जेलिडियम और ग्रेसिलेरिया से मिलने वाला अगार प्रयोगशाला में सूक्ष्मजीव उगाने, और आइसक्रीम व जेली में इस्तेमाल होता है। और एक बढ़िया बिंदु: धरती की लगभग आधी कार्बन डाइऑक्साइड शैवाल ही स्थिर करते हैं।"}, {"en": "This is a section six question on the classes of algae, worth five marks. In the paper, the table is given with four terms missing, marked a, b, c and d. You don't have to write the whole table, you only identify the missing terms. Look at a: the common name of Rhodophyceae. Look at b: the pigment of brown algae, along with chlorophyll a and c. Look at c: the food stored by green algae. And look at d: the cell wall material of brown algae, along with cellulose. Pause now and write a, b, c and d in your notebook.", "kn": "ಇದು ಶೈವಲಗಳ ವರ್ಗಗಳ ಮೇಲಿನ ಆರನೇ ವಿಭಾಗದ ಪ್ರಶ್ನೆ, ಐದು ಅಂಕಗಳದ್ದು. ಪತ್ರಿಕೆಯಲ್ಲಿ ಕೋಷ್ಟಕ ಕೊಟ್ಟಿರುತ್ತಾರೆ, ಅದರಲ್ಲಿ ನಾಲ್ಕು ಪದಗಳು ಕಾಣೆಯಾಗಿದ್ದು ಎ, ಬಿ, ಸಿ ಮತ್ತು ಡಿ ಎಂದು ಗುರುತಿಸಲಾಗಿರುತ್ತದೆ. ಇಡೀ ಕೋಷ್ಟಕ ಬರೆಯಬೇಕಿಲ್ಲ, ಕಾಣೆಯಾದ ಪದಗಳನ್ನು ಮಾತ್ರ ಗುರುತಿಸಿ. ಎ ನೋಡಿ: ರೋಡೋಫೈಸಿಯ ಸಾಮಾನ್ಯ ಹೆಸರು. ಬಿ ನೋಡಿ: ಕ್ಲೋರೋಫಿಲ್ ಎ ಮತ್ತು ಸಿ ಜೊತೆಗೆ ಕಂದು ಶೈವಲಗಳ ವರ್ಣದ್ರವ್ಯ. ಸಿ ನೋಡಿ: ಹಸಿರು ಶೈವಲಗಳು ಸಂಗ್ರಹಿಸುವ ಆಹಾರ. ಡಿ ನೋಡಿ: ಸೆಲ್ಯುಲೋಸ್ ಜೊತೆಗೆ ಕಂದು ಶೈವಲಗಳ ಕೋಶಭಿತ್ತಿಯ ವಸ್ತು. ಈಗ ನಿಲ್ಲಿಸಿ, ಎ, ಬಿ, ಸಿ, ಡಿ ಉತ್ತರಗಳನ್ನು ನೋಟ್‌ಬುಕ್‌ನಲ್ಲಿ ಬರೆಯಿರಿ.", "hi": "यह शैवालों के वर्गों पर खंड छह का प्रश्न है, पाँच अंक का। प्रश्नपत्र में तालिका दी जाती है, जिसमें चार शब्द ग़ायब होते हैं, जिन पर ए, बी, सी और डी लिखा होता है। आपको पूरी तालिका नहीं लिखनी, सिर्फ़ ग़ायब शब्द पहचानने हैं। ए देखिए: रोडोफ़ाइसी का सामान्य नाम। बी देखिए: क्लोरोफ़िल ए और सी के साथ भूरे शैवाल का वर्णक। सी देखिए: हरे शैवाल द्वारा संचित भोजन। और डी देखिए: सेल्यूलोज़ के साथ भूरे शैवाल की कोशिका भित्ति का पदार्थ। अब रुकिए, और ए, बी, सी, डी के उत्तर नोटबुक में लिखिए।"}, {"en": "Let's check your answers. a is red algae, because Rhodophyceae are the red algae. b is fucoxanthin, the pigment that gives brown algae their colour. c is starch, the food stored by green algae, just like in plants. And d is algin, found in the cell wall of brown algae. In the exam, write each answer clearly against its letter, like a equals red algae.", "kn": "ನಿಮ್ಮ ಉತ್ತರಗಳನ್ನು ಪರಿಶೀಲಿಸೋಣ. ಎ ಎಂದರೆ ಕೆಂಪು ಶೈವಲಗಳು, ಏಕೆಂದರೆ ರೋಡೋಫೈಸಿ ಕೆಂಪು ಶೈವಲಗಳು. ಬಿ ಎಂದರೆ ಫ್ಯೂಕೋಜ಼ಾಂಥಿನ್, ಕಂದು ಶೈವಲಗಳಿಗೆ ಬಣ್ಣ ಕೊಡುವ ವರ್ಣದ್ರವ್ಯ. ಸಿ ಎಂದರೆ ಪಿಷ್ಟ, ಸಸ್ಯಗಳಂತೆಯೇ ಹಸಿರು ಶೈವಲಗಳು ಸಂಗ್ರಹಿಸುವ ಆಹಾರ. ಡಿ ಎಂದರೆ ಆಲ್ಜಿನ್, ಕಂದು ಶೈವಲಗಳ ಕೋಶಭಿತ್ತಿಯಲ್ಲಿರುತ್ತದೆ. ಪರೀಕ್ಷೆಯಲ್ಲಿ ಪ್ರತಿ ಅಕ್ಷರದ ಎದುರು ಉತ್ತರವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಬರೆಯಿರಿ, ಎ ಸಮ ಕೆಂಪು ಶೈವಲಗಳು ಎಂಬಂತೆ.", "hi": "चलिए अपने उत्तर जाँचते हैं। ए है लाल शैवाल, क्योंकि रोडोफ़ाइसी लाल शैवाल हैं। बी है फ़्यूकोज़ैंथिन, वह वर्णक जो भूरे शैवाल को रंग देता है। सी है स्टार्च, जो पौधों की तरह हरे शैवाल का संचित भोजन है। और डी है एल्जिन, जो भूरे शैवाल की कोशिका भित्ति में होता है। परीक्षा में हर अक्षर के सामने उत्तर साफ़ लिखिए, जैसे ए बराबर लाल शैवाल।"}, {"en": "Chapter four, Animal Kingdom, is one of the four big chapters, with sixteen marks. Two five-mark questions came from here. Give it a lot of time.", "kn": "ಅಧ್ಯಾಯ ನಾಲ್ಕು, ಪ್ರಾಣಿ ಸಾಮ್ರಾಜ್ಯ, ಹದಿನಾರು ಅಂಕಗಳ ದೊಡ್ಡ ಅಧ್ಯಾಯ. ಇಲ್ಲಿಂದ ಎರಡು ಐದು ಅಂಕದ ಪ್ರಶ್ನೆಗಳು ಬಂದಿವೆ. ಇದಕ್ಕೆ ಹೆಚ್ಚು ಸಮಯ ಕೊಡಿ.", "hi": "अध्याय चार, प्राणि जगत, चार बड़े अध्यायों में से एक है, सोलह अंक का। यहाँ से पाँच अंक के दो प्रश्न आए थे। इसे ख़ूब समय दीजिए।"}, {"en": "Three MCQ facts. The water vascular system is found only in Echinodermata, like the starfish. It helps them move and catch food. Mammals are homoiothermous, which means warm-blooded. And sponges belong to the phylum Porifera, porifera means pore-bearing, since their body is full of pores.", "kn": "ಮೂರು ಬಹು ಆಯ್ಕೆ ಅಂಶಗಳು. ಜಲ ನಾಳ ವ್ಯವಸ್ಥೆ ಕೇವಲ ಎಕಿನೋಡರ್ಮೇಟಾದಲ್ಲಿ ಇರುತ್ತದೆ, ನಕ್ಷತ್ರ ಮೀನಿನಂತೆ. ಇದು ಚಲನೆಗೆ ಮತ್ತು ಆಹಾರ ಹಿಡಿಯಲು ಸಹಾಯ ಮಾಡುತ್ತದೆ. ಸಸ್ತನಿಗಳು ಸಮತಾಪಿಗಳು, ಅಂದರೆ ಬೆಚ್ಚಗಿನ ರಕ್ತದವು. ಸ್ಪಂಜುಗಳು ಪೊರಿಫೆರಾ ವಂಶಕ್ಕೆ ಸೇರಿವೆ, ಪೊರಿಫೆರಾ ಎಂದರೆ ರಂಧ್ರಗಳುಳ್ಳವು, ಅವುಗಳ ದೇಹ ರಂಧ್ರಗಳಿಂದ ತುಂಬಿದೆ.", "hi": "तीन बहुविकल्पीय तथ्य। जल संवहन तंत्र सिर्फ़ एकाइनोडर्मेटा में होता है, जैसे तारा मछली। यह चलने और भोजन पकड़ने में मदद करता है। स्तनधारी समतापी होते हैं, यानी गर्म रक्त वाले। और स्पंज पोरीफ़ेरा संघ में आते हैं, पोरीफ़ेरा मतलब छिद्रों वाले, क्योंकि इनका शरीर छिद्रों से भरा होता है।"}, {"en": "Chordates versus non-chordates is a three-mark question. The simplest trick: chordates have a notochord, non-chordates don't. The nerve cord in chordates is dorsal, hollow and single, while in non-chordates it is ventral, solid and double. Chordates have pharyngeal gill slits and a post-anal tail. And notice the heart: ventral in chordates, dorsal in non-chordates. Write it as a two-column table with three matching points.", "kn": "ಕಶೇರುಕ ಮತ್ತು ಅಕಶೇರುಕಗಳ ವ್ಯತ್ಯಾಸ ಮೂರು ಅಂಕದ ಪ್ರಶ್ನೆ. ಸುಲಭ ಉಪಾಯ: ಕಾರ್ಡೇಟ್‌ಗಳಲ್ಲಿ ನೋಟೋಕಾರ್ಡ್ ಇದೆ, ನಾನ್ ಕಾರ್ಡೇಟ್‌ಗಳಲ್ಲಿ ಇಲ್ಲ. ಕಾರ್ಡೇಟ್‌ಗಳ ನರರಜ್ಜು ಬೆನ್ನಿನ ಕಡೆ, ಟೊಳ್ಳು ಮತ್ತು ಒಂದೇ, ನಾನ್ ಕಾರ್ಡೇಟ್‌ಗಳಲ್ಲಿ ಹೊಟ್ಟೆಯ ಕಡೆ, ಘನ ಮತ್ತು ಎರಡು. ಕಾರ್ಡೇಟ್‌ಗಳಲ್ಲಿ ಗಂಟಲಿನ ಕಿವಿರು ಸೀಳುಗಳು ಮತ್ತು ಗುದದ ನಂತರದ ಬಾಲ ಇರುತ್ತದೆ. ಹೃದಯ ಕಾರ್ಡೇಟ್‌ಗಳಲ್ಲಿ ಹೊಟ್ಟೆಯ ಕಡೆ, ನಾನ್ ಕಾರ್ಡೇಟ್‌ಗಳಲ್ಲಿ ಬೆನ್ನಿನ ಕಡೆ. ಮೂರು ಹೊಂದುವ ಅಂಶಗಳನ್ನು ಎರಡು ಕಾಲಂ ಕೋಷ್ಟಕದಲ್ಲಿ ಬರೆಯಿರಿ.", "hi": "कॉर्डेट और नॉन कॉर्डेट का अंतर तीन अंक का प्रश्न है। सबसे आसान तरीका: कॉर्डेट में नोटोकॉर्ड होता है, नॉन कॉर्डेट में नहीं। कॉर्डेट में तंत्रिका रज्जु पृष्ठ की ओर, खोखली और एकल होती है, जबकि नॉन कॉर्डेट में अधर की ओर, ठोस और दोहरी। कॉर्डेट में ग्रसनी क्लोम दरारें और गुदा के बाद पूँछ होती है। और हृदय देखिए: कॉर्डेट में अधर में, नॉन कॉर्डेट में पृष्ठ में। तीन मिलते हुए बिंदु दो कॉलम की तालिका में लिखिए।"}, {"en": "Phylum Arthropoda is a five-mark question. It is the largest phylum, about two-thirds of all named species. Arthropod means jointed legs, so jointed appendages are the key feature. They are bilateral, triploblastic, segmented and coelomate, covered by a chitin exoskeleton. The body has a head, thorax and abdomen. They breathe by gills, book gills, book lungs or tracheae, and excrete through Malpighian tubules. Give examples like Apis the honey bee, Bombyx the silkworm, and Anopheles the mosquito.", "kn": "ಆರ್ಥ್ರೋಪೋಡಾ ವಂಶ ಐದು ಅಂಕದ ಪ್ರಶ್ನೆ. ಇದು ಅತಿ ದೊಡ್ಡ ವಂಶ, ಹೆಸರಿಸಲಾದ ಎಲ್ಲಾ ಪ್ರಭೇದಗಳಲ್ಲಿ ಸುಮಾರು ಮೂರನೇ ಎರಡು ಭಾಗ. ಆರ್ಥ್ರೋಪೋಡ್ ಎಂದರೆ ಕೀಲುಳ್ಳ ಕಾಲುಗಳು, ಇದೇ ಮುಖ್ಯ ಲಕ್ಷಣ. ಇವು ದ್ವಿಪಾರ್ಶ್ವ ಸಮಮಿತಿ, ತ್ರಿಸ್ತರ, ಖಂಡಿತ ದೇಹ ಮತ್ತು ದೇಹಾವಕಾಶ ಉಳ್ಳವು, ಕೈಟಿನ್ ಹೊರಕವಚವಿದೆ. ದೇಹ ತಲೆ, ಎದೆ ಮತ್ತು ಹೊಟ್ಟೆ ಭಾಗಗಳಾಗಿದೆ. ಕಿವಿರು, ಪುಸ್ತಕ ಕಿವಿರು, ಪುಸ್ತಕ ಶ್ವಾಸಕೋಶ ಅಥವಾ ಶ್ವಾಸನಾಳಗಳಿಂದ ಉಸಿರಾಡುತ್ತವೆ, ಮಾಲ್ಪಿಜಿಯನ್ ನಳಿಕೆಗಳಿಂದ ವಿಸರ್ಜನೆ. ಜೇನುನೊಣ ಏಪಿಸ್, ರೇಷ್ಮೆ ಹುಳು ಬಾಂಬಿಕ್ಸ್, ಸೊಳ್ಳೆ ಅನಾಫಿಲಿಸ್‌ನಂತಹ ಉದಾಹರಣೆ ಕೊಡಿ.", "hi": "संघ आर्थ्रोपोडा पाँच अंक का प्रश्न है। यह सबसे बड़ा संघ है, सभी ज्ञात जातियों का लगभग दो तिहाई। आर्थ्रोपोड मतलब संधियुक्त पैर, यही मुख्य लक्षण है। ये द्विपार्श्व सममित, त्रिस्तरीय, खंडित और प्रगुहा वाले होते हैं, काइटिन के बाह्य कंकाल से ढके। शरीर में सिर, वक्ष और उदर होते हैं। ये क्लोम, पुस्त क्लोम, पुस्त फुफ्फुस या श्वासनलियों से साँस लेते हैं, और मैल्पीघी नलिकाओं से उत्सर्जन करते हैं। मधुमक्खी एपिस, रेशम कीट बॉम्बिक्स और मच्छर एनोफ़िलीज़ जैसे उदाहरण दीजिए।"}, {"en": "In section six, you may be given features and asked to name the phylum. Let's practise. Proboscis, collar and trunk: that's Hemichordata. Comb plates and bioluminescence: Ctenophora. Jointed appendages and Malpighian tubules: Arthropoda. Notochord, hollow nerve cord and gill slits: Chordata. And a shell with head, foot, visceral mass and radula: Mollusca. Practise this both ways, from feature to phylum and phylum to feature.", "kn": "ಆರನೇ ವಿಭಾಗದಲ್ಲಿ ಲಕ್ಷಣಗಳನ್ನು ಕೊಟ್ಟು ವಂಶವನ್ನು ಹೆಸರಿಸಲು ಕೇಳಬಹುದು. ಅಭ್ಯಾಸ ಮಾಡೋಣ. ಪ್ರೊಬೊಸಿಸ್, ಕಾಲರ್ ಮತ್ತು ಕಾಂಡ: ಹೆಮಿಕಾರ್ಡೇಟಾ. ಬಾಚಣಿಗೆ ಫಲಕಗಳು ಮತ್ತು ಜೈವಿಕ ಬೆಳಕು: ಟೀನೋಫೋರಾ. ಕೀಲುಳ್ಳ ಉಪಾಂಗಗಳು ಮತ್ತು ಮಾಲ್ಪಿಜಿಯನ್ ನಳಿಕೆಗಳು: ಆರ್ಥ್ರೋಪೋಡಾ. ನೋಟೋಕಾರ್ಡ್, ಟೊಳ್ಳು ನರರಜ್ಜು ಮತ್ತು ಕಿವಿರು ಸೀಳುಗಳು: ಕಾರ್ಡೇಟಾ. ಚಿಪ್ಪು, ತಲೆ, ಪಾದ, ಒಳಾಂಗ ರಾಶಿ ಮತ್ತು ರಾಡುಲಾ: ಮೊಲಸ್ಕಾ. ಲಕ್ಷಣದಿಂದ ವಂಶ ಮತ್ತು ವಂಶದಿಂದ ಲಕ್ಷಣ, ಎರಡೂ ರೀತಿ ಅಭ್ಯಾಸ ಮಾಡಿ.", "hi": "खंड छह में लक्षण देकर संघ का नाम पूछा जा सकता है। चलिए अभ्यास करें। शुंड, कॉलर और धड़: यह हेमीकॉर्डेटा है। कंकत पट्टिकाएँ और जैव संदीप्ति: टीनोफ़ोरा। संधियुक्त उपांग और मैल्पीघी नलिकाएँ: आर्थ्रोपोडा। नोटोकॉर्ड, खोखली तंत्रिका रज्जु और क्लोम दरारें: कॉर्डेटा। और कवच, सिर, पैर, अंतरंग पुंज और रेडुला: मोलस्का। दोनों तरह से अभ्यास कीजिए, लक्षण से संघ और संघ से लक्षण।"}, {"en": "Chapter five, Morphology of Flowering Plants, carries eleven marks. Placentation, phyllotaxy, venation and fruits are the topics to focus on.", "kn": "ಅಧ್ಯಾಯ ಐದು, ಹೂಬಿಡುವ ಸಸ್ಯಗಳ ರೂಪವಿಜ್ಞಾನ, ಹನ್ನೊಂದು ಅಂಕಗಳದ್ದು. ಬೀಜಾಂಡ ವಿನ್ಯಾಸ, ಎಲೆ ವಿನ್ಯಾಸ, ನಾಳ ವಿನ್ಯಾಸ ಮತ್ತು ಹಣ್ಣುಗಳ ಮೇಲೆ ಗಮನ ಕೊಡಿ.", "hi": "अध्याय पाँच, पुष्पी पादपों की आकारिकी, ग्यारह अंक का है। बीजांडन्यास, पर्णविन्यास, शिराविन्यास और फलों पर ध्यान दीजिए।"}, {"en": "First, an MCQ fact. The edible part of mango is the fleshy mesocarp, the middle layer of the fruit wall. Next, venation, which came as a two-mark question. Venation is the arrangement of veins in the leaf lamina. In reticulate venation, the veins form a network, as in dicot leaves. In parallel venation, the veins run parallel to each other, as in monocots like grass. Define it, and give both types with an example.", "kn": "ಮೊದಲು ಒಂದು ಬಹು ಆಯ್ಕೆ ಅಂಶ. ಮಾವಿನ ಹಣ್ಣಿನ ತಿನ್ನುವ ಭಾಗ ತಿರುಳಿನ ಮಧ್ಯಫಲಭಿತ್ತಿ, ಅಂದರೆ ಮೀಸೋಕಾರ್ಪ್. ಮುಂದೆ, ನಾಳ ವಿನ್ಯಾಸ, ಇದು ಎರಡು ಅಂಕದ ಪ್ರಶ್ನೆಯಾಗಿ ಬಂದಿತ್ತು. ಎಲೆಯ ಪತ್ರಪಟಲದಲ್ಲಿ ನಾಳಗಳ ಜೋಡಣೆಯೇ ನಾಳ ವಿನ್ಯಾಸ. ಜಾಲಾಕಾರ ನಾಳ ವಿನ್ಯಾಸದಲ್ಲಿ ನಾಳಗಳು ಜಾಲ ರೂಪಿಸುತ್ತವೆ, ದ್ವಿದಳ ಸಸ್ಯಗಳಂತೆ. ಸಮಾಂತರ ನಾಳ ವಿನ್ಯಾಸದಲ್ಲಿ ನಾಳಗಳು ಸಮಾಂತರವಾಗಿ ಸಾಗುತ್ತವೆ, ಹುಲ್ಲಿನಂತಹ ಏಕದಳ ಸಸ್ಯಗಳಂತೆ. ವ್ಯಾಖ್ಯಾನ ಮತ್ತು ಎರಡೂ ವಿಧಗಳನ್ನು ಉದಾಹರಣೆಯೊಂದಿಗೆ ಬರೆಯಿರಿ.", "hi": "पहले एक बहुविकल्पीय तथ्य। आम का खाने योग्य भाग गूदेदार मध्यफलभित्ति यानी मीसोकार्प है। अगला, शिराविन्यास, जो दो अंक के प्रश्न में आया था। पत्ती के फलक में शिराओं की व्यवस्था को शिराविन्यास कहते हैं। जालिकावत शिराविन्यास में शिराएँ जाल बनाती हैं, जैसे द्विबीजपत्री पत्तियों में। समानांतर शिराविन्यास में शिराएँ एक दूसरे के समानांतर चलती हैं, जैसे घास जैसे एकबीजपत्रियों में। परिभाषा लिखिए, और दोनों प्रकार उदाहरण के साथ।"}, {"en": "Phyllotaxy, three marks. It is the arrangement of leaves on the stem. Think of the number of leaves at each node. One leaf per node is alternate, as in china rose and mustard. A pair of leaves per node is opposite, as in Calotropis and guava. More than two leaves at a node is whorled, as in Alstonia. Three types, three examples, three marks.", "kn": "ಎಲೆ ವಿನ್ಯಾಸ, ಮೂರು ಅಂಕ. ಕಾಂಡದ ಮೇಲೆ ಎಲೆಗಳ ಜೋಡಣೆ. ಪ್ರತಿ ಗಿಣ್ಣಿನಲ್ಲಿ ಎಷ್ಟು ಎಲೆಗಳಿವೆ ಎಂದು ಯೋಚಿಸಿ. ಒಂದು ಗಿಣ್ಣಿಗೆ ಒಂದು ಎಲೆ ಇದ್ದರೆ ಪರ್ಯಾಯ, ದಾಸವಾಳ ಮತ್ತು ಸಾಸಿವೆಯಂತೆ. ಒಂದು ಗಿಣ್ಣಿಗೆ ಜೋಡಿ ಎಲೆಗಳಿದ್ದರೆ ಅಭಿಮುಖ, ಎಕ್ಕ ಮತ್ತು ಸೀಬೆಯಂತೆ. ಎರಡಕ್ಕಿಂತ ಹೆಚ್ಚು ಎಲೆಗಳಿದ್ದರೆ ಸುತ್ತು ವಿನ್ಯಾಸ, ಆಲ್ಸ್ಟೋನಿಯಾದಂತೆ. ಮೂರು ವಿಧ, ಮೂರು ಉದಾಹರಣೆ, ಮೂರು ಅಂಕ.", "hi": "पर्णविन्यास, तीन अंक। यह तने पर पत्तियों की व्यवस्था है। हर गाँठ पर कितनी पत्तियाँ हैं, यह सोचिए। एक गाँठ पर एक पत्ती हो तो एकांतर, जैसे गुड़हल और सरसों। एक गाँठ पर पत्तियों का जोड़ा हो तो सम्मुख, जैसे आक और अमरूद। दो से ज़्यादा पत्तियाँ हों तो चक्करदार, जैसे एल्सटोनिया। तीन प्रकार, तीन उदाहरण, तीन अंक।"}, {"en": "Placentation is the five-mark question from this chapter. It is the arrangement of ovules inside the ovary. There are five types, so one mark each. Marginal, as in pea. Axile, as in china rose, tomato and lemon. Parietal, as in mustard and Argemone, where a false septum forms. Free central, as in Dianthus and Primrose. And basal, as in sunflower and marigold. Draw a small sketch for each type. Sketches earn marks fast.", "kn": "ಬೀಜಾಂಡ ವಿನ್ಯಾಸ ಈ ಅಧ್ಯಾಯದ ಐದು ಅಂಕದ ಪ್ರಶ್ನೆ. ಅಂಡಾಶಯದೊಳಗೆ ಬೀಜಾಂಡಗಳ ಜೋಡಣೆ. ಐದು ವಿಧಗಳಿವೆ, ಪ್ರತಿಯೊಂದಕ್ಕೆ ಒಂದು ಅಂಕ. ಅಂಚಿನ ವಿನ್ಯಾಸ, ಬಟಾಣಿಯಂತೆ. ಅಕ್ಷೀಯ, ದಾಸವಾಳ, ಟೊಮೆಟೊ ಮತ್ತು ನಿಂಬೆಯಂತೆ. ಭಿತ್ತೀಯ, ಸಾಸಿವೆ ಮತ್ತು ಆರ್ಜಿಮೋನ್‌ನಂತೆ, ಇಲ್ಲಿ ಸುಳ್ಳು ವಿಭಾಜಕ ಉಂಟಾಗುತ್ತದೆ. ಮುಕ್ತ ಕೇಂದ್ರೀಯ, ಡಯಾಂಥಸ್ ಮತ್ತು ಪ್ರಿಮ್‌ರೋಸ್‌ನಂತೆ. ತಳದ ವಿನ್ಯಾಸ, ಸೂರ್ಯಕಾಂತಿ ಮತ್ತು ಚೆಂಡು ಹೂವಿನಂತೆ. ಪ್ರತಿ ವಿಧಕ್ಕೆ ಚಿಕ್ಕ ಚಿತ್ರ ಬರೆಯಿರಿ, ಚಿತ್ರಗಳು ಬೇಗ ಅಂಕ ತರುತ್ತವೆ.", "hi": "बीजांडन्यास इस अध्याय का पाँच अंक का प्रश्न है। यह अंडाशय के अंदर बीजांडों की व्यवस्था है। पाँच प्रकार हैं, हर एक का एक अंक। सीमांत, जैसे मटर। स्तंभीय, जैसे गुड़हल, टमाटर और नींबू। भित्तीय, जैसे सरसों और आर्जीमोन, जहाँ एक कूट पट बनता है। मुक्त स्तंभीय, जैसे डायंथस और प्रिमरोज़। और आधारी, जैसे सूरजमुखी और गेंदा। हर प्रकार का छोटा चित्र बनाइए। चित्र जल्दी अंक दिलाते हैं।"}, {"en": "Chapter six, Anatomy of Flowering Plants, is small, with five marks. Two MCQs and one three-mark question.", "kn": "ಅಧ್ಯಾಯ ಆರು, ಹೂಬಿಡುವ ಸಸ್ಯಗಳ ಅಂಗರಚನೆ, ಐದು ಅಂಕಗಳ ಚಿಕ್ಕ ಅಧ್ಯಾಯ. ಎರಡು ಬಹು ಆಯ್ಕೆ ಮತ್ತು ಒಂದು ಮೂರು ಅಂಕದ ಪ್ರಶ್ನೆ.", "hi": "अध्याय छह, पुष्पी पादपों का शारीर, छोटा है, पाँच अंक का। दो बहुविकल्पीय और एक तीन अंक का प्रश्न।"}, {"en": "Two MCQ facts. Root hairs are outgrowths of the epidermal cells of the root. They increase the surface for absorbing water. And stomata are controlled by two bean-shaped guard cells in dicots. In grasses, the guard cells are dumb-bell shaped. That difference is a favourite in MCQs.", "kn": "ಎರಡು ಬಹು ಆಯ್ಕೆ ಅಂಶಗಳು. ಬೇರು ಕೂದಲುಗಳು ಬೇರಿನ ಹೊರಚರ್ಮ ಕೋಶಗಳ ಬೆಳವಣಿಗೆಗಳು. ಅವು ನೀರು ಹೀರಲು ಮೇಲ್ಮೈ ಹೆಚ್ಚಿಸುತ್ತವೆ. ದ್ವಿದಳ ಸಸ್ಯಗಳಲ್ಲಿ ಪತ್ರರಂಧ್ರಗಳನ್ನು ಎರಡು ಹುರುಳಿ ಆಕಾರದ ಕಾವಲು ಕೋಶಗಳು ನಿಯಂತ್ರಿಸುತ್ತವೆ. ಹುಲ್ಲುಗಳಲ್ಲಿ ಕಾವಲು ಕೋಶಗಳು ಡಂಬೆಲ್ ಆಕಾರದವು. ಈ ವ್ಯತ್ಯಾಸ ಬಹು ಆಯ್ಕೆ ಪ್ರಶ್ನೆಗಳಲ್ಲಿ ಹೆಚ್ಚಾಗಿ ಬರುತ್ತದೆ.", "hi": "दो बहुविकल्पीय तथ्य। मूल रोम जड़ की बाह्यत्वचा कोशिकाओं की वृद्धियाँ हैं। ये पानी सोखने की सतह बढ़ाते हैं। और द्विबीजपत्रियों में रंध्र दो सेम के आकार की द्वार कोशिकाओं से नियंत्रित होते हैं। घासों में द्वार कोशिकाएँ डम्बल के आकार की होती हैं। यह अंतर बहुविकल्पीय प्रश्नों में बहुत पूछा जाता है।"}, {"en": "Open versus closed vascular bundles, three marks. The only thing to remember is cambium. If cambium is present between xylem and phloem, the bundle is open, so secondary growth is possible, as in dicot stems. If cambium is absent, it is closed, with no secondary growth, as in monocot stems. Write three matching points in a table.", "kn": "ತೆರೆದ ಮತ್ತು ಮುಚ್ಚಿದ ನಾಳಕಟ್ಟುಗಳು, ಮೂರು ಅಂಕ. ನೆನಪಿಡಬೇಕಾದದ್ದು ಕೇವಲ ಕ್ಯಾಂಬಿಯಮ್. ಕ್ಸೈಲಮ್ ಮತ್ತು ಫ್ಲೋಯಮ್ ನಡುವೆ ಕ್ಯಾಂಬಿಯಮ್ ಇದ್ದರೆ ತೆರೆದ ನಾಳಕಟ್ಟು, ದ್ವಿತೀಯಕ ಬೆಳವಣಿಗೆ ಸಾಧ್ಯ, ದ್ವಿದಳ ಕಾಂಡಗಳಂತೆ. ಕ್ಯಾಂಬಿಯಮ್ ಇಲ್ಲದಿದ್ದರೆ ಮುಚ್ಚಿದ ನಾಳಕಟ್ಟು, ದ್ವಿತೀಯಕ ಬೆಳವಣಿಗೆ ಇಲ್ಲ, ಏಕದಳ ಕಾಂಡಗಳಂತೆ. ಮೂರು ಹೊಂದುವ ಅಂಶಗಳನ್ನು ಕೋಷ್ಟಕದಲ್ಲಿ ಬರೆಯಿರಿ.", "hi": "खुले और बंद संवहन बंडल, तीन अंक। बस कैम्बियम याद रखिए। अगर ज़ाइलम और फ़्लोएम के बीच कैम्बियम हो, तो बंडल खुला होता है, द्वितीयक वृद्धि संभव है, जैसे द्विबीजपत्री तनों में। अगर कैम्बियम न हो, तो बंद, द्वितीयक वृद्धि नहीं, जैसे एकबीजपत्री तनों में। तालिका में तीन मिलते हुए बिंदु लिखिए।"}, {"en": "Chapter seven, Structural Organisation in Animals, focuses on the frog. It is worth four marks: one MCQ and one three-mark question.", "kn": "ಅಧ್ಯಾಯ ಏಳು, ಪ್ರಾಣಿಗಳಲ್ಲಿ ರಚನಾತ್ಮಕ ವ್ಯವಸ್ಥೆ, ಕಪ್ಪೆಯ ಮೇಲೆ ಕೇಂದ್ರೀಕೃತವಾಗಿದೆ. ನಾಲ್ಕು ಅಂಕ: ಒಂದು ಬಹು ಆಯ್ಕೆ ಮತ್ತು ಒಂದು ಮೂರು ಅಂಕದ ಪ್ರಶ್ನೆ.", "hi": "अध्याय सात, प्राणियों में संरचनात्मक संगठन, मेंढक पर केंद्रित है। चार अंक: एक बहुविकल्पीय और एक तीन अंक का प्रश्न।"}, {"en": "Frogs are cold-blooded, or poikilotherms. Their body temperature changes with the surroundings. So when it gets too hot or too cold, frogs hide in deep burrows. The summer sleep is called aestivation, and the winter sleep is called hibernation. Here's an easy trick: aestivation sounds a bit like summer vacation, so the other one, hibernation, is the winter sleep.", "kn": "ಕಪ್ಪೆಗಳು ಶೀತರಕ್ತದವು, ಅಂದರೆ ಅಸಮತಾಪಿಗಳು. ಅವುಗಳ ದೇಹದ ಉಷ್ಣತೆ ಸುತ್ತಲಿನ ವಾತಾವರಣಕ್ಕೆ ತಕ್ಕಂತೆ ಬದಲಾಗುತ್ತದೆ. ಹೆಚ್ಚು ಬಿಸಿ ಅಥವಾ ಹೆಚ್ಚು ಚಳಿ ಆದಾಗ ಕಪ್ಪೆಗಳು ಆಳವಾದ ಬಿಲಗಳಲ್ಲಿ ಅಡಗುತ್ತವೆ. ಬೇಸಿಗೆಯ ನಿದ್ರೆಗೆ ಗ್ರೀಷ್ಮ ನಿದ್ರೆ ಅಥವಾ ಏಸ್ಟಿವೇಶನ್, ಚಳಿಗಾಲದ ನಿದ್ರೆಗೆ ಶಿಶಿರ ನಿದ್ರೆ ಅಥವಾ ಹೈಬರ್ನೇಶನ್ ಎನ್ನುತ್ತಾರೆ. ಸುಲಭ ಉಪಾಯ: ಏಸ್ಟಿವೇಶನ್ ಸಮ್ಮರ್ ವೆಕೇಶನ್‌ನಂತೆ ಕೇಳಿಸುತ್ತದೆ, ಆದ್ದರಿಂದ ಹೈಬರ್ನೇಶನ್ ಚಳಿಗಾಲದ್ದು.", "hi": "मेंढक ठंडे रक्त वाले यानी असमतापी होते हैं। इनके शरीर का तापमान आसपास के वातावरण के साथ बदलता है। इसलिए जब बहुत गर्मी या बहुत ठंड हो, तो मेंढक गहरे बिलों में छिप जाते हैं। गर्मी की नींद को ग्रीष्म निष्क्रियता यानी एस्टिवेशन, और सर्दी की नींद को शीत निष्क्रियता यानी हाइबरनेशन कहते हैं। आसान तरीका: एस्टिवेशन थोड़ा समर वेकेशन जैसा सुनाई देता है, तो दूसरा, हाइबरनेशन, सर्दी वाला है।"}, {"en": "The digestive system of the frog is a three-mark question. The alimentary canal is short, because frogs are carnivores. Food passes from mouth, buccal cavity, pharynx and oesophagus into the stomach, then the intestine, rectum, and out through the cloaca. The frog catches its prey with its bilobed tongue. In the stomach, food is digested by HCl and gastric juices. Bile from the liver and pancreatic juice reach the duodenum through the common bile duct. Digested food is absorbed by villi and microvilli.", "kn": "ಕಪ್ಪೆಯ ಜೀರ್ಣಾಂಗ ವ್ಯವಸ್ಥೆ ಮೂರು ಅಂಕದ ಪ್ರಶ್ನೆ. ಕಪ್ಪೆ ಮಾಂಸಾಹಾರಿ ಆದ್ದರಿಂದ ಆಹಾರ ನಾಳ ಚಿಕ್ಕದು. ಆಹಾರ ಬಾಯಿ, ಬಾಯಿಯ ಕುಹರ, ಗಂಟಲು ಮತ್ತು ಅನ್ನನಾಳದ ಮೂಲಕ ಜಠರಕ್ಕೆ, ನಂತರ ಕರುಳು, ಗುದನಾಳ ಮತ್ತು ಅವಸ್ಕರದ ಮೂಲಕ ಹೊರಗೆ ಹೋಗುತ್ತದೆ. ಕಪ್ಪೆ ತನ್ನ ಎರಡು ಹಾಲೆಗಳ ನಾಲಿಗೆಯಿಂದ ಬೇಟೆ ಹಿಡಿಯುತ್ತದೆ. ಜಠರದಲ್ಲಿ ಹೈಡ್ರೋಕ್ಲೋರಿಕ್ ಆಮ್ಲ ಮತ್ತು ಜಠರ ರಸಗಳಿಂದ ಜೀರ್ಣವಾಗುತ್ತದೆ. ಯಕೃತ್ತಿನ ಪಿತ್ತರಸ ಮತ್ತು ಮೇದೋಜೀರಕ ರಸ ಸಾಮಾನ್ಯ ಪಿತ್ತನಾಳದ ಮೂಲಕ ಡ್ಯುವೋಡಿನಮ್ ತಲುಪುತ್ತವೆ. ಜೀರ್ಣವಾದ ಆಹಾರವನ್ನು ವಿಲ್ಲೈ ಮತ್ತು ಮೈಕ್ರೋವಿಲ್ಲೈ ಹೀರಿಕೊಳ್ಳುತ್ತವೆ.", "hi": "मेंढक का पाचन तंत्र तीन अंक का प्रश्न है। मेंढक मांसाहारी है, इसलिए आहार नाल छोटी होती है। भोजन मुँह, मुख गुहा, ग्रसनी और ग्रासनली से होकर आमाशय में, फिर आँत, मलाशय, और अवस्कर से बाहर जाता है। मेंढक अपनी द्विपालित जीभ से शिकार पकड़ता है। आमाशय में भोजन हाइड्रोक्लोरिक अम्ल और जठर रस से पचता है। यकृत का पित्त और अग्नाशयी रस सामान्य पित्त वाहिनी से ग्रहणी में पहुँचते हैं। पचा हुआ भोजन अंकुरों और सूक्ष्म अंकुरों द्वारा सोखा जाता है।"}, {"en": "Now practise the diagram of the frog's digestive system. Draw it large, in pencil, and label clearly: mouth, oesophagus, stomach, duodenum, intestine, rectum and cloaca, along with the liver, gall bladder and pancreas. Keep your label lines straight and on one side. Remember, an unlabelled diagram gets no marks.", "kn": "ಈಗ ಕಪ್ಪೆಯ ಜೀರ್ಣಾಂಗ ವ್ಯವಸ್ಥೆಯ ಚಿತ್ರ ಅಭ್ಯಾಸ ಮಾಡಿ. ಪೆನ್ಸಿಲ್‌ನಿಂದ ದೊಡ್ಡದಾಗಿ ಬರೆದು ಸ್ಪಷ್ಟವಾಗಿ ಹೆಸರಿಸಿ: ಬಾಯಿ, ಅನ್ನನಾಳ, ಜಠರ, ಡ್ಯುವೋಡಿನಮ್, ಕರುಳು, ಗುದನಾಳ, ಅವಸ್ಕರ, ಜೊತೆಗೆ ಯಕೃತ್ತು, ಪಿತ್ತಕೋಶ ಮತ್ತು ಮೇದೋಜೀರಕ ಗ್ರಂಥಿ. ಗುರುತು ಗೆರೆಗಳನ್ನು ನೇರವಾಗಿ, ಒಂದೇ ಬದಿಯಲ್ಲಿ ಎಳೆಯಿರಿ. ನೆನಪಿಡಿ, ಹೆಸರಿಸದ ಚಿತ್ರಕ್ಕೆ ಅಂಕವಿಲ್ಲ.", "hi": "अब मेंढक के पाचन तंत्र का चित्र अभ्यास कीजिए। पेंसिल से बड़ा बनाइए और साफ़ नामांकन कीजिए: मुँह, ग्रासनली, आमाशय, ग्रहणी, आँत, मलाशय और अवस्कर, साथ में यकृत, पित्ताशय और अग्नाशय। नामांकन की रेखाएँ सीधी और एक तरफ़ रखिए। याद रखिए, बिना नामांकन के चित्र को कोई अंक नहीं।"}, {"en": "Chapter eight, Cell: The Unit of Life, is the most important chapter in this paper, with twenty-one marks. Three five-mark questions came from here. Study this chapter first and study it deeply.", "kn": "ಅಧ್ಯಾಯ ಎಂಟು, ಜೀವಕೋಶ: ಜೀವದ ಘಟಕ, ಈ ಪತ್ರಿಕೆಯ ಅತ್ಯಂತ ಮುಖ್ಯ ಅಧ್ಯಾಯ, ಇಪ್ಪತ್ತೊಂದು ಅಂಕಗಳು. ಇಲ್ಲಿಂದ ಮೂರು ಐದು ಅಂಕದ ಪ್ರಶ್ನೆಗಳು ಬಂದಿವೆ. ಈ ಅಧ್ಯಾಯವನ್ನು ಮೊದಲು ಮತ್ತು ಆಳವಾಗಿ ಓದಿ.", "hi": "अध्याय आठ, कोशिका: जीवन की इकाई, इस प्रश्नपत्र का सबसे महत्वपूर्ण अध्याय है, इक्कीस अंक का। यहाँ से पाँच अंक के तीन प्रश्न आए थे। इस अध्याय को सबसे पहले और गहराई से पढ़िए।"}, {"en": "Two MCQ facts. The plant cell wall is mainly made of cellulose. And ribosomal RNA, which builds ribosomes, is made in the nucleolus. Next, mesosomes, a two-mark question. Mesosomes are infoldings of the plasma membrane in bacteria. They help in cell wall formation, DNA replication, respiration and secretion. Write the definition and any two functions.", "kn": "ಎರಡು ಬಹು ಆಯ್ಕೆ ಅಂಶಗಳು. ಸಸ್ಯ ಕೋಶಭಿತ್ತಿ ಮುಖ್ಯವಾಗಿ ಸೆಲ್ಯುಲೋಸ್‌ನಿಂದ ಮಾಡಲ್ಪಟ್ಟಿದೆ. ರೈಬೋಸೋಮ್‌ಗಳನ್ನು ನಿರ್ಮಿಸುವ ರೈಬೋಸೋಮಲ್ ಆರ್‌ಎನ್‌ಎ ಕೋಶಕೇಂದ್ರಕಣಿಕೆಯಲ್ಲಿ, ಅಂದರೆ ನ್ಯೂಕ್ಲಿಯೋಲಸ್‌ನಲ್ಲಿ ತಯಾರಾಗುತ್ತದೆ. ಮುಂದೆ, ಮೀಸೋಸೋಮ್‌ಗಳು, ಎರಡು ಅಂಕದ ಪ್ರಶ್ನೆ. ಮೀಸೋಸೋಮ್‌ಗಳು ಬ್ಯಾಕ್ಟೀರಿಯಾದ ಪ್ಲಾಸ್ಮಾ ಪೊರೆಯ ಒಳಮಡಿಕೆಗಳು. ಅವು ಕೋಶಭಿತ್ತಿ ರಚನೆ, ಡಿಎನ್‌ಎ ದ್ವಿಗುಣನ, ಉಸಿರಾಟ ಮತ್ತು ಸ್ರವಿಕೆಗೆ ಸಹಾಯ ಮಾಡುತ್ತವೆ. ವ್ಯಾಖ್ಯಾನ ಮತ್ತು ಯಾವುದೇ ಎರಡು ಕಾರ್ಯಗಳನ್ನು ಬರೆಯಿರಿ.", "hi": "दो बहुविकल्पीय तथ्य। पादप कोशिका भित्ति मुख्यतः सेल्यूलोज़ की बनी होती है। और राइबोसोम बनाने वाला राइबोसोमल आरएनए केंद्रिका यानी न्यूक्लियोलस में बनता है। अगला, मीसोसोम, दो अंक का प्रश्न। मीसोसोम जीवाणुओं की प्लाज़्मा झिल्ली के अंतर्वलन हैं। ये कोशिका भित्ति बनाने, डीएनए प्रतिकृति, श्वसन और स्रावण में मदद करते हैं। परिभाषा और कोई दो कार्य लिखिए।"}, {"en": "Plant cell versus animal cell, two marks. Plant cells have a cellulose cell wall, plastids and one large central vacuole. Animal cells have no cell wall, no plastids, and only small vacuoles, but they do have centrioles, which plant cells usually lack. Two clear differences in a table get you full marks.", "kn": "ಸಸ್ಯ ಕೋಶ ಮತ್ತು ಪ್ರಾಣಿ ಕೋಶದ ವ್ಯತ್ಯಾಸ, ಎರಡು ಅಂಕ. ಸಸ್ಯ ಕೋಶಗಳಲ್ಲಿ ಸೆಲ್ಯುಲೋಸ್ ಕೋಶಭಿತ್ತಿ, ಪ್ಲಾಸ್ಟಿಡ್‌ಗಳು ಮತ್ತು ಒಂದು ದೊಡ್ಡ ಕೇಂದ್ರ ರಸದಾನಿ ಇರುತ್ತದೆ. ಪ್ರಾಣಿ ಕೋಶಗಳಲ್ಲಿ ಕೋಶಭಿತ್ತಿ ಮತ್ತು ಪ್ಲಾಸ್ಟಿಡ್ ಇಲ್ಲ, ರಸದಾನಿಗಳು ಚಿಕ್ಕವು, ಆದರೆ ಸೆಂಟ್ರಿಯೋಲ್‌ಗಳು ಇರುತ್ತವೆ, ಅವು ಸಸ್ಯ ಕೋಶಗಳಲ್ಲಿ ಸಾಮಾನ್ಯವಾಗಿ ಇರುವುದಿಲ್ಲ. ಕೋಷ್ಟಕದಲ್ಲಿ ಎರಡು ಸ್ಪಷ್ಟ ವ್ಯತ್ಯಾಸ ಬರೆದರೆ ಪೂರ್ಣ ಅಂಕ.", "hi": "पादप कोशिका और जंतु कोशिका का अंतर, दो अंक। पादप कोशिका में सेल्यूलोज़ की कोशिका भित्ति, लवक और एक बड़ी केंद्रीय रिक्तिका होती है। जंतु कोशिका में न कोशिका भित्ति, न लवक, और रिक्तिकाएँ छोटी होती हैं, पर इनमें तारककेंद्र होते हैं, जो पादप कोशिकाओं में आमतौर पर नहीं होते। तालिका में दो स्पष्ट अंतर, और पूरे अंक।"}, {"en": "Practise the plant cell diagram. Draw a rectangle with a cell wall, and inside it the plasma membrane, a big central vacuole with its tonoplast, the nucleus with its nucleolus, chloroplasts, mitochondria, Golgi apparatus, endoplasmic reticulum and ribosomes. Also show plasmodesmata in the wall. Label everything neatly.", "kn": "ಸಸ್ಯ ಕೋಶದ ಚಿತ್ರ ಅಭ್ಯಾಸ ಮಾಡಿ. ಕೋಶಭಿತ್ತಿಯಿರುವ ಆಯತ ಬರೆದು, ಅದರೊಳಗೆ ಪ್ಲಾಸ್ಮಾ ಪೊರೆ, ಟೋನೋಪ್ಲಾಸ್ಟ್ ಇರುವ ದೊಡ್ಡ ಕೇಂದ್ರ ರಸದಾನಿ, ನ್ಯೂಕ್ಲಿಯೋಲಸ್ ಇರುವ ಕೋಶಕೇಂದ್ರ, ಹರಿತ್ತಿಲಗಳು, ಮೈಟೊಕಾಂಡ್ರಿಯಾ, ಗಾಲ್ಗಿ ಸಂಕೀರ್ಣ, ಎಂಡೋಪ್ಲಾಸ್ಮಿಕ್ ರೆಟಿಕ್ಯುಲಮ್ ಮತ್ತು ರೈಬೋಸೋಮ್‌ಗಳನ್ನು ತೋರಿಸಿ. ಭಿತ್ತಿಯಲ್ಲಿ ಪ್ಲಾಸ್ಮೋಡೆಸ್ಮೇಟಾವನ್ನೂ ತೋರಿಸಿ. ಎಲ್ಲವನ್ನೂ ಅಚ್ಚುಕಟ್ಟಾಗಿ ಹೆಸರಿಸಿ.", "hi": "पादप कोशिका का चित्र अभ्यास कीजिए। कोशिका भित्ति वाला एक आयत बनाइए, और उसके अंदर प्लाज़्मा झिल्ली, टोनोप्लास्ट वाली बड़ी केंद्रीय रिक्तिका, केंद्रिका वाला केंद्रक, हरितलवक, सूत्रकणिका, गॉल्जी उपकरण, अंतर्द्रव्यी जालिका और राइबोसोम दिखाइए। भित्ति में प्लाज़्मोडेस्मेटा भी दिखाइए। सब कुछ साफ़ नामांकित कीजिए।"}, {"en": "The fluid mosaic model is a five-mark question. It was proposed by Singer and Nicolson in nineteen seventy two. The membrane is a lipid bilayer: the polar heads face outside and the non-polar tails face inside. It is quasi-fluid, which means lipids and proteins can move sideways, like tiles floating in a mosaic. Peripheral proteins sit on the surface, while integral proteins are buried in the bilayer. In the human RBC membrane, there is about fifty-two percent protein and forty percent lipid. The membrane is selectively permeable, allowing both passive and active transport. Draw the diagram with your answer.", "kn": "ದ್ರವ ಮೊಸಾಯಿಕ್ ಮಾದರಿ ಐದು ಅಂಕದ ಪ್ರಶ್ನೆ. ಇದನ್ನು ಸಾವಿರದ ಒಂಬೈನೂರ ಎಪ್ಪತ್ತೆರಡರಲ್ಲಿ ಸಿಂಗರ್ ಮತ್ತು ನಿಕೋಲ್ಸನ್ ಮಂಡಿಸಿದರು. ಪೊರೆ ಒಂದು ಲಿಪಿಡ್ ದ್ವಿಪದರ: ಧ್ರುವೀಯ ತಲೆಗಳು ಹೊರಗೆ, ಅಧ್ರುವೀಯ ಬಾಲಗಳು ಒಳಗೆ. ಇದು ಅರೆ ದ್ರವ, ಅಂದರೆ ಲಿಪಿಡ್ ಮತ್ತು ಪ್ರೋಟೀನ್‌ಗಳು ಪಕ್ಕಕ್ಕೆ ಚಲಿಸಬಹುದು. ಬಾಹ್ಯ ಪ್ರೋಟೀನ್‌ಗಳು ಮೇಲ್ಮೈಯಲ್ಲಿ, ಸಮಗ್ರ ಪ್ರೋಟೀನ್‌ಗಳು ದ್ವಿಪದರದೊಳಗೆ ಹುದುಗಿರುತ್ತವೆ. ಮಾನವ ಕೆಂಪು ರಕ್ತ ಕಣದ ಪೊರೆಯಲ್ಲಿ ಸುಮಾರು ಐವತ್ತೆರಡು ಶೇಕಡಾ ಪ್ರೋಟೀನ್ ಮತ್ತು ನಲವತ್ತು ಶೇಕಡಾ ಲಿಪಿಡ್ ಇದೆ. ಪೊರೆ ಆಯ್ದ ಪಾರಗಮ್ಯ, ನಿಷ್ಕ್ರಿಯ ಮತ್ತು ಸಕ್ರಿಯ ಸಾಗಣೆ ಎರಡೂ ನಡೆಯುತ್ತವೆ. ಉತ್ತರದೊಂದಿಗೆ ಚಿತ್ರ ಬರೆಯಿರಿ.", "hi": "तरल मोज़ेक मॉडल पाँच अंक का प्रश्न है। इसे उन्नीस सौ बहत्तर में सिंगर और निकोल्सन ने दिया था। झिल्ली एक लिपिड द्विपरत है: ध्रुवीय सिर बाहर और अध्रुवीय पूँछें अंदर की ओर। यह अर्ध तरल है, यानी लिपिड और प्रोटीन बगल की ओर खिसक सकते हैं, जैसे मोज़ेक में तैरती टाइलें। परिधीय प्रोटीन सतह पर होते हैं, जबकि समाकल प्रोटीन द्विपरत में धँसे होते हैं। मनुष्य की लाल रक्त कोशिका की झिल्ली में लगभग बावन प्रतिशत प्रोटीन और चालीस प्रतिशत लिपिड होता है। झिल्ली चयनात्मक पारगम्य है, जिससे निष्क्रिय और सक्रिय दोनों परिवहन होते हैं। उत्तर के साथ चित्र बनाइए।"}, {"en": "The mitochondrion is a five-mark question, and here only the diagram is asked, so let's understand each part as we draw it. Draw an oval with two membranes, the outer membrane and the inner membrane. The inner membrane folds inwards into finger-like cristae, which increase the surface for making energy. The space between the two membranes is the intermembrane space, and the fluid inside is the matrix. Show small F zero F one particles on the cristae, because this is where ATP is made. In the matrix, draw a small circle of DNA and dots for seventy S ribosomes. Label every part and write the title below: ultrastructure of mitochondrion.", "kn": "ಮೈಟೊಕಾಂಡ್ರಿಯಾ ಐದು ಅಂಕದ ಪ್ರಶ್ನೆ, ಇಲ್ಲಿ ಚಿತ್ರ ಮಾತ್ರ ಕೇಳುತ್ತಾರೆ, ಆದ್ದರಿಂದ ಬರೆಯುತ್ತಲೇ ಪ್ರತಿ ಭಾಗವನ್ನು ಅರ್ಥಮಾಡಿಕೊಳ್ಳೋಣ. ಹೊರಪೊರೆ ಮತ್ತು ಒಳಪೊರೆ ಎಂಬ ಎರಡು ಪೊರೆಗಳಿರುವ ಅಂಡಾಕಾರ ಬರೆಯಿರಿ. ಒಳಪೊರೆ ಒಳಕ್ಕೆ ಬೆರಳಿನಂತೆ ಮಡಚಿ ಕ್ರಿಸ್ಟೇ ರೂಪಿಸುತ್ತದೆ, ಇವು ಶಕ್ತಿ ತಯಾರಿಕೆಗೆ ಮೇಲ್ಮೈ ಹೆಚ್ಚಿಸುತ್ತವೆ. ಎರಡು ಪೊರೆಗಳ ನಡುವಿನ ಜಾಗ ಅಂತರ ಪೊರೆ ಅವಕಾಶ, ಒಳಗಿನ ದ್ರವ ಮ್ಯಾಟ್ರಿಕ್ಸ್. ಕ್ರಿಸ್ಟೇ ಮೇಲೆ ಚಿಕ್ಕ ಎಫ್ ಸೊನ್ನೆ ಎಫ್ ಒಂದು ಕಣಗಳನ್ನು ತೋರಿಸಿ, ಏಕೆಂದರೆ ಎಟಿಪಿ ಇಲ್ಲೇ ತಯಾರಾಗುತ್ತದೆ. ಮ್ಯಾಟ್ರಿಕ್ಸ್‌ನಲ್ಲಿ ಡಿಎನ್‌ಎಯ ಚಿಕ್ಕ ವೃತ್ತ ಮತ್ತು ಎಪ್ಪತ್ತು ಎಸ್ ರೈಬೋಸೋಮ್‌ಗಳಿಗೆ ಚುಕ್ಕೆಗಳನ್ನು ಬರೆಯಿರಿ. ಪ್ರತಿ ಭಾಗ ಹೆಸರಿಸಿ, ಕೆಳಗೆ ಶೀರ್ಷಿಕೆ ಬರೆಯಿರಿ: ಮೈಟೊಕಾಂಡ್ರಿಯಾದ ಸೂಕ್ಷ್ಮ ರಚನೆ.", "hi": "सूत्रकणिका पाँच अंक का प्रश्न है, और यहाँ सिर्फ़ चित्र पूछा जाता है, तो बनाते बनाते हर भाग समझते हैं। दो झिल्लियों, बाहरी झिल्ली और भीतरी झिल्ली, वाला एक अंडाकार बनाइए। भीतरी झिल्ली अंदर की ओर उँगलियों जैसी मुड़कर क्रिस्टी बनाती है, जो ऊर्जा बनाने के लिए सतह बढ़ाती हैं। दोनों झिल्लियों के बीच की जगह अंतर्झिल्ली अवकाश है, और अंदर का द्रव आधात्री यानी मैट्रिक्स। क्रिस्टी पर छोटे एफ़ शून्य एफ़ एक कण दिखाइए, क्योंकि एटीपी यहीं बनता है। आधात्री में डीएनए का छोटा वृत्त और सत्तर एस राइबोसोम के लिए बिंदु बनाइए। हर भाग का नामांकन कीजिए और नीचे शीर्षक लिखिए: सूत्रकणिका की सूक्ष्म संरचना।"}, {"en": "This is a classic section six question: name the organelle where each structure is found. Cisternae belong to the Golgi apparatus. Cristae belong to the mitochondrion. Thylakoids are inside the chloroplast. The nucleolus is in the nucleus. And the tonoplast is the membrane around the vacuole. Answer by writing each letter clearly with its organelle.", "kn": "ಇದು ಆರನೇ ವಿಭಾಗದ ಸಾಮಾನ್ಯ ಪ್ರಶ್ನೆ: ಪ್ರತಿ ರಚನೆ ಯಾವ ಕಣದಂಗದಲ್ಲಿದೆ ಎಂದು ಹೆಸರಿಸಿ. ಸಿಸ್ಟರ್ನೇ ಗಾಲ್ಗಿ ಸಂಕೀರ್ಣದಲ್ಲಿ. ಕ್ರಿಸ್ಟೇ ಮೈಟೊಕಾಂಡ್ರಿಯಾದಲ್ಲಿ. ಥೈಲಕಾಯ್ಡ್‌ಗಳು ಹರಿತ್ತಿಲದೊಳಗೆ. ನ್ಯೂಕ್ಲಿಯೋಲಸ್ ಕೋಶಕೇಂದ್ರದಲ್ಲಿ. ಟೋನೋಪ್ಲಾಸ್ಟ್ ರಸದಾನಿಯ ಸುತ್ತಲಿನ ಪೊರೆ. ಪ್ರತಿ ಅಕ್ಷರದ ಎದುರು ಅದರ ಕಣದಂಗವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಬರೆಯಿರಿ.", "hi": "यह खंड छह का एक जाना पहचाना प्रश्न है: हर संरचना किस कोशिकांग में पाई जाती है। सिस्टर्नी गॉल्जी उपकरण में। क्रिस्टी सूत्रकणिका में। थाइलेकॉइड हरितलवक के अंदर। केंद्रिका केंद्रक में। और टोनोप्लास्ट रिक्तिका के चारों ओर की झिल्ली है। हर अक्षर के सामने उसका कोशिकांग साफ़ लिखिए।"}, {"en": "Chapter nine, Biomolecules, carries twelve marks. Nucleotides, proteins, polysaccharides and enzymes are the main topics.", "kn": "ಅಧ್ಯಾಯ ಒಂಬತ್ತು, ಜೈವಿಕ ಅಣುಗಳು, ಹನ್ನೆರಡು ಅಂಕಗಳದ್ದು. ನ್ಯೂಕ್ಲಿಯೋಟೈಡ್‌ಗಳು, ಪ್ರೋಟೀನ್‌ಗಳು, ಬಹುಶರ್ಕರಗಳು ಮತ್ತು ಕಿಣ್ವಗಳು ಮುಖ್ಯ ವಿಷಯಗಳು.", "hi": "अध्याय नौ, जैव अणु, बारह अंक का है। न्यूक्लियोटाइड, प्रोटीन, बहुशर्करा और एंज़ाइम मुख्य विषय हैं।"}, {"en": "Two MCQ facts. Purines are adenine and guanine. Remember the trick: pure as gold, purines are A and G. Pyrimidines are cytosine, thymine and uracil. And proteins are polymers of amino acids. Next, polysaccharides, a two-mark question. They are long chains of monosaccharides joined by glycosidic bonds. Examples are cellulose, starch, glycogen, inulin and chitin. Give the definition with two examples.", "kn": "ಎರಡು ಬಹು ಆಯ್ಕೆ ಅಂಶಗಳು. ಪ್ಯೂರಿನ್‌ಗಳು ಅಡಿನೈನ್ ಮತ್ತು ಗ್ವಾನಿನ್. ಉಪಾಯ ನೆನಪಿಡಿ: ಪ್ಯೂರ್ ಆಸ್ ಗೋಲ್ಡ್, ಪ್ಯೂರಿನ್‌ಗಳು ಎ ಮತ್ತು ಜಿ. ಪಿರಿಮಿಡಿನ್‌ಗಳು ಸೈಟೋಸಿನ್, ಥೈಮಿನ್ ಮತ್ತು ಯುರಾಸಿಲ್. ಪ್ರೋಟೀನ್‌ಗಳು ಅಮೈನೋ ಆಮ್ಲಗಳ ಬಹ್ವಣುಗಳು. ಮುಂದೆ, ಬಹುಶರ್ಕರಗಳು, ಎರಡು ಅಂಕದ ಪ್ರಶ್ನೆ. ಅವು ಗ್ಲೈಕೋಸಿಡಿಕ್ ಬಂಧಗಳಿಂದ ಜೋಡಿಸಲ್ಪಟ್ಟ ಏಕಶರ್ಕರಗಳ ಉದ್ದ ಸರಪಳಿಗಳು. ಸೆಲ್ಯುಲೋಸ್, ಪಿಷ್ಟ, ಗ್ಲೈಕೋಜೆನ್, ಇನ್ಯುಲಿನ್ ಮತ್ತು ಕೈಟಿನ್ ಉದಾಹರಣೆಗಳು. ವ್ಯಾಖ್ಯಾನವನ್ನು ಎರಡು ಉದಾಹರಣೆಗಳೊಂದಿಗೆ ಬರೆಯಿರಿ.", "hi": "दो बहुविकल्पीय तथ्य। प्यूरीन हैं एडेनिन और ग्वानिन। तरीका याद रखिए: प्योर ऐज़ गोल्ड, प्यूरीन यानी ए और जी। पिरिमिडीन हैं साइटोसिन, थाइमिन और यूरेसिल। और प्रोटीन अमीनो अम्लों के बहुलक हैं। अगला, बहुशर्करा, दो अंक का प्रश्न। ये ग्लाइकोसिडिक बंधों से जुड़े एकलशर्कराओं की लंबी श्रृंखलाएँ हैं। उदाहरण हैं सेल्यूलोज़, स्टार्च, ग्लाइकोजन, इनुलिन और काइटिन। परिभाषा दो उदाहरणों के साथ लिखिए।"}, {"en": "The structure of a nucleotide is a three-mark question. A nucleotide has three parts: a nitrogenous base, a pentose sugar and a phosphate group. When the base joins the sugar by an N-glycosidic bond at the first carbon, it forms a nucleoside. When a phosphate is added by a phosphoester bond at the fifth carbon, it becomes a nucleotide. Nucleotides are joined to each other by three prime to five prime phosphodiester bonds. Draw a small sketch to show this.", "kn": "ನ್ಯೂಕ್ಲಿಯೋಟೈಡ್‌ನ ರಚನೆ ಮೂರು ಅಂಕದ ಪ್ರಶ್ನೆ. ನ್ಯೂಕ್ಲಿಯೋಟೈಡ್‌ಗೆ ಮೂರು ಭಾಗಗಳಿವೆ: ಸಾರಜನಕ ಕ್ಷಾರ, ಪೆಂಟೋಸ್ ಸಕ್ಕರೆ ಮತ್ತು ಫಾಸ್ಫೇಟ್ ಗುಂಪು. ಕ್ಷಾರ ಸಕ್ಕರೆಯ ಮೊದಲ ಕಾರ್ಬನ್‌ಗೆ ಎನ್ ಗ್ಲೈಕೋಸಿಡಿಕ್ ಬಂಧದಿಂದ ಸೇರಿದಾಗ ನ್ಯೂಕ್ಲಿಯೋಸೈಡ್ ಆಗುತ್ತದೆ. ಐದನೇ ಕಾರ್ಬನ್‌ಗೆ ಫಾಸ್ಫೋಎಸ್ಟರ್ ಬಂಧದಿಂದ ಫಾಸ್ಫೇಟ್ ಸೇರಿದಾಗ ನ್ಯೂಕ್ಲಿಯೋಟೈಡ್ ಆಗುತ್ತದೆ. ನ್ಯೂಕ್ಲಿಯೋಟೈಡ್‌ಗಳು ಮೂರು ಪ್ರೈಮ್ ಐದು ಪ್ರೈಮ್ ಫಾಸ್ಫೋಡೈಎಸ್ಟರ್ ಬಂಧಗಳಿಂದ ಜೋಡಿಸಲ್ಪಡುತ್ತವೆ. ಇದನ್ನು ತೋರಿಸಲು ಚಿಕ್ಕ ಚಿತ್ರ ಬರೆಯಿರಿ.", "hi": "न्यूक्लियोटाइड की संरचना तीन अंक का प्रश्न है। न्यूक्लियोटाइड के तीन भाग होते हैं: नाइट्रोजनी क्षार, पेंटोस शर्करा और फ़ॉस्फ़ेट समूह। जब क्षार शर्करा के पहले कार्बन से एन ग्लाइकोसिडिक बंध से जुड़ता है, तो न्यूक्लियोसाइड बनता है। जब पाँचवें कार्बन पर फ़ॉस्फ़ोएस्टर बंध से फ़ॉस्फ़ेट जुड़ता है, तो यह न्यूक्लियोटाइड बन जाता है। न्यूक्लियोटाइड आपस में तीन प्राइम पाँच प्राइम फ़ॉस्फ़ोडाइएस्टर बंधों से जुड़ते हैं। इसे दिखाने के लिए छोटा चित्र बनाइए।"}, {"en": "Factors affecting enzyme activity, five marks. Temperature: each enzyme works best at its optimum temperature. At low temperature it becomes inactive, but that is reversible. At high temperature, it gets denatured. pH: each enzyme also has an optimum pH. Substrate concentration: the reaction speeds up as the substrate increases, and then levels off at V max. The substrate concentration at half of V max is called K m. Finally, inhibitors: for example, malonate competitively inhibits succinic dehydrogenase because it looks like the substrate. Draw a small graph for each factor. It earns marks faster than a long paragraph.", "kn": "ಕಿಣ್ವದ ಚಟುವಟಿಕೆಯ ಮೇಲೆ ಪ್ರಭಾವ ಬೀರುವ ಅಂಶಗಳು, ಐದು ಅಂಕ. ಉಷ್ಣತೆ: ಪ್ರತಿ ಕಿಣ್ವ ತನ್ನ ಸೂಕ್ತ ಉಷ್ಣತೆಯಲ್ಲಿ ಚೆನ್ನಾಗಿ ಕೆಲಸ ಮಾಡುತ್ತದೆ. ಕಡಿಮೆ ಉಷ್ಣತೆಯಲ್ಲಿ ನಿಷ್ಕ್ರಿಯವಾಗುತ್ತದೆ, ಆದರೆ ಅದು ಹಿಂತಿರುಗಿಸಬಹುದಾದದ್ದು. ಹೆಚ್ಚು ಉಷ್ಣತೆಯಲ್ಲಿ ಕಿಣ್ವ ನಾಶವಾಗುತ್ತದೆ. ಪಿಎಚ್: ಪ್ರತಿ ಕಿಣ್ವಕ್ಕೂ ಸೂಕ್ತ ಪಿಎಚ್ ಇರುತ್ತದೆ. ಆಧಾರ ವಸ್ತುವಿನ ಸಾಂದ್ರತೆ: ಸಾಂದ್ರತೆ ಹೆಚ್ಚಿದಂತೆ ವೇಗ ಹೆಚ್ಚುತ್ತದೆ, ನಂತರ ವಿ ಮ್ಯಾಕ್ಸ್‌ನಲ್ಲಿ ಸ್ಥಿರವಾಗುತ್ತದೆ. ವಿ ಮ್ಯಾಕ್ಸ್‌ನ ಅರ್ಧದಲ್ಲಿನ ಸಾಂದ್ರತೆಯನ್ನು ಕೆ ಎಮ್ ಎನ್ನುತ್ತಾರೆ. ಕೊನೆಯದಾಗಿ ಪ್ರತಿಬಂಧಕಗಳು: ಮ್ಯಾಲೋನೇಟ್ ಆಧಾರ ವಸ್ತುವಿನಂತೆ ಕಾಣುವುದರಿಂದ ಸಕ್ಸಿನಿಕ್ ಡಿಹೈಡ್ರೋಜಿನೇಸ್ ಅನ್ನು ಸ್ಪರ್ಧಾತ್ಮಕವಾಗಿ ತಡೆಯುತ್ತದೆ. ಪ್ರತಿ ಅಂಶಕ್ಕೆ ಚಿಕ್ಕ ಗ್ರಾಫ್ ಬರೆಯಿರಿ, ಉದ್ದ ಪ್ಯಾರಾಗ್ರಾಫ್‌ಗಿಂತ ಬೇಗ ಅಂಕ ತರುತ್ತದೆ.", "hi": "एंज़ाइम क्रिया को प्रभावित करने वाले कारक, पाँच अंक। तापमान: हर एंज़ाइम अपने इष्टतम तापमान पर सबसे अच्छा काम करता है। कम तापमान पर यह निष्क्रिय हो जाता है, पर यह उत्क्रमणीय है। ज़्यादा तापमान पर यह विकृत हो जाता है। पीएच: हर एंज़ाइम का एक इष्टतम पीएच होता है। क्रियाधार की सांद्रता: क्रियाधार बढ़ने पर अभिक्रिया तेज़ होती है, फिर वी मैक्स पर स्थिर हो जाती है। वी मैक्स के आधे पर क्रियाधार की सांद्रता को के एम कहते हैं। अंत में, संदमक: जैसे मैलोनेट, जो क्रियाधार जैसा दिखता है, सक्सिनिक डिहाइड्रोजिनेज़ को प्रतिस्पर्धी रूप से रोकता है। हर कारक के लिए छोटा ग्राफ़ बनाइए। यह लंबे पैराग्राफ़ से जल्दी अंक दिलाता है।"}, {"en": "The last chapter, Cell Cycle and Cell Division, carries twelve marks. Let's finish strong.", "kn": "ಕೊನೆಯ ಅಧ್ಯಾಯ, ಜೀವಕೋಶ ಚಕ್ರ ಮತ್ತು ಕೋಶ ವಿಭಜನೆ, ಹನ್ನೆರಡು ಅಂಕಗಳದ್ದು. ಚೆನ್ನಾಗಿ ಮುಗಿಸೋಣ.", "hi": "आख़िरी अध्याय, कोशिका चक्र और कोशिका विभाजन, बारह अंक का है। चलिए अच्छे से ख़त्म करते हैं।"}, {"en": "Two MCQ facts. In metaphase, the chromosomes line up at the equator, and spindle fibres attach to their kinetochores. Crossing over happens in pachytene of prophase one. To remember the five stages of prophase one, use this line: Lazy Zebras Prefer Dancing Daily, for leptotene, zygotene, pachytene, diplotene and diakinesis. Crossing over itself is a two-mark question: it is the exchange of genetic material between non-sister chromatids of homologous chromosomes, carried out by the enzyme recombinase.", "kn": "ಎರಡು ಬಹು ಆಯ್ಕೆ ಅಂಶಗಳು. ಮೆಟಾಫೇಸ್‌ನಲ್ಲಿ ವರ್ಣತಂತುಗಳು ಸಮಭಾಜಕ ರೇಖೆಯಲ್ಲಿ ಸಾಲಾಗಿ ನಿಲ್ಲುತ್ತವೆ, ತಂತುಕದ ನಾರುಗಳು ಕೈನೆಟೋಕೋರ್‌ಗಳಿಗೆ ಅಂಟಿಕೊಳ್ಳುತ್ತವೆ. ಕ್ರಾಸಿಂಗ್ ಓವರ್ ಮೊದಲ ಪ್ರೊಫೇಸ್‌ನ ಪ್ಯಾಕಿಟೀನ್ ಹಂತದಲ್ಲಿ ನಡೆಯುತ್ತದೆ. ಮೊದಲ ಪ್ರೊಫೇಸ್‌ನ ಐದು ಹಂತ ನೆನಪಿಡಲು ಈ ಸಾಲು ಬಳಸಿ: ಲೇಜ಼ಿ ಜ಼ೀಬ್ರಾಸ್ ಪ್ರಿಫರ್ ಡ್ಯಾನ್ಸಿಂಗ್ ಡೈಲಿ, ಲೆಪ್ಟೋಟೀನ್, ಜೈಗೋಟೀನ್, ಪ್ಯಾಕಿಟೀನ್, ಡಿಪ್ಲೋಟೀನ್ ಮತ್ತು ಡಯಾಕೈನೆಸಿಸ್. ಕ್ರಾಸಿಂಗ್ ಓವರ್ ಎರಡು ಅಂಕದ ಪ್ರಶ್ನೆಯೂ ಹೌದು: ಸಮರೂಪಿ ವರ್ಣತಂತುಗಳ ಸಹೋದರಿಯಲ್ಲದ ಕ್ರೊಮ್ಯಾಟಿಡ್‌ಗಳ ನಡುವೆ ಆನುವಂಶಿಕ ವಸ್ತುವಿನ ವಿನಿಮಯ, ಇದನ್ನು ರಿಕಾಂಬಿನೇಸ್ ಕಿಣ್ವ ಮಾಡುತ್ತದೆ.", "hi": "दो बहुविकल्पीय तथ्य। मेटाफ़ेज़ में गुणसूत्र मध्य रेखा पर पंक्ति में आ जाते हैं, और तर्कु तंतु उनके काइनेटोकोर से जुड़ते हैं। क्रॉसिंग ओवर पहले प्रोफ़ेज़ के पैकीटीन में होता है। पहले प्रोफ़ेज़ के पाँच चरण याद रखने के लिए यह लाइन बोलिए: लेज़ी ज़ेब्राज़ प्रेफ़र डांसिंग डेली, यानी लेप्टोटीन, ज़ाइगोटीन, पैकीटीन, डिप्लोटीन और डायकाइनेसिस। क्रॉसिंग ओवर ख़ुद दो अंक का प्रश्न है: यह समजात गुणसूत्रों के असहोदर अर्धगुणसूत्रों के बीच आनुवंशिक पदार्थ का आदान प्रदान है, जो रिकॉम्बिनेज़ एंज़ाइम से होता है।"}, {"en": "Mitosis versus meiosis, three marks. Mitosis happens in body cells, and meiosis in reproductive cells. Mitosis has one division making two cells, while meiosis has two divisions making four cells. Mitosis keeps the chromosome number the same, two n to two n, while meiosis halves it, two n to n. And meiosis has crossing over, which makes the daughter cells genetically different. Three matching points in a table.", "kn": "ಸಮಸೂತ್ರ ವಿಭಜನೆ ಮತ್ತು ಅರ್ಧಸೂತ್ರ ವಿಭಜನೆಯ ವ್ಯತ್ಯಾಸ, ಮೂರು ಅಂಕ. ಮೈಟೋಸಿಸ್ ದೇಹ ಕೋಶಗಳಲ್ಲಿ, ಮಿಯಾಸಿಸ್ ಸಂತಾನೋತ್ಪತ್ತಿ ಕೋಶಗಳಲ್ಲಿ ನಡೆಯುತ್ತದೆ. ಮೈಟೋಸಿಸ್‌ನಲ್ಲಿ ಒಂದು ವಿಭಜನೆ, ಎರಡು ಕೋಶಗಳು. ಮಿಯಾಸಿಸ್‌ನಲ್ಲಿ ಎರಡು ವಿಭಜನೆ, ನಾಲ್ಕು ಕೋಶಗಳು. ಮೈಟೋಸಿಸ್ ವರ್ಣತಂತು ಸಂಖ್ಯೆಯನ್ನು ಹಾಗೆಯೇ ಇಡುತ್ತದೆ, ಟು ಎನ್‌ನಿಂದ ಟು ಎನ್. ಮಿಯಾಸಿಸ್ ಅದನ್ನು ಅರ್ಧ ಮಾಡುತ್ತದೆ, ಟು ಎನ್‌ನಿಂದ ಎನ್. ಮಿಯಾಸಿಸ್‌ನಲ್ಲಿ ಕ್ರಾಸಿಂಗ್ ಓವರ್ ಇರುವುದರಿಂದ ಮರಿ ಕೋಶಗಳು ಆನುವಂಶಿಕವಾಗಿ ಬೇರೆಯಾಗಿರುತ್ತವೆ. ಕೋಷ್ಟಕದಲ್ಲಿ ಮೂರು ಹೊಂದುವ ಅಂಶ ಬರೆಯಿರಿ.", "hi": "समसूत्री और अर्धसूत्री विभाजन का अंतर, तीन अंक। समसूत्री विभाजन शरीर की कोशिकाओं में, और अर्धसूत्री विभाजन जनन कोशिकाओं में होता है। समसूत्री में एक विभाजन से दो कोशिकाएँ बनती हैं, जबकि अर्धसूत्री में दो विभाजनों से चार कोशिकाएँ। समसूत्री गुणसूत्र संख्या वही रखता है, टू एन से टू एन, जबकि अर्धसूत्री उसे आधा कर देता है, टू एन से एन। और अर्धसूत्री में क्रॉसिंग ओवर होता है, जिससे संतति कोशिकाएँ आनुवंशिक रूप से अलग होती हैं। तालिका में तीन मिलते हुए बिंदु।"}, {"en": "The phases of the cell cycle, five marks. In G one, the cell grows, but its DNA does not replicate. In the S phase, DNA replicates, so the DNA content doubles from two C to four C. In G two, proteins are made for mitosis. Then comes the M phase, with karyokinesis, which is prophase, metaphase, anaphase and telophase, followed by cytokinesis. Some cells leave the cycle from G one and enter a resting stage called G zero. Always draw the cell cycle wheel with this answer.", "kn": "ಜೀವಕೋಶ ಚಕ್ರದ ಹಂತಗಳು, ಐದು ಅಂಕ. ಜಿ ಒಂದು ಹಂತದಲ್ಲಿ ಕೋಶ ಬೆಳೆಯುತ್ತದೆ, ಆದರೆ ಡಿಎನ್‌ಎ ದ್ವಿಗುಣಗೊಳ್ಳುವುದಿಲ್ಲ. ಎಸ್ ಹಂತದಲ್ಲಿ ಡಿಎನ್‌ಎ ದ್ವಿಗುಣಗೊಳ್ಳುತ್ತದೆ, ಡಿಎನ್‌ಎ ಪ್ರಮಾಣ ಟು ಸಿ ಇಂದ ಫೋರ್ ಸಿ ಆಗುತ್ತದೆ. ಜಿ ಎರಡು ಹಂತದಲ್ಲಿ ವಿಭಜನೆಗೆ ಬೇಕಾದ ಪ್ರೋಟೀನ್‌ಗಳು ತಯಾರಾಗುತ್ತವೆ. ನಂತರ ಎಮ್ ಹಂತ, ಇದರಲ್ಲಿ ಕೇಂದ್ರ ವಿಭಜನೆ, ಅಂದರೆ ಪ್ರೊಫೇಸ್, ಮೆಟಾಫೇಸ್, ಅನಾಫೇಸ್ ಮತ್ತು ಟೆಲೋಫೇಸ್, ನಂತರ ಕೋಶದ್ರವ್ಯ ವಿಭಜನೆ. ಕೆಲವು ಕೋಶಗಳು ಜಿ ಒಂದರಿಂದ ಹೊರಬಂದು ಜಿ ಸೊನ್ನೆ ಎಂಬ ವಿಶ್ರಾಂತ ಹಂತಕ್ಕೆ ಹೋಗುತ್ತವೆ. ಈ ಉತ್ತರದೊಂದಿಗೆ ಯಾವಾಗಲೂ ಜೀವಕೋಶ ಚಕ್ರದ ಚಿತ್ರ ಬರೆಯಿರಿ.", "hi": "कोशिका चक्र की अवस्थाएँ, पाँच अंक। जी एक में कोशिका बढ़ती है, पर डीएनए की प्रतिकृति नहीं होती। एस अवस्था में डीएनए की प्रतिकृति होती है, तो डीएनए की मात्रा टू सी से फ़ोर सी हो जाती है। जी दो में विभाजन के लिए प्रोटीन बनते हैं। फिर आती है एम अवस्था, जिसमें केंद्रक विभाजन, यानी प्रोफ़ेज़, मेटाफ़ेज़, एनाफ़ेज़ और टीलोफ़ेज़, और फिर कोशिकाद्रव्य विभाजन होता है। कुछ कोशिकाएँ जी एक से निकलकर जी शून्य नामक विश्राम अवस्था में चली जाती हैं। इस उत्तर के साथ हमेशा कोशिका चक्र का चित्र बनाइए।"}, {"en": "Practise the cell cycle diagram. Draw a circle, divide it into interphase with G one, S and G two, and a small M phase, then show G zero branching off from G one. Add arrows to show the direction. Simple, neat and fully labelled.", "kn": "ಜೀವಕೋಶ ಚಕ್ರದ ಚಿತ್ರ ಅಭ್ಯಾಸ ಮಾಡಿ. ಒಂದು ವೃತ್ತ ಬರೆದು, ಅದನ್ನು ಜಿ ಒಂದು, ಎಸ್ ಮತ್ತು ಜಿ ಎರಡು ಇರುವ ಅಂತರಾವಸ್ಥೆ ಮತ್ತು ಚಿಕ್ಕ ಎಮ್ ಹಂತವಾಗಿ ವಿಭಾಗಿಸಿ, ಜಿ ಒಂದರಿಂದ ಕವಲೊಡೆಯುವ ಜಿ ಸೊನ್ನೆಯನ್ನು ತೋರಿಸಿ. ದಿಕ್ಕು ತೋರಿಸಲು ಬಾಣದ ಗುರುತುಗಳನ್ನು ಹಾಕಿ. ಸರಳ, ಅಚ್ಚುಕಟ್ಟು, ಪೂರ್ಣವಾಗಿ ಹೆಸರಿಸಿದ ಚಿತ್ರ.", "hi": "कोशिका चक्र का चित्र अभ्यास कीजिए। एक वृत्त बनाइए, उसे जी एक, एस और जी दो वाली अंतरावस्था और छोटी एम अवस्था में बाँटिए, फिर जी एक से निकलती जी शून्य दिखाइए। दिशा दिखाने के लिए तीर लगाइए। सरल, साफ़ और पूरा नामांकित।"}, {"en": "These are the four diagrams you must master: the plant cell, the mitochondrion, the cell cycle, and the digestive system of the frog. Practise each one at least three times, until you can draw it neatly in about three minutes.", "kn": "ನೀವು ಕರಗತ ಮಾಡಿಕೊಳ್ಳಬೇಕಾದ ನಾಲ್ಕು ಚಿತ್ರಗಳು ಇವು: ಸಸ್ಯ ಕೋಶ, ಮೈಟೊಕಾಂಡ್ರಿಯಾ, ಜೀವಕೋಶ ಚಕ್ರ ಮತ್ತು ಕಪ್ಪೆಯ ಜೀರ್ಣಾಂಗ ವ್ಯವಸ್ಥೆ. ಪ್ರತಿಯೊಂದನ್ನು ಕನಿಷ್ಠ ಮೂರು ಬಾರಿ, ಸುಮಾರು ಮೂರು ನಿಮಿಷದಲ್ಲಿ ಅಚ್ಚುಕಟ್ಟಾಗಿ ಬರೆಯುವವರೆಗೆ ಅಭ್ಯಾಸ ಮಾಡಿ.", "hi": "ये चार चित्र आपको पक्के करने हैं: पादप कोशिका, सूत्रकणिका, कोशिका चक्र और मेंढक का पाचन तंत्र। हर एक का कम से कम तीन बार अभ्यास कीजिए, जब तक आप उसे लगभग तीन मिनट में साफ़ न बना सकें।"}, {"en": "Here are Narendra Sir's tips for studying. Read a topic, close the book, and write it from memory. This is the best way to check yourself. Practise every diagram at least three times. Learn examples and scientific names along with each topic. Revise all differences as tables. And use the BAIO Learning System app every day for MCQs and flashcards.", "kn": "ಓದುವುದಕ್ಕೆ ನರೇಂದ್ರ ಸರ್ ಅವರ ಸಲಹೆಗಳು ಇಲ್ಲಿವೆ. ಒಂದು ವಿಷಯ ಓದಿ, ಪುಸ್ತಕ ಮುಚ್ಚಿ, ನೆನಪಿನಿಂದ ಬರೆಯಿರಿ. ನಿಮ್ಮನ್ನು ಪರೀಕ್ಷಿಸಿಕೊಳ್ಳಲು ಇದೇ ಉತ್ತಮ ದಾರಿ. ಪ್ರತಿ ಚಿತ್ರವನ್ನು ಕನಿಷ್ಠ ಮೂರು ಬಾರಿ ಅಭ್ಯಾಸ ಮಾಡಿ. ಪ್ರತಿ ವಿಷಯದೊಂದಿಗೆ ಉದಾಹರಣೆ ಮತ್ತು ವೈಜ್ಞಾನಿಕ ಹೆಸರುಗಳನ್ನು ಕಲಿಯಿರಿ. ಎಲ್ಲಾ ವ್ಯತ್ಯಾಸಗಳನ್ನು ಕೋಷ್ಟಕವಾಗಿ ಪುನರಾವರ್ತಿಸಿ. ಬಹು ಆಯ್ಕೆ ಪ್ರಶ್ನೆ ಮತ್ತು ಫ್ಲ್ಯಾಶ್‌ಕಾರ್ಡ್‌ಗಳಿಗಾಗಿ ಪ್ರತಿದಿನ ಬಿಎಐಒ ಲರ್ನಿಂಗ್ ಸಿಸ್ಟಮ್ ಆ್ಯಪ್ ಬಳಸಿ.", "hi": "पढ़ाई के लिए नरेंद्र सर के सुझाव। एक विषय पढ़िए, किताब बंद कीजिए, और याद से लिखिए। ख़ुद को जाँचने का यही सबसे अच्छा तरीका है। हर चित्र का कम से कम तीन बार अभ्यास कीजिए। हर विषय के साथ उदाहरण और वैज्ञानिक नाम सीखिए। सारे अंतर तालिका के रूप में दोहराइए। और बहुविकल्पीय प्रश्नों और फ़्लैशकार्ड के लिए रोज़ बी ए आई ओ लर्निंग सिस्टम ऐप इस्तेमाल कीजिए।"}, {"en": "And in the exam hall: first read the whole paper and plan which questions you will attempt. In Part A, only your first answer is counted, so don't overwrite. Match your answer to the marks: two marks need about two points, five marks need two hundred to two hundred and fifty words. Write in points, underline key words and give examples. Never leave a diagram unlabelled. And keep the last ten minutes to check everything.", "kn": "ಪರೀಕ್ಷಾ ಕೊಠಡಿಯಲ್ಲಿ: ಮೊದಲು ಇಡೀ ಪತ್ರಿಕೆ ಓದಿ, ಯಾವ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸುವಿರಿ ಎಂದು ಯೋಜಿಸಿ. ಭಾಗ ಎ ಯಲ್ಲಿ ನಿಮ್ಮ ಮೊದಲ ಉತ್ತರ ಮಾತ್ರ ಪರಿಗಣಿಸಲಾಗುತ್ತದೆ, ತಿದ್ದಿ ಬರೆಯಬೇಡಿ. ಅಂಕಕ್ಕೆ ತಕ್ಕಂತೆ ಬರೆಯಿರಿ: ಎರಡು ಅಂಕಕ್ಕೆ ಸುಮಾರು ಎರಡು ಅಂಶ, ಐದು ಅಂಕಕ್ಕೆ ಇನ್ನೂರರಿಂದ ಇನ್ನೂರ ಐವತ್ತು ಪದ. ಅಂಶವಾರು ಬರೆಯಿರಿ, ಮುಖ್ಯ ಪದಗಳಿಗೆ ಅಡಿಗೆರೆ ಹಾಕಿ, ಉದಾಹರಣೆ ಕೊಡಿ. ಚಿತ್ರವನ್ನು ಎಂದಿಗೂ ಹೆಸರಿಸದೆ ಬಿಡಬೇಡಿ. ಕೊನೆಯ ಹತ್ತು ನಿಮಿಷ ಎಲ್ಲವನ್ನೂ ಪರಿಶೀಲಿಸಲು ಇಟ್ಟುಕೊಳ್ಳಿ.", "hi": "और परीक्षा हॉल में: पहले पूरा प्रश्नपत्र पढ़िए और तय कीजिए कि कौन से प्रश्न करेंगे। भाग ए में सिर्फ़ आपका पहला उत्तर गिना जाता है, इसलिए काटकर दोबारा मत लिखिए। उत्तर अंकों के हिसाब से लिखिए: दो अंक के लिए लगभग दो बिंदु, पाँच अंक के लिए दो सौ से ढाई सौ शब्द। बिंदुओं में लिखिए, मुख्य शब्दों को रेखांकित कीजिए और उदाहरण दीजिए। चित्र को कभी बिना नामांकन के मत छोड़िए। और आख़िरी दस मिनट सब कुछ जाँचने के लिए रखिए।"}, {"en": "That's the end of our session. You now know what to study, how many marks each topic carries and how to write your answers. Revise regularly, practise your diagrams and stay confident. I am Narendra Sir's BAIO AI assistant, and on behalf of Narendra Sir, all the very best for your mid-term exam!", "kn": "ಇಲ್ಲಿಗೆ ನಮ್ಮ ಅವಧಿ ಮುಗಿಯಿತು. ಏನು ಓದಬೇಕು, ಪ್ರತಿ ವಿಷಯಕ್ಕೆ ಎಷ್ಟು ಅಂಕ, ಮತ್ತು ಉತ್ತರ ಹೇಗೆ ಬರೆಯಬೇಕು ಎಂದು ಈಗ ನಿಮಗೆ ತಿಳಿದಿದೆ. ನಿಯಮಿತವಾಗಿ ಪುನರಾವರ್ತಿಸಿ, ಚಿತ್ರಗಳನ್ನು ಅಭ್ಯಾಸ ಮಾಡಿ, ಆತ್ಮವಿಶ್ವಾಸದಿಂದಿರಿ. ನಾನು ನರೇಂದ್ರ ಸರ್ ಅವರ ಬಿಎಐಒ ಎಐ ಸಹಾಯಕ, ನರೇಂದ್ರ ಸರ್ ಅವರ ಪರವಾಗಿ ನಿಮ್ಮ ಮಧ್ಯಾವಧಿ ಪರೀಕ್ಷೆಗೆ ಶುಭಾಶಯಗಳು!", "hi": "यहीं हमारा सत्र समाप्त होता है। अब आप जानते हैं कि क्या पढ़ना है, हर विषय के कितने अंक हैं, और उत्तर कैसे लिखने हैं। नियमित दोहराइए, चित्रों का अभ्यास कीजिए और आत्मविश्वास रखिए। मैं नरेंद्र सर का बी ए आई ओ ए आई सहायक हूँ, और नरेंद्र सर की ओर से आपको मध्यावधि परीक्षा के लिए ढेर सारी शुभकामनाएँ!"}];

function insets(){ const cs=getComputedStyle(document.documentElement); const v=k=>parseFloat(cs.getPropertyValue(k))||0; return {t:v('--sat'),l:v('--sal'),r:v('--sar'),b:v('--sab')}; }
function fit(){
  const cw=stage.clientWidth, ch=stage.clientHeight, fsOn=isFs(), rot=fsOn&&ch>cw, ins=insets();
  /* full-screen buttons: size them so all four fit along the short edge */
  const room = rot ? cw : ch, gapPx = Math.max(6, Math.min(12, room * 0.025));

  stage.style.setProperty('--fsb', btnPx + 'px'); stage.style.setProperty('--fsg', gapPx + 'px');
  /* keep a strip for the buttons (clear of the iPhone notch) so they never cover the slide */
  const notch = rot ? ins.t : Math.max(ins.l, 0);
  const bar = fsOn ? btnPx + 24 + notch : 0;
  stage.style.setProperty('--fsoff', (notch + 12) + 'px');
  let sc, cx, cy;
  if(rot){ const ah=ch-bar; sc=Math.min(ah/1280,cw/720); cx=cw/2; cy=bar+ah/2; }
  else if(fsOn){ const aw=cw-bar-ins.r; sc=Math.min(aw/1280,ch/720); cx=bar+aw/2; cy=ch/2; }

let seqT=null, seqQ=null, seqI=0, seqT0=0, seqDur=0;
function clearHl(){ clearInterval(seqT); seqQ=null; ptr.classList.remove('on'); }

  const b=(BOXES[cur]||[])[t]; if(!b){ ptr.classList.remove('on'); return; }
  const [x,y,w,h]=b, hx=Math.max(x,70), small=w<140&&h<44;

function show(i, restartAnim){
  cur=Math.max(0,Math.min(SLIDES.length-1,i)); loadAround(cur);
  secs.forEach((s,k)=>{ s.classList.toggle('on',k===cur); });
  const s=secs[cur];

  document.querySelectorAll('#prog button').forEach((b,k)=>b.classList.toggle('on',k<=cur));

/* ---------- voice ---------- */
const TTS='speechSynthesis' in window?window.speechSynthesis:null;
const TAG={en:'en-IN',kn:'kn-IN',hi:'hi-IN'};
function voicesFor(l){ return TTS?TTS.getVoices().filter(v=>(v.lang||'').replace('_','-').toLowerCase().startsWith(l)):[]; }
function pickVoice(l){ const vs=voicesFor(l), saved=store.get('baio_mt_voice_'+l); return (saved&&vs.find(v=>v.voiceURI===saved))||vs.find(v=>v.lang===TAG[l])||vs[0]||null; }
function fillVoices(){
  const vs=voicesFor(lang), v=pickVoice(lang);
  voiceSel.innerHTML = vs.length ? vs.map(x=>`<option value="${x.voiceURI}" ${v&&x.voiceURI===v.voiceURI?'selected':''}>${x.name}</option>`).join('') : `<option value="">No ${lang==='kn'?'Kannada':lang==='hi'?'Hindi':'English'} voice on this device</option>`;
}

const keep=[];
/* time until this slide's entrance animation has finished */

function explain(){

     otherwise by where the sentence sits in the whole text */
  const en=sentences(NARR[cur].en);
  const bounds=ps=>{ const tot=ps.reduce((a,p)=>a+p.length,0)||1; const b=[]; let acc=0; ps.forEach(p=>{ b.push([acc/tot,(acc+p.length)/tot]); acc+=p.length; }); return b; };

  const part=()=>{
    if(id!==runId) return; if(i>=parts.length){ next(); return; }
    const k=i, t=parts[i++];
    /* caption + highlight appear the moment the voice actually starts this sentence */
    let shown=false; const reveal=()=>{ if(shown||id!==runId) return; shown=true; setCap(t); highlight(enIdx[k], est); };
    const est=t.length*70/rate, t0=Date.now();

document.getElementById('fs').onclick=()=>{ if(window.top!==window && !(document.fullscreenEnabled||document.webkitFullscreenEnabled)){ window.top.location.href=location.href.split('#')[0]+'#fs'; return; } stage.classList.add('fs'); document.body.classList.add('fsmode'); try{ const r=(stage.requestFullscreen||stage.webkitRequestFullscreen||function(){}).call(stage); if(r&&r.catch) r.catch(()=>{}); }catch(e){} try{ screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} setTimeout(fit,250); };
document.getElementById('fsExit').onclick=()=>{ if(document.fullscreenElement||document.webkitFullscreenElement) (document.exitFullscreen||document.webkitExitFullscreen).call(document); stage.classList.remove('fs'); document.body.classList.remove('fsmode'); setTimeout(fit,250); };
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement){ stage.classList.remove('fs'); document.body.classList.remove('fsmode'); } setTimeout(fit,150); });
window.addEventListener('resize',fit); window.addEventListener('orientationchange',()=>setTimeout(fit,300));
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&playing) stop(); });

setLang(lang);
const saved=parseInt(store.get('baio_pt_slide'),10); show(isNaN(saved)?0:saved); fit();
if(location.hash==='#fs'){ stage.classList.add('fs'); document.body.classList.add('fsmode'); setTimeout(fit,100); }
if(window.top!==window){ document.getElementById('backBtn').style.display='none'; document.getElementById('shareBtn').style.display='none'; document.body.style.background='transparent'; }
if(!TTS) document.getElementById('hint').textContent='This browser has no speech voice — captions will play by themselves when you tap Explain.';

/* Share — native share sheet on phones; WhatsApp / Telegram / copy link otherwise */
(function(){
  var URL_='https://narendra-bio-sir.github.io/BAIO-Learning-System-By-Narendra-Sir/exam-corner/pu1-midterm-2026-practice-talk.html';
  var MSG={
    en:"🎧 I PUC Biology mid-term chapter-wise practice — every slide explained by Narendra Sir's BAIO AI assistant: key facts for MCQs, marks for each topic and exam tips (English · ಕನ್ನಡ · हिंदी).",
    kn:"🎧 ಪ್ರಥಮ ಪಿಯುಸಿ ಜೀವಶಾಸ್ತ್ರ ಮಧ್ಯಾವಧಿ ಅಧ್ಯಾಯವಾರು ಅಭ್ಯಾಸ — ನರೇಂದ್ರ ಸರ್ ಅವರ ಬಿಎಐಒ ಎಐ ಸಹಾಯಕ ಪ್ರತಿ ಸ್ಲೈಡ್ ವಿವರಿಸುತ್ತದೆ (English · ಕನ್ನಡ · हिंदी).",
    hi:"🎧 प्रथम पीयूसी जीव विज्ञान मध्यावधि अध्यायवार अभ्यास — नरेंद्र सर का बी ए आई ओ ए आई सहायक हर स्लाइड समझाता है (English · ಕನ್ನಡ · हिंदी)."
  };
  var LBL={en:['Share','Copy link','Link copied ✓'],kn:['ಹಂಚಿಕೊಳ್ಳಿ','ಲಿಂಕ್ ನಕಲಿಸಿ','ಲಿಂಕ್ ನಕಲಾಯಿತು ✓'],hi:['शेयर करें','लिंक कॉपी करें','लिंक कॉपी हो गया ✓']};
  function lang(){ var l='en'; try{ l=localStorage.getItem('baio_mt_lang')||document.documentElement.lang||'en'; }catch(e){} return MSG[l]?l:'en'; }
  var sheet=document.createElement('div'); sheet.className='share-sheet'; sheet.hidden=true;
  sheet.innerHTML='<div class="share-box" role="dialog" aria-modal="true" aria-labelledby="shareTtl"><b id="shareTtl"></b>'+
    '<a class="share-opt wa" target="_blank" rel="noopener">🟢 WhatsApp</a><a class="share-opt tg" target="_blank" rel="noopener">✈️ Telegram</a>'+
    '<button class="share-opt cp" type="button"></button><input class="share-url" readonly aria-label="Link"><button class="share-x" type="button" aria-label="Close">✕</button></div>';
  document.body.appendChild(sheet);
  function close(){ sheet.hidden=true; }
  sheet.addEventListener('click',function(e){ if(e.target===sheet||e.target.closest('.share-x')) close(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
  sheet.querySelector('.cp').addEventListener('click',function(){
    var b=this, inp=sheet.querySelector('.share-url'), l=lang();
    function done(){ b.textContent=LBL[l][2]; setTimeout(function(){ b.textContent='🔗 '+LBL[l][1]; },1800); }
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(URL_).then(done,function(){ inp.select(); document.execCommand('copy'); done(); });
    else { inp.select(); document.execCommand('copy'); done(); }
  });
  window.sharePresentation=function(){
    var l=lang(), text=MSG[l];
    if(navigator.share){ navigator.share({title:'BAIO · Mid-Term 2026 · Chapter-wise practice',text:text,url:URL_}).catch(function(){}); return; }
    sheet.querySelector('#shareTtl').textContent=LBL[l][0];
    sheet.querySelector('.wa').href='https://wa.me/?text='+encodeURIComponent(text+'\n'+URL_);
    sheet.querySelector('.tg').href='https://t.me/share/url?url='+encodeURIComponent(URL_)+'&text='+encodeURIComponent(text);
    sheet.querySelector('.cp').textContent='🔗 '+LBL[l][1];
    sheet.querySelector('.share-url').value=URL_;
    sheet.hidden=false; sheet.querySelector('.wa').focus();
  };
  document.querySelectorAll('[data-share]').forEach(function(b){ b.addEventListener('click',window.sharePresentation); });
})();

/* light / dark theme — shared with the Exam Corner page through localStorage "baio_theme" */
(function(){
  var KEY='baio_theme', btn=document.getElementById('themeBtn');
  function apply(t){ var dark=t==='dark'; document.documentElement.classList.toggle('dk',dark); if(btn){ btn.textContent=dark?'☀️':'🌙'; btn.title=dark?'Light theme':'Dark theme'; } }
  var cur='light'; try{ cur=localStorage.getItem(KEY)||'light'; }catch(e){}
  apply(cur);
  if(btn) btn.addEventListener('click',function(){ var next=document.documentElement.classList.contains('dk')?'light':'dark'; apply(next); try{ localStorage.setItem(KEY,next); }catch(e){} try{ if(window.parent!==window) window.parent.postMessage({baioTheme:next},'*'); }catch(e){} });
  window.addEventListener('storage',function(e){ if(e.key===KEY) apply(e.newValue||'light'); });
})();
</script>
