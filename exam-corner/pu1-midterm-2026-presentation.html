<style>
:root{--navy:#0c1830;--ink:#1f2a40;--muted:#556074;--teal:#0b8f80;--tealSoft:#e8f3f1;--gold:#c99a1e;--goldSoft:#fbf1d5;--line:#d9e2e1;--page:#eef2f4;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:Inter,'Noto Sans Kannada','Noto Sans Devanagari',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:1280px;margin:0 auto;padding:14px 16px 24px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .b{width:38px;height:38px;border-radius:10px;background:var(--navy);color:#e8c25a;font:700 20px 'Space Grotesk',sans-serif;display:grid;place-items:center}
.brand b{font:700 15px 'Space Grotesk',sans-serif;color:var(--navy);display:block}
.brand span{font:600 11px Inter;letter-spacing:.12em;color:var(--teal);text-transform:uppercase}
.langs{display:flex;gap:6px}
.btn{font:600 14px Inter,'Noto Sans Kannada','Noto Sans Devanagari',sans-serif;border:1.5px solid var(--line);background:#fff;color:var(--navy);padding:9px 14px;border-radius:999px;cursor:pointer;min-height:40px}
.btn[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn:focus-visible{outline:3px solid #e8c25a;outline-offset:2px}

/* stage */
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 6px 30px rgba(12,24,48,.12)}
.slide{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
.s{position:absolute;inset:0;padding:42px 58px 0;background:#fff;opacity:0;visibility:hidden;transition:opacity .45s}
.s.on{opacity:1;visibility:visible}
.s.dark{background:var(--navy);color:#fff}
.s h2{font:700 36px/1.1 'Space Grotesk',sans-serif;color:var(--navy);letter-spacing:-.01em}
.foot{position:absolute;left:58px;right:58px;bottom:18px;display:flex;justify-content:space-between;font:500 12px Inter;color:var(--muted)}
.dark .foot{display:none}
/* entrance animation, staggered */
.s.on .a{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.a{opacity:0}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.s.on .a{animation:none;opacity:1}}
/* explain highlight */
.hl{box-shadow:0 0 0 4px rgba(201,154,30,.85),0 10px 28px rgba(12,24,48,.18)!important;transform:translateY(-3px)!important;transition:box-shadow .3s,transform .3s}

/* shared bits */
.card{border-radius:16px;background:var(--tealSoft);transition:box-shadow .3s,transform .3s}
.card.gold{background:var(--goldSoft)}
.label{font:700 13px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.gold .label,.label.g{color:#a57c10}
.big{font:700 76px/1 'Space Grotesk',sans-serif;color:var(--navy)}
.ic{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:32px}

/* title slide */
.t-kick{position:absolute;left:72px;top:150px;font:700 16px Inter;letter-spacing:.2em;color:#e8c25a}
.t-h{position:absolute;left:72px;top:190px;width:760px;font:700 60px/1.06 'Space Grotesk',sans-serif;color:#fff}
.t-h em{font-style:normal;color:#5fd3c4}
.t-sub{position:absolute;left:72px;top:360px;width:700px;font:500 20px/1.45 Inter;color:#c9d3e3}
.t-by{position:absolute;left:72px;top:520px;font:500 15px/1.6 Inter;color:#c9d3e3}
.t-by b{color:#fff;font-size:17px}
.emblem{position:absolute;right:110px;top:150px;width:300px;height:300px;border-radius:50%;background:#16264a;border:3px solid #c99a1e;display:grid;place-items:center;font-size:130px}
.t-lang{position:absolute;right:70px;top:480px;width:380px;text-align:center;font:600 15px Inter;color:#e8c25a}

/* pattern */
.parts{position:absolute;left:58px;right:58px;top:120px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.part{padding:24px;height:330px}
.part .big{margin-top:12px}
.part .u{font:500 15px Inter;color:var(--muted);margin-top:6px}
.part .d{margin-top:26px;font:700 17px/1.3 Inter;color:var(--navy)}
.part .d2{margin-top:6px;font:500 15px/1.35 Inter;color:var(--muted)}
.band{position:absolute;left:58px;right:58px;top:480px;height:100px;border-radius:16px;background:var(--navy);display:flex;align-items:center;padding:0 30px;gap:18px;color:#dce4f0;font:500 18px Inter}
.band b{font:700 30px 'Space Grotesk',sans-serif;color:#fff;white-space:nowrap}

/* chart */
.chart{position:absolute;left:58px;top:118px;width:720px}
.chart .ccap{font:600 14px Inter;color:var(--muted);margin-bottom:12px}
.row{display:grid;grid-template-columns:200px 1fr;align-items:center;gap:14px;margin:9px 0}
.row{border-radius:10px;padding:2px 6px;transition:box-shadow .3s,transform .3s}
.row span{font:600 15px Inter;color:var(--navy);text-align:right}
.bar{height:34px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:flex-end;padding-right:10px;color:#fff;font:700 15px Inter;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.row.top .bar{background:#c99a1e}
.focus{position:absolute;right:58px;top:120px;width:380px;padding:28px}
.focus .big{font-size:96px}
.focus p{font:500 18px/1.4 Inter;color:var(--navy);margin-top:10px}
.tipc{position:absolute;right:58px;top:430px;width:380px;padding:24px;display:flex;gap:14px;font:500 17px/1.4 Inter;color:var(--navy)}

/* chapter slides */
.chp{position:absolute;left:58px;top:112px;width:300px;height:478px;padding:26px}
.chp .tag{margin-top:22px;font:700 16px Inter;color:var(--teal)}
.chp.gold .tag{color:#a57c10}
.chp .big{font-size:104px;margin-top:10px}
.chp .ml{font:500 16px Inter;color:var(--muted);margin-top:6px}
.chp .mn{font:italic 500 13px Inter;color:var(--muted);margin-top:4px}
.topics{position:absolute;left:390px;right:58px;top:116px}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.chip{font:700 21px Inter;color:var(--navy);background:#f4f8f8;border:1.5px solid var(--line);padding:15px 24px;border-radius:999px;transition:box-shadow .3s,transform .3s,background .3s}
.gold .chip,.chips.gold .chip{background:#fff8e6;border-color:#e6cf8a}
.tip{position:absolute;left:390px;right:58px;top:450px;height:140px;border-radius:16px;background:var(--navy);padding:26px 30px 0 92px;color:#fff;font:500 18px/1.45 Inter;transition:box-shadow .3s,transform .3s}
.tip:before{content:"💡";position:absolute;left:30px;top:24px;font-size:34px}
.tip b{display:block;color:#f2d27a;margin-bottom:6px}

/* diagrams */
.diags{position:absolute;left:58px;right:58px;top:118px;display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.diag{height:220px;padding:26px 14px;text-align:center}
.diag .ic{margin:0 auto}
.diag b{display:block;margin-top:18px;font:700 18px Inter;color:var(--navy)}
.diag small{display:block;margin-top:6px;font:600 14px Inter;color:var(--teal)}
.rules{position:absolute;left:58px;right:58px;top:380px;display:grid;grid-template-columns:1fr 1fr;gap:26px 40px}
.rule{display:flex;gap:16px;align-items:flex-start;border-radius:14px;padding:6px}
.num{flex:none;width:46px;height:46px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font:700 20px Inter}
.rule b{font:700 18px Inter;color:var(--navy);display:block}
.rule span{font:500 16px/1.4 Inter;color:var(--muted)}

/* tips */
.tp{position:absolute;left:58px;top:112px;width:290px;height:478px;padding:28px}
.tp .big{font-size:96px;margin-top:14px}
.tp p{font:500 16px/1.45 Inter;color:var(--muted);margin-top:14px}
.tlist{position:absolute;left:390px;right:58px;top:118px;display:grid;gap:16px}
.ti{display:flex;gap:18px;align-items:flex-start;padding:14px 16px;border-radius:14px;transition:box-shadow .3s,transform .3s,background .3s}
.ti .ic{width:58px;height:58px;font-size:26px;background:var(--teal);color:#fff;flex:none}
.goldset .ti .ic{background:#c99a1e}
.ti b{display:block;font:700 21px Inter;color:var(--navy)}
.ti span{font:500 17px/1.4 Inter;color:var(--muted)}

/* steps */
.steps{position:absolute;left:58px;right:58px;top:140px;display:grid;grid-template-columns:repeat(5,1fr);gap:26px}
.step{height:360px;padding:30px 18px;text-align:center;position:relative}
.step .num{margin:0 auto;width:62px;height:62px;font-size:26px}
.step.gold .num{background:#c99a1e}
.step b{display:block;margin-top:24px;font:700 20px/1.25 Inter;color:var(--navy)}
.step span{display:block;margin-top:12px;font:500 16px/1.4 Inter;color:var(--muted)}
.step:not(:last-child):after{content:"➜";position:absolute;right:-22px;top:150px;color:#9fbab6;font-size:18px}
.hallnote{position:absolute;left:58px;top:530px;font:500 17px Inter;color:var(--muted)}

/* days */
.days{position:absolute;left:58px;right:58px;top:118px;display:grid;grid-template-columns:repeat(7,1fr);gap:14px}
.day{height:470px;padding:24px 12px;text-align:center}
.day.dk{background:var(--navy)}
.day .label{font-size:12px}
.day .big{font-size:60px;margin-top:8px}
.day b{display:block;margin-top:22px;font:700 17px/1.3 Inter;color:var(--navy)}
.day span{display:block;margin-top:16px;font:500 15px/1.4 Inter;color:var(--muted)}
.day.dk .label{color:#f2d27a}.day.dk .big,.day.dk b{color:#fff}.day.dk span{color:#dce4f0}

/* close */
.c-h{position:absolute;left:72px;top:190px;font:700 58px 'Space Grotesk',sans-serif;color:#fff}
.c-l{position:absolute;left:72px;top:300px;display:grid;gap:22px}
.c-l div{display:flex;align-items:center;gap:16px;font:500 24px Inter;color:#fff;border-radius:12px;padding:4px 8px;transition:box-shadow .3s}
.c-l i{font-style:normal;width:38px;height:38px;border-radius:50%;background:#c99a1e;display:grid;place-items:center;font-size:20px;color:var(--navy)}
.c-by{position:absolute;left:72px;top:520px;font:700 18px Inter;color:#e8c25a}

/* caption + controls */
.cap{position:absolute;z-index:4;left:90px;right:90px;bottom:40px;background:rgba(12,24,48,.92);color:#fff;border-radius:16px;padding:14px 24px;font:500 24px/1.45 Inter,'Noto Sans Kannada','Noto Sans Devanagari',sans-serif;text-align:center;pointer-events:none}
.cap[hidden]{display:none}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.controls .sp{flex:1}
.prog{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.prog button{width:28px;height:8px;border-radius:4px;border:0;background:#cdd6dc;cursor:pointer}
.prog button.on{background:var(--teal)}
.count{font:600 14px Inter;color:var(--muted);min-width:64px;text-align:center}
.opt{display:flex;align-items:center;gap:6px;font:600 13px Inter;color:var(--muted)}
select{font:500 14px Inter;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--navy);max-width:240px;min-height:40px}
.hint{margin-top:10px;font:500 13px Inter;color:var(--muted)}

/* fullscreen */
.stage:fullscreen{border-radius:0;background:#000;width:100vw;height:100vh;aspect-ratio:auto}
/* iPhone Safari can't make a page element full screen, so fill the screen ourselves */
.stage.fs{position:fixed;inset:0;z-index:50;width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;border-radius:0;background:#000}
body.fsmode{overflow:hidden}
:root{--sat:env(safe-area-inset-top,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px)}
.stage:-webkit-full-screen{border-radius:0;background:#000;width:100vw;height:100vh}
.fsbar{display:none;position:absolute;z-index:5;gap:var(--fsg,12px);flex-direction:column;left:var(--fsoff,12px);top:50%;transform:translateY(-50%)}
.stage.fs .fsbar{display:flex}
.fsbar .btn{width:var(--fsb,52px);height:var(--fsb,52px);min-height:0;padding:0;border-radius:50%;display:grid;place-items:center;font-size:calc(var(--fsb,52px) * .4);font-weight:700;background:rgba(255,255,255,.94);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.fsbar .btn.primary{background:var(--teal);color:#fff}
.stage.rot .fsbar{flex-direction:row-reverse;left:50%;top:var(--fsoff,12px);transform:translateX(-50%)}
.stage.rot .fsbar .btn{transform:rotate(90deg)}

.share-sheet{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.share-sheet[hidden]{display:none}
.share-box{position:relative;width:100%;max-width:380px;background:#fff;color:#0c1830;border-radius:18px;padding:18px;display:grid;gap:10px;font-family:Inter,'Noto Sans Kannada','Noto Sans Devanagari',sans-serif;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.share-box b{font:700 17px 'Space Grotesk',Inter,sans-serif}
.share-opt{display:block;text-align:left;padding:13px 14px;border-radius:12px;border:1.5px solid #e6e0d2;background:#fbf8f1;color:#0c1830;text-decoration:none;font:600 15px Inter,'Noto Sans Kannada','Noto Sans Devanagari',sans-serif;cursor:pointer}
.share-opt:hover{border-color:#0b8f80}
.share-url{width:100%;padding:9px 10px;border-radius:10px;border:1px solid #e6e0d2;font:500 12px Inter;color:#5f6b80;background:#fff}
.share-x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:none;background:#f1ede2;cursor:pointer;font-size:14px}
</style>
</head>

<script>
const NARR = [{"en": "Hello students. I'm Narendra Sir. In this session we will look at the important topics from the I PUC Biology mid-term paper, chapter by chapter, and I will share simple tips that help you score high marks. Keep a notebook ready and mark the topics you still need to revise.", "kn": "ನಮಸ್ಕಾರ ವಿದ್ಯಾರ್ಥಿಗಳೇ. ನಾನು ನರೇಂದ್ರ ಸರ್. ಈ ಅವಧಿಯಲ್ಲಿ ಪ್ರಥಮ ಪಿಯುಸಿ ಜೀವಶಾಸ್ತ್ರ ಮಧ್ಯಾವಧಿ ಪ್ರಶ್ನೆಪತ್ರಿಕೆಯ ಪ್ರಮುಖ ವಿಷಯಗಳನ್ನು ಅಧ್ಯಾಯವಾರು ನೋಡೋಣ. ಹೆಚ್ಚು ಅಂಕ ಗಳಿಸಲು ಸಹಾಯ ಮಾಡುವ ಸರಳ ಸಲಹೆಗಳನ್ನೂ ನೀಡುತ್ತೇನೆ. ಒಂದು ನೋಟ್‌ಬುಕ್ ಇಟ್ಟುಕೊಂಡು, ಇನ್ನೂ ಪುನರಾವರ್ತಿಸಬೇಕಾದ ವಿಷಯಗಳನ್ನು ಗುರುತು ಮಾಡಿಕೊಳ್ಳಿ.", "hi": "नमस्ते विद्यार्थियों। मैं नरेंद्र सर हूँ। इस सत्र में हम प्रथम पीयूसी जीव विज्ञान मध्यावधि प्रश्नपत्र के महत्वपूर्ण विषयों को अध्यायवार देखेंगे। साथ ही, अधिक अंक पाने में मदद करने वाले आसान सुझाव भी बताऊँगा। एक नोटबुक साथ रखें और जिन विषयों को अभी दोहराना बाकी है, उन्हें चिह्नित करें।"}, {"en": "First, understand the pattern. The paper is for 70 marks. Part A has 15 multiple choice questions and 5 fill in the blanks, one mark each. Part B asks you to answer any five of seven two-mark questions. Part C asks any five of seven three-mark questions. Part D has five-mark questions: any four of seven in section five, and any one of three in section six. Because you get choices, you can skip a few topics, but you cannot skip whole chapters.", "kn": "ಮೊದಲು ಪ್ರಶ್ನೆಪತ್ರಿಕೆಯ ಮಾದರಿಯನ್ನು ಅರ್ಥಮಾಡಿಕೊಳ್ಳಿ. ಪತ್ರಿಕೆ 70 ಅಂಕಗಳದ್ದು. ಭಾಗ ಎ ಯಲ್ಲಿ 15 ಬಹು ಆಯ್ಕೆ ಪ್ರಶ್ನೆಗಳು ಮತ್ತು 5 ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬುವ ಪ್ರಶ್ನೆಗಳು, ತಲಾ ಒಂದು ಅಂಕ. ಭಾಗ ಬಿ ಯಲ್ಲಿ ಏಳರಲ್ಲಿ ಯಾವುದಾದರೂ ಐದು ಎರಡು ಅಂಕದ ಪ್ರಶ್ನೆಗಳು. ಭಾಗ ಸಿ ಯಲ್ಲಿ ಏಳರಲ್ಲಿ ಐದು ಮೂರು ಅಂಕದ ಪ್ರಶ್ನೆಗಳು. ಭಾಗ ಡಿ ಯಲ್ಲಿ ಐದು ಅಂಕದ ಪ್ರಶ್ನೆಗಳು: ಐದನೇ ವಿಭಾಗದಲ್ಲಿ ಏಳರಲ್ಲಿ ನಾಲ್ಕು, ಆರನೇ ವಿಭಾಗದಲ್ಲಿ ಮೂರರಲ್ಲಿ ಒಂದು. ಆಯ್ಕೆ ಇರುವುದರಿಂದ ಕೆಲವು ವಿಷಯಗಳನ್ನು ಬಿಡಬಹುದು, ಆದರೆ ಸಂಪೂರ್ಣ ಅಧ್ಯಾಯವನ್ನು ಬಿಡಬಾರದು.", "hi": "पहले प्रश्नपत्र का पैटर्न समझिए। पेपर 70 अंकों का है। भाग ए में 15 बहुविकल्पीय प्रश्न और 5 रिक्त स्थान, हर एक का एक अंक। भाग बी में सात में से कोई पाँच दो अंक वाले प्रश्न। भाग सी में सात में से कोई पाँच तीन अंक वाले प्रश्न। भाग डी में पाँच अंक वाले प्रश्न हैं: खंड पाँच में सात में से कोई चार, और खंड छह में तीन में से कोई एक। विकल्प मिलने से आप कुछ विषय छोड़ सकते हैं, लेकिन पूरा अध्याय नहीं छोड़ सकते।"}, {"en": "This chart shows how many marks were asked from each chapter, counting the choice questions too. Cell: The Unit of Life is the biggest with 25 marks. Animal Kingdom follows with 16, then Biomolecules and Cell Cycle with 12 each. These four chapters together give 65 of the 105 marks asked, so study them first and study them deeply.", "kn": "ಪ್ರತಿ ಅಧ್ಯಾಯದಿಂದ ಎಷ್ಟು ಅಂಕಗಳ ಪ್ರಶ್ನೆ ಕೇಳಲಾಗಿದೆ ಎಂಬುದನ್ನು ಈ ಚಾರ್ಟ್ ತೋರಿಸುತ್ತದೆ, ಆಯ್ಕೆ ಪ್ರಶ್ನೆಗಳನ್ನೂ ಸೇರಿಸಿ. ಜೀವಕೋಶ: ಜೀವದ ಘಟಕ ಅಧ್ಯಾಯದಿಂದ ಅತಿ ಹೆಚ್ಚು, 25 ಅಂಕಗಳು. ನಂತರ ಪ್ರಾಣಿ ಸಾಮ್ರಾಜ್ಯ 16, ಜೈವಿಕ ಅಣುಗಳು ಮತ್ತು ಜೀವಕೋಶ ಚಕ್ರ ತಲಾ 12. ಈ ನಾಲ್ಕು ಅಧ್ಯಾಯಗಳು ಒಟ್ಟು 105 ರಲ್ಲಿ 65 ಅಂಕಗಳನ್ನು ನೀಡುತ್ತವೆ. ಆದ್ದರಿಂದ ಇವುಗಳನ್ನು ಮೊದಲು ಮತ್ತು ಆಳವಾಗಿ ಓದಿ.", "hi": "यह चार्ट दिखाता है कि हर अध्याय से कितने अंकों के प्रश्न पूछे गए, विकल्प वाले प्रश्नों सहित। कोशिका: जीवन की इकाई सबसे बड़ा है, 25 अंक। उसके बाद प्राणी जगत 16, फिर जैव अणु और कोशिका चक्र 12-12। ये चार अध्याय मिलकर 105 में से 65 अंक देते हैं, इसलिए इन्हें सबसे पहले और गहराई से पढ़िए।"}, {"en": "Chapters one and two. Learn binomial nomenclature and the rules for writing scientific names: the genus starts with a capital letter, the species with a small letter, and both are underlined when handwritten. Know that species is the basic unit of classification. From Biological Classification, prepare Whittaker's five kingdom classification with its merits and demerits, the features of Kingdom Monera, and Kingdom Fungi, including the chitin cell wall and fungal plant diseases.", "kn": "ಅಧ್ಯಾಯ ಒಂದು ಮತ್ತು ಎರಡು. ದ್ವಿನಾಮ ನಾಮಕರಣ ಮತ್ತು ವೈಜ್ಞಾನಿಕ ಹೆಸರು ಬರೆಯುವ ನಿಯಮಗಳನ್ನು ಕಲಿಯಿರಿ: ಕುಲದ ಹೆಸರು ದೊಡ್ಡ ಅಕ್ಷರದಿಂದ, ಪ್ರಭೇದದ ಹೆಸರು ಸಣ್ಣ ಅಕ್ಷರದಿಂದ ಆರಂಭ, ಕೈಬರಹದಲ್ಲಿ ಎರಡಕ್ಕೂ ಅಡಿಗೆರೆ. ವರ್ಗೀಕರಣದ ಮೂಲ ಘಟಕ ಪ್ರಭೇದ ಎಂದು ತಿಳಿಯಿರಿ. ಜೈವಿಕ ವರ್ಗೀಕರಣದಿಂದ ವಿಟ್ಟೇಕರ್ ಅವರ ಐದು ಸಾಮ್ರಾಜ್ಯ ವರ್ಗೀಕರಣ, ಅದರ ಗುಣ ಮತ್ತು ದೋಷಗಳು, ಮೊನೆರಾ ಸಾಮ್ರಾಜ್ಯದ ಲಕ್ಷಣಗಳು, ಹಾಗೂ ಶಿಲೀಂಧ್ರ ಸಾಮ್ರಾಜ್ಯವನ್ನು ಸಿದ್ಧಪಡಿಸಿ. ಕೈಟಿನ್ ಕೋಶಭಿತ್ತಿ ಮತ್ತು ಶಿಲೀಂಧ್ರದಿಂದ ಬರುವ ಸಸ್ಯ ರೋಗಗಳನ್ನೂ ನೆನಪಿಡಿ.", "hi": "अध्याय एक और दो। द्विनाम पद्धति और वैज्ञानिक नाम लिखने के नियम सीखिए: वंश का नाम बड़े अक्षर से, जाति का नाम छोटे अक्षर से, और हाथ से लिखते समय दोनों के नीचे रेखा। जानिए कि वर्गीकरण की मूल इकाई जाति है। जैविक वर्गीकरण से व्हिटेकर का पाँच जगत वर्गीकरण, उसके गुण और दोष, मोनेरा जगत की विशेषताएँ, और कवक जगत तैयार कीजिए, जिसमें काइटिन कोशिका भित्ति और कवक से होने वाले पादप रोग शामिल हैं।"}, {"en": "Plant Kingdom. The most valuable topic here is the classes of algae: Chlorophyceae, Phaeophyceae and Rhodophyceae. For each class, learn the common name, major pigments, stored food and cell wall. A single table can bring you five marks. Also learn the economic importance of algae, with Chlorella as a protein-rich food, the features of bryophytes, called the amphibians of the plant kingdom, and gymnosperms, where Ginkgo is a living fossil.", "kn": "ಸಸ್ಯ ಸಾಮ್ರಾಜ್ಯ. ಇಲ್ಲಿ ಅತ್ಯಂತ ಮುಖ್ಯ ವಿಷಯ ಶೈವಲಗಳ ವರ್ಗಗಳು: ಕ್ಲೋರೋಫೈಸಿ, ಫಿಯೋಫೈಸಿ ಮತ್ತು ರೋಡೋಫೈಸಿ. ಪ್ರತಿ ವರ್ಗದ ಸಾಮಾನ್ಯ ಹೆಸರು, ಪ್ರಮುಖ ವರ್ಣದ್ರವ್ಯಗಳು, ಸಂಗ್ರಹಿತ ಆಹಾರ ಮತ್ತು ಕೋಶಭಿತ್ತಿಯನ್ನು ಕಲಿಯಿರಿ. ಒಂದೇ ಕೋಷ್ಟಕ ಐದು ಅಂಕ ತಂದುಕೊಡಬಹುದು. ಶೈವಲಗಳ ಆರ್ಥಿಕ ಮಹತ್ವ, ಪ್ರೋಟೀನ್ ಸಮೃದ್ಧ ಆಹಾರವಾದ ಕ್ಲೋರೆಲ್ಲಾ, ಸಸ್ಯ ಸಾಮ್ರಾಜ್ಯದ ಉಭಯಚರಗಳೆಂದು ಕರೆಯುವ ಬ್ರಯೋಫೈಟ್‌ಗಳು, ಮತ್ತು ಜೀವಂತ ಪಳೆಯುಳಿಕೆ ಗಿಂಕ್ಗೊ ಇರುವ ಅನಾವೃತಬೀಜಿಗಳನ್ನೂ ಓದಿ.", "hi": "पादप जगत। यहाँ सबसे महत्वपूर्ण विषय शैवाल के वर्ग हैं: क्लोरोफाइसी, फियोफाइसी और रोडोफाइसी। हर वर्ग का सामान्य नाम, मुख्य वर्णक, संचित भोजन और कोशिका भित्ति सीखिए। एक ही तालिका आपको पाँच अंक दिला सकती है। शैवाल का आर्थिक महत्व, प्रोटीन से भरपूर क्लोरेला, पादप जगत के उभयचर कहे जाने वाले ब्रायोफाइट, और अनावृतबीजी जिनमें गिंकगो जीवित जीवाश्म है, ये भी पढ़िए।"}, {"en": "Animal Kingdom carries 16 marks. For every phylum, remember three key features and two examples: Porifera, Ctenophora, Arthropoda, Mollusca, Echinodermata, Hemichordata and Chordata. The paper gives you features and asks you to name the phylum, so practise in both directions. Also prepare differences between chordates and non-chordates, and the characters of Class Mammalia. Remember: mammals are warm-blooded, so poikilothermous is not a mammalian character.", "kn": "ಪ್ರಾಣಿ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ 16 ಅಂಕಗಳು. ಪ್ರತಿ ವಂಶಕ್ಕೆ ಮೂರು ಪ್ರಮುಖ ಲಕ್ಷಣಗಳು ಮತ್ತು ಎರಡು ಉದಾಹರಣೆಗಳನ್ನು ನೆನಪಿಡಿ: ಪೊರಿಫೆರಾ, ಟೀನೋಫೊರಾ, ಆರ್ತ್ರೋಪೋಡಾ, ಮೊಲಸ್ಕಾ, ಎಕೈನೋಡರ್ಮೇಟಾ, ಹೆಮಿಕಾರ್ಡೇಟಾ ಮತ್ತು ಕಾರ್ಡೇಟಾ. ಪ್ರಶ್ನೆಪತ್ರಿಕೆ ಲಕ್ಷಣಗಳನ್ನು ಕೊಟ್ಟು ವಂಶದ ಹೆಸರು ಕೇಳುತ್ತದೆ, ಆದ್ದರಿಂದ ಎರಡೂ ದಿಕ್ಕಿನಲ್ಲಿ ಅಭ್ಯಾಸ ಮಾಡಿ. ಕಾರ್ಡೇಟ್ ಮತ್ತು ಅಕಾರ್ಡೇಟ್‌ಗಳ ವ್ಯತ್ಯಾಸಗಳು ಹಾಗೂ ಸಸ್ತನಿ ವರ್ಗದ ಲಕ್ಷಣಗಳನ್ನು ಸಿದ್ಧಪಡಿಸಿ. ನೆನಪಿಡಿ: ಸಸ್ತನಿಗಳು ಉಷ್ಣರಕ್ತ ಪ್ರಾಣಿಗಳು.", "hi": "प्राणी जगत में 16 अंक हैं। हर संघ की तीन मुख्य विशेषताएँ और दो उदाहरण याद रखिए: पोरीफेरा, टीनोफोरा, आर्थ्रोपोडा, मोलस्का, इकाइनोडर्मेटा, हेमीकॉर्डेटा और कॉर्डेटा। पेपर विशेषताएँ देकर संघ का नाम पूछता है, इसलिए दोनों तरफ से अभ्यास कीजिए। कॉर्डेट और नॉन-कॉर्डेट के अंतर, और स्तनधारी वर्ग की विशेषताएँ भी तैयार कीजिए। याद रखिए: स्तनधारी नियततापी होते हैं।"}, {"en": "Morphology and Anatomy of flowering plants. Practise placentation with five small labelled diagrams and an example for each: marginal in pea, axile in tomato and lemon, parietal in mustard, free central in Dianthus, and basal in sunflower. Learn the types of phyllotaxy and venation, and remember that the edible part of mango is the mesocarp. From anatomy, prepare the epidermal tissue system with stomata, guard cells and root hairs, and the differences between open and closed vascular bundles.", "kn": "ಆವೃತಬೀಜ ಸಸ್ಯಗಳ ರೂಪವಿಜ್ಞಾನ ಮತ್ತು ಅಂಗರಚನೆ. ಬೀಜಾಂಡ ವಿನ್ಯಾಸವನ್ನು ಐದು ಸಣ್ಣ ಹೆಸರಿಸಿದ ಚಿತ್ರಗಳು ಮತ್ತು ತಲಾ ಒಂದು ಉದಾಹರಣೆಯೊಂದಿಗೆ ಅಭ್ಯಾಸ ಮಾಡಿ: ಬಟಾಣಿಯಲ್ಲಿ ಅಂಚಿನ, ಟೊಮೆಟೊ ಮತ್ತು ನಿಂಬೆಯಲ್ಲಿ ಅಕ್ಷೀಯ, ಸಾಸಿವೆಯಲ್ಲಿ ಭಿತ್ತಿಯ, ಡಯಾಂಥಸ್‌ನಲ್ಲಿ ಮುಕ್ತ ಕೇಂದ್ರೀಯ, ಸೂರ್ಯಕಾಂತಿಯಲ್ಲಿ ತಳದ ವಿನ್ಯಾಸ. ಎಲೆ ಜೋಡಣೆ ಮತ್ತು ನಾಳ ವಿನ್ಯಾಸದ ವಿಧಗಳನ್ನು ಕಲಿಯಿರಿ. ಮಾವಿನ ತಿನ್ನುವ ಭಾಗ ಮಧ್ಯಫಲಭಿತ್ತಿ. ಅಂಗರಚನೆಯಿಂದ ಪತ್ರರಂಧ್ರ, ರಕ್ಷಕ ಕೋಶಗಳು ಮತ್ತು ಬೇರುಕೂದಲು ಇರುವ ಹೊರಚರ್ಮ ಅಂಗಾಂಶ ವ್ಯವಸ್ಥೆ, ಹಾಗೂ ತೆರೆದ ಮತ್ತು ಮುಚ್ಚಿದ ನಾಳಕಟ್ಟುಗಳ ವ್ಯತ್ಯಾಸಗಳನ್ನು ಸಿದ್ಧಪಡಿಸಿ.", "hi": "पुष्पी पादपों की आकारिकी और शारीरिकी। बीजांडन्यास को पाँच छोटे नामांकित चित्रों और हर एक के उदाहरण के साथ अभ्यास कीजिए: मटर में सीमांत, टमाटर और नींबू में स्तंभीय, सरसों में भित्तीय, डायंथस में मुक्त स्तंभीय, और सूरजमुखी में आधारी। पर्णविन्यास और शिराविन्यास के प्रकार सीखिए, और याद रखिए कि आम का खाने योग्य भाग मध्यफलभित्ति है। शारीरिकी से रंध्र, द्वार कोशिकाएँ और मूलरोम वाला बाह्यत्वचीय ऊतक तंत्र, और खुले व बंद संवहन बंडलों के अंतर तैयार कीजिए।"}, {"en": "Cell: The Unit of Life is the highest-scoring chapter with 25 marks. Prepare the prokaryotic cell and mesosomes, plant cell versus animal cell, the fluid mosaic model of the cell membrane, the cell wall, the endomembrane system, mitochondria, plastids, ribosomes and the nucleus with the nucleolus. Many questions ask you to name the organelle where a structure is found, such as cristae in mitochondria, thylakoids in chloroplasts, cisternae in the Golgi body and the tonoplast around the vacuole.", "kn": "ಜೀವಕೋಶ: ಜೀವದ ಘಟಕ ಅತಿ ಹೆಚ್ಚು ಅಂಕದ ಅಧ್ಯಾಯ, 25 ಅಂಕಗಳು. ಆದಿಕೋಶ ಮತ್ತು ಮೀಸೋಸೋಮ್‌ಗಳು, ಸಸ್ಯಕೋಶ ಮತ್ತು ಪ್ರಾಣಿಕೋಶದ ವ್ಯತ್ಯಾಸ, ಕೋಶಪೊರೆಯ ದ್ರವ ಮೊಸಾಯಿಕ್ ಮಾದರಿ, ಕೋಶಭಿತ್ತಿ, ಒಳಪೊರೆ ವ್ಯವಸ್ಥೆ, ಮೈಟೊಕಾಂಡ್ರಿಯಾ, ಪ್ಲಾಸ್ಟಿಡ್‌ಗಳು, ರೈಬೋಸೋಮ್‌ಗಳು ಮತ್ತು ಕೋಶಕೇಂದ್ರಕವನ್ನು ಕೇಂದ್ರಕದ ಜೊತೆ ಸಿದ್ಧಪಡಿಸಿ. ಒಂದು ರಚನೆ ಯಾವ ಕೋಶಾಂಗದಲ್ಲಿದೆ ಎಂದು ಕೇಳುವ ಪ್ರಶ್ನೆಗಳು ಹೆಚ್ಚು: ಕ್ರಿಸ್ಟೇ ಮೈಟೊಕಾಂಡ್ರಿಯಾದಲ್ಲಿ, ಥೈಲಕಾಯ್ಡ್ ಹರಿತ್ತಿಲವಕದಲ್ಲಿ, ಸಿಸ್ಟರ್ನೇ ಗಾಲ್ಗಿ ಕಾಯದಲ್ಲಿ, ಟೋನೋಪ್ಲಾಸ್ಟ್ ರಸದಾನಿಯ ಸುತ್ತ.", "hi": "कोशिका: जीवन की इकाई सबसे अधिक अंकों वाला अध्याय है, 25 अंक। प्रोकैरियोटिक कोशिका और मीसोसोम, पादप और जंतु कोशिका का अंतर, कोशिका झिल्ली का तरल मोज़ेक मॉडल, कोशिका भित्ति, अंतःझिल्ली तंत्र, माइटोकॉन्ड्रिया, लवक, राइबोसोम, और केंद्रिक सहित केंद्रक तैयार कीजिए। कई प्रश्न पूछते हैं कि कोई संरचना किस कोशिकांग में मिलती है: क्रिस्टी माइटोकॉन्ड्रिया में, थायलाकॉइड हरितलवक में, सिस्टर्नी गॉल्जी काय में, और टोनोप्लास्ट रिक्तिका के चारों ओर।"}, {"en": "Biomolecules. Know that proteins are polymers of amino acids, polysaccharides are polymers of monosaccharides with examples like starch, cellulose and glycogen, and that a nucleotide has three parts: a nitrogenous base, a pentose sugar and a phosphate group. Adenine and guanine are purines. For enzymes, explain four factors: temperature, pH, substrate concentration and activators or inhibitors. Draw a small graph for each factor. A graph earns marks faster than a paragraph.", "kn": "ಜೈವಿಕ ಅಣುಗಳು. ಪ್ರೋಟೀನ್‌ಗಳು ಅಮೈನೋ ಆಮ್ಲಗಳ ಬಹ್ವಣುಗಳು, ಬಹುಶರ್ಕರಗಳು ಏಕಶರ್ಕರಗಳ ಬಹ್ವಣುಗಳು, ಉದಾಹರಣೆಗೆ ಪಿಷ್ಟ, ಸೆಲ್ಯುಲೋಸ್ ಮತ್ತು ಗ್ಲೈಕೋಜನ್. ನ್ಯೂಕ್ಲಿಯೋಟೈಡ್‌ಗೆ ಮೂರು ಭಾಗಗಳಿವೆ: ಸಾರಜನಕ ಪ್ರತ್ಯಾಮ್ಲ, ಪೆಂಟೋಸ್ ಸಕ್ಕರೆ ಮತ್ತು ಫಾಸ್ಫೇಟ್ ಗುಂಪು. ಅಡೆನಿನ್ ಮತ್ತು ಗ್ವಾನಿನ್ ಪ್ಯೂರಿನ್‌ಗಳು. ಕಿಣ್ವಗಳಿಗೆ ನಾಲ್ಕು ಅಂಶಗಳನ್ನು ವಿವರಿಸಿ: ತಾಪಮಾನ, ಪಿಎಚ್, ಆಧಾರವಸ್ತು ಸಾಂದ್ರತೆ ಮತ್ತು ಸಕ್ರಿಯಕಾರಕ ಅಥವಾ ಪ್ರತಿಬಂಧಕ. ಪ್ರತಿ ಅಂಶಕ್ಕೆ ಒಂದು ಸಣ್ಣ ಗ್ರಾಫ್ ಬರೆಯಿರಿ. ಗ್ರಾಫ್ ಪ್ಯಾರಾಗ್ರಾಫ್‌ಗಿಂತ ಬೇಗ ಅಂಕ ತರುತ್ತದೆ.", "hi": "जैव अणु। जानिए कि प्रोटीन अमीनो अम्लों के बहुलक हैं, पॉलीसैकेराइड मोनोसैकेराइड के बहुलक हैं, जैसे स्टार्च, सेलुलोज़ और ग्लाइकोजन, और न्यूक्लियोटाइड के तीन भाग होते हैं: नाइट्रोजनी क्षारक, पेंटोज़ शर्करा और फॉस्फेट समूह। एडेनिन और ग्वानिन प्यूरिन हैं। एंजाइम के लिए चार कारक समझाइए: तापमान, पीएच, सब्सट्रेट सांद्रता, और सक्रियक या संदमक। हर कारक का एक छोटा ग्राफ बनाइए। ग्राफ पैराग्राफ से जल्दी अंक दिलाता है।"}, {"en": "Cell Cycle and Cell Division. Draw the cell cycle as a wheel: interphase with G1, S and G2, then the M phase, and the G0 quiescent stage. Learn the stages of mitosis well enough to identify a stage from a diagram. For meiosis, remember the order of Prophase One: leptotene, zygotene, pachytene, diplotene and diakinesis. Crossing over happens in pachytene. Finally, prepare at least three differences between mitosis and meiosis.", "kn": "ಜೀವಕೋಶ ಚಕ್ರ ಮತ್ತು ಕೋಶ ವಿಭಜನೆ. ಜೀವಕೋಶ ಚಕ್ರವನ್ನು ಚಕ್ರದ ರೂಪದಲ್ಲಿ ಬರೆಯಿರಿ: ಜಿ1, ಎಸ್ ಮತ್ತು ಜಿ2 ಇರುವ ಅಂತರಾವಸ್ಥೆ, ನಂತರ ಎಂ ಹಂತ, ಮತ್ತು ಜಿ0 ವಿಶ್ರಾಂತ ಹಂತ. ಚಿತ್ರದಿಂದ ಹಂತವನ್ನು ಗುರುತಿಸುವಷ್ಟು ಸಮಸೂತ್ರ ವಿಭಜನೆಯ ಹಂತಗಳನ್ನು ಕಲಿಯಿರಿ. ಅರ್ಧಸೂತ್ರ ವಿಭಜನೆಗೆ ಪ್ರೊಫೇಸ್ ಒಂದರ ಕ್ರಮ ನೆನಪಿಡಿ: ಲೆಪ್ಟೋಟೀನ್, ಜೈಗೋಟೀನ್, ಪ್ಯಾಕಿಟೀನ್, ಡಿಪ್ಲೋಟೀನ್ ಮತ್ತು ಡಯಾಕೈನೆಸಿಸ್. ಕ್ರಾಸಿಂಗ್ ಓವರ್ ಪ್ಯಾಕಿಟೀನ್‌ನಲ್ಲಿ ನಡೆಯುತ್ತದೆ. ಕೊನೆಗೆ ಸಮಸೂತ್ರ ಮತ್ತು ಅರ್ಧಸೂತ್ರ ವಿಭಜನೆಯ ಕನಿಷ್ಠ ಮೂರು ವ್ಯತ್ಯಾಸಗಳನ್ನು ಸಿದ್ಧಪಡಿಸಿ.", "hi": "कोशिका चक्र और कोशिका विभाजन। कोशिका चक्र को एक पहिये के रूप में बनाइए: जी1, एस और जी2 वाली अंतरावस्था, फिर एम प्रावस्था, और जी0 विश्राम अवस्था। समसूत्री विभाजन की अवस्थाएँ इतनी अच्छी तरह सीखिए कि चित्र देखकर अवस्था पहचान सकें। अर्धसूत्री विभाजन के लिए प्रोफेज़ एक का क्रम याद रखिए: लेप्टोटीन, ज़ाइगोटीन, पैकीटीन, डिप्लोटीन और डायकाइनेसिस। क्रॉसिंग ओवर पैकीटीन में होता है। अंत में समसूत्री और अर्धसूत्री विभाजन के कम से कम तीन अंतर तैयार कीजिए।"}, {"en": "Diagrams carry marks, and unlabelled diagrams get no marks. Practise these five until you can draw each one in about three minutes: the plant cell, the mitochondrion, the fluid mosaic model, the cell cycle, and the types of placentation. Draw with a pencil, keep the diagram large and neat, draw label lines straight and parallel, and write the title below the diagram.", "kn": "ಚಿತ್ರಗಳಿಗೆ ಅಂಕಗಳಿವೆ, ಹೆಸರಿಸದ ಚಿತ್ರಗಳಿಗೆ ಅಂಕವಿಲ್ಲ. ಈ ಐದು ಚಿತ್ರಗಳನ್ನು ತಲಾ ಸುಮಾರು ಮೂರು ನಿಮಿಷದಲ್ಲಿ ಬರೆಯುವಷ್ಟು ಅಭ್ಯಾಸ ಮಾಡಿ: ಸಸ್ಯಕೋಶ, ಮೈಟೊಕಾಂಡ್ರಿಯಾ, ದ್ರವ ಮೊಸಾಯಿಕ್ ಮಾದರಿ, ಜೀವಕೋಶ ಚಕ್ರ ಮತ್ತು ಬೀಜಾಂಡ ವಿನ್ಯಾಸದ ವಿಧಗಳು. ಪೆನ್ಸಿಲ್‌ನಿಂದ ಬರೆಯಿರಿ, ಚಿತ್ರ ದೊಡ್ಡದಾಗಿ ಮತ್ತು ಅಚ್ಚುಕಟ್ಟಾಗಿರಲಿ, ಹೆಸರಿಸುವ ಗೆರೆಗಳು ನೇರ ಮತ್ತು ಸಮಾಂತರವಾಗಿರಲಿ, ಮತ್ತು ಶೀರ್ಷಿಕೆಯನ್ನು ಚಿತ್ರದ ಕೆಳಗೆ ಬರೆಯಿರಿ.", "hi": "चित्रों के अंक होते हैं, और बिना नामांकन वाले चित्रों को अंक नहीं मिलते। इन पाँच चित्रों का अभ्यास तब तक कीजिए जब तक हर एक लगभग तीन मिनट में न बन जाए: पादप कोशिका, माइटोकॉन्ड्रिया, तरल मोज़ेक मॉडल, कोशिका चक्र, और बीजांडन्यास के प्रकार। पेंसिल से बनाइए, चित्र बड़ा और साफ़ रखिए, नामांकन रेखाएँ सीधी और समानांतर खींचिए, और शीर्षक चित्र के नीचे लिखिए।"}, {"en": "Tips for Part A. Read all four options before you choose. Eliminate the clearly wrong ones first. Watch for words like not, incorrect and except. Only the first answer you write is evaluated, so do not overwrite or write two answers. In fill in the blanks, every word from the bracket is used once, so cross out each word as you use it.", "kn": "ಭಾಗ ಎ ಗೆ ಸಲಹೆಗಳು. ಆಯ್ಕೆ ಮಾಡುವ ಮೊದಲು ನಾಲ್ಕೂ ಆಯ್ಕೆಗಳನ್ನು ಓದಿ. ಸ್ಪಷ್ಟವಾಗಿ ತಪ್ಪಾದವುಗಳನ್ನು ಮೊದಲು ತೆಗೆದುಹಾಕಿ. ಅಲ್ಲ, ತಪ್ಪು, ಹೊರತುಪಡಿಸಿ ಎಂಬ ಪದಗಳ ಬಗ್ಗೆ ಎಚ್ಚರ. ಮೊದಲು ಬರೆದ ಉತ್ತರವನ್ನು ಮಾತ್ರ ಮೌಲ್ಯಮಾಪನ ಮಾಡಲಾಗುತ್ತದೆ, ಆದ್ದರಿಂದ ತಿದ್ದಿ ಬರೆಯಬೇಡಿ ಅಥವಾ ಎರಡು ಉತ್ತರ ಬರೆಯಬೇಡಿ. ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬುವಾಗ ಆವರಣದ ಪ್ರತಿ ಪದವನ್ನು ಒಮ್ಮೆ ಮಾತ್ರ ಬಳಸಲಾಗುತ್ತದೆ, ಬಳಸಿದ ಪದವನ್ನು ಹೊಡೆದು ಹಾಕಿ.", "hi": "भाग ए के लिए सुझाव। उत्तर चुनने से पहले चारों विकल्प पढ़िए। पहले स्पष्ट रूप से गलत विकल्प हटाइए। नहीं, गलत और को छोड़कर जैसे शब्दों पर ध्यान दीजिए। केवल पहला लिखा उत्तर जाँचा जाता है, इसलिए काटकर दोबारा न लिखें और दो उत्तर न लिखें। रिक्त स्थान भरते समय कोष्ठक का हर शब्द एक बार ही उपयोग होता है, इसलिए उपयोग किया शब्द काटते जाइए।"}, {"en": "Tips for two and three mark answers. Give one clear point for every mark: two points for two marks, three points for three marks. Start with a definition and add an example. Write differences in a two-column table, not in a paragraph. If a diagram is asked, label it fully. Underline the key terms so the examiner can find them quickly.", "kn": "ಎರಡು ಮತ್ತು ಮೂರು ಅಂಕದ ಉತ್ತರಗಳಿಗೆ ಸಲಹೆಗಳು. ಪ್ರತಿ ಅಂಕಕ್ಕೆ ಒಂದು ಸ್ಪಷ್ಟ ಅಂಶ ನೀಡಿ: ಎರಡು ಅಂಕಕ್ಕೆ ಎರಡು ಅಂಶಗಳು, ಮೂರು ಅಂಕಕ್ಕೆ ಮೂರು ಅಂಶಗಳು. ವ್ಯಾಖ್ಯಾನದಿಂದ ಆರಂಭಿಸಿ ಒಂದು ಉದಾಹರಣೆ ಸೇರಿಸಿ. ವ್ಯತ್ಯಾಸಗಳನ್ನು ಪ್ಯಾರಾಗ್ರಾಫ್‌ನಲ್ಲಿ ಅಲ್ಲ, ಎರಡು ಕಾಲಂ ಕೋಷ್ಟಕದಲ್ಲಿ ಬರೆಯಿರಿ. ಚಿತ್ರ ಕೇಳಿದ್ದರೆ ಪೂರ್ತಿ ಹೆಸರಿಸಿ. ಮೌಲ್ಯಮಾಪಕರಿಗೆ ಬೇಗ ಕಾಣುವಂತೆ ಮುಖ್ಯ ಪದಗಳಿಗೆ ಅಡಿಗೆರೆ ಹಾಕಿ.", "hi": "दो और तीन अंक वाले उत्तरों के सुझाव। हर अंक के लिए एक स्पष्ट बिंदु दीजिए: दो अंक के लिए दो बिंदु, तीन अंक के लिए तीन बिंदु। परिभाषा से शुरू कीजिए और एक उदाहरण जोड़िए। अंतर पैराग्राफ में नहीं, दो कॉलम वाली तालिका में लिखिए। अगर चित्र पूछा है तो पूरा नामांकन कीजिए। मुख्य शब्दों को रेखांकित कीजिए ताकि परीक्षक उन्हें जल्दी देख सकें।"}, {"en": "Tips for five mark answers. Plan before you write. Begin with a one-line introduction, then write headed points, add a neat labelled diagram, give examples, and end with a short conclusion. Aim for two hundred to two hundred and fifty words. Choose the questions where you can draw the diagram confidently. In the identification questions of section six, write each answer clearly against its letter or number.", "kn": "ಐದು ಅಂಕದ ಉತ್ತರಗಳಿಗೆ ಸಲಹೆಗಳು. ಬರೆಯುವ ಮೊದಲು ಯೋಜನೆ ಮಾಡಿ. ಒಂದು ಸಾಲಿನ ಪೀಠಿಕೆಯಿಂದ ಆರಂಭಿಸಿ, ನಂತರ ಶೀರ್ಷಿಕೆ ಇರುವ ಅಂಶಗಳು, ಅಚ್ಚುಕಟ್ಟಾದ ಹೆಸರಿಸಿದ ಚಿತ್ರ, ಉದಾಹರಣೆಗಳು, ಮತ್ತು ಕೊನೆಗೆ ಸಣ್ಣ ತೀರ್ಮಾನ ಬರೆಯಿರಿ. ಇನ್ನೂರರಿಂದ ಇನ್ನೂರ ಐವತ್ತು ಪದಗಳ ಗುರಿ ಇಡಿ. ಆತ್ಮವಿಶ್ವಾಸದಿಂದ ಚಿತ್ರ ಬರೆಯಬಲ್ಲ ಪ್ರಶ್ನೆಗಳನ್ನು ಆಯ್ಕೆ ಮಾಡಿ. ಆರನೇ ವಿಭಾಗದ ಗುರುತಿಸುವ ಪ್ರಶ್ನೆಗಳಲ್ಲಿ ಪ್ರತಿ ಉತ್ತರವನ್ನು ಅದರ ಅಕ್ಷರ ಅಥವಾ ಸಂಖ್ಯೆಯ ಎದುರು ಸ್ಪಷ್ಟವಾಗಿ ಬರೆಯಿರಿ.", "hi": "पाँच अंक वाले उत्तरों के सुझाव। लिखने से पहले योजना बनाइए। एक पंक्ति की भूमिका से शुरू कीजिए, फिर शीर्षक वाले बिंदु, एक साफ़ नामांकित चित्र, उदाहरण, और अंत में एक छोटा निष्कर्ष लिखिए। दो सौ से ढाई सौ शब्दों का लक्ष्य रखिए। वे प्रश्न चुनिए जिनका चित्र आप आत्मविश्वास से बना सकें। खंड छह के पहचान वाले प्रश्नों में हर उत्तर उसके अक्षर या संख्या के सामने साफ़ लिखिए।"}, {"en": "In the exam hall, use your time well. Spend the first few minutes reading the whole paper and ticking the questions you will answer. Finish Part A first, since it is quick and sure. Next, write the long answers you know best while your mind is fresh. Then complete the short answers. Keep the last ten minutes to check question numbers, labels and any blank answers.", "kn": "ಪರೀಕ್ಷಾ ಕೊಠಡಿಯಲ್ಲಿ ಸಮಯವನ್ನು ಚೆನ್ನಾಗಿ ಬಳಸಿ. ಮೊದಲ ಕೆಲವು ನಿಮಿಷ ಇಡೀ ಪತ್ರಿಕೆಯನ್ನು ಓದಿ, ಉತ್ತರಿಸುವ ಪ್ರಶ್ನೆಗಳಿಗೆ ಗುರುತು ಹಾಕಿ. ಭಾಗ ಎ ಅನ್ನು ಮೊದಲು ಮುಗಿಸಿ, ಅದು ಬೇಗ ಮತ್ತು ಖಚಿತ. ನಂತರ ಮನಸ್ಸು ತಾಜಾ ಇರುವಾಗಲೇ ಚೆನ್ನಾಗಿ ಗೊತ್ತಿರುವ ದೀರ್ಘ ಉತ್ತರಗಳನ್ನು ಬರೆಯಿರಿ. ನಂತರ ಸಣ್ಣ ಉತ್ತರಗಳನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ. ಕೊನೆಯ ಹತ್ತು ನಿಮಿಷಗಳನ್ನು ಪ್ರಶ್ನೆ ಸಂಖ್ಯೆ, ಚಿತ್ರದ ಹೆಸರುಗಳು ಮತ್ತು ಬಿಟ್ಟುಹೋದ ಉತ್ತರಗಳನ್ನು ಪರಿಶೀಲಿಸಲು ಇಟ್ಟುಕೊಳ್ಳಿ.", "hi": "परीक्षा कक्ष में समय का अच्छा उपयोग कीजिए। पहले कुछ मिनट पूरा पेपर पढ़िए और जिन प्रश्नों के उत्तर देंगे उन पर निशान लगाइए। भाग ए पहले पूरा कीजिए, क्योंकि वह जल्दी और पक्का है। फिर दिमाग ताज़ा रहते हुए वे लंबे उत्तर लिखिए जो आपको सबसे अच्छे आते हैं। उसके बाद छोटे उत्तर पूरे कीजिए। आखिरी दस मिनट प्रश्न संख्या, चित्र के नामांकन और छूटे उत्तर जाँचने के लिए रखिए।"}, {"en": "Here is a seven-day revision plan. Day one: Cell, the unit of life. Day two: cell diagrams and Biomolecules. Day three: Cell Cycle and Cell Division. Day four: Animal Kingdom. Day five: Living World, Biological Classification and Plant Kingdom. Day six: Morphology and Anatomy. Day seven: write a full mock paper in exam time and redraw all five diagrams.", "kn": "ಇಲ್ಲಿ ಏಳು ದಿನಗಳ ಪುನರಾವರ್ತನೆ ಯೋಜನೆ ಇದೆ. ಮೊದಲ ದಿನ: ಜೀವಕೋಶ, ಜೀವದ ಘಟಕ. ಎರಡನೇ ದಿನ: ಕೋಶದ ಚಿತ್ರಗಳು ಮತ್ತು ಜೈವಿಕ ಅಣುಗಳು. ಮೂರನೇ ದಿನ: ಜೀವಕೋಶ ಚಕ್ರ ಮತ್ತು ಕೋಶ ವಿಭಜನೆ. ನಾಲ್ಕನೇ ದಿನ: ಪ್ರಾಣಿ ಸಾಮ್ರಾಜ್ಯ. ಐದನೇ ದಿನ: ಜೀವ ಜಗತ್ತು, ಜೈವಿಕ ವರ್ಗೀಕರಣ ಮತ್ತು ಸಸ್ಯ ಸಾಮ್ರಾಜ್ಯ. ಆರನೇ ದಿನ: ರೂಪವಿಜ್ಞಾನ ಮತ್ತು ಅಂಗರಚನೆ. ಏಳನೇ ದಿನ: ಪರೀಕ್ಷಾ ಸಮಯದಲ್ಲಿ ಒಂದು ಪೂರ್ಣ ಮಾದರಿ ಪತ್ರಿಕೆ ಬರೆಯಿರಿ ಮತ್ತು ಐದೂ ಚಿತ್ರಗಳನ್ನು ಮತ್ತೆ ಬರೆಯಿರಿ.", "hi": "यह रही सात दिन की दोहराने की योजना। पहला दिन: कोशिका, जीवन की इकाई। दूसरा दिन: कोशिका के चित्र और जैव अणु। तीसरा दिन: कोशिका चक्र और कोशिका विभाजन। चौथा दिन: प्राणी जगत। पाँचवाँ दिन: जीव जगत, जैविक वर्गीकरण और पादप जगत। छठा दिन: आकारिकी और शारीरिकी। सातवाँ दिन: परीक्षा के समय में एक पूरा मॉडल पेपर लिखिए और पाँचों चित्र फिर से बनाइए।"}, {"en": "That brings us to the end. Focus on the four high-mark chapters, practise your diagrams, and write every answer point by point. Regular revision always beats last-minute reading. All the best for your examination. Narendra Sir, BAIO Learning System.", "kn": "ಇಲ್ಲಿಗೆ ಅವಧಿ ಮುಗಿಯುತ್ತದೆ. ಹೆಚ್ಚು ಅಂಕದ ನಾಲ್ಕು ಅಧ್ಯಾಯಗಳ ಮೇಲೆ ಗಮನ ಕೊಡಿ, ಚಿತ್ರಗಳನ್ನು ಅಭ್ಯಾಸ ಮಾಡಿ, ಮತ್ತು ಪ್ರತಿ ಉತ್ತರವನ್ನು ಅಂಶವಾರು ಬರೆಯಿರಿ. ನಿಯಮಿತ ಪುನರಾವರ್ತನೆ ಕೊನೆಯ ಕ್ಷಣದ ಓದಿಗಿಂತ ಯಾವಾಗಲೂ ಉತ್ತಮ. ನಿಮ್ಮ ಪರೀಕ್ಷೆಗೆ ಶುಭಾಶಯಗಳು. ನರೇಂದ್ರ ಸರ್, ಬಿಎಐಒ ಲರ್ನಿಂಗ್ ಸಿಸ್ಟಮ್.", "hi": "यहीं हमारा सत्र समाप्त होता है। अधिक अंकों वाले चार अध्यायों पर ध्यान दीजिए, चित्रों का अभ्यास कीजिए, और हर उत्तर बिंदुवार लिखिए। नियमित दोहराना आखिरी समय की पढ़ाई से हमेशा बेहतर है। आपकी परीक्षा के लिए शुभकामनाएँ। नरेंद्र सर, बीएआईओ लर्निंग सिस्टम।"}];
const T = (cls, html, d) => `<div class="a ${cls}" style="animation-delay:${d||0}s">${html}</div>`;
const chap = (o) => `
  <h2 class="a">${o.title}</h2>
  <div class="a card chp ${o.hot?'gold':''}" data-k="0" style="animation-delay:.1s"><div class="ic">${o.ic}</div><div class="tag">${o.tag}</div><div class="big">${o.marks}</div><div class="ml">marks asked in the paper</div><div class="mn">incl. choice questions</div></div>
  <div class="topics"><div class="label a" style="animation-delay:.15s">Topics to practise</div>
    <div class="chips ${o.hot?'gold':''}">${o.topics.map((t,i)=>`<span class="chip a" data-k="t${i}" style="animation-delay:${.2+i*.06}s">${t}</span>`).join('')}</div></div>
  <div class="a tip" data-k="tip" style="animation-delay:.5s"><b>Scoring tip</b>${o.tip}</div>`;

function insets(){ const cs=getComputedStyle(document.documentElement); const v=k=>parseFloat(cs.getPropertyValue(k))||0; return {t:v('--sat'),l:v('--sal'),r:v('--sar'),b:v('--sab')}; }
function fit(){
  const cw=stage.clientWidth, ch=stage.clientHeight, fsOn=isFs(), rot=fsOn&&ch>cw, ins=insets();
  /* full-screen buttons: size them so all four fit along the short edge */
  const room = rot ? cw : ch, gapPx = Math.max(6, Math.min(12, room * 0.025));
  const btnPx = Math.max(34, Math.min(52, (room - 24 - gapPx * 3) / 4));
  stage.style.setProperty('--fsb', btnPx + 'px'); stage.style.setProperty('--fsg', gapPx + 'px');
  /* keep a strip for the buttons (clear of the iPhone notch) so they never cover the slide */
  const notch = rot ? ins.t : Math.max(ins.l, 0);
  const bar = fsOn ? btnPx + 24 + notch : 0;
  stage.style.setProperty('--fsoff', (notch + 12) + 'px');
  let sc, cx, cy;
  if(rot){ const ah=ch-bar; sc=Math.min(ah/1280,cw/720); cx=cw/2; cy=bar+ah/2; }
  else if(fsOn){ const aw=cw-bar-ins.r; sc=Math.min(aw/1280,ch/720); cx=bar+aw/2; cy=ch/2; }
  else { sc=Math.min(cw/1280,ch/720); cx=cw/2; cy=ch/2; }
  slideEl.style.transform=`translate(${cx}px,${cy}px) ${rot?'rotate(90deg) ':''}scale(${sc}) translate(-640px,-360px)`;
  stage.classList.toggle('rot',rot);
}
function sentences(t){ return t.split(/(?<=[.!?।])\s+/).filter(x=>x.trim()); }
function setCap(t){ capEl.textContent=t||''; capEl.hidden=!capsEl.checked||!t||!playing; }
function clearHl(){ secs[cur].querySelectorAll('.hl').forEach(e=>e.classList.remove('hl')); }
/* which card to light up: use where this sentence sits in the whole explanation (by length, not sentence count),
   so Kannada and Hindi — which split sentences differently — point at the same card as English */
function highlight(j){
  clearHl(); const keys=(SLIDES[cur].keys||[])[j]; if(!keys) return;
  keys.forEach(k=>{ const el= k==='0' ? null : secs[cur].querySelector(`[data-k="${k}"]`); if(el) el.classList.add('hl'); });
}
function show(i, restartAnim){
  cur=Math.max(0,Math.min(SLIDES.length-1,i));
  secs.forEach((s,k)=>{ s.classList.toggle('on',k===cur); });
  const s=secs[cur];
  if(restartAnim!==false){ shownAt=Date.now(); s.querySelectorAll('.a').forEach(a=>{ a.style.animation='none'; void a.offsetWidth; a.style.animation=''; }); }
  s.querySelectorAll('.bar').forEach(b=>{ b.style.width='0'; requestAnimationFrame(()=>requestAnimationFrame(()=>b.style.width=b.dataset.w+'%')); });
  clearHl(); setCap('');
  document.getElementById('count').textContent=`${cur+1} / ${SLIDES.length}`;
  document.querySelectorAll('#prog button').forEach((b,k)=>b.classList.toggle('on',k<=cur));
  store.set('baio_mt_slide',String(cur));
}

/* ---------- voice ---------- */
const TTS='speechSynthesis' in window?window.speechSynthesis:null;
const TAG={en:'en-IN',kn:'kn-IN',hi:'hi-IN'};
function voicesFor(l){ return TTS?TTS.getVoices().filter(v=>(v.lang||'').replace('_','-').toLowerCase().startsWith(l)):[]; }
function pickVoice(l){ const vs=voicesFor(l), saved=store.get('baio_mt_voice_'+l); return (saved&&vs.find(v=>v.voiceURI===saved))||vs.find(v=>v.lang===TAG[l])||vs[0]||null; }
function fillVoices(){
  const vs=voicesFor(lang), v=pickVoice(lang);
  voiceSel.innerHTML = vs.length ? vs.map(x=>`<option value="${x.voiceURI}" ${v&&x.voiceURI===v.voiceURI?'selected':''}>${x.name}</option>`).join('') : `<option value="">No ${lang==='kn'?'Kannada':lang==='hi'?'Hindi':'English'} voice on this device</option>`;
}
if(TTS){ fillVoices(); TTS.onvoiceschanged=fillVoices; }
const keep=[];
/* time until this slide's entrance animation has finished */
function settleMs(){ let m=0; secs[cur].querySelectorAll('.a').forEach(a=>{ m=Math.max(m,(parseFloat(a.style.animationDelay)||0)+0.6); }); if(secs[cur].querySelector('.bar')) m=Math.max(m,1.1); return m*1000+150; }
function explain(){
  const id=++runId, parts=sentences(NARR[cur][lang]), rate=parseFloat(rateEl.value)||1, v=pickVoice(lang);
  /* English sentence each spoken sentence belongs to: same index when the counts match,
     otherwise by where the sentence sits in the whole text */
  const en=sentences(NARR[cur].en);
  const bounds=ps=>{ const tot=ps.reduce((a,p)=>a+p.length,0)||1; const b=[]; let acc=0; ps.forEach(p=>{ b.push([acc/tot,(acc+p.length)/tot]); acc+=p.length; }); return b; };
  const enB=bounds(en), myB=bounds(parts);
  const enIdx = parts.length===en.length ? parts.map((_,k)=>k) : myB.map(([a,b])=>{ const m=(a+b)/2; const j=enB.findIndex(([x,y])=>m>=x&&m<y); return j<0?en.length-1:j; });
  if(TTS&&(TTS.speaking||TTS.pending)) TTS.cancel();
  let i=0;
  const next=()=>{ if(id!==runId||!playing) return; clearHl(); if(autoEl.checked&&cur<SLIDES.length-1){ setTimeout(()=>{ if(id===runId&&playing){ show(cur+1); setTimeout(()=>{ if(id===runId&&playing) explain(); },settleMs()); } },600); } else { setPlay(false); } };
  const part=()=>{
    if(id!==runId) return; if(i>=parts.length){ next(); return; }
    const k=i, t=parts[i++];
    /* caption + highlight appear the moment the voice actually starts this sentence */
    let shown=false; const reveal=()=>{ if(shown||id!==runId) return; shown=true; setCap(t); highlight(enIdx[k]); };
    const est=t.length*70/rate, t0=Date.now();
    if(!TTS){ reveal(); setTimeout(part, Math.max(2500,est)); return; }
    const fallback=setTimeout(reveal,1200);
    const u=new SpeechSynthesisUtterance(t); u.lang=TAG[lang]; u.rate=rate; if(v) try{u.voice=v}catch(e){}
    let done=false, spoke=false;
    const fin=()=>{ if(done||id!==runId) return; done=true; clearTimeout(wd); clearInterval(poll); clearTimeout(fallback); reveal(); setTimeout(part, spoke?150:Math.max(0,est-(Date.now()-t0))); };
    u.onstart=()=>{ spoke=true; clearTimeout(fallback); reveal(); }; u.onend=fin; u.onerror=fin;
    const wd=setTimeout(fin, est*2+4000);
    let quiet=0; const poll=setInterval(()=>{ if(done) return clearInterval(poll); if(Date.now()-t0>1500&&!TTS.speaking&&!TTS.pending){ if(++quiet>=2) fin(); } else quiet=0; },300);
    keep.push(u); if(keep.length>30) keep.shift();
    TTS.speak(u);
  };
  setTimeout(part,120);
}
function setPlay(on){ playing=on; const t=on?'❚❚ Pause':'▶ Explain'; document.getElementById('play').textContent=t; document.getElementById('fsPlay').textContent=on?'❚❚':'▶'; document.getElementById('fsPlay').setAttribute('aria-label',on?'Pause':'Explain'); }
function stop(){ runId++; setPlay(false); if(TTS) TTS.cancel(); clearHl(); setCap(''); }
let shownAt=0;
function play(){ setPlay(true); const id=runId, wait=Math.max(0, settleMs()-(Date.now()-shownAt)); setTimeout(()=>{ if(id===runId&&playing) explain(); }, wait); }
function go(i){ const was=playing; stop(); show(i); if(was) play(); }

let sx=null; stage.addEventListener('touchstart',e=>{ const t=e.touches[0]; sx= (isFs()&&stage.clientHeight>stage.clientWidth)?t.clientY:t.clientX; },{passive:true});
stage.addEventListener('touchend',e=>{ if(sx===null) return; const t=e.changedTouches[0]; const d=((isFs()&&stage.clientHeight>stage.clientWidth)?t.clientY:t.clientX)-sx; sx=null; if(Math.abs(d)>50) go(cur+(d<0?1:-1)); });
function isFs(){ return document.fullscreenElement===stage||document.webkitFullscreenElement===stage||stage.classList.contains('fs'); }
document.getElementById('fs').onclick=()=>{ if(window.top!==window && !(document.fullscreenEnabled||document.webkitFullscreenEnabled)){ window.top.location.href=location.href.split('#')[0]+'#fs'; return; } stage.classList.add('fs'); document.body.classList.add('fsmode'); try{ const r=(stage.requestFullscreen||stage.webkitRequestFullscreen||function(){}).call(stage); if(r&&r.catch) r.catch(()=>{}); }catch(e){} try{ screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} setTimeout(fit,250); };
document.getElementById('fsExit').onclick=()=>{ if(document.fullscreenElement||document.webkitFullscreenElement) (document.exitFullscreen||document.webkitExitFullscreen).call(document); stage.classList.remove('fs'); document.body.classList.remove('fsmode'); setTimeout(fit,250); };
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement){ stage.classList.remove('fs'); document.body.classList.remove('fsmode'); } setTimeout(fit,150); });
window.addEventListener('resize',fit); window.addEventListener('orientationchange',()=>setTimeout(fit,300));
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&playing) stop(); });

setLang(lang);
const saved=parseInt(store.get('baio_mt_slide'),10); show(isNaN(saved)?0:saved); fit();
if(location.hash==='#fs'){ stage.classList.add('fs'); document.body.classList.add('fsmode'); setTimeout(fit,100); }
if(window.top!==window){ document.getElementById('backBtn').style.display='none'; document.getElementById('shareBtn').style.display='none'; document.body.style.background='transparent'; }
if(!TTS) document.getElementById('hint').textContent='This browser has no speech voice — captions will play by themselves when you tap Explain.';

/* Share — native share sheet on phones; WhatsApp / Telegram / copy link otherwise */
(function(){
  var URL_='https://narendra-bio-sir.github.io/BAIO-Learning-System-By-Narendra-Sir/exam-corner.html#midterm';
  var MSG={
    en:"📝 How to prepare for the I PUC Biology mid-term — Narendra Sir explains, slide by slide (English · ಕನ್ನಡ · हिंदी).",
    kn:"📝 ಪ್ರಥಮ ಪಿಯುಸಿ ಜೀವಶಾಸ್ತ್ರ ಮಧ್ಯಾವಧಿ ಪರೀಕ್ಷೆಗೆ ಹೇಗೆ ಸಿದ್ಧರಾಗಬೇಕು — ನರೇಂದ್ರ ಸರ್ ಸ್ಲೈಡ್‌ವಾರು ವಿವರಿಸುತ್ತಾರೆ (English · ಕನ್ನಡ · हिंदी).",
    hi:"📝 प्रथम पीयूसी जीव विज्ञान मध्यावधि परीक्षा की तैयारी कैसे करें — नरेंद्र सर स्लाइड दर स्लाइड समझाते हैं (English · ಕನ್ನಡ · हिंदी)."
  };
  var LBL={en:['Share','Copy link','Link copied ✓'],kn:['ಹಂಚಿಕೊಳ್ಳಿ','ಲಿಂಕ್ ನಕಲಿಸಿ','ಲಿಂಕ್ ನಕಲಾಯಿತು ✓'],hi:['शेयर करें','लिंक कॉपी करें','लिंक कॉपी हो गया ✓']};
  function lang(){ var l='en'; try{ l=localStorage.getItem('baio_mt_lang')||document.documentElement.lang||'en'; }catch(e){} return MSG[l]?l:'en'; }
  var sheet=document.createElement('div'); sheet.className='share-sheet'; sheet.hidden=true;
  sheet.innerHTML='<div class="share-box" role="dialog" aria-modal="true" aria-labelledby="shareTtl"><b id="shareTtl"></b>'+
    '<a class="share-opt wa" target="_blank" rel="noopener">🟢 WhatsApp</a><a class="share-opt tg" target="_blank" rel="noopener">✈️ Telegram</a>'+
    '<button class="share-opt cp" type="button"></button><input class="share-url" readonly aria-label="Link"><button class="share-x" type="button" aria-label="Close">✕</button></div>';
  document.body.appendChild(sheet);
  function close(){ sheet.hidden=true; }
  sheet.addEventListener('click',function(e){ if(e.target===sheet||e.target.closest('.share-x')) close(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
  sheet.querySelector('.cp').addEventListener('click',function(){
    var b=this, inp=sheet.querySelector('.share-url'), l=lang();
    function done(){ b.textContent=LBL[l][2]; setTimeout(function(){ b.textContent='🔗 '+LBL[l][1]; },1800); }
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(URL_).then(done,function(){ inp.select(); document.execCommand('copy'); done(); });
    else { inp.select(); document.execCommand('copy'); done(); }
  });
  window.sharePresentation=function(){
    var l=lang(), text=MSG[l];
    if(navigator.share){ navigator.share({title:'BAIO · Mid-Term 2026',text:text,url:URL_}).catch(function(){}); return; }
    sheet.querySelector('#shareTtl').textContent=LBL[l][0];
    sheet.querySelector('.wa').href='https://wa.me/?text='+encodeURIComponent(text+'\n'+URL_);
    sheet.querySelector('.tg').href='https://t.me/share/url?url='+encodeURIComponent(URL_)+'&text='+encodeURIComponent(text);
    sheet.querySelector('.cp').textContent='🔗 '+LBL[l][1];
    sheet.querySelector('.share-url').value=URL_;
    sheet.hidden=false; sheet.querySelector('.wa').focus();
  };
  document.querySelectorAll('[data-share]').forEach(function(b){ b.addEventListener('click',window.sharePresentation); });
})();
</script>
</body>
</html>
