<!DOCTYPE html>
<html lang="en">
<head>

<title>Student Feedback · BAIO</title>

<style>
:root{--paper:#FBF7EE;--card:#FFFFFF;--ink:#1D2433;--dim:#5E6677;--gold:#B8912A;--gold2:#E9C45A;--teal:#0E8F7E;--teal-bg:#E6F4F1;--rose:#C2554A;--line:#EADFC6;--navy:#0E1B33;--chip:#FFFFFF;--topbg:rgba(251,247,238,.94);color-scheme:light}
:root[data-theme="dark"]{--paper:#0F1520;--card:#18212F;--ink:#E8ECF2;--dim:#A3ADBD;--gold:#E9C45A;--teal:#3CC9B4;--teal-bg:#123A36;--rose:#F08A7E;--line:#2A3547;--navy:#0B1424;--chip:#1E2938;--topbg:rgba(15,21,32,.94);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 Inter,'Noto Sans Devanagari','Noto Sans Kannada',sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}
.top{position:sticky;top:0;z-index:10;background:var(--topbg);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand .b{width:34px;height:34px;border-radius:9px;background:var(--navy);color:var(--gold2);display:grid;place-items:center;font:700 18px Fraunces;border:1px solid var(--line)}
.tools{display:flex;gap:6px;align-items:center}
.tools button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 13px Inter,'Noto Sans Devanagari','Noto Sans Kannada';cursor:pointer;min-height:38px}
.tools button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .tools button.on{background:var(--gold2);color:#0E1B33;border-color:var(--gold2)}
.tools .thm{width:38px;padding:0;font-size:16px}
.progress{height:4px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold2));transition:width .3s}
.hero{margin-top:20px;border-radius:24px;padding:28px 24px;background:linear-gradient(140deg,#0E1B33 0%,#13304A 55%,#0E8F7E 140%);color:#fff;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(233,196,90,.35),rgba(233,196,90,0) 70%)}
.eyebrow{font:700 12px Inter;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold2)}
.hero h1{font:700 30px/1.2 Fraunces,'Noto Sans Devanagari','Noto Sans Kannada',serif;margin:10px 0 8px}
.hero p{margin:0;color:#D6E2EC}
.hero .meta{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.hero .meta span{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font:600 13px Inter,'Noto Sans Devanagari','Noto Sans Kannada'}
.note{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.note p{margin:0 0 10px}
.sign{font:600 26px/1 Caveat,cursive;color:var(--navy)}
:root[data-theme="dark"] .sign{color:var(--gold2)}
.sign-sub{font:500 12.5px Inter;color:var(--dim)}
.sec{margin-top:28px}
.sec h2{font:700 21px/1.3 Fraunces,'Noto Sans Devanagari','Noto Sans Kannada',serif;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.sec h2 .n{width:32px;height:32px;border-radius:10px;background:var(--teal-bg);color:var(--teal);display:grid;place-items:center;font:700 15px Inter;flex:0 0 auto}
.sec .lead{color:var(--dim);margin:0 0 12px;font-size:14.5px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.q .qt{font:600 15.5px/1.45 Inter,'Noto Sans Devanagari','Noto Sans Kannada';margin-bottom:10px}
.q .qd{font-size:13px;color:var(--dim);margin:-6px 0 10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:9px 13px;font:500 14px Inter,'Noto Sans Devanagari','Noto Sans Kannada';cursor:pointer;min-height:42px;text-align:left}
.opt.on{border-color:var(--teal);background:var(--teal-bg);color:var(--ink);font-weight:700}
.stars{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.star{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:22px;cursor:pointer;color:#C9C2B0;line-height:1}
.star.on{color:#E2A913;border-color:#E9C45A;background:#FFF6DC}
:root[data-theme="dark"] .star.on{background:#2A2414}
.stars .lbl{font:600 13px Inter,'Noto Sans Devanagari','Noto Sans Kannada';color:var(--dim);margin-left:6px}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:11px 12px;font:400 15px Inter,'Noto Sans Devanagari','Noto Sans Kannada';resize:vertical}
textarea{min-height:84px}
textarea:focus,input:focus{outline:none;border-color:var(--teal)}
.tool{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:12px 0;border-top:1px dashed var(--line)}
.tool:first-of-type{border-top:0;padding-top:2px}
.tool .tn{font:600 15px Inter,'Noto Sans Devanagari','Noto Sans Kannada';display:flex;gap:8px;align-items:flex-start}
.tool .tn i{font-style:normal;font-size:18px;line-height:1.3}
.tool .td{font-size:13px;color:var(--dim);margin-top:1px;font-weight:400}
.tool .opts .opt{padding:7px 11px;min-height:38px;font-size:13.5px}
.submit{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--topbg);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.submit-in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.submit .cnt{font:600 12.5px Inter,'Noto Sans Devanagari','Noto Sans Kannada';color:var(--dim);flex:1;min-width:0}
.btn{border:0;border-radius:14px;padding:12px 16px;font:700 15px Inter,'Noto Sans Devanagari','Noto Sans Kannada';cursor:pointer;min-height:48px}
.btn.wa{background:#1FA855;color:#fff}
.btn.sec2{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.done{display:none;margin-top:18px;background:var(--teal-bg);border:1px solid var(--teal);border-radius:16px;padding:16px 18px}
.done.on{display:block}
footer{margin-top:30px;text-align:center;color:var(--dim);font-size:13px}
@media (max-width:420px){.hero h1{font-size:25px}.tools button{padding:7px 9px}.btn{padding:12px 12px;font-size:14px}}
</style>
</head>

 {id:'support',type:'multi',t:T('What extra support do you want from me? (tick all)','ನನ್ನಿಂದ ಯಾವ ಹೆಚ್ಚುವರಿ ಬೆಂಬಲ ಬೇಕು? (ಎಲ್ಲವನ್ನೂ ಆರಿಸು)','तुम्हें मुझसे कौन-सी अतिरिक्त मदद चाहिए? (सभी चुनो)'),o:[T('Full-length NEET mock tests','ಪೂರ್ಣ NEET ಮಾದರಿ ಪರೀಕ್ಷೆಗಳು','पूर्ण NEET मॉक टेस्ट'),T('Weekly chapter tests','ವಾರದ ಅಧ್ಯಾಯ ಪರೀಕ್ಷೆಗಳು','साप्ताहिक अध्याय टेस्ट'),T('Previous-year NEET questions','ಹಿಂದಿನ ವರ್ಷಗಳ NEET ಪ್ರಶ್ನೆಗಳು','पिछले वर्षों के NEET प्रश्न'),T('NCERT line-by-line revision','NCERT ಸಾಲು-ಸಾಲಿನ ಪುನರಾವರ್ತನೆ','NCERT लाइन-दर-लाइन रिवीज़न'),T('Doubt-clearing sessions','ಸಂದೇಹ ನಿವಾರಣಾ ತರಗತಿಗಳು','डाउट क्लियरिंग सत्र'),T('Diagram practice sessions','ಚಿತ್ರ ಅಭ್ಯಾಸ ತರಗತಿಗಳು','चित्र अभ्यास सत्र'),T('More reels & podcasts','ಹೆಚ್ಚು ರೀಲ್ಸ್ ಮತ್ತು ಪಾಡ್‌ಕಾಸ್ಟ್','ज़्यादा रील्स और पॉडकास्ट'),T('Personal report card after tests','ಪರೀಕ್ಷೆಯ ನಂತರ ವೈಯಕ್ತಿಕ ವರದಿ ಪತ್ರ','टेस्ट के बाद व्यक्तिगत रिपोर्ट कार्ड'),T('Exam stress & motivation talks','ಪರೀಕ್ಷಾ ಒತ್ತಡ ಮತ್ತು ಪ್ರೇರಣೆ ಮಾತುಕತೆ','परीक्षा तनाव और प्रेरणा पर बातचीत')]},

 {id:'like',type:'text',t:T('What do you like most about my classes or the BAIO app?','ನನ್ನ ತರಗತಿ ಅಥವಾ BAIO ಆ್ಯಪ್‌ನಲ್ಲಿ ನಿನಗೆ ಹೆಚ್ಚು ಇಷ್ಟವಾದದ್ದು ಯಾವುದು?','मेरी कक्षाओं या BAIO ऐप में तुम्हें सबसे ज़्यादा क्या पसंद है?')},
 {id:'improve',type:'text',t:T('What should I improve or add?','ನಾನು ಏನನ್ನು ಉತ್ತಮಪಡಿಸಬೇಕು ಅಥವಾ ಸೇರಿಸಬೇಕು?','मुझे क्या सुधारना या जोड़ना चाहिए?')},
 {id:'overall',type:'rate',t:T('Overall rating','ಒಟ್ಟಾರೆ ರೇಟಿಂಗ್','कुल रेटिंग')},
 {id:'recommend',type:'choice',t:T('Would you recommend BAIO to your friends?','BAIO ಅನ್ನು ನಿನ್ನ ಸ್ನೇಹಿತರಿಗೆ ಶಿಫಾರಸು ಮಾಡುವೆಯಾ?','क्या तुम BAIO की सिफ़ारिश अपने दोस्तों से करोगे?'),o:[T('Yes, definitely','ಹೌದು, ಖಂಡಿತ','हाँ, ज़रूर'),T('Maybe','ಬಹುಶಃ','शायद'),T('No','ಇಲ್ಲ','नहीं')]},
 {id:'msg',type:'text',t:T('A message for Narendra Sir','ನರೇಂದ್ರ ಸರ್‌ಗೆ ಒಂದು ಸಂದೇಶ','नरेंद्र सर के लिए एक संदेश')}]}
];
const DRAFT='baio_fb_student_v1';
let A={};try{A=JSON.parse(localStorage.getItem(DRAFT)||'{}')||{}}catch(e){A={}}
let lang='en';try{const s=localStorage.getItem('baio_fb_lang');if(L[s])lang=s}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){try{localStorage.setItem(DRAFT,JSON.stringify(A))}catch(e){}count()}
function allQ(){const r=[];S.forEach(s=>s.q.forEach(q=>{if(q.type==='tools')q.items.forEach(it=>r.push({id:'tool_'+it[0]}));else r.push(q)}));return r}
function filled(id){const v=A[id];return Array.isArray(v)?v.length>0:(v!==undefined&&v!==null&&String(v).trim()!=='')}
function count(){const qs=allQ(),a=qs.filter(q=>filled(q.id)).length;document.getElementById('cnt').textContent=L[lang].answered(a,qs.length);document.getElementById('bar').style.width=(a/qs.length*100)+'%'}
function render(){
 const t=L[lang];document.documentElement.lang=lang;
 document.getElementById('langs').innerHTML=[['en','English'],['kn','ಕನ್ನಡ'],['hi','हिंदी']].map(([k,n])=>`<button type="button" class="${k===lang?'on':''}" data-l="${k}">${n}</button>`).join('');
 let h=`<div class="hero"><div class="eyebrow">${t.eyebrow}</div><h1>${t.h1}</h1><p>${t.sub}</p><div class="meta">${t.meta.map(m=>`<span>${m}</span>`).join('')}</div></div>`;
 h+=`<div class="note"><p><b>${t.note[0]}</b></p><p>${t.note[1]}</p><p>${t.note[2]}</p><div class="sign">${t.sig}</div><div class="sign-sub">${t.sigSub}</div></div>`;
 S.forEach((s,si)=>{
  h+=`<div class="sec"><h2><span class="n">${si+1}</span>${s.t[lang]}</h2><p class="lead">${s.l[lang]}</p>`;
  s.q.forEach(q=>{
   if(q.type==='tools'){
    h+=`<div class="q">`+q.items.map(it=>{const id='tool_'+it[0];return `<div class="tool"><div class="tn"><i>${it[1]}</i><div>${it[2][lang]}<div class="td">${it[3][lang]}</div></div></div><div class="opts">${t.tOpts.map((o,oi)=>`<button type="button" class="opt ${A[id]===oi?'on':''}" data-q="${id}" data-v="${oi}">${o}</button>`).join('')}</div></div>`}).join('')+`</div>`;return}
   h+=`<div class="q"><div class="qt">${q.t[lang]}</div>`;
   if(q.type==='text') h+=q.short?`<input type="text" data-t="${q.id}" value="${esc(A[q.id]||'')}" placeholder="${t.ph}">`:`<textarea data-t="${q.id}" placeholder="${t.ph}">${esc(A[q.id]||'')}</textarea>`;
   if(q.type==='choice') h+=`<div class="opts">${q.o.map((o,oi)=>`<button type="button" class="opt ${A[q.id]===oi?'on':''}" data-q="${q.id}" data-v="${oi}">${o[lang]}</button>`).join('')}</div>`;
   if(q.type==='multi'){const cur=A[q.id]||[];h+=`<div class="opts">${q.o.map((o,oi)=>`<button type="button" class="opt ${cur.includes(oi)?'on':''}" data-m="${q.id}" data-v="${oi}">${cur.includes(oi)?'✓ ':''}${o[lang]}</button>`).join('')}</div>`}
   if(q.type==='rate'){const v=A[q.id]||0;h+=`<div class="stars">${[1,2,3,4,5].map(n=>`<button type="button" class="star ${n<=v?'on':''}" data-r="${q.id}" data-v="${n}" aria-label="${n}">★</button>`).join('')}<span class="lbl">${t.rate[v]||''}</span></div>`}
   h+=`</div>`});
  h+=`</div>`});
 h+=`<div class="done" id="done">${t.done}</div><footer>${t.foot}</footer>`;
 document.getElementById('app').innerHTML=h;
 document.getElementById('sendBtn').textContent='💬 '+t.send;document.getElementById('copyBtn').textContent=t.copy;
 count();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.l){lang=b.dataset.l;try{localStorage.setItem('baio_fb_lang',lang)}catch(x){}render();return}
 if(b.dataset.q){const id=b.dataset.q,v=+b.dataset.v;A[id]=A[id]===v?undefined:v;b.parentNode.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',A[id]===+o.dataset.v));save();return}
 if(b.dataset.m){const id=b.dataset.m,v=+b.dataset.v,cur=A[id]||[];A[id]=cur.includes(v)?cur.filter(x=>x!==v):cur.concat(v);
  const q=S.flatMap(s=>s.q).find(x=>x.id===id);b.classList.toggle('on',A[id].includes(v));b.textContent=(A[id].includes(v)?'✓ ':'')+q.o[v][lang];save();return}
 if(b.dataset.r){const id=b.dataset.r,v=+b.dataset.v;A[id]=v;b.parentNode.querySelectorAll('.star').forEach(s=>s.classList.toggle('on',+s.dataset.v<=v));b.parentNode.querySelector('.lbl').textContent=L[lang].rate[v];save();return}
});
document.addEventListener('input',e=>{const id=e.target.dataset&&e.target.dataset.t;if(id){A[id]=e.target.value;save()}});
function message(){
 const stars=n=>n?'★'.repeat(n)+'☆'.repeat(5-n)+' ('+L.en.rate[n]+')':'—';
 const q0=S[0].q,nm=(A.name||'').trim()||'Student',
  cls=A.cls!=null?q0[2].o[A.cls].en:'',sec=A.section!=null?q0[3].o[A.section].en:'',roll=(A.roll||'').trim();
 let m='*BAIO Student Feedback — '+nm+'*'+([cls,sec].filter(Boolean).length?' ('+[cls,sec].filter(Boolean).join(' ')+')':'')+(roll?' · Roll '+roll:'')+'\n';
 S.forEach(s=>{
  m+='\n*'+s.t.en+'*\n';
  s.q.forEach(q=>{
   if(q.type==='tools'){q.items.forEach(it=>{const v=A['tool_'+it[0]];m+='• '+it[2].en+': '+(v===undefined||v===null?'—':L.en.tOpts[v])+'\n'});return}
   let v=A[q.id],out='—';
   if(q.type==='text'&&v&&String(v).trim())out=String(v).trim();
   if(q.type==='choice'&&v!==undefined&&v!==null)out=q.o[v].en;
   if(q.type==='multi'&&v&&v.length)out=v.slice().sort((a,b)=>a-b).map(i=>q.o[i].en).join(', ');
   if(q.type==='rate')out=stars(v);
   m+='• '+q.t.en+': '+out+'\n';
  })});
 m+='\n(Form language: '+({en:'English',kn:'Kannada',hi:'Hindi'})[lang]+')';
 return m;
}
document.getElementById('sendBtn').onclick=()=>{
 const url='https://wa.me/'+WA+'?text='+encodeURIComponent(message());
 document.getElementById('done').classList.add('on');
 window.open(url,'_blank')||(location.href=url);
};
document.getElementById('copyBtn').onclick=async()=>{
 const b=document.getElementById('copyBtn'),txt=message();
 try{await navigator.clipboard.writeText(txt)}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(x){}ta.remove()}
 b.textContent=L[lang].copied;setTimeout(()=>b.textContent=L[lang].copy,1800);
};
(function(){const r=document.documentElement,b=document.getElementById('thm');
function set(t,s){r.setAttribute('data-theme',t);b.textContent=t==='dark'?'☀️':'🌙';if(s){try{localStorage.setItem('baio-report-theme',t)}catch(e){}}}
let s=null;try{s=localStorage.getItem('baio-report-theme')}catch(e){}
set(s||'light');b.onclick=()=>set(r.getAttribute('data-theme')==='dark'?'light':'dark',true)})();
render();
</script>
</body>
</html>
