var lang = 'en'; try{ var sl = localStorage.getItem('baio_lang'); if(T[sl]) lang = sl; }catch(e){}

sw.innerHTML = [['en','EN'],['kn','ಕನ್ನಡ'],['hi','हिंदी']].map(function(x){ return '<button class="lang-btn" data-l="' + x[0] + '">' + x[1] + '</button>'; }).join('');
sw.onclick = function(e){ var b = e.target.closest('[data-l]'); if(!b) return; lang = b.dataset.l; try{ localStorage.setItem('baio_lang', lang); }catch(x){} draw(); };
function u(){ return T[lang]; }
function chName(k){ var c = D.chapters[k]; return c[lang] || c.en; }

var app = document.getElementById('app'), view = 'home', st = get(SKEY), timer = null, filt = 'all';
function daysLeft(){ return Math.ceil((new Date(D.date + 'T09:00:00+05:30') - Date.now()) / 864e5); }
function order(){ var o = {}; Q.forEach(function(q, i){ (o[q.c] = o[q.c] || []).push(i); }); return o; }
function nAns(a){ return Object.keys(a || {}).length; }

function homeHtml(){
  var t = u(), d = daysLeft(), best = get(BKEY), cnt = {};
  Q.forEach(function(q){ cnt[q.c] = (cnt[q.c] || 0) + 1; });
  var h = '<div class="hero"><div class="eyebrow">' + t.eyebrow + '</div><h1>' + t.h1 + '</h1><p>' + t.intro + '</p>';
  h += '<div class="when">📅 ' + (d > 0 ? t.on + ' · <b>' + d + '</b> ' + t.left : d === 0 ? t.today : t.over) + '</div></div>';
  h += '<div class="facts"><div class="fact"><b>' + N + '</b><small>' + t.fq + '</small></div><div class="fact"><b>' + D.minutes + '</b><small>' + t.fm + '</small></div><div class="fact"><b>+1</b><small>' + t.fmk + '</small></div><div class="fact"><b>0</b><small>' + t.fneg + '</small></div></div>';
  h += '<div class="card"><h3 style="font-size:16px">' + t.chH + '</h3><div class="chl">' + Object.keys(cnt).map(function(k){ return '<div><span>' + chName(k) + '</span><b>' + cnt[k] + ' ' + t.qs + '</b></div>'; }).join('') + '</div></div>';
  h += '<div class="card"><h3 style="font-size:16px">' + t.insH + '</h3><ul class="ins">' + t.ins.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul></div>';
  if(best) h += '<div class="card" style="text-align:center"><b style="font:800 28px \'Space Grotesk\';color:var(--gold)">' + best.s + '/60</b><div class="note" style="margin-top:2px">' + t.best + ' · ' + best.n + ' ' + t.attempts + '</div></div>';

  } else h += '<div class="card"><button class="btn pri big" data-a="start">' + t.start + '</button></div>';
  h += '<p class="note">' + t.note + '</p>';

function qHtml(q, i, mode, a){
  var t = u(), h = '<div class="q" id="q' + i + '">';
  if(mode === 'review'){
    var v = a == null ? 'skip' : a === q.a ? 'ok' : 'bad';
    h += '<span class="verdict ' + v + '">' + (v === 'ok' ? '✓ ' + t.correct : v === 'bad' ? '✗ ' + t.wrong : '— ' + t.skipped) + '</span>';
  }
  h += '<div class="qt"><span class="qn">' + (i + 1) + '.</span>' + (q.src === 'new' ? '<span class="tag">' + t.newQ + '</span> ' : ' ') + q.q + '</div>';
  if(q.img) h += '<img class="qimg" src="' + q.img + '" alt="Diagram for question ' + (i + 1) + '">';
  h += '<div class="opts">' + q.o.map(function(o, k){
    var cls = 'opt';
    if(mode === 'review'){ if(k === q.a) cls += ' ok'; else if(k === a) cls += ' bad'; }
    else if(a === k) cls += ' sel';
    return '<label class="' + cls + '"><input type="radio" name="r' + i + '" value="' + k + '"' + (a === k ? ' checked' : '') + (mode === 'review' ? ' disabled' : '') + '><span class="l">' + LET[k] + ')</span><span>' + o + '</span></label>';
  }).join('') + '</div>';
  if(mode === 'test' && a != null) h += '<button class="clear" data-clear="' + i + '">✕ ' + t.clear + '</button>';
  if(mode === 'review') h += '<div class="explain"><b class="h">' + t.why + '</b>' + (a !== q.a ? t.rightAns + ': <b>' + LET[q.a] + ') ' + q.o[q.a] + '</b><br>' : '') + q.e + '</div>';
  return h + '</div>';
}
function palHtml(mode){
  return Q.map(function(q, i){
    var a = st.ans[i], cls = '';
    if(mode === 'review') cls = a == null ? '' : a === q.a ? 'ok' : 'bad'; else if(a != null) cls = 'done';
    return '<button class="' + cls + '" data-go="' + i + '">' + (i + 1) + '</button>';
  }).join('');
}
function testHtml(){
  var t = u(), o = order(), h = '<div class="timerbar"><div class="tb-top"><div><div class="t" id="tm">--:--</div><small><span id="na">' + nAns(st.ans) + '</span>/' + N + ' ' + t.answered + '</small></div>' +
    '<div class="row"><button class="pal-tg" data-a="pal">🔢 ' + t.palette + '</button><button class="btn pri" data-a="submit" style="min-height:40px;padding:8px 14px">' + t.submit + '</button></div></div><div class="pal" id="pal">' + palHtml('test') + '</div></div>';
  Object.keys(o).forEach(function(k){
    h += '<div class="sec-h"><h2>' + chName(k) + '</h2><span>' + o[k].length + ' ' + t.qs + '</span></div>';

  });
  h += '<div class="card"><button class="btn pri big" data-a="submit">' + t.submit + '</button></div>';
  return h;

function grade(){
  var r = { s:0, w:0, k:0, ch:{} };
  Q.forEach(function(q, i){ var a = st.ans[i], c = r.ch[q.c] = r.ch[q.c] || { s:0, n:0 }; c.n++;
    if(a == null) r.k++; else if(a === q.a){ r.s++; c.s++; } else r.w++; });
  return r;
}
function resultHtml(){
  var t = u(), r = grade(), pct = Math.round(100 * r.s / N), mi = pct >= 85 ? 0 : pct >= 65 ? 1 : pct >= 40 ? 2 : 3;
  var used = Math.max(1, Math.round(((st.end || Date.now()) - st.start) / 60000));
  var h = '<div class="card"><div class="score-big"><div class="eyebrow">' + t.score + '</div><div class="n">' + r.s + '<small> / ' + N + '</small></div><div class="m">' + t.m[mi] + '</div></div>';
  h += '<div class="parts"><div class="part"><b style="color:var(--ok)">' + r.s + '</b><small>' + t.correct + '</small></div><div class="part"><b style="color:var(--bad)">' + r.w + '</b><small>' + t.wrong + '</small></div><div class="part"><b>' + r.k + '</b><small>' + t.skipped + '</small></div><div class="part"><b>' + Math.min(used, D.minutes) + '</b><small>' + t.time + ' (' + t.min + ')</small></div></div>';

  h += '<div class="card"><h3 style="font-size:16px">' + t.chRes + '</h3>' + Object.keys(r.ch).map(function(k){ var c = r.ch[k], p = Math.round(100 * c.s / c.n), href = D.chapters[k].href;
    return '<div style="margin-top:12px"><div class="row" style="justify-content:space-between"><b style="font-size:14px">' + chName(k) + '</b><span style="font-weight:800;color:var(--gold)">' + c.s + '/' + c.n + '</span></div><div class="bar"><i style="width:' + p + '%"></i></div>' +
      (p < 80 && href ? '<a href="' + href + '" style="font-size:12.5px;font-weight:700">' + t.revise + '</a>' : '') + '</div>'; }).join('') + '</div>';

  Q.forEach(function(q, i){ var a = st.ans[i];

    h += qHtml(q, i, 'review', a); });
  return h;
}
function draw(){
  sw.querySelectorAll('[data-l]').forEach(function(b){ b.classList.toggle('active', b.dataset.l === lang); });
  document.documentElement.lang = lang;
  app.innerHTML = view === 'test' ? testHtml() : view === 'result' ? resultHtml() : homeHtml();
  if(view === 'test') tick();
  app.insertAdjacentHTML('beforeend', '<footer>BAIO Learning System · Narendra Sir, Biology Lecturer · Founder &amp; CEO, BAIO</footer>');

function fmt(ms){ var s = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function remaining(){ return st.start + D.minutes * 60000 - Date.now(); }
function tick(){
  var el = document.getElementById('tm'); if(!el) return;
  var r = remaining(); el.textContent = fmt(r) + ' ' ; el.classList.toggle('low', r < 5 * 60000);
  if(r <= 0){ finish(true); }
}
function startTimer(){ clearInterval(timer); timer = setInterval(function(){ if(view === 'test') tick(); }, 1000); }
function finish(auto){
  clearInterval(timer); st.done = true; st.end = Math.min(Date.now(), st.start + D.minutes * 60000); put(SKEY, st);
  var s = grade().s, b = get(BKEY) || { s:0, n:0 }; b.n++; if(s > b.s) b.s = s; put(BKEY, b);

  window.open('https://wa.me/?text=' + encodeURIComponent(text + '\n' + url), '_blank', 'noopener');

  document.getElementById('na').textContent = nAns(st.ans);

app.addEventListener('click', function(e){
  var c = e.target.closest('[data-clear]');

  else if(a === 'submit'){ var left = N - nAns(st.ans); if(confirm(left ? t.submitQ.replace('{n}', left) : t.submitQ0)) finish(false); }
  else if(a === 'home'){ view = 'home'; draw(); window.scrollTo(0, 0); }
  else if(a === 'shareScore'){ share(t.myScore(grade().s), PAGE); }
});

/* open where the student left off */
if(st && st.done && location.hash !== '#start') view = 'result';
else if(st && !st.done && remaining() > 0) view = 'home';
else if(st && !st.done){ draw(); finish(true); }
