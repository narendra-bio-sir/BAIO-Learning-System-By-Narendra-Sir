.res.bad{background:var(--badbg);border:1px solid var(--bad)}

/* scoring */
function ptsScore(q){ var t=mock.pts[q.id]||{}; return sum(q.p.map(function(p,j){ return t[j]?p[1]:0; })); }
function d2Score(q){ var o=mock.d2[q.id]||{}, c=q.blanks.filter(function(b,j){ return o[j]===b[1]; }).length; return 5*c/q.blanks.length; }
function bestN(arr,scoreFn,n){ var sc=arr.map(function(q){ return {id:q.id,s:scoreFn(q)}; }).sort(function(a,b){ return b.s-a.s; }); var ids={}; sc.slice(0,n).forEach(function(x){ ids[x.id]=1; }); return {total:sum(sc.slice(0,n).map(function(x){ return x.s; })), ids:ids}; }
function scores(){
  var a=sum(mock.mcq.map(function(m){ return m.pick===M.mcq[m.i].a?1:0; }))+sum(M.fib.map(function(q,k){ return mock.fib[k]===q.a?1:0; }));
  var b=bestN(M.B,ptsScore,5), c=bestN(M.C,ptsScore,5), d1=bestN(M.D,ptsScore,4), d2=bestN(M.D2,d2Score,1);
  return {A:a,B:b.total,C:c.total,D:d1.total+d2.total,ids:Object.assign({},b.ids,c.ids,d1.ids,d2.ids),total:a+b.total+c.total+d1.total+d2.total};
}
function renderMark(){
  if(!mock) mock=store('baio_mt_cur');
  if(!mock||!mock.submitted){ go('home'); return; }
  var S=scores(), n=0, h='<div class="back noprint"><button class="btn" id="bk">'+esc(T('home'))+'</button></div>';
  h+='<div class="timerbar"><span><span class="t" id="live">'+fmt(S.total)+'</span> <small>/ 70</small></span><button class="btn pri" id="fin">'+esc(T('finish'))+' →</button></div>';
  h+='<div class="card"><h2 style="font-size:19px">✍️ '+esc(T('marking'))+'</h2><p class="hint" style="font-size:13px;line-height:1.6">'+esc(T('markingS'))+'</p></div>';
  h+='<div class="sec-h"><h2>'+esc(T('partA'))+'</h2><span id="sA">'+S.A+' / 20</span></div>';
  mock.mcq.forEach(function(m){ var q=M.mcq[m.i], ok=m.pick===q.a; n++;
    h+='<div class="q">'+qHead(n,esc(q.q),1,q.ch)+'<div class="res '+(ok?'ok':'bad')+'">'+(ok?'✅ '+esc(T('correct'))+': ':'❌ '+esc(T('wrong'))+' ')+'<b>'+esc(q.o[q.a])+'</b>'+(!ok&&m.pick!=null?' <span class="hint">(you: '+esc(q.o[m.pick])+')</span>':'')+'<br>'+esc(q.e)+'</div></div>'; });
  M.fib.forEach(function(q,k){ var ok=mock.fib[k]===q.a; n++;
    h+='<div class="q">'+qHead(n,esc(q.q),1,q.ch)+'<div class="res '+(ok?'ok':'bad')+'">'+(ok?'✅ '+esc(T('correct'))+': ':'❌ '+esc(T('wrong'))+' ')+'<b>'+esc(q.a)+'</b>'+(!ok&&mock.fib[k]?' <span class="hint">(you: '+esc(mock.fib[k])+')</span>':'')+'<br>'+esc(q.e)+'</div></div>'; });
  function longMark(arr,marks){ var s=''; arr.forEach(function(q){ n++; var sc=ptsScore(q);
    s+='<div class="q" id="q-'+q.id+'"><span class="qscore" data-qs="'+q.id+'">'+fmt(sc)+'/'+marks+'</span>'+qHead(n,esc(q.q),marks,q.ch)+'<span data-cnt="'+q.id+'"></span>'+
      (mock.typed[q.id]?'<div class="model" style="white-space:pre-wrap;font-size:13px"><div class="model-h">✍️ You</div>'+esc(mock.typed[q.id])+'</div>':'')+
      '<div class="row" style="margin-top:10px"><button class="btn teal" data-tog="'+q.id+'">'+esc(T('showModel'))+'</button></div><div data-body="'+q.id+'" hidden>'+
      '<div class="model"><div class="model-h">'+esc(T('modelH'))+'</div>'+q.m+(q.img?'<img class="dimg" loading="lazy" src="'+q.img+'" alt="">':'')+(q.labels?'<p class="hint"><b>'+esc(T('labelsH'))+':</b> '+q.labels.map(esc).join(' · ')+'</p>':'')+'</div>'+
      '<div class="model-h" style="margin-top:12px">'+esc(T('ptsH'))+'</div><div class="pts">'+q.p.map(function(p,j){ return '<label class="pt"><input type="checkbox" data-pt="'+q.id+'" data-j="'+j+'"'+((mock.pts[q.id]||{})[j]?' checked':'')+'><span>'+p[0]+'</span><span class="mk">'+p[1]+'</span></label>'; }).join('')+'</div></div></div>'; });
    return s; }
  h+='<div class="sec-h"><h2>'+esc(T('partB'))+'</h2><span id="sB">'+fmt(S.B)+' / 10</span></div>'+longMark(M.B,2);
  h+='<div class="sec-h"><h2>'+esc(T('partC'))+'</h2><span id="sC">'+fmt(S.C)+' / 15</span></div>'+longMark(M.C,3);
  h+='<div class="sec-h"><h2>'+esc(T('partD'))+'</h2><span id="sD">'+fmt(S.D)+' / 25</span></div><div class="hint" style="font-weight:700;margin-top:8px">'+esc(T('dH'))+'</div>'+longMark(M.D,5);
  h+='<div class="hint" style="font-weight:700;margin-top:14px">'+esc(T('d2H'))+'</div>';
  M.D2.forEach(function(q){ n++; var sc=d2Score(q); h+='<div class="q"><span class="qscore">'+fmt(sc)+'/5</span>'+qHead(n,esc(q.q),5,q.ch)+'<span data-cnt="'+q.id+'"></span>'+d2Inputs(q,0,true,true)+'<div class="res ok" style="margin-top:8px">'+esc(q.e)+'</div></div>'; });
  h+='<div class="row" style="margin-top:20px;justify-content:center"><button class="btn pri" id="fin2">'+esc(T('finish'))+' →</button></div>';
  app.innerHTML=h;
  function refresh(){ var S=scores(); document.getElementById('live').textContent=fmt(S.total); ['A','B','C','D'].forEach(function(p){ var el=document.getElementById('s'+p); if(el) el.textContent=fmt(S[p])+' / '+{A:20,B:10,C:15,D:25}[p]; });
    app.querySelectorAll('[data-qs]').forEach(function(el){ var q=M.B.concat(M.C,M.D).filter(function(x){ return x.id===el.dataset.qs; })[0]; el.textContent=fmt(ptsScore(q))+'/'+sum(q.p.map(function(p){ return p[1]; })); });
    app.querySelectorAll('[data-cnt]').forEach(function(el){ el.innerHTML=S.ids[el.dataset.cnt]?'<span class="counted">'+esc(T('counted'))+'</span>':'<span class="notcounted">'+esc(T('notCounted'))+'</span>'; }); }
  refresh();
  app.querySelectorAll('[data-tog]').forEach(function(b){ b.onclick=function(){ var body=app.querySelector('[data-body="'+b.dataset.tog+'"]'); body.hidden=!body.hidden; b.textContent=body.hidden?T('showModel'):T('hideModel'); }; });
  app.querySelectorAll('[data-pt]').forEach(function(c){ c.onchange=function(){ var o=mock.pts[c.dataset.pt]||(mock.pts[c.dataset.pt]={}); o[+c.dataset.j]=c.checked; save(); refresh(); }; });
  document.getElementById('bk').onclick=function(){ location.hash=''; go('home'); };
  ['fin','fin2'].forEach(function(id){ document.getElementById(id).onclick=function(){ finishMock(); }; });
}
function finishMock(){
  var S=scores(), hist=store('baio_mt_hist')||[], ex=hist.filter(function(h){ return h.id===mock.id; })[0];
  var rec={id:mock.id,at:Date.now(),total:S.total,A:S.A,B:S.B,C:S.C,D:S.D};
  if(ex) Object.assign(ex,rec); else hist.push(rec); store('baio_mt_hist',hist.slice(-30));
  location.hash='result'; go('result');
}
function renderResult(){
  if(!mock) mock=store('baio_mt_cur'); if(!mock){ go('home'); return; }
  var S=scores(), lost={};
  function add(ch,v){ if(v>0) lost[ch]=(lost[ch]||0)+v; }
  mock.mcq.forEach(function(m){ var q=M.mcq[m.i]; if(m.pick!==q.a) add(q.ch,1); });
  M.fib.forEach(function(q,k){ if(mock.fib[k]!==q.a) add(q.ch,1); });
  M.B.concat(M.C,M.D).forEach(function(q){ if(S.ids[q.id]) add(q.ch,sum(q.p.map(function(p){ return p[1]; }))-ptsScore(q)); });
  M.D2.forEach(function(q){ if(S.ids[q.id]) add(q.ch,5-d2Score(q)); });
  var weak=Object.keys(lost).map(Number).sort(function(a,b){ return lost[b]-lost[a]; });
  var h='<div class="back"><button class="btn" id="bk">'+esc(T('home'))+'</button></div><div class="card"><div class="score-big"><div class="hint" style="font-weight:700">'+esc(T('total'))+'</div><div class="n">'+fmt(S.total)+'<small> / 70</small></div></div>'+
   '<div class="parts">'+[['A',20],['B',10],['C',15],['D',25]].map(function(p){ return '<div class="part"><b>'+fmt(S[p[0]])+'</b><small>'+esc(T('part'+p[0]))+' / '+p[1]+'</small></div>'; }).join('')+'</div>'+
   (weak.length?'<h3 style="font-size:15px;margin-top:18px">'+esc(T('weakH'))+'</h3><div class="weak">'+weak.map(function(c){ return '<a href="#chapter" data-ch="'+c+'"><span>'+esc(chName(c))+'</span><b style="color:var(--bad)">−'+fmt(lost[c])+'</b></a>'; }).join('')+'</div>':'<p style="margin-top:14px;font-weight:700;color:var(--ok)">🏆 '+esc(T('allGood'))+'</p>')+
   '<div class="row" style="margin-top:16px"><button class="btn" id="rv">'+esc(T('review'))+'</button><button class="btn pri" id="ag">'+esc(T('again'))+'</button><button class="btn teal" id="sh">'+esc(T('share'))+'</button></div></div>';
  app.innerHTML=h;
  app.querySelectorAll('[data-ch]').forEach(function(a){ a.onclick=function(e){ e.preventDefault(); chSel=+a.dataset.ch; location.hash='chapter'; go('chapter'); }; });
  document.getElementById('bk').onclick=function(){ location.hash=''; go('home'); };
  document.getElementById('rv').onclick=function(){ location.hash='mark'; go('mark'); };
  document.getElementById('ag').onclick=function(){ mock=null; try{ localStorage.removeItem('baio_mt_cur'); }catch(e){} startScreen(); };
  document.getElementById('sh').onclick=function(){ var txt='📝 I scored '+fmt(S.total)+'/70 in Narendra Sir\'s I PUC Biology Mid-Term practice paper on BAIO! Practise yours 👇\nhttps://narendra-bio-sir.github.io/BAIO-Learning-System-By-Narendra-Sir/midterm-practice.html';
    if(navigator.share) navigator.share({text:txt}).catch(function(){}); else window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank','noopener'); };
}

/* ---------- Part A drill ---------- */
function newDrill(){ var items=M.mcq.map(function(q){ return {t:'m',q:q,order:shuffle([0,1,2,3])}; }).concat(M.fib.map(function(q){ return {t:'f',q:q,order:shuffle(M.fibWords.map(function(w,i){ return i; }))}; })); drill={items:shuffle(items),k:0,score:0,ans:null}; }
function renderDrill(){
  if(!drill) newDrill();
  var d=drill, h='<div class="back"><button class="btn" id="bk">'+esc(T('back'))+'</button></div>';
  if(d.k>=d.items.length){
    h+='<div class="card"><div class="score-big"><div class="hint" style="font-weight:700">'+esc(T('drillDone'))+'</div><div class="n">'+d.score+'<small> / 20</small></div></div><div class="row" style="justify-content:center"><button class="btn pri" id="rt">'+esc(T('retry'))+'</button></div></div>';
    app.innerHTML=h; document.getElementById('bk').onclick=function(){ location.hash=''; go('home'); }; document.getElementById('rt').onclick=function(){ newDrill(); render(); }; return;
  }
  var it=d.items[d.k], q=it.q, opts=it.t==='m'?it.order.map(function(i){ return [i,q.o[i]]; }):it.order.map(function(i){ return [M.fibWords[i],M.fibWords[i]]; }), correct=it.t==='m'?q.a:q.a;
  h+='<div class="card"><div class="row" style="justify-content:space-between"><b>⚡ '+esc(T('drillH'))+'</b><span class="hint">'+(d.k+1)+' '+esc(T('of'))+' 20 · ✅ '+d.score+'</span></div><div class="progress"><i style="width:'+(d.k/20*100)+'%"></i></div>'+
   '<div class="drill-q" style="margin-top:14px">'+esc(q.q)+'</div><div class="meta hint">Ch '+esc(chName(q.ch))+'</div><div class="opts">'+opts.map(function(o){ var cls=''; if(d.ans!=null){ if(o[0]===correct) cls=' ok'; else if(o[0]===d.ans) cls=' bad'; } return '<button class="opt'+cls+'" data-v="'+esc(o[0])+'" style="text-align:left;color:var(--ink);font:inherit;font-size:15px"'+(d.ans!=null?' disabled':'')+'>'+esc(o[1])+'</button>'; }).join('')+'</div>'+
   (d.ans!=null?'<div class="res '+(String(d.ans)===String(correct)?'ok':'bad')+'">'+esc(q.e)+'</div><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn pri" id="nx">'+esc(d.k===19?T('finishDrill'):T('next'))+'</button></div>':'')+'</div>';
  app.innerHTML=h;
  document.getElementById('bk').onclick=function(){ location.hash=''; go('home'); };
  app.querySelectorAll('[data-v]').forEach(function(b){ b.onclick=function(){ var v=it.t==='m'?+b.dataset.v:b.dataset.v; d.ans=v; if(v===correct) d.score++; render(); }; });
  var nx=document.getElementById('nx'); if(nx) nx.onclick=function(){ d.k++; d.ans=null; render(); window.scrollTo(0,0); };
}

/* ---------- chapter-wise practice ---------- */
function chapterItems(c){
  var out=[];
  M.mcq.forEach(function(q){ if(q.ch===c) out.push({part:'A',marks:1,q:q.q,ans:'<p><b>'+esc(q.o[q.a])+'</b></p><p>'+esc(q.e)+'</p>',s:q.s,opts:q.o}); });
  M.fib.forEach(function(q){ if(q.ch===c) out.push({part:'A',marks:1,q:q.q,ans:'<p><b>'+esc(q.a)+'</b></p><p>'+esc(q.e)+'</p>',s:q.s}); });
  M.B.forEach(function(q){ if(q.ch===c) out.push({part:'B',marks:2,q:q.q,ans:q.m,s:q.s,img:q.img}); });
  M.C.forEach(function(q){ if(q.ch===c) out.push({part:'C',marks:3,q:q.q,ans:q.m,s:q.s,img:q.img,labels:q.labels}); });
  M.D.forEach(function(q){ if(q.ch===c) out.push({part:'D',marks:5,q:q.q,ans:q.m,s:q.s,img:q.img,labels:q.labels}); });
  M.D2.forEach(function(q){ if(q.ch===c) out.push({part:'D',marks:5,q:q.q,ans:(q.table?'':'')+'<ul>'+q.blanks.map(function(b){ return '<li>'+esc(q.table?'('+b[0]+')':b[0])+' → <b>'+esc(b[1])+'</b></li>'; }).join('')+'</ul>',s:q.s,table:q.table}); });
  return out;
}
function renderChapter(){
  var h='<div class="back"><button class="btn" id="bk">'+esc(T('back'))+'</button></div><div class="card"><h2 style="font-size:20px">📚 '+esc(T('chH'))+'</h2><p class="hint">'+esc(T('chS'))+' '+esc(T('ansLang'))+'</p><div class="chips">'+
   M.chapters.map(function(n,i){ return i?'<button class="chip'+(i===chSel?' on':'')+'" data-c="'+i+'">'+i+'. '+esc(n)+' · '+M.marks[i]+'</button>':''; }).join('')+'</div></div>';
  var items=chapterItems(chSel);
  h+='<div class="sec-h"><h2>'+esc(chName(chSel))+'</h2><span>'+M.marks[chSel]+' '+esc(T('marksIn'))+(M.page[chSel]?' · <a href="'+M.page[chSel]+'">'+esc(T('openCh'))+'</a>':'')+'</span></div>';
  items.forEach(function(it,k){
    h+='<div class="q"><div class="qt"><span class="qn">'+esc(T('partShort')['ABCD'.indexOf(it.part)])+'·'+it.marks+'</span> '+esc(it.q)+'</div>'+
     (it.opts?'<div class="hint">'+it.opts.map(function(o,j){ return '('+'abcd'[j]+') '+esc(o); }).join(' &nbsp; ')+'</div>':'')+
     (it.table?'<div class="tbl-wrap"><table class="bp" style="margin-top:8px"><tr>'+it.table.h.map(function(x){ return '<th>'+esc(x)+'</th>'; }).join('')+'</tr>'+it.table.r.map(function(r){ return '<tr>'+r.map(function(c){ return '<td>'+esc(c)+'</td>'; }).join('')+'</tr>'; }).join('')+'</table></div>':'')+
     '<div class="row" style="margin-top:10px"><button class="btn teal" data-show="'+k+'">'+esc(T('showAns'))+'</button></div><div data-ans="'+k+'" hidden>'+
     '<div class="model"><div class="model-h">'+esc(T('modelH'))+'</div>'+it.ans+(it.img?'<img class="dimg" loading="lazy" src="'+it.img+'" alt="">':'')+(it.labels?'<p class="hint"><b>'+esc(T('labelsH'))+':</b> '+it.labels.map(esc).join(' · ')+'</p>':'')+'</div>'+'</div></div>';
  });
  app.innerHTML=h;
  document.getElementById('bk').onclick=function(){ location.hash=''; go('home'); };
  app.querySelectorAll('[data-c]').forEach(function(b){ b.onclick=function(){ chSel=+b.dataset.c; stopSpeak(); renderChapter(); }; });
  app.querySelectorAll('[data-show]').forEach(function(b){ b.onclick=function(){ var k=b.dataset.show, box=app.querySelector('[data-ans="'+k+'"]'); box.hidden=!box.hidden; b.textContent=box.hidden?T('showAns'):T('hideAns'); }; });
}

/* ---------- diagrams ---------- */
function renderDiagrams(){
  var done=store('baio_mt_dg')||{};
  var h='<div class="back"><button class="btn" id="bk">'+esc(T('back'))+'</button></div><div class="card"><h2 style="font-size:20px">✏️ '+esc(T('dgH'))+'</h2><p class="hint">'+esc(T('dgS'))+'</p></div>';
  M.diagrams.forEach(function(d,k){ var dn=done[k]||{}, cnt=d.labels.filter(function(_,j){ return dn[j]; }).length;
    h+='<div class="q"><div class="row" style="justify-content:space-between"><div class="qt"><span class="qn">'+(k+1)+'.</span> '+esc(d.t)+'</div><span class="hint" data-cnt="'+k+'">'+cnt+'/'+d.labels.length+' '+esc(T('drawn'))+'</span></div><div class="meta">Ch '+esc(chName(d.ch))+'</div>'+
     '<div class="model-h" style="margin-top:10px">'+esc(T('labelsH'))+'</div><div class="labels">'+d.labels.map(function(l,j){ return '<label><input type="checkbox" data-dg="'+k+'" data-j="'+j+'"'+(dn[j]?' checked':'')+'> '+esc(l)+'</label>'; }).join('')+'</div>'+
     (d.img?'<div class="model-h" style="margin-top:12px">'+esc(T('ref'))+'</div><img class="dimg" loading="lazy" alt="NCERT diagram: '+esc(d.t)+'" src="'+d.img+'">':'')+'</div>'; });
  app.innerHTML=h;
  document.getElementById('bk').onclick=function(){ location.hash=''; go('home'); };
  app.querySelectorAll('[data-dg]').forEach(function(c){ c.onchange=function(){ var k=+c.dataset.dg, o=done[k]||(done[k]={}); o[+c.dataset.j]=c.checked; store('baio_mt_dg',done); var d=M.diagrams[k]; app.querySelector('[data-cnt="'+k+'"]').textContent=d.labels.filter(function(_,j){ return o[j]; }).length+'/'+d.labels.length+' '+T('drawn'); }; });
}

/* ---------- tips (Sir's narration of slides 48 and 49) ---------- */
function renderTips(){
  app.innerHTML='<div class="back"><button class="btn" id="bk">'+esc(T('back'))+'</button></div><div class="card"><h2 style="font-size:20px">🎯 '+esc(T('tipsH'))+'</h2><div id="tp">…</div></div>';
  document.getElementById('bk').onclick=function(){ location.hash=''; go('home'); };
  loadNarr().then(function(){ var box=document.getElementById('tp'); if(!box) return;
    box.innerHTML=[48,49].map(function(s,k){ return '<div class="explain"><div class="h"><span>'+(k?'🏫':'📖')+'</span><button class="btn" data-say2="'+s+'" style="min-height:36px;padding:6px 10px">'+esc(T('listen'))+'</button></div>'+esc(narr(s))+'<img class="slideimg" loading="lazy" alt="" src="'+slideSrc(s)+'"></div>'; }).join('');
    box.querySelectorAll('[data-say2]').forEach(function(b){ b.setAttribute('data-say',''); b.onclick=function(){ say(narr(+b.dataset.say2),b); }; }); });
}

/* ---------- start ---------- */
mock=store('baio_mt_cur');
var h0=location.hash.slice(1);
if(h0==='mock'){ if(!mock) newMock(180); view='mock'; }
else if(h0==='mark'||h0==='result'){ view=mock&&mock.submitted?h0:'home'; }
else if(['drill','chapter','diagrams','tips'].indexOf(h0)>=0){ view=h0; if(h0==='drill') newDrill(); }
render();
})();
</script>
