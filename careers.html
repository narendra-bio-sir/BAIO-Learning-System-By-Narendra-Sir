<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1B14">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Career Guidance | BAIO Learning System</title>
<meta name="description" content="Career guidance for PU Science (PCB, PCM, PCME) students: medical, engineering, electronics, other streams and skills, with exams, eligibility, fees, pay, scholarships and a career quiz. By Narendra Sir.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="subject-apps/app.css?v=2">
<style>
[hidden]{display:none!important}
body{font-family:Inter,'Noto Sans Kannada','Noto Sans Devanagari',system-ui,sans-serif}
.F{font-family:'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari',sans-serif}
.tip{margin-top:16px;padding:13px 15px;border-radius:16px;background:color-mix(in srgb,var(--gold2) 12%,var(--panel));border:1.5px solid color-mix(in srgb,var(--gold2) 45%,transparent);font-size:14.5px;line-height:1.55}
.tip b{color:var(--ink)}
.qcard{margin-top:14px;display:flex;gap:12px;align-items:center;padding:14px 15px;border-radius:18px;background:var(--panel);border:1.5px solid var(--teal);cursor:pointer;width:100%;text-align:left;color:var(--ink);font:inherit}
.qcard .e{font-size:30px;flex:none}
.qcard b{display:block;font:700 17px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.qcard small{color:var(--dim);font-size:13.5px}
.seg2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:5px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);margin-top:18px}
.seg2 button{border:0;background:transparent;color:var(--ink);border-radius:12px;padding:10px 8px;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.seg2 button b{display:block;font:700 14px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.seg2 button small{display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
.seg2 button.on{background:linear-gradient(135deg,var(--gold2),#E9C45A);color:#1a1406}.seg2 button.on small{color:#3b300f}
.seg2 button{position:relative}.seg2 .fy{position:absolute;top:-7px;right:6px;font:800 10px Inter,'Noto Sans Kannada','Noto Sans Devanagari';font-style:normal;background:#2F9E6B;color:#fff;border-radius:999px;padding:2px 7px}
.autost{margin-top:18px;padding:10px 12px;border-radius:14px;border:1.5px solid #2F9E6B;background:color-mix(in srgb,#2F9E6B 9%,var(--panel));font-size:13.5px;line-height:1.5}
.autost b{display:block;font:700 14px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari';margin-bottom:2px}
.autost button{margin-top:6px;border:1.5px solid #2F9E6B;background:transparent;color:#2F9E6B;border-radius:999px;padding:5px 11px;font:700 12.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer}
.autost+.seg2{margin-top:10px}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.gbtn{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:15px;padding:11px 12px;text-align:left;cursor:pointer;font:inherit;-webkit-tap-highlight-color:transparent}
.gbtn b{display:block;font:700 15px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.gbtn small{display:block;color:var(--dim);font-size:12px;line-height:1.35;margin-top:2px}
.gbtn.on{border-color:var(--gold2);background:color-mix(in srgb,var(--gold2) 15%,var(--panel))}
.cards{margin-top:14px;display:grid;gap:10px}
.car{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.car.open{border-color:color-mix(in srgb,var(--teal) 60%,var(--line))}
.car.flash{box-shadow:0 0 0 3px var(--gold2)}
.ch{display:flex;gap:12px;align-items:center;padding:13px 15px;cursor:pointer;width:100%;background:none;border:0;color:var(--ink);text-align:left;font:inherit;-webkit-tap-highlight-color:transparent}
.ch .e{font-size:28px;flex:none;width:40px;text-align:center}
.ch h3{margin:0;font:700 17px/1.25 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.ch small{display:block;color:var(--dim);font-size:13px;line-height:1.4;margin-top:2px}
.ch .dur{display:inline-block;margin-top:5px;font:700 11.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,transparent);border-radius:999px;padding:3px 9px}
.ch .ar{margin-left:auto;flex:none;color:var(--dim);transition:transform .2s}
.car.open .ch .ar{transform:rotate(90deg)}
.cb{padding:0 15px 14px;display:none}
.car.open .cb{display:block}
.cb p.what{margin:0 0 6px;font-size:14.5px;line-height:1.55}
.row{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5}
.row .k{flex:none;width:26px;text-align:center}
.row .v b{display:block;font:800 11px Inter,'Noto Sans Kannada','Noto Sans Devanagari';letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-bottom:1px}
.box{margin-top:18px;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.box h3{margin:0 0 8px;font:700 17px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.ex{padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5}
.ex .n{font-weight:800}.ex .by{color:var(--dim);font-size:12px;margin-left:6px}
.ex .f{color:var(--dim);font-size:13px}
.note{margin-top:14px;font-size:12.5px;line-height:1.55;color:var(--dim)}
/* quiz */
.qz{margin-top:14px;background:var(--panel);border:1.5px solid var(--teal);border-radius:18px;padding:14px 15px}
.qz h3{margin:0 0 4px;font:700 18px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.qz .sub{color:var(--dim);font-size:13.5px;margin:0 0 6px}
.qq{padding:10px 0;border-top:1px solid var(--line)}
.qq p{margin:0 0 7px;font-size:15px;line-height:1.45}
.opts{display:flex;gap:6px}
.opts button{flex:1;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:11px;padding:8px 4px;font:700 13.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer}
.opts button.on{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 18%,var(--panel))}
.qact{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 15px;font:700 14px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer;background:linear-gradient(135deg,var(--gold2),#E9C45A);color:#1a1406}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.res{margin-top:12px}
.res .r{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--panel2);margin-top:8px;cursor:pointer;border:0;width:100%;text-align:left;color:var(--ink);font:inherit}
.res .r .e{font-size:24px}
.res .r b{display:block;font:700 15px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.res .r small{color:var(--dim);font-size:12.5px}
.res .rk{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 13px Inter;background:var(--gold2);color:#1a1406}
.vid{margin-top:14px;background:var(--panel);border:1.5px solid var(--teal);border-radius:18px;padding:12px 14px}
.vid summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;color:var(--ink)}
.vid summary::-webkit-details-marker{display:none}
.vid .vp{flex:none;width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:14px;padding-left:2px}
.vid .vt{flex:1;min-width:0;font-weight:700;font-size:15px;line-height:1.3}
.vid .vd{flex:none;font:700 12px Inter,sans-serif;color:var(--teal);border:1.5px solid var(--teal);border-radius:999px;padding:3px 9px;white-space:nowrap}
.vid[open] .vp{background:var(--ink-dim,#888)}
.vid video{display:block;width:100%;max-width:330px;aspect-ratio:9/16;margin:12px auto 2px;border-radius:14px;background:#000}
/* personal report */
.rep{margin-top:14px;background:var(--panel);border:2px solid var(--gold2);border-radius:18px;padding:14px 15px}
.rep h3{margin:0 0 4px;font:700 18px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.rep h4{margin:16px 0 6px;font:700 15.5px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.rep .sub{color:var(--dim);font-size:13.5px;margin:0 0 8px;line-height:1.5}
.frm{display:grid;gap:9px}
.frm label{display:grid;gap:4px;font:700 12.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';color:var(--dim)}
.frm input{font:600 16px Inter;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);text-transform:uppercase}
/* hidden code: dots are blurred too, so nothing readable is on screen; clears when 'Show password' is ticked */
.frm input#cpPass[type="password"]{color:transparent;text-shadow:0 0 7px var(--ink);caret-color:var(--ink);letter-spacing:.1em}
.frm label.pw-show{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--dim);margin-top:-3px;cursor:pointer}
.frm label.pw-show input{width:18px;height:18px;padding:0;margin:0;accent-color:var(--teal);cursor:pointer}
.rep .err{color:#D0544B;font-size:13.5px;margin:8px 0 0}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:6px}
.rhead b{display:block;font:700 17px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.rhead small{color:var(--dim);font-size:13px}
.lnk{background:none;border:0;color:var(--teal);font:700 12.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer;padding:4px 0;flex:none}
.mrow{padding:9px 0;border-top:1px solid var(--line)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px;font-size:14.5px}
.goal{margin-top:12px;padding:10px 12px;border:1.5px solid var(--gold2);border-radius:14px;background:var(--panel2)}
.goal b{font:700 14px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.gseg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 6px}
.gseg button{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 6px;font:700 13.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer}
.gseg button.on{background:linear-gradient(135deg,var(--gold2),#E9C45A);border-color:var(--gold2);color:#1a1406}
.goal small{display:block;color:var(--dim);font-size:12.5px;line-height:1.45}
body.print-report #myReport .gseg button:not(.on){display:none}
.pill{color:#fff;border-radius:999px;padding:3px 9px;font:800 11.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';white-space:nowrap}
.mbar{display:block;height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;flex:1}
.mbar i{display:block;height:100%;border-radius:99px}
.mut{color:var(--dim);font-size:12.5px;margin-top:5px;line-height:1.45}
.mut .up{color:#2F9E6B;font-weight:700}.mut .dn{color:#D0544B;font-weight:700}
.chipsm{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chipsm span{font:700 11.5px Inter;background:var(--panel2);border-radius:8px;padding:3px 7px}
.srow{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14px}
.srow .sl{width:110px;flex:none}.srow .sv{width:40px;text-align:right;font-weight:700;flex:none}
.sg{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel2);border:0;border-radius:14px;padding:10px 12px;margin-top:7px;color:var(--ink);font:inherit;cursor:pointer}
.sg .e{font-size:24px;flex:none}.sg b{display:block;font:700 15px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.sg small{display:block;color:var(--dim);font-size:12.5px;line-height:1.4}.sg .op{margin-left:auto;flex:none;color:var(--teal);font:700 12px Inter,'Noto Sans Kannada','Noto Sans Devanagari'}
ol.stp{margin:0;padding-left:20px;font-size:14.5px;line-height:1.55}ol.stp li{margin:5px 0}
.hp{display:grid;gap:7px}
.hp a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:9px 12px}
.hp .e{font-size:22px;flex:none}.hp b{display:block;font:700 14.5px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}.hp small{display:block;color:var(--dim);font-size:12.5px;line-height:1.4}
.shr{display:inline-flex;align-items:center;gap:6px;margin-top:12px;border:1.5px solid var(--teal);color:var(--teal);background:transparent;border-radius:999px;padding:7px 13px;font:700 13.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer}
.cshr{margin-top:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:7px 11px;font:700 13px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1E2A22;color:#fff;padding:10px 16px;border-radius:12px;font:600 14px Inter;z-index:99}
@media print{.top,.qcard,.qz,.groups,.shr,.cshr{display:none!important}.car .cb{display:block!important}
  body.print-report main>*:not(#myReport){display:none!important}
  body.print-report #myReport{border:0;padding:0}
  body.print-report #myReport .qact,body.print-report #myReport .lnk,body.print-report #myReport .sg .op{display:none!important}
  html,body{background:#fff!important;color:#111!important}}
#myReport,#quiz,#sch,#finder,#fres,.car{scroll-margin-top:64px}
/* scholarships */
.qcard.sch-btn{border-color:var(--gold2)}.qcard.sch-btn small{display:block;line-height:1.4;margin-top:2px}
.schf{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.schf button{border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:999px;padding:6px 11px;font:700 13px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer;-webkit-tap-highlight-color:transparent}
.schf button.on{background:linear-gradient(135deg,var(--gold2),#E9C45A);border-color:var(--gold2);color:#1a1406}
.sch-list{display:grid;gap:8px;margin-top:10px}
.sch-list .car{background:var(--panel2)}
.gtag{display:inline-block;margin-left:6px;vertical-align:2px;font:700 10.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';color:#fff;background:#C2477F;border-radius:999px;padding:2px 7px}
.row .v a{color:var(--teal);font-weight:700;word-break:break-all}
.box h4{margin:16px 0 4px;font:700 15px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.box .sub{margin:0;color:var(--dim);font-size:13.5px;line-height:1.5}
ul.dl{margin:4px 0 0;padding-left:20px;font-size:14px;line-height:1.55}ul.dl li{margin:4px 0}
#loans{scroll-margin-top:64px}
.qcard.loan-btn{border-color:#3B7BD9}.qcard.loan-btn small{display:block;line-height:1.4;margin-top:2px}
/* scholarship finder */
.fnd{margin-top:12px;padding:12px 13px;border-radius:16px;border:1.5px solid var(--teal);background:color-mix(in srgb,var(--teal) 7%,var(--panel))}
.fnd h4{margin:0 0 2px!important}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.fgrid .fl{display:grid;gap:3px;font:700 12px Inter,'Noto Sans Kannada','Noto Sans Devanagari';color:var(--dim)}
.fgrid .fl.w{grid-column:1/-1}
.fsp{grid-column:1/-1;display:grid;grid-template-columns:1fr;gap:7px;font-size:13px}.fsp>b{grid-column:1/-1;font:700 12px Inter,'Noto Sans Kannada','Noto Sans Devanagari';color:var(--dim)}
.fsp button{display:flex;gap:8px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:12px;padding:9px 10px;font:600 12.5px/1.3 Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer;-webkit-tap-highlight-color:transparent}
.fsp button .di{font-size:20px;flex:none}.fsp button .tk{margin-left:auto;flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:transparent}
.fsp button[aria-pressed="true"]{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,var(--panel))}
.fsp button[aria-pressed="true"] .tk{background:var(--teal);border-color:var(--teal);color:#fff}
/* custom drop-down with icons */
.dd{position:relative}
.ddb{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:12px;padding:9px 10px;font:600 14px/1.3 Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:46px}
.ddb .di{font-size:20px;flex:none;width:26px;text-align:center}.ddb .dt{flex:1;min-width:0}.ddb .dc{flex:none;color:var(--dim);font-size:12px;transition:transform .15s}
.dd.open .ddb{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 18%,transparent)}.dd.open .ddb .dc{transform:rotate(180deg)}
.dd.ph .ddb .dt{color:var(--dim)}.dd.err .ddb{border-color:#D0544B;box-shadow:0 0 0 3px rgba(208,84,75,.18)}
.ddl{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:30;margin:0;padding:5px;list-style:none;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.18);max-height:320px;overflow:auto}
.fgrid .fl:not(.w) .ddl{min-width:min(250px,86vw)}.fgrid .fl:nth-child(3) .ddl,.fgrid .fl:nth-child(5) .ddl{left:auto;right:0}
.ddl button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);border-radius:10px;padding:10px 9px;font:600 14px/1.3 Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer}
.ddl button .di{font-size:20px;flex:none;width:26px;text-align:center}.ddl button .dt{flex:1}
.ddl button .ck{flex:none;color:var(--teal);font-weight:800;visibility:hidden}
.ddl button:hover,.ddl button:focus-visible{background:var(--panel2);outline:0}
.ddl button[aria-selected="true"]{background:color-mix(in srgb,var(--teal) 13%,var(--panel))}.ddl button[aria-selected="true"] .ck{visibility:visible}
.fres{margin-top:12px}.fres>p{margin:0 0 6px;font-weight:700;font-size:14px}
.frc{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:7px;color:var(--ink);font:inherit;cursor:pointer}
.frc.y{border-color:color-mix(in srgb,#2F9E6B 55%,var(--line))}.frc.m{border-color:color-mix(in srgb,var(--gold2) 60%,var(--line))}
.frc .e{font-size:22px;flex:none}.frc b{display:block;font:700 14.5px/1.3 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.frc small{display:block;color:var(--dim);font-size:12.5px;line-height:1.4;margin-top:2px}
.frc .st{display:inline-block;font:800 11px Inter,'Noto Sans Kannada','Noto Sans Devanagari';margin-top:4px}
.frc .op{margin-left:auto;flex:none;color:var(--teal);font:700 12px Inter,'Noto Sans Kannada','Noto Sans Devanagari';padding-top:2px}
.lhint{margin-top:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,#3B7BD9 10%,var(--panel));font-size:13.5px;line-height:1.5}
.lhint button{margin-top:6px}
.sjr{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.sjr button{border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:999px;padding:5px 10px;font:700 12px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer}
.sjr button.lk{border-color:var(--teal);color:var(--teal);background:transparent}
/* loans */
.ltab{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.ltab th{text-align:left;font:800 11.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';color:var(--dim);padding:6px 5px;border-bottom:1.5px solid var(--line)}
.ltab td{padding:7px 5px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.4}

  function schMatch(x, p){

    if(x.girls){ if(p.g !== 'girl') return null; why.push('girl'); }

    if(navigator.share){ navigator.share({ title:title, text:text, url:url }).catch(function(){}); return; }
    var w = window.open('https://wa.me/?text=' + encodeURIComponent(text + '\n' + url), '_blank');
    if(!w && navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ toast(UI[lang].copied); });
  }
  $('shareBtn').onclick = function(){ share('BAIO · Career Guidance', UI[lang].shareMsg, BASE); };
  function jumpSch(id){
    schCat = 'all'; schOpen = {}; schOpen[id] = true; renderSch();
    var el = $('sch-' + id); if(el){ el.scrollIntoView({ behavior:'smooth', block:'start' }); el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); }, 2000); }
    try{ clearHash(); }catch(x){}
  }
  function toLoans(){ $('loans').scrollIntoView({ behavior:'smooth', block:'start' }); clearHash(); }
  $('cards').addEventListener('click', function(e){
    var j = e.target.closest('[data-jump]'); if(j){ jumpSch(j.dataset.jump); return; }
    var fd = e.target.closest('[data-find]'); if(fd){ prof = prof || { g:'girl', cat:'gen', inc:2, mk:2, govt:'no', sp:{} }; prof.c = fd.dataset.find; showFind = false; renderSch(); $('finder').scrollIntoView({ behavior:'smooth', block:'start' }); return; }
    if(e.target.closest('[data-loans]')){ toLoans(); return; }
    var sh = e.target.closest('[data-share]');
    if(sh){ var c = D.list.filter(function(x){ return x.id === sh.dataset.share; })[0];
      var u = UI[lang];
      if(window.careerShare) careerShare(c, lang, { dur:u.dur, exam:u.exam, elig:u.elig, fee:u.fee, pay:u.pay, scope:u.scope }, BASE + '#' + c.id);
      else share('BAIO · ' + c.name, '🎓 ' + c.name + ' — ' + L(c.sub) + '. ' + L(c.what) + ' (BAIO Learning System, Narendra Sir)', BASE + '#' + c.id);
      return; }
    var b = e.target.closest('.ch'); if(!b) return;
    var id = b.dataset.id; open[id] = !open[id];
    var a = b.closest('.car'); a.classList.toggle('open', !!open[id]); b.setAttribute('aria-expanded', !!open[id]);
  });
  $('qOpen').onclick = function(){ quizOpen = true; renderQuiz(); $('quiz').scrollIntoView({ behavior:'smooth', block:'start' }); };
  $('quiz').addEventListener('click', function(e){
    var o = e.target.closest('.opts button');
    if(o){ ans[o.dataset.t] = +o.dataset.v; try{ localStorage.setItem(qKey(), JSON.stringify(ans)); }catch(x){} o.parentNode.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === o); }); return; }
    if(e.target.id === 'qSee'){ showRes = true; renderQuiz(); var r = document.querySelector('.res'); if(r) r.scrollIntoView({ behavior:'smooth', block:'center' }); return; }
    if(e.target.id === 'qReset'){ ans = {}; showRes = false; try{ localStorage.removeItem(qKey()); }catch(x){} renderQuiz(); return; }
    if(e.target.id === 'qClose'){ quizOpen = false; showRes = false; renderQuiz(); return; }
    var g = e.target.closest('[data-go]'); if(g) go(g.dataset.go);
  });
  $('schOpen').onclick = function(){ $('sch').scrollIntoView({ behavior:'smooth', block:'start' }); clearHash(); };
  $('loanOpen').onclick = toLoans;
  $('loans').addEventListener('click', function(e){
    var b = e.target.closest('[data-lid]'); if(!b) return;
    var id = 'ln-' + b.dataset.lid; schOpen[id] = !schOpen[id];
    b.closest('.car').classList.toggle('open', !!schOpen[id]); b.setAttribute('aria-expanded', !!schOpen[id]);
  });
  function ddClose(except){ document.querySelectorAll('.dd.open').forEach(function(d){ if(d === except) return; d.classList.remove('open'); d.querySelector('.ddl').hidden = true; d.querySelector('.ddb').setAttribute('aria-expanded', 'false'); }); }
  document.addEventListener('click', function(e){ if(!e.target.closest('.dd')) ddClose(); });
  document.addEventListener('keydown', function(e){
    var d = e.target.closest && e.target.closest('.dd'); if(!d) return;
    if(e.key === 'Escape'){ ddClose(); d.querySelector('.ddb').focus(); return; }
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault(); if(!d.classList.contains('open')) d.querySelector('.ddb').click();
      var o = [].slice.call(d.querySelectorAll('.ddl button')), i = o.indexOf(document.activeElement);
      (o[i < 0 ? 0 : Math.max(0, Math.min(o.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))] || o[0]).focus();
    }
  });
  $('sch').addEventListener('click', function(e){
    var db = e.target.closest('.ddb');
    if(db){ var d = db.closest('.dd'), op = !d.classList.contains('open'); ddClose(d); d.classList.toggle('open', op); d.querySelector('.ddl').hidden = !op; db.setAttribute('aria-expanded', op);
      if(op){ var cur = d.querySelector('[aria-selected="true"]') || d.querySelector('.ddl button'); if(cur) cur.focus({ preventScroll:true }); var l = d.querySelector('.ddl'), r = l.getBoundingClientRect(); if(r.bottom > innerHeight) window.scrollBy({ top:r.bottom - innerHeight + 16, behavior:'smooth' }); }
      return; }
    var dop = e.target.closest('.ddl button');
    if(dop){ var dd = dop.closest('.dd'); dd.dataset.v = dop.dataset.o; dd.classList.remove('ph', 'err');
      dd.querySelectorAll('.ddl button').forEach(function(x){ x.setAttribute('aria-selected', x === dop); });
      dd.querySelector('.ddb .di').textContent = dop.querySelector('.di').textContent; dd.querySelector('.ddb .dt').textContent = dop.querySelector('.dt').textContent;
      ddClose(); dd.querySelector('.ddb').focus(); return; }
    var spb = e.target.closest('[data-sp]'); if(spb){ spb.setAttribute('aria-pressed', spb.getAttribute('aria-pressed') !== 'true'); return; }
    if(e.target.id === 'fGo'){
      var p = { sp:{} };
      $('finder').querySelectorAll('.dd[data-f]').forEach(function(el){ p[el.dataset.f] = /^(inc|mk)$/.test(el.dataset.f) ? +el.dataset.v : el.dataset.v; });
      $('finder').querySelectorAll('[data-sp]').forEach(function(el){ if(el.getAttribute('aria-pressed') === 'true') p.sp[el.dataset.sp] = 1; });
      if(!p.c){ var cs = $('finder').querySelector('.dd[data-f="c"]'); cs.classList.add('err'); cs.querySelector('.ddb').focus(); cs.scrollIntoView({ behavior:'smooth', block:'center' }); return; }
      prof = p; showFind = true; try{ localStorage.setItem('baio_sch_finder', JSON.stringify(p)); }catch(x){}
      renderSch(); var r = $('fres'); if(r) r.scrollIntoView({ behavior:'smooth', block:'start' }); return;
    }
    if(e.target.id === 'fReset'){ prof = null; showFind = false; try{ localStorage.removeItem('baio_sch_finder'); }catch(x){} renderSch(); return; }
    var j = e.target.closest('[data-jump]'); if(j){ jumpSch(j.dataset.jump); return; }
    if(e.target.closest('[data-loans]')){ toLoans(); return; }
    var c = e.target.closest('[data-sc]');
    if(c){ schCat = c.dataset.sc; schOpen = {}; renderSch(); return; }
    var b = e.target.closest('[data-sid]'); if(!b) return;
    var id = b.dataset.sid; schOpen[id] = !schOpen[id];
    b.closest('.car').classList.toggle('open', !!schOpen[id]); b.setAttribute('aria-expanded', !!schOpen[id]);
    clearHash();
  });
  if(!S){ $('schOpen').hidden = true; $('sch').hidden = true; }
  render();
  if(hc) setTimeout(function(){ go(hc.id); }, 200);
  else if(h === 'loans' || h.indexOf('ln-') === 0) setTimeout(function(){ toLoans(); }, 200);
  else if(h === 'finder' && S) setTimeout(function(){ $('finder').scrollIntoView({ behavior:'smooth', block:'start' }); }, 200);
  else if(S && h.indexOf('sch') === 0) setTimeout(function(){ var el = $(h === 'scholarships' ? 'sch' : h) || $('sch'); el.scrollIntoView({ behavior:'smooth', block:'start' }); }, 200);
  if(h && !/report=/.test(h)) setTimeout(clearHash, 900);
})();
</script>
</body>
</html>
