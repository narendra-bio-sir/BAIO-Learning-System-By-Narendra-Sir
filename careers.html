[hidden]{display:none!important}
body{font-family:Inter,'Noto Sans Kannada','Noto Sans Devanagari',system-ui,sans-serif}
.F{font-family:'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari',sans-serif}
.tip{margin-top:16px;padding:13px 15px;border-radius:16px;background:color-mix(in srgb,var(--gold2) 12%,var(--panel));border:1.5px solid color-mix(in srgb,var(--gold2) 45%,transparent);font-size:14.5px;line-height:1.55}
.tip b{color:var(--ink)}

.qcard b{display:block;font:700 17px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}

.cards{margin-top:14px;display:grid;gap:10px}
.car{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.car.open{border-color:color-mix(in srgb,var(--teal) 60%,var(--line))}

.ch{display:flex;gap:12px;align-items:center;padding:13px 15px;cursor:pointer;width:100%;background:none;border:0;color:var(--ink);text-align:left;font:inherit;-webkit-tap-highlight-color:transparent}
.ch .e{font-size:28px;flex:none;width:40px;text-align:center}
.ch h3{margin:0;font:700 17px/1.25 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.ch small{display:block;color:var(--dim);font-size:13px;line-height:1.4;margin-top:2px}
.ch .dur{display:inline-block;margin-top:5px;font:700 11.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,transparent);border-radius:999px;padding:3px 9px}

.car.open .ch .ar{transform:rotate(90deg)}
.cb{padding:0 15px 14px;display:none}
.car.open .cb{display:block}
.cb p.what{margin:0 0 6px;font-size:14.5px;line-height:1.55}
.row{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5}

.box{margin-top:18px;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.box h3{margin:0 0 8px;font:700 17px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.ex{padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5}
.ex .n{font-weight:800}.ex .by{color:var(--dim);font-size:12px;margin-left:6px}
.ex .f{color:var(--dim);font-size:13px}
.note{margin-top:14px;font-size:12.5px;line-height:1.55;color:var(--dim)}

.qz{margin-top:14px;background:var(--panel);border:1.5px solid var(--teal);border-radius:18px;padding:14px 15px}
.qz h3{margin:0 0 4px;font:700 18px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.qz .sub{color:var(--dim);font-size:13.5px;margin:0 0 6px}
.qq{padding:10px 0;border-top:1px solid var(--line)}
.qq p{margin:0 0 7px;font-size:15px;line-height:1.45}
.opts{display:flex;gap:6px}
.opts button{flex:1;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:11px;padding:8px 4px;font:700 13.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer}

.qact{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 15px;font:700 14px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer;background:linear-gradient(135deg,var(--gold2),#E9C45A);color:#1a1406}

.res{margin-top:12px}
.res .r{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--panel2);margin-top:8px;cursor:pointer;border:0;width:100%;text-align:left;color:var(--ink);font:inherit}
.res .r .e{font-size:24px}
.res .r b{display:block;font:700 15px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.res .r small{color:var(--dim);font-size:12.5px}
.res .rk{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 13px Inter;background:var(--gold2);color:#1a1406}
.vid{margin-top:14px;background:var(--panel);border:1.5px solid var(--teal);border-radius:18px;padding:12px 14px}
.vid summary{cursor:pointer;font:700 15.5px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari';color:var(--ink);list-style:none}
.vid summary::-webkit-details-marker{display:none}
.vid video{display:block;width:100%;max-width:330px;aspect-ratio:9/16;margin:12px auto 2px;border-radius:14px;background:#000}
/* personal report */
.rep{margin-top:14px;background:var(--panel);border:2px solid var(--gold2);border-radius:18px;padding:14px 15px}
.rep h3{margin:0 0 4px;font:700 18px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.rep h4{margin:16px 0 6px;font:700 15.5px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.rep .sub{color:var(--dim);font-size:13.5px;margin:0 0 8px;line-height:1.5}

.frm label{display:grid;gap:4px;font:700 12.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';color:var(--dim)}

.rep .err{color:#D0544B;font-size:13.5px;margin:8px 0 0}

ol.stp{margin:0;padding-left:20px;font-size:14.5px;line-height:1.55}ol.stp li{margin:5px 0}

.cshr{margin-top:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:7px 11px;font:700 13px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1E2A22;color:#fff;padding:10px 16px;border-radius:12px;font:600 14px Inter;z-index:99}
@media print{.top,.qcard,.qz,.groups,.shr,.cshr{display:none!important}.car .cb{display:block!important}

  body.print-report #myReport{border:0;padding:0}
  body.print-report #myReport .qact,body.print-report #myReport .lnk,body.print-report #myReport .sg .op{display:none!important}
  html,body{background:#fff!important;color:#111!important}}

         qT:'मेरे लिए कौन-सा करियर सही है?', qS:'10 छोटे सवालों के जवाब दें और अपने टॉप 3 देखें', qClose:'क्विज़ बंद करें',
         qSub:'कोई सही या गलत जवाब नहीं है। ईमानदारी से जवाब दें!', yes:'हाँ', maybe:'शायद', no:'नहीं',
         vid:'▶️ देखें: करियर मार्गदर्शन कैसे काम करता है (1½ मिनट)', shareP:'📤 यह पेज शेयर करें', shareC:'📤 शेयर', copied:'लिंक कॉपी हो गया ✓', shareMsg:'🎓 पीयूसी साइंस छात्रों के लिए करियर मार्गदर्शन — परीक्षा, फ़ीस और करियर क्विज़ के साथ। नरेंद्र सर, BAIO लर्निंग सिस्टम।',
         see:'मेरे मैच देखें', reset:'फिर से शुरू करें', top:'आपके सबसे अच्छे मैच', need:'पहले कम से कम 5 सवालों के जवाब दें।',
         lWhat:'क्या करेंगे', dur:'अवधि', exam:'प्रवेश परीक्षा', elig:'योग्यता', fee:'फ़ीस (अनुमान)', pay:'शुरुआती वेतन (अनुमान)', scope:'भविष्य',
         exT:'📅 परीक्षा कैलेंडर (आम तौर पर महीने)', note:'फ़ीस और वेतन अनुमानित हैं और हर साल बदलते हैं। फ़ैसले से पहले KEA (cetonline.karnataka.gov.in), NTA और कॉलेज की ताज़ा सूचना ज़रूर देखें। उलझन है? क्लास में या WhatsApp पर नरेंद्र सर से पूछें।' }
  };
  function $(id){ return document.getElementById(id); }
  function L(o){ return o ? (o[lang] || o.en) : ''; }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  var lang = 'en'; try{ lang = localStorage.getItem('baio_lang') || 'en'; }catch(e){} if(!UI[lang]) lang = 'en';
  var tb = $('themeBtn');
  function theme(t){ document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); tb.textContent = t === 'dark' ? '☀️' : '🌙'; }
  var th = 'light'; try{ th = localStorage.getItem('baio_theme') || 'light'; }catch(e){} theme(th);
  tb.onclick = function(){ var n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; theme(n); try{ localStorage.setItem('baio_theme', n); }catch(e){} };

  var grp = 'neet', open = {}, ans = {}, showRes = false, quizOpen = false;
  try{ ans = JSON.parse(localStorage.getItem('baio_career_quiz') || '{}') || {}; }catch(e){}
  var h = location.hash.slice(1);
  var hc = D.list.filter(function(c){ return c.id === h; })[0];
  if(hc){ grp = hc.g; open[hc.id] = true; }
  else if(D.groups.some(function(g){ return g.id === h; })) grp = h;
  else if(h === 'quiz') quizOpen = true;

  function card(c){
    var u = UI[lang];
    function row(k, lab, v){ return '<div class="row"><span class="k">'+k+'</span><div class="v"><b>'+lab+'</b>'+esc(L(v))+'</div></div>'; }
    return '<article class="car'+(open[c.id]?' open':'')+'" id="'+c.id+'"><button class="ch" type="button" data-id="'+c.id+'" aria-expanded="'+!!open[c.id]+'"><span class="e">'+c.ic+'</span><span><h3>'+esc(c.name)+'</h3><small>'+esc(L(c.sub))+'</small><span class="dur">⏱ '+esc(L(c.dur))+'</span></span><span class="ar">›</span></button>'
      + '<div class="cb"><p class="what">'+esc(L(c.what))+'</p>'
      + row('📝', u.exam, c.exam) + row('✅', u.elig, c.elig) + row('💰', u.fee, c.fee) + row('💼', u.pay, c.pay) + row('🚀', u.scope, c.scope)
      + '<button type="button" class="cshr" data-share="'+c.id+'">'+u.shareC+'</button></div></article>';
  }
  function scores(){
    return D.list.map(function(c){
      var s = 0; c.t.forEach(function(t){ var a = ans[t]; s += a === 2 ? 2 : a === 1 ? 1 : 0; });
      return { c:c, s:s / Math.sqrt(c.t.length) };
    }).sort(function(a, b){ return b.s - a.s; });
  }
  function renderQuiz(){
    var u = UI[lang], q = $('quiz');
    q.hidden = !quizOpen; $('qOpen').hidden = quizOpen;
    if(!quizOpen) return;
    var n = Object.keys(ans).length;
    var html = '<div class="qz"><h3>🧭 '+u.qT+'</h3><p class="sub">'+u.qSub+'</p>';
    D.quiz.forEach(function(x){
      var a = ans[x.t];
      html += '<div class="qq"><p>'+esc(L(x.q))+'</p><div class="opts">'
        + [[2,u.yes],[1,u.maybe],[0,u.no]].map(function(o){ return '<button type="button" data-t="'+x.t+'" data-v="'+o[0]+'" class="'+(a===o[0]?'on':'')+'">'+o[1]+'</button>'; }).join('')
        + '</div></div>';
    });
    html += '<div class="qact"><button class="btn" id="qSee" type="button">'+u.see+'</button><button class="btn ghost" id="qReset" type="button">'+u.reset+'</button><button class="btn ghost" id="qClose" type="button">'+u.qClose+'</button></div>';
    if(showRes){
      if(n < 5) html += '<div class="res"><p class="sub">'+u.need+'</p></div>';
      else {
        html += '<div class="res"><h3>⭐ '+u.top+'</h3>' + scores().slice(0, 3).map(function(r, i){
          return '<button class="r" type="button" data-go="'+r.c.id+'"><span class="rk">'+(i+1)+'</span><span class="e">'+r.c.ic+'</span><span><b>'+esc(r.c.name)+'</b><small>'+esc(L(r.c.sub))+'</small></span></button>';
        }).join('') + '</div>';
      }
    }
    q.innerHTML = html + '</div>';
  }
  function render(){
    var u = UI[lang];
    document.documentElement.lang = lang;
    $('langs').innerHTML = [['en','English'],['kn','ಕನ್ನಡ'],['hi','हिंदी']].map(function(l){ return '<button class="lang'+(l[0]===lang?' on':'')+'" data-l="'+l[0]+'">'+l[1]+'</button>'; }).join('');
    $('eyebrow').textContent = u.eyebrow; $('h1').textContent = u.h1; $('intro').textContent = u.intro; $('tip').innerHTML = u.tip;
    $('shareBtn').textContent = u.shareP; $('vidT').textContent = u.vid;
    if(window.CareerReport) window.CareerReport.render($('myReport'), lang, go, D);
    $('qT').textContent = u.qT; $('qS').textContent = u.qS; $('note').textContent = u.note;
    $('groups').innerHTML = D.groups.map(function(g){ return '<button class="gbtn'+(g.id===grp?' on':'')+'" role="tab" aria-selected="'+(g.id===grp)+'" data-g="'+g.id+'"><b>'+g.ic+' '+esc(L(g.t))+'</b><small>'+esc(L(g.s))+'</small></button>'; }).join('');
    $('cards').innerHTML = D.list.filter(function(c){ return c.g === grp; }).map(card).join('');
    $('exams').innerHTML = '<h3>'+u.exT+'</h3>' + D.exams.map(function(x){ return '<div class="ex"><span class="n">'+esc(x.n)+'</span><span class="by">'+esc(x.by)+'</span><div>'+esc(L(x.m))+'</div><div class="f">'+esc(L(x.f))+'</div></div>'; }).join('');
    renderQuiz();
  }
  function go(id){
    var c = D.list.filter(function(x){ return x.id === id; })[0]; if(!c) return;
    grp = c.g; open = {}; open[id] = true; render();
    var el = $(id); if(el){ el.scrollIntoView({ behavior:'smooth', block:'start' }); el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); }, 2000); }
    try{ history.replaceState(null, '', '#' + id); }catch(e){}
  }

  $('langs').addEventListener('click', function(e){ var b = e.target.closest('button'); if(!b) return; lang = b.dataset.l; try{ localStorage.setItem('baio_lang', lang); }catch(x){} render(); });
  $('groups').addEventListener('click', function(e){ var b = e.target.closest('.gbtn'); if(!b) return; grp = b.dataset.g; open = {}; render(); try{ history.replaceState(null, '', '#' + grp); }catch(x){} });
  var BASE = 'https://narendra-bio-sir.github.io/BAIO-Learning-System-By-Narendra-Sir/careers.html';
  function toast(t){ var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 1800); }
  function share(title, text, url){
    if(navigator.share){ navigator.share({ title:title, text:text, url:url }).catch(function(){}); return; }
    var w = window.open('https://wa.me/?text=' + encodeURIComponent(text + '\n' + url), '_blank');
    if(!w && navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ toast(UI[lang].copied); });
  }
  $('shareBtn').onclick = function(){ share('BAIO · Career Guidance', UI[lang].shareMsg, BASE); };
  $('cards').addEventListener('click', function(e){
    var sh = e.target.closest('[data-share]');
    if(sh){ var c = D.list.filter(function(x){ return x.id === sh.dataset.share; })[0];
      share('BAIO · ' + c.name, '🎓 ' + c.name + ' — ' + L(c.sub) + '. ' + L(c.what) + ' (BAIO Learning System, Narendra Sir)', BASE + '#' + c.id); return; }
    var b = e.target.closest('.ch'); if(!b) return;
    var id = b.dataset.id; open[id] = !open[id];
    var a = b.closest('.car'); a.classList.toggle('open', !!open[id]); b.setAttribute('aria-expanded', !!open[id]);
  });
  $('qOpen').onclick = function(){ quizOpen = true; renderQuiz(); $('quiz').scrollIntoView({ behavior:'smooth', block:'start' }); };
  $('quiz').addEventListener('click', function(e){
    var o = e.target.closest('.opts button');
    if(o){ ans[o.dataset.t] = +o.dataset.v; try{ localStorage.setItem('baio_career_quiz', JSON.stringify(ans)); }catch(x){} o.parentNode.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === o); }); return; }
    if(e.target.id === 'qSee'){ showRes = true; renderQuiz(); var r = document.querySelector('.res'); if(r) r.scrollIntoView({ behavior:'smooth', block:'center' }); return; }
    if(e.target.id === 'qReset'){ ans = {}; showRes = false; try{ localStorage.removeItem('baio_career_quiz'); }catch(x){} renderQuiz(); return; }
    if(e.target.id === 'qClose'){ quizOpen = false; showRes = false; renderQuiz(); return; }
    var g = e.target.closest('[data-go]'); if(g) go(g.dataset.go);
  });
  render();
  if(hc) setTimeout(function(){ go(hc.id); }, 200);
})();
</script>
</body>
</html>
