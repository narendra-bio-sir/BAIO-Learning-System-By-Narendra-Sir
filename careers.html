body{font-family:Inter,'Noto Sans Kannada','Noto Sans Devanagari',system-ui,sans-serif}
.F{font-family:'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari',sans-serif}
.tip{margin-top:16px;padding:13px 15px;border-radius:16px;background:color-mix(in srgb,var(--gold2) 12%,var(--panel));border:1.5px solid color-mix(in srgb,var(--gold2) 45%,transparent);font-size:14.5px;line-height:1.55}
.tip b{color:var(--ink)}
.qcard{margin-top:14px;display:flex;gap:12px;align-items:center;padding:14px 15px;border-radius:18px;background:var(--panel);border:1.5px solid var(--teal);cursor:pointer;width:100%;text-align:left;color:var(--ink);font:inherit}
.qcard .e{font-size:30px;flex:none}
.qcard b{display:block;font:700 17px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.qcard small{color:var(--dim);font-size:13.5px}
.seg2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:5px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);margin-top:18px}
.seg2 button{border:0;background:transparent;color:var(--ink);border-radius:12px;padding:10px 8px;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.seg2 button b{display:block;font:700 14px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.seg2 button small{display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
.seg2 button.on{background:linear-gradient(135deg,var(--gold2),#E9C45A);color:#1a1406}.seg2 button.on small{color:#3b300f}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.gbtn{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:15px;padding:11px 12px;text-align:left;cursor:pointer;font:inherit;-webkit-tap-highlight-color:transparent}
.gbtn b{display:block;font:700 15px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.gbtn small{display:block;color:var(--dim);font-size:12px;line-height:1.35;margin-top:2px}
.gbtn.on{border-color:var(--gold2);background:color-mix(in srgb,var(--gold2) 15%,var(--panel))}
.cards{margin-top:14px;display:grid;gap:10px}
.car{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.car.open{border-color:color-mix(in srgb,var(--teal) 60%,var(--line))}
.car.flash{box-shadow:0 0 0 3px var(--gold2)}
.ch{display:flex;gap:12px;align-items:center;padding:13px 15px;cursor:pointer;width:100%;background:none;border:0;color:var(--ink);text-align:left;font:inherit;-webkit-tap-highlight-color:transparent}
.ch .e{font-size:28px;flex:none;width:40px;text-align:center}
.ch h3{margin:0;font:700 17px/1.25 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.ch small{display:block;color:var(--dim);font-size:13px;line-height:1.4;margin-top:2px}
.ch .dur{display:inline-block;margin-top:5px;font:700 11.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,transparent);border-radius:999px;padding:3px 9px}
.ch .ar{margin-left:auto;flex:none;color:var(--dim);transition:transform .2s}
.car.open .ch .ar{transform:rotate(90deg)}
.cb{padding:0 15px 14px;display:none}
.car.open .cb{display:block}
.cb p.what{margin:0 0 6px;font-size:14.5px;line-height:1.55}
.row{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5}
.row .k{flex:none;width:26px;text-align:center}
.row .v b{display:block;font:800 11px Inter,'Noto Sans Kannada','Noto Sans Devanagari';letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-bottom:1px}
.box{margin-top:18px;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.box h3{margin:0 0 8px;font:700 17px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.ex{padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5}
.ex .n{font-weight:800}.ex .by{color:var(--dim);font-size:12px;margin-left:6px}
.ex .f{color:var(--dim);font-size:13px}
.note{margin-top:14px;font-size:12.5px;line-height:1.55;color:var(--dim)}
/* quiz */
.qz{margin-top:14px;background:var(--panel);border:1.5px solid var(--teal);border-radius:18px;padding:14px 15px}
.qz h3{margin:0 0 4px;font:700 18px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.qz .sub{color:var(--dim);font-size:13.5px;margin:0 0 6px}
.qq{padding:10px 0;border-top:1px solid var(--line)}
.qq p{margin:0 0 7px;font-size:15px;line-height:1.45}
.opts{display:flex;gap:6px}
.opts button{flex:1;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:11px;padding:8px 4px;font:700 13.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer}
.opts button.on{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 18%,var(--panel))}
.qact{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 15px;font:700 14px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer;background:linear-gradient(135deg,var(--gold2),#E9C45A);color:#1a1406}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.res{margin-top:12px}
.res .r{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--panel2);margin-top:8px;cursor:pointer;border:0;width:100%;text-align:left;color:var(--ink);font:inherit}
.res .r .e{font-size:24px}
.res .r b{display:block;font:700 15px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.res .r small{color:var(--dim);font-size:12.5px}
.res .rk{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 13px Inter;background:var(--gold2);color:#1a1406}
.vid{margin-top:14px;background:var(--panel);border:1.5px solid var(--teal);border-radius:18px;padding:12px 14px}
.vid summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;color:var(--ink)}
.vid summary::-webkit-details-marker{display:none}
.vid .vp{flex:none;width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:14px;padding-left:2px}
.vid .vt{flex:1;min-width:0;font-weight:700;font-size:15px;line-height:1.3}
.vid .vd{flex:none;font:700 12px Inter,sans-serif;color:var(--teal);border:1.5px solid var(--teal);border-radius:999px;padding:3px 9px;white-space:nowrap}
.vid[open] .vp{background:var(--ink-dim,#888)}
.vid video{display:block;width:100%;max-width:330px;aspect-ratio:9/16;margin:12px auto 2px;border-radius:14px;background:#000}

.rep{margin-top:14px;background:var(--panel);border:2px solid var(--gold2);border-radius:18px;padding:14px 15px}
.rep h3{margin:0 0 4px;font:700 18px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.rep h4{margin:16px 0 6px;font:700 15.5px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.rep .sub{color:var(--dim);font-size:13.5px;margin:0 0 8px;line-height:1.5}
.frm{display:grid;gap:9px}
.frm label{display:grid;gap:4px;font:700 12.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';color:var(--dim)}
.frm input{font:600 16px Inter;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);text-transform:uppercase}
.rep .err{color:#D0544B;font-size:13.5px;margin:8px 0 0}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:6px}
.rhead b{display:block;font:700 17px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.rhead small{color:var(--dim);font-size:13px}
.lnk{background:none;border:0;color:var(--teal);font:700 12.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer;padding:4px 0;flex:none}
.mrow{padding:9px 0;border-top:1px solid var(--line)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px;font-size:14.5px}
.goal{margin-top:12px;padding:10px 12px;border:1.5px solid var(--gold2);border-radius:14px;background:var(--panel2)}
.goal b{font:700 14px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}

.gseg button{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 6px;font:700 13.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer}
.gseg button.on{background:linear-gradient(135deg,var(--gold2),#E9C45A);border-color:var(--gold2);color:#1a1406}
.goal small{display:block;color:var(--dim);font-size:12.5px;line-height:1.45}
body.print-report #myReport .gseg button:not(.on){display:none}
.pill{color:#fff;border-radius:999px;padding:3px 9px;font:800 11.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';white-space:nowrap}
.mbar{display:block;height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;flex:1}
.mbar i{display:block;height:100%;border-radius:99px}
.mut{color:var(--dim);font-size:12.5px;margin-top:5px;line-height:1.45}
.mut .up{color:#2F9E6B;font-weight:700}.mut .dn{color:#D0544B;font-weight:700}
.chipsm{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chipsm span{font:700 11.5px Inter;background:var(--panel2);border-radius:8px;padding:3px 7px}
.srow{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14px}
.srow .sl{width:110px;flex:none}.srow .sv{width:40px;text-align:right;font-weight:700;flex:none}
.sg{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel2);border:0;border-radius:14px;padding:10px 12px;margin-top:7px;color:var(--ink);font:inherit;cursor:pointer}
.sg .e{font-size:24px;flex:none}.sg b{display:block;font:700 15px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}
.sg small{display:block;color:var(--dim);font-size:12.5px;line-height:1.4}.sg .op{margin-left:auto;flex:none;color:var(--teal);font:700 12px Inter,'Noto Sans Kannada','Noto Sans Devanagari'}
ol.stp{margin:0;padding-left:20px;font-size:14.5px;line-height:1.55}ol.stp li{margin:5px 0}
.hp{display:grid;gap:7px}
.hp a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:9px 12px}
.hp .e{font-size:22px;flex:none}.hp b{display:block;font:700 14.5px 'Space Grotesk','Noto Sans Kannada','Noto Sans Devanagari'}.hp small{display:block;color:var(--dim);font-size:12.5px;line-height:1.4}
.shr{display:inline-flex;align-items:center;gap:6px;margin-top:12px;border:1.5px solid var(--teal);color:var(--teal);background:transparent;border-radius:999px;padding:7px 13px;font:700 13.5px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer}
.cshr{margin-top:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:7px 11px;font:700 13px Inter,'Noto Sans Kannada','Noto Sans Devanagari';cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1E2A22;color:#fff;padding:10px 16px;border-radius:12px;font:600 14px Inter;z-index:99}
@media print{.top,.qcard,.qz,.groups,.shr,.cshr{display:none!important}.car .cb{display:block!important}
  body.print-report main>*:not(#myReport){display:none!important}
  body.print-report #myReport{border:0;padding:0}
  body.print-report #myReport .qact,body.print-report #myReport .lnk,body.print-report #myReport .sg .op{display:none!important}
  html,body{background:#fff!important;color:#111!important}}
</style>

    var b = e.target.closest('.ch'); if(!b) return;
    var id = b.dataset.id; open[id] = !open[id];
    var a = b.closest('.car'); a.classList.toggle('open', !!open[id]); b.setAttribute('aria-expanded', !!open[id]);
  });
  $('qOpen').onclick = function(){ quizOpen = true; renderQuiz(); $('quiz').scrollIntoView({ behavior:'smooth', block:'start' }); };
  $('quiz').addEventListener('click', function(e){
    var o = e.target.closest('.opts button');
    if(o){ ans[o.dataset.t] = +o.dataset.v; try{ localStorage.setItem(qKey(), JSON.stringify(ans)); }catch(x){} o.parentNode.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === o); }); return; }
    if(e.target.id === 'qSee'){ showRes = true; renderQuiz(); var r = document.querySelector('.res'); if(r) r.scrollIntoView({ behavior:'smooth', block:'center' }); return; }
    if(e.target.id === 'qReset'){ ans = {}; showRes = false; try{ localStorage.removeItem(qKey()); }catch(x){} renderQuiz(); return; }
    if(e.target.id === 'qClose'){ quizOpen = false; showRes = false; renderQuiz(); return; }
    var g = e.target.closest('[data-go]'); if(g) go(g.dataset.go);
  });
  render();
  if(hc) setTimeout(function(){ go(hc.id); }, 200);
})();
</script>
</body>
</html>
