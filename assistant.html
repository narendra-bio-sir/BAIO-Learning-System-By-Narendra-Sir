    else if(k==='btn'){ n=it[2]; h=`<div class="m btn${it[3]?' acc':''}" data-n="${n||''}">${esc(it[1])}${nb(n)}</div>`; }
    else if(k==='card'){ n=it[4]; h=`<div class="m card" data-n="${n||''}"><span class="e">${it[1]}</span><span>${esc(it[2])}<small>${esc(it[3]||'')}</small></span>${nb(n)}</div>`; }
    else if(k==='grid'){ n=it[2]; h=`<div class="m grid" data-n="${n||''}">${it[1].map(x=>`<i>${esc(x)}</i>`).join('')}${nb(n)}</div>`; }
    else if(k==='tabs'){ n=it[2]; h=`<div class="m tabs" data-n="${n||''}">${it[1].map(x=>`<i>${esc(x)}</i>`).join('')}${nb(n)}</div>`; }
    else if(k==='bar'){ n=it[3]; h=`<div class="m bar" data-n="${n||''}">${esc(it[1])}<s><u style="width:${it[2]}%"></u></s>${nb(n)}</div>`; }
    else if(k==='pic'){ n=it[3]; h=`<div class="m pic" data-n="${n||''}"><span class="e">${it[1]}</span>${esc(it[2])}${nb(n)}</div>`; }
    return h||''; }).join(''); }
function slideHtml(t,i,n){ const c=L(t);
  return `<div class="hd"><span class="i">${t.ic}</span><div><div class="k">${T('guide')}</div><h2>${esc(c.h)}</h2></div><span class="no">${i+1} / ${n}</span></div>
    <div class="sub">${esc(c.s)}</div>
    <div class="bd"><ol>${c.p.map((p,j)=>`<li data-i="${j}"><b style="background:${NUM[j%5]}">${j+1}</b><span>${esc(p)}</span></li>`).join('')}</ol>
    <div class="phone"><div class="scr">${mockHtml(t.mock)}</div></div></div>
    <div class="ft">BAIO Learning System · Narendra Sir</div>`; }

/* ---------- player ---------- */
let deck=[], cur=0, playing=false, seq=0;
function load(ids,i){ deck=ids.map(id=>byId[id]).filter(Boolean); cur=Math.max(0,Math.min(i||0,deck.length-1)); $('#player').hidden=false; show(); }
function show(){ stop(); const t=deck[cur]; const el=$('#slide'); el.innerHTML=slideHtml(t,cur,deck.length);
  $('#cnt').textContent=`${cur+1} / ${deck.length}`; $('#open').textContent=T('open'); $('#open').href=t.url;
  $('#dots').innerHTML=deck.map((d,j)=>`<i class="${j===cur?'on':''}" data-j="${j}" title="${esc(L(d).h)}"></i>`).join('');
  $('#dots').querySelectorAll('i').forEach(d=>d.onclick=()=>{ const was=playing; cur=+d.dataset.j; show(); if(was) play(); });
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',deck.length===1&&c.dataset.id===t.id));
  $('#cap').textContent=L(t).s; paintPlay();
  try{ history.replaceState(null,'','#'+(deck.length>1?'all/'+(cur+1):t.id)); }catch(e){} }
function hl(j){ const el=$('#slide'); el.querySelectorAll('li').forEach(li=>{ const k=+li.dataset.i; li.classList.toggle('on',k===j); li.classList.toggle('dim',j>=0&&k!==j); });
  el.querySelectorAll('.m').forEach(m=>m.classList.toggle('on',j>=0&&+m.dataset.n===j+1)); }
function paintPlay(){ $('#play').textContent=playing?T('pause'):T('explain'); }

/* speech */
const VL={en:'en-IN',kn:'kn-IN',hi:'hi-IN'}; let voice=null;
function pickVoice(){ if(!('speechSynthesis' in window)) return; const v=speechSynthesis.getVoices(), l=GZ.lang; voice=v.find(x=>new RegExp('^'+l+'[-_]IN','i').test(x.lang))||v.find(x=>new RegExp('^'+l,'i').test(x.lang))||null;
  $('#vnote').textContent=(!voice&&v.length&&l!=='en')?T('novoice'):''; if(!voice&&l!=='en') $('#capOn').checked=true; $('#cap').hidden=!$('#capOn').checked; }
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=pickVoice; }
const sayable=s=>s.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu,'').replace(/→/g,',').replace(/\s+/g,' ').replace(/BAIO/g,'BAIO').trim();
function speak(text,onend){ const my=seq; $('#cap').textContent=text;
  if(!('speechSynthesis' in window)){ setTimeout(()=>{ if(my===seq) onend(); },Math.max(2200,text.length*55)); return; }
  const u=new SpeechSynthesisUtterance(sayable(text)); if(voice) u.voice=voice; u.lang=voice?voice.lang:VL[GZ.lang]; u.rate=+$('#rate').value;
  let done=false; const fin=()=>{ if(done||my!==seq) return; done=true; onend(); };
  u.onend=fin; u.onerror=()=>setTimeout(fin,Math.max(1500,text.length*50)); setTimeout(fin,Math.max(6000,text.length*150/u.rate)); speechSynthesis.speak(u); }
function play(){ stop(); playing=true; paintPlay(); const my=++seq; const c=L(deck[cur]); const parts=[[-1,c.h+'. '+c.s]].concat(c.p.map((p,j)=>[j,p]));
  let k=0; const step=()=>{ if(my!==seq) return; if(k>=parts.length){ hl(-1); if($('#autoOn').checked&&cur<deck.length-1){ cur++; show(); play(); } else { playing=false; paintPlay(); } return; }
    const [j,txt]=parts[k++]; hl(j); speak(txt,()=>setTimeout(step,350)); };
  step(); }
function stop(){ seq++; playing=false; try{ speechSynthesis.cancel(); }catch(e){} hl(-1); paintPlay(); }
$('#play').onclick=()=>{ playing?stop():play(); };
$('#prev').onclick=()=>{ if(cur>0){ const was=playing; cur--; show(); if(was) play(); } };
$('#next').onclick=()=>{ if(cur<deck.length-1){ const was=playing; cur++; show(); if(was) play(); } };
$('#capOn').onchange=()=>{ $('#cap').hidden=!$('#capOn').checked; };
(function(){ let x0=null; const el=$('#slide'); el.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; },{passive:true}); el.addEventListener('touchend',e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>50) (dx<0?$('#next'):$('#prev')).click(); x0=null; },{passive:true}); })();
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'||$('#player').hidden) return; if(e.key==='ArrowRight') $('#next').click(); if(e.key==='ArrowLeft') $('#prev').click(); if(e.key===' '){ e.preventDefault(); $('#play').click(); } });

/* ---------- chat + understanding the question ---------- */
function say(html,me){ const d=document.createElement('div'); d.className='bubble'+(me?' me':''); d.innerHTML=(me?'':'<div class="av">🦉</div>')+`<div class="tx">${html}</div>`; const c=$('#chat'); c.innerHTML=''; if(me) c.appendChild(d); return d; }
const norm=s=>s.toLowerCase().normalize('NFC').replace(/[?!.,;:'"()¿¡।|]/g,' ').replace(/\s+/g,' ').trim();
const STOP=new Set('how what where when which who why can could does do did the and for you your are is was with from into this that about want need use using get open find show tell me my to of in on a an it its i we our there here please app baio ಹೇಗೆ ಏನು ಎಲ್ಲಿ ಯಾವುದು ಮಾಡುವುದು ಮಾಡಬೇಕು ನನ್ನ ಇದೆ ಹೇಳಿ ತೋರಿಸಿ ಬಳಸುವುದು कैसे क्या कहाँ कहां कौन है हैं में का की के को से और मेरा मेरी मुझे करें करूँ करना बताओ दिखाओ इस यह'.split(' '));
function score(q,t){ const words=norm(q).split(' ').filter(w=>w.length>2&&!STOP.has(w)); let s=0; const hay=norm(t.kw+' '+Object.values(t.t).map(x=>x.h).join(' '));
  const keys=hay.split(' ');
  words.forEach(w=>{ if(keys.includes(w)) s+=3; else if(w.length>=4&&keys.some(k=>k.length>=4&&(k.startsWith(w)||w.startsWith(k)))) s+=2; });
  Object.values(t.t).forEach(x=>{ if(norm(q).includes(norm(x.h))) s+=6; }); return s; }
function ask(q){ q=(q||'').trim(); if(!q) return; const c=$('#chat'); c.innerHTML=''; const me=document.createElement('div'); me.className='bubble me'; me.innerHTML=`<div class="tx">${esc(q)}</div>`; c.appendChild(me);
  if(/whole app|everything|all features|full guide|explain the app|ಇಡೀ ಆ್ಯಪ್|ಎಲ್ಲ ವೈಶಿಷ್ಟ್ಯ|ಎಲ್ಲಾ ವೈಶಿಷ್ಟ್ಯ|पूरा ऐप|सारे फ़ीचर|सभी फ़ीचर/i.test(q)) return startAll();
  const r=TP.map(t=>[t,score(q,t)]).sort((a,b)=>b[1]-a[1]);
  const bot=document.createElement('div'); bot.className='bubble'; c.appendChild(bot);
  if(r[0][1]>=2){ const t=r[0][0]; bot.innerHTML=`<div class="av">🦉</div><div class="tx">${esc(T('found',{t:L(t).h}))}</div>`; load([t.id],0); $('#player').scrollIntoView({behavior:'smooth',block:'start'}); }
  else { bot.innerHTML=`<div class="av">🦉</div><div class="tx">${esc(T('miss'))}<div class="miss">${r.slice(0,3).map(([t])=>`<button class="tbtn" data-id="${t.id}">${t.ic} ${esc(L(t).h)}</button>`).join('')}<a class="tbtn" href="https://wa.me/919008968389?text=${encodeURIComponent('BAIO: '+q)}" target="_blank" rel="noopener">${T('wa')}</a></div></div>`;
    bot.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>pick(b.dataset.id)); } }
function pick(id){ const t=byId[id]; $('#chat').innerHTML=''; const b=document.createElement('div'); b.className='bubble'; b.innerHTML=`<div class="av">🦉</div><div class="tx">${esc(T('found',{t:L(t).h}))}</div>`; $('#chat').appendChild(b); load([id],0); $('#player').scrollIntoView({behavior:'smooth',block:'start'}); }
function startAll(){ const b=document.createElement('div'); b.className='bubble'; b.innerHTML=`<div class="av">🦉</div><div class="tx">${esc(T('foundAll'))}</div>`; $('#chat').appendChild(b); load(TP.map(t=>t.id),0); $('#player').scrollIntoView({behavior:'smooth',block:'start'}); }
$('#askBtn').onclick=()=>ask($('#q').value); $('#q').addEventListener('keydown',e=>{ if(e.key==='Enter') ask($('#q').value); });
$('#allBtn').onclick=()=>{ $('#chat').innerHTML=''; startAll(); };
function drawChips(){ $('#chips').innerHTML=TP.map(t=>`<button class="chip" data-id="${t.id}"><span>${t.ic}</span>${esc(L(t).h)}</button>`).join(''); $('#chips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>pick(c.dataset.id)); }

/* voice question */
(function(){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return; const m=$('#mic'); m.hidden=false; let r=null;
  m.onclick=()=>{ if(r){ r.stop(); return; } r=new SR(); r.lang=VL[GZ.lang]; r.interimResults=true; r.maxAlternatives=1; m.classList.add('on'); const ph=$('#q').placeholder; $('#q').placeholder=T('listen');
    r.onresult=e=>{ const s=[...e.results].map(x=>x[0].transcript).join(''); $('#q').value=s; if(e.results[e.results.length-1].isFinal) ask(s); };
    r.onend=()=>{ m.classList.remove('on'); $('#q').placeholder=ph; r=null; }; r.onerror=()=>{}; try{ r.start(); }catch(e){ m.classList.remove('on'); r=null; } }; })();

/* ---------- start ---------- */
GZ.startLang();
function lang(){ $('#q').placeholder=T('ph'); drawChips(); pickVoice(); if(!$('#player').hidden&&deck.length){ const was=playing; show(); if(was) play(); } if(!$('#chat').children.length) say(esc(T('hello'))); }
GZ.onLang(lang); lang();
(function(){ const h=location.hash.slice(1); if(!h) return; const [a,b]=h.split('/'); if(a==='all'){ startAll(); if(b){ cur=Math.max(0,Math.min(deck.length-1,+b-1)); show(); } } else if(byId[a]) pick(a); })();
window.addEventListener('pagehide',stop);
</script>
</body>
</html>
